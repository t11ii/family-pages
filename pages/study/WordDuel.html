ive`,`solution`]],[`precaution`,`名詞`,`an action taken in advance to prevent possible harm`,`危険に備えて先にしておく用心`,`Wearing a helmet is an important ____ against head injuries.`,`ヘルメットは頭のけがを防ぐ重要な備えだ。`,`As a ____, we copied the files to another drive before repairing the computer.`,`データを失わないよう修理前にコピーして備えた。`,[`consequence`,`diagnosis`,`symptom`]],[`priority`,`名詞`,`something treated as more important than other things`,`ほかより先に扱うべき重要なこと`,`During the rescue, getting everyone to safety was the first ____.`,`救助中は全員を安全な場所へ移すことが最優先だった。`,`The hospital gives ____ to patients who need immediate treatment.`,`すぐ治療が必要な患者を優先する。`,[`obstacle`,`distraction`,`restriction`]],[`proportion`,`名詞`,`the share of a whole represented by a particular part`,`全体に対する一部分の割合`,`A large ____ of the students walk to school; only a few take the bus.`,`生徒の大きな割合が徒歩通学で、バスは少数だ。`,`The ____ of recycled material in this bottle is seventy percent.`,`ボトル全体のうち再生素材が占める割合は70%。`,[`duration`,`frequency`,`distance`]],[`prospect`,`名詞`,`the possibility that something will happen in the future`,`これから起こる可能性、見通し`,`The ____ of seeing wild dolphins on their first trip made the children excited.`,`野生のイルカを見られるという期待が子どもたちをわくわくさせた。`,`With no rain forecast for weeks, there is little ____ of the drought ending soon.`,`すぐに干ばつが終わる見込みはほとんどない。`,[`memory`,`aftermath`,`record`]],[`restriction`,`名詞`,`a rule that limits what people may do`,`できることを制限する決まり`,`The museum has a ____ on photography, so visitors must keep their cameras in their bags.`,`美術館は撮影を制限しており、カメラはかばんにしまう必要がある。`,`The age ____ means children under twelve cannot enter without an adult.`,`12歳未満は大人が必要という年齢上の制限。`,[`permission`,`incentive`,`invitation`]],[`shortage`,`名詞`,`a situation in which there is not enough of something needed`,`必要な物や人の不足`,`The hospital had to close one ward because of a severe staff ____.`,`深刻な人手不足で病院は一つの病棟を閉じた。`,`Poor harvests led to a food ____ across the region.`,`不作が地域全体の食料不足を引き起こした。`,[`surplus`,`supply`,`abundance`]],[`tendency`,`名詞`,`a habit or likelihood o ce and several examinations.`,`経験年数や複数の試験など、厳しい条件を満たす必要がある。`,[`lenient`,`flexible`,`optional`]],[`detrimental`,`形容詞`,`causing harm or damage`,`害や悪影響を与える`,`A lack of sleep can be ____ to both concentration and health.`,`睡眠不足は集中力にも健康にも悪影響を及ぼすことがある。`,`The waste was ____ to river life, killing fish and damaging their habitat.`,`排水が魚やすみかに害を与えていた。`,[`beneficial`,`harmless`,`essential`]],[`impeccable`,`形容詞`,`so good that no fault or error can be found`,`非の打ちどころがない、完璧な`,`Her performance was ____; even the strictest judge could find no fault with it.`,`演技は完璧で、最も厳しい審査員も欠点を見つけられなかった。`,`He arrived in an ____ uniform, with every button polished and not a single crease out of place.`,`ボタンから折り目まで、まったく乱れのない制服。`,[`flawed`,`mediocre`,`untidy`]],[`complacent`,`形容詞`,`too satisfied with yourself to notice risks or the need to improve`,`現状に満足しすぎて油断している`,`After several easy wins, the team became ____ and stopped practicing seriously.`,`楽に勝ち続けたチームは油断し、真剣な練習をやめた。`,`We must not become ____ about safety just because no accident has happened yet.`,`事故が起きていないからといって安全に油断してはいけない。`,[`vigilant`,`anxious`,`diligent`]],[`precarious`,`形容詞`,`not secure and likely to become dangerous or fail`,`不安定で、危険になりかねない`,`The climber was in a ____ position on the narrow ledge, with little support beneath her feet.`,`狭い岩棚で足元の支えも少なく、登山者は危険な状態だった。`,`With almost no savings and an uncertain income, the financial situation of the family was ____.`,`貯金も安定収入もなく、家計は危うい状態だった。`,[`secure`,`stable`,`prosperous`]]]),m=d(`pre1`,[[`diagram`,`名詞`,`a drawing that explains parts or how something works`,`仕組みや部分を説明する図`,`The manual has a ____ with arrows showing where each robot part goes.`,`説明書には、ロボットの各部品を付ける場所を矢印で示した図がある。`,`Draw a ____ of the water cycle and label the clouds and rain.`,`雲と雨に名前を付けて、水の循環を図で説明する。`,[`receipt`,`schedule`,`poem`]],[`redundant`,`形容詞`,`unnecessary because something else already does the same job`,`重複していて必要のない`,`This second save button is ____; the first one does exactly the same thing.`,`2つ目の保存ボタンは、1つ目とまったく同じ on`]],[`vivid`,`形容詞`,`very clear, bright, or easy to imagine`,`鮮やかな、はっきりと思い浮かぶ`,`The story gave a ____ picture of the jungle; I could almost see every leaf.`,`物語はジャングルを鮮やかに描き、葉の1枚1枚が見えるようだった。`,`I have a ____ memory of the parade, including every color and sound.`,`色や音まで思い出せる、はっきりした記憶。`,[`vague`,`faint`,`blurred`]],[`intentionally`,`副詞`,`on purpose, rather than by accident`,`わざと、意図的に`,`The designer ____ left the wall blank because she wanted space for our drawings.`,`設計者は私たちの絵を飾る場所が欲しくて、わざと壁を空白にした。`,`He ____ chose the harder level to challenge himself; it was no mistake.`,`自分を試すため、わざと難しいレベルを選んだ。`,[`accidentally`,`unconsciously`,`inadvertently`]],[`obligation`,`名詞`,`something you are required or duty-bound to do`,`果たすべき務め、義務`,`If you borrow a library book, you have an ____ to return it on time.`,`図書館で本を借りたら、期限内に返す義務がある。`,`Feeding the class pet is my ____ this week, so I must do it each day.`,`今週の担当として、毎日生き物に餌をあげる務めがある。`,[`option`,`preference`,`ambition`]],[`interact`,`動詞`,`to communicate or do things with one another`,`互いにやり取りする`,`Players can ____ with teammates by chatting and planning moves together.`,`プレイヤーは会話し、一緒に作戦を立てて仲間とやり取りできる。`,`At the workshop, children ____ with scientists by asking and answering questions.`,`子どもと科学者が質問や回答を通じて交流する。`,[`compete`,`disagree`,`quarrel`]],[`component`,`名詞`,`one part of a larger machine or system`,`機械や仕組みを作る部品、構成要素`,`The battery is a ____ of the robot; it supplies power to the other parts.`,`電池はロボットの構成部品で、他の部分に電力を送る。`,`Check each ____ of the circuit to find which part is broken.`,`回路を構成する部品を1つずつ調べる。`,[`spectator`,`destination`,`opponent`]],[`symptom`,`名詞`,`a change in the body that may signal illness`,`病気のしるしとなる症状`,`A sore throat can be a ____ of a cold.`,`のどの痛みは、風邪の症状の1つであることがある。`,`The nurse asked which ____ had appeared first: the cough or the headache.`,`せきと頭痛のどちらの症状が先に出たか聞いた。`,[`cure`,`treatment`,`remedy`]],[`resolution`,`名詞`,`a firm decision to do or stop doing something`,`何かをしようと固く決めること、決意`,`My New Year's ____ is to read for eaving little room to turn.`,`壁が狭く、ロボットの動きが制限される。`,[`expand`,`liberate`,`encourage`]],[`precede`,`動詞`,`to happen or come before something else`,`時間や順序で先に来る`,`A short warm-up will ____ the race; the runners stretch before it begins.`,`レースの前に短い準備運動があり、走者は開始前に体を伸ばす。`,`In this book, two pages of maps ____ the first chapter.`,`第1章の前に地図のページが2ページある。`,[`follow`,`interrupt`,`replace`]]]),h=d(`grade1`,[[`equivocate`,`動詞`,`to avoid a clear answer by using vague or double-meaning language`,`曖昧な言い方で答えをにごす`,`Do not ____ by saying both yes and no; tell us clearly whether you agree.`,`はいともいいえとも言って答えをにごさず、賛成かどうかはっきり言おう。`,`When asked who broke the cup, he began to ____, giving vague replies that hid the truth.`,`コップを割った人を聞かれ、曖昧な返事で事実を隠そうとする。`,[`confess`,`clarify`,`confirm`]],[`bolster`,`動詞`,`to make something stronger or better supported`,`強める、支える`,`We added wooden beams to ____ the weak bridge and make it stronger.`,`弱い橋を補強して強くするため、木の梁を加えた。`,`A few encouraging words can ____ a nervous player's confidence before a match.`,`励ましの言葉で、緊張する選手の自信を高める。`,[`undermine`,`weaken`,`diminish`]],[`defer`,`動詞`,`to put an action or decision off until later`,`後に延期する`,`Because of heavy rain, we will ____ the outdoor match until next week.`,`大雨のため、屋外の試合を来週まで延期する。`,`Let us ____ the decision until we have all the results.`,`結果がそろうまで決定を後に延ばす。`,[`expedite`,`hasten`,`accelerate`]],[`envoy`,`名詞`,`a person sent to represent a government or group`,`代表として派遣される使節`,`The queen sent an ____ to the neighboring kingdom with a message of peace.`,`女王は隣の王国へ、和平の伝言を持たせた使節を送った。`,`Each city chose an ____ to represent it at the meeting.`,`会議で市を代表する人を選ぶ。`,[`fugitive`,`spectator`,`hostage`]],[`incumbent`,`名詞`,`the person who currently holds a particular official position`,`現在その役職に就いている人、現職者`,`The ____ has been mayor for four years and wants to keep the job in the election.`,`現職の市長は4年間務めており、選挙で続投を目指している。`,`As the club president, Aya is the ____; Ken hopes to replace her in the vote.`,`アヤが現在の会長で、ケンは選挙で代わりたいと思っている。`,[`successor`,`newcomer`,`challenger`]],[`auspicious`,`形容詞`,`giving signs that things are likely to go well`,`うまくいきそうな兆しのある、さい先のよい`,`Winning our first three matches was an ____ start to the season.`,`最初の3試合に勝ったのは、シーズンのさい先のよい始まりだった。`,`The clear skies and calm sea seemed ____ for a successful voyage.`,`晴天と穏やかな海が、よい航海を期待させた。`,[`ominous`,`discouraging`,`unpromising`]],[`contrite`,`形容詞`,`feeling sorry and guilty about something wrong you did`,`悪いことをしたと心から反省している`,`The ____ child apologized for breaking the model and offered to repair it.`,`心から反省した子は、模型を壊したことを謝り、直すと申し出た。`,`He felt ____ after lying to his friend and sincerely asked for forgiveness.`,`友達にうそをついたことを悔やみ、心から許しを求める。`,[`unrepentant`,`defiant`,`smug`]],[`obliterate`,`動詞`,`to destroy or remove something so completely that little or nothing remains`,`跡形もなく消す、完全に破壊する`,`A huge wave can ____ a sandcastle, leaving no trace of its towers.`,`大きな波は砂の城を完全に壊し、塔の跡も残さないことがある。`,`Heavy snow will ____ our footprints by covering them completely.`,`雪が足跡をすっかり覆い、見えなくする。`,[`preserve`,`restore`,`reveal`]],[`staunch`,`形容詞`,`firmly loyal and unlikely to stop supporting something`,`強く支持し続ける、忠実な`,`Even after ten defeats, our ____ supporter came to every match and cheered.`,`10回負けた後も、その熱心な支持者は毎試合応援に来た。`,`She remained a ____ defender of the forest and never gave up protecting it.`,`森を守る強い姿勢を最後まで変えなかった。`,[`wavering`,`disloyal`,`indifferent`]],[`gist`,`名詞`,`the main meaning or point, without every detail`,`話や文章のおおまかな要点`,`I missed a few words, but I understood the ____: we must leave before sunset.`,`数語は聞き逃したが、日没前に出発するという要点はわかった。`,`Give me the ____ of the story in one sentence; save the details for later.`,`細部を省き、物語の要点を1文で伝える。`,[`wording`,`spelling`,`punctuation`]],[`dearth`,`名詞`,`a serious lack or shortage of something`,`ひどい不足`,`A ____ of rain left the pond dry for months.`,`雨がひどく不足し、池は何か月も干上がっていた。`,`There is a ____ of volunteers; only two people came when we needed twenty.`,`20人必要なのに2人しかおらず、人手が大幅に足りない。`,[`surplus`,`wealth`,`profusion`]],[`entail`,`動詞`,`to make something necessary as a part or result`,`当然必要とする、伴う`,`Keeping a puppy will ____ feeding and walking it every day.`,`子犬を飼うには、毎日の餌やりと散歩が必要になる。`,`Building a larger robot would ____ buying extra motors; it cannot work without them.`,`大きなロボットを作るため、追加のモーターが必要になる。`,[`eliminate`,`forbid`,`prevent`]],[`convergence`,`名詞`,`the coming together of things from different directions`,`別々のものが集まったり合流したりすること`,`The map marks the ____ of three rivers where they join into one.`,`地図には、3本の川が1本になる合流地点が示されている。`,`A ____ of ideas occurred when both teams finally reached the same conclusion.`,`両チームの考えが同じ結論にまとまる。`,[`separation`,`divergence`,`isolation`]],[`coax`,`動詞`,`to gently persuade someone to do something`,`優しく根気よく説得する`,`We used a soft voice and a treat to ____ the frightened dog out of its hiding place.`,`優しい声とおやつで、怖がる犬が隠れ場所から出るよう誘った。`,`The teacher tried to ____ the shy singer onto the stage with gentle encouragement.`,`内気な歌い手を優しく励まし、舞台へ誘う。`,[`force`,`frighten`,`threaten`]],[`boisterous`,`形容詞`,`noisy and full of lively energy`,`にぎやかで元気いっぱいの`,`The ____ fans jumped, shouted, and sang after the winning goal.`,`決勝点が入ると、元気いっぱいのファンたちが跳びはね、叫び、歌った。`,`The puppies were ____ all morning, barking and racing around the yard.`,`子犬たちが吠えながら庭を走り回り、にぎやかだった。`,[`subdued`,`silent`,`motionless`]],[`perennial`,`形容詞`,`continuing for a long time or returning again and again`,`長く続く、繰り返し現れる`,`Lost pencils are a ____ problem in our class; it happens every year.`,`鉛筆の紛失は毎年起こり、クラスで繰り返される問題だ。`,`This story is a ____ favorite, loved by readers generation after generation.`,`何世代もの読者に長く愛される作品を指す。`,[`temporary`,`short-lived`,`fleeting`]],[`clemency`,`名詞`,`mercy shown by someone with the power to reduce a punishment`,`罰を軽くする権限のある人が示す寛大さ`,`In the tale, the king showed ____ by reducing the prisoner's sentence.`,`物語で、王は囚人の刑を軽くする寛大さを示した。`,`The judge granted ____ and ordered a lighter punishment than the law normally required.`,`裁判官が通常より軽い罰にした。`,[`vengeance`,`severity`,`cruelty`]],[`unruly`,`形容詞`,`difficult to control and unwilling to follow rules`,`言うことを聞かず、手に負えない`,`The ____ crowd kept pushing past the barriers despite repeated warnings.`,`何度注意されても、その手に負えない群衆は柵を押しのけ続けた。`,`The ____ students ignored every instruction and ran around the room.`,`指示を聞かず、教室を走り回る生徒たち。`,[`obedient`,`orderly`,`disciplined`]],[`elucidate`,`動詞`,`to explain something difficult so it becomes clear`,`難しいことを説明して明らかにする`,`Please ____ the puzzle's rule with a simple example so everyone understands.`,`みんなが理解できるよう、簡単な例でパズルの規則を説明してください。`,`The scientist used a model to ____ how the complicated engine worked.`,`模型を使い、複雑なエンジンの仕組みを明らかにする。`,[`obscure`,`conceal`,`complicate`]],[`lucrative`,`形容詞`,`earning a large amount of money or profit`,`多くの利益を生む`,`The toy shop became ____ when sales rose far above its costs.`,`売上が費用を大きく上回り、おもちゃ屋は多くの利益を生むようになった。`,`Designing the hit game was ____; it earned the studio millions in profit.`,`ヒットしたゲームの制作で多額の利益が生まれた。`,[`unprofitable`,`unpaid`,`fruitless`]],[`hindsight`,`名詞`,`understanding a past event better after knowing what happened`,`結果がわかった後で振り返って得る理解`,`In ____, taking an umbrella would have been wise, but we had not expected rain.`,`後から考えると傘を持つべきだったが、雨は予想していなかった。`,`With ____, we can see why our first robot failed; we did not notice the flaw then.`,`当時は見えなかった失敗の理由が、後から振り返るとわかる。`,[`foresight`,`anticipation`,`prediction`]],[`rescind`,`動詞`,`to officially cancel a rule, order, or agreement`,`規則や命令などを正式に取り消す`,`The council voted to ____ the park ban, officially allowing visitors back in.`,`議会は公園の立入禁止を正式に取り消し、再び来園できるようにした。`,`We must ____ the old rule before replacing it with the new one.`,`新規則に置き換える前に、古い規則を正式に取り消す。`,[`enforce`,`uphold`,`renew`]],[`niche`,`名詞`,`a special role or area that suits a person or business`,`得意なことを生かせる役割や専門分野`,`Leo found his ____ in the team as its mapmaker, the job that suited him best.`,`レオは地図作りという、自分に最も合う役割をチームで見つけた。`,`The tiny shop found a ____ selling unusual parts that big robot stores did not offer.`,`大型店にない部品を扱い、小さな店が独自の専門分野を見つける。`,[`rival`,`obstacle`,`shortage`]],[`quarantine`,`名詞`,`separation to prevent a possible infection from spreading`,`感染の広がりを防ぐための隔離`,`The new animals stayed in ____ away from the others while vets checked for infection.`,`新しい動物は、獣医師が感染の有無を調べる間、他の動物から隔離された。`,`The space story puts returning explorers in ____ so unknown germs cannot reach the town.`,`宇宙から帰った探検家を隔離し、未知の病原体が町に広がるのを防ぐ。`,[`reunion`,`circulation`,`exhibition`]],[`incursion`,`名詞`,`a sudden entry into another territory, often an attack`,`他の領域への突然の侵入`,`The game warned of an enemy ____ when hostile robots crossed into our base.`,`敵のロボットが基地に入り、ゲームに敵の侵入警報が出た。`,`The guards stopped an ____ by raiders who tried to cross the border.`,`境界を越えようとした襲撃者の侵入を止める。`,[`retreat`,`evacuation`,`withdrawal`]],[`exuberant`,`形容詞`,`showing a great deal of joy, energy, and excitement`,`喜びや元気にあふれた`,`The ____ winners laughed and leaped into the air, unable to hide their joy.`,`喜びにあふれた勝者たちは、うれしさを隠せず笑って跳びはねた。`,`Her ____ greeting filled the room with excited laughter.`,`元気いっぱいのあいさつで部屋が楽しい笑いに包まれる。`,[`gloomy`,`apathetic`,`dejected`]],[`jeopardy`,`名詞`,`danger of being lost, harmed, or ruined`,`失敗や損失につながる危険`,`Our lead was in ____ when the other team scored four times in a row.`,`相手が4回続けて得点し、私たちのリードが危うくなった。`,`A broken engine put the mission in ____; the crew might not reach the station.`,`エンジン故障で、任務を果たせない危険が生じた。`,[`safety`,`harmony`,`comfort`]],[`provisions`,`名詞（複数）`,`food and other supplies prepared for a journey or future need`,`旅などに備えた食料や必要品`,`We packed enough ____ to feed the explorers for a week.`,`探検家たちが1週間食べられるだけの食料を詰めた。`,`The ship stopped at the port to load fresh ____ before the long voyage.`,`長い航海の前に、港で食料などの必要品を積む。`,[`souvenirs`,`ornaments`,`trophies`]],[`appraise`,`動詞`,`to judge the value or quality of something carefully`,`価値や質をよく調べて評価する`,`An expert will ____ the old coin to estimate how much it is worth.`,`専門家が古い硬貨を鑑定し、どのくらいの価値か見積もる。`,`The judges will ____ each model, carefully assessing its design and quality.`,`審査員が模型の設計と質をよく調べて評価する。`,[`manufacture`,`conceal`,`transport`]],[`cajole`,`動詞`,`to persuade someone through repeated requests or flattering words`,`おだてたり何度も頼んだりしてその気にさせる`,`They tried to ____ me into singing by praising my voice again and again.`,`みんなは何度も声を褒め、私を歌う気にさせようとした。`,`He hoped to ____ his sister into helping by flattering her skill at puzzles.`,`パズルが得意だとおだて、姉に手伝ってもらおうとした。`,[`force`,`frighten`,`bully`]],[`inane`,`形容詞`,`silly and lacking any useful meaning or thought`,`ばかげていて中身がない`,`The ____ comment added nothing useful and made no sense at all.`,`その中身のない発言には役立つことも、意味もまったくなかった。`,`We stopped the ____ chatter about nothing and finally discussed the real problem.`,`中身のないおしゃべりをやめ、本題を話し合った。`,[`insightful`,`profound`,`thoughtful`]],[`wrest`,`動詞`,`to take something from someone with force or great effort`,`力ずくや大変な努力で奪い取る`,`The hero struggled to ____ the stolen key from the villain's tight grip.`,`主人公は、悪役が強く握る盗まれた鍵を奪い取ろうと格闘した。`,`After a long battle, our team managed to ____ control of the tower from its defenders.`,`長い戦いの末、塔を守る相手から支配権を奪う。`,[`receive`,`inherit`,`borrow`]],[`tacit`,`形容詞`,`understood or accepted without being directly expressed`,`直接表現せず了解されている、暗黙の`,`We had a ____ agreement to share the bench; nobody stated or wrote it, but we all acted as if it was understood.`,`誰も口や文章にはしなかったが、ベンチを分け合う了解があるように皆が行動した。`,`Their ____ approval was inferred from their continued cooperation; they never directly expressed it.`,`直接の表明はなかったが、協力を続ける様子から暗黙の承認があるとわかった。`,[`explicit`,`verbal`,`written`]],[`dilapidated`,`形容詞`,`in poor condition because of age or lack of care`,`古さや手入れ不足でぼろぼろの`,`The ____ hut had a broken roof, rotten walls, and missing windows.`,`ぼろぼろの小屋には、壊れた屋根と腐った壁があり、窓もなかった。`,`They repaired the ____ station after years of neglect had left it falling apart.`,`長年放置され、崩れかけた駅を修理する。`,[`pristine`,`immaculate`,`sturdy`]],[`caustic`,`形容詞`,`very harsh and cutting in the way something is said`,`言葉が辛辣で、人を傷つける`,`His ____ remark mocked her effort so cruelly that she left in tears.`,`彼の辛辣な発言が努力をひどくあざけったので、彼女は泣いて立ち去った。`,`The critic's ____ review was full of bitter insults instead of helpful advice.`,`批評には役立つ助言でなく、辛辣な悪口が並んでいた。`,[`gentle`,`tactful`,`complimentary`]],[`repulse`,`動詞`,`to make someone feel strong disgust`,`強い嫌悪感を抱かせる`,`The rotten smell may ____ visitors so much that they turn away in disgust.`,`腐ったにおいで来場者が強い嫌悪感を覚え、顔を背けるかもしれない。`,`Scenes of cruelty ____ me; I find them deeply disgusting.`,`残酷な場面に強い嫌悪感を覚える。`,[`attract`,`delight`,`fascinate`]],[`impasse`,`名詞`,`a situation where disagreement prevents further progress`,`意見が合わず、先に進めない状態、行き詰まり`,`The teams reached an ____: neither would accept the other's proposed rules.`,`どちらのチームも相手の規則案を受け入れず、話し合いは行き詰まった。`,`A mediator helped end the ____ after both sides had refused to compromise.`,`互いに譲らず止まっていた話し合いを、仲介者が進めた。`,[`breakthrough`,`agreement`,`solution`]],[`intangible`,`形容詞`,`real or valuable but not physical and touchable`,`実体がなく、手で触れられない`,`Trust is ____: it matters greatly, but you cannot hold it in your hands.`,`信頼はとても大切だが、手で持つことのできないものだ。`,`The team gained an ____ benefit: a feeling of friendship rather than a physical prize.`,`形のある賞品ではなく、友情という目に見えないよさを得る。`,[`tangible`,`concrete`,`material`]],[`fortuitous`,`形容詞`,`happening by chance rather than by design`,`計画せず、偶然に起こる`,`Our meeting was ____; neither of us had planned to visit that shop.`,`2人ともその店へ行く予定はなく、出会いは偶然だった。`,`A ____ gust of wind uncovered the hidden coin; nobody had arranged it.`,`偶然吹いた風で隠れた硬貨が現れた。`,[`deliberate`,`planned`,`intentional`]],[`belittle`,`動詞`,`to make a person or achievement seem unimportant`,`人や努力などを小さく見せてけなす`,`Do not ____ her victory by saying it was easy; she trained for months.`,`何か月も練習したのだから、簡単だったと言って彼女の勝利をけなしてはいけない。`,`A kind captain will not ____ a beginner's effort by calling it worthless.`,`努力を「価値がない」と言って初心者を見下すことをしない。`,[`praise`,`celebrate`,`applaud`]]]),g=d(`pre1`,[[`abide`,`動詞`,`to accept and obey a rule or decision (used with "by")`,`（規則・決定に）従う、守る`,`All players agreed to ____ by the rules, so the game was fair for everyone.`,`全員が規則に従うことに同意したので、試合は誰にとっても公平だった。`,`Visitors must ____ by the park's rules and stay on the marked paths.`,`公園の決まりを守り、指定された道を歩くよう来園者に求めている。`,[`hurry`,`wander`,`drift`]],[`abnormal`,`形容詞`,`not usual, in a way that may show something is wrong`,`異常な、普通でない`,`The vet said the puppy's very high temperature was ____, so she gave it some medicine.`,`獣医は子犬のとても高い体温は異常だと言い、薬を与えた。`,`The machine made strange, ____ noises, so the engineer stopped it to check for problems.`,`機械がいつもと違うおかしな音を出したので、技術者が止めて点検した場面。`,[`usual`,`normal`,`ordinary`]],[`abrupt`,`形容詞`,`happening very suddenly and without warning`,`突然の、急な`,`The stop was so ____ that all the bags on the bus slid off the seats.`,`停車があまりに急だったので、バスのかばんが全部座席から滑り落ちた。`,`The weather change was ____: sunny one minute and pouring rain the next.`,`晴れていたのに次の瞬間には土砂降りになった、急な天気の変化。`,[`gradual`,`gentle`,`smooth`]],[`abundant`,`形容詞`,`existing in large amounts; more than enough`,`豊富な、たくさんある`,`Fish are ____ in this lake, so even beginners catch many in an hour.`,`この湖には魚がたくさんいるので、初心者でも1時間でたくさん釣れる。`,`After a rainy spring, the forest had ____ food for the deer all summer.`,`雨の多い春のあと、森には夏じゅうシカの食べ物がたっぷりあった。`,[`scarce`,`rare`,`limited`]],[`acquaint`,`動詞`,`to make yourself or someone else familiar with something`,`（～に）慣れさせる、精通させる`,`On the first day, new students ____ themselves with the school by taking a tour.`,`初日に新入生は校内を見学して学校に慣れる。`,`Before the game, please ____ yourself with the rules by reading this short guide.`,`ゲーム前に短い説明書を読んでルールを知っておくよう頼んでいる。`,[`bore`,`tire`,`burden`]],[`acute`,`形容詞`,`very strong and sharp, especially about the senses`,`鋭い、鋭敏な`,`A dog's sense of smell is so ____ that it can find a snack hidden in a closed bag.`,`犬の嗅覚はとても鋭いので、閉じた袋に隠したおやつも見つけられる。`,`Owls have ____ hearing, so they can find a mouse moving under the snow.`,`フクロウは耳がとても鋭く、雪の下で動くネズミも見つけられる。`,[`dull`,`weak`,`poor`]],[`admissible`,`形容詞`,`allowed or accepted according to the rules`,`認められる、許容される`,`Stories that arrive after Friday are not ____ in the contest, so please send yours early.`,`金曜日より後に届いた物語はコンテストで認められないので、早めに送ってください。`,`The contest judges decided the drawing was ____ because it followed every rule.`,`絵がすべての規則を守っていたので、審査員が応募を認めた場面。`,[`forbidden`,`banned`,`prohibited`]],[`afflict`,`動詞`,`to cause pain, illness, or trouble to someone or something`,`苦しめる、悩ませる`,`A strange disease began to ____ the apple trees, and many leaves turned brown.`,`奇妙な病気がリンゴの木を苦しめ始め、たくさんの葉が茶色くなった。`,`Bad headaches often ____ my uncle when he works on the computer too long.`,`パソコン作業が長すぎると、おじがひどい頭痛に悩まされる。`,[`heal`,`cure`,`protect`]],[`aggression`,`名詞`,`angry or threatening behavior toward others`,`攻撃性、攻撃的な態度`,`The dog showed ____ by barking and growling at every stranger.`,`その犬は知らない人みんなに吠えたりうなったりして攻撃性を見せた。`,`Some fish show ____ by chasing away any fish that swims into their part of the tank.`,`水槽の自分の縄張りに入ってきた魚を追い払う、攻撃的な魚の様子。`,[`kindness`,`affection`,`gentleness`]],[`agile`,`形容詞`,`able to move quickly and easily`,`機敏な、身軽な`,`The ____ monkey jumped from branch to branch without slipping once.`,`身軽なサルは一度も滑らずに枝から枝へ跳び移った。`,`Goalkeepers must be ____ to dive quickly in either direction.`,`ゴールキーパーはどちらの方向にもすばやく飛びつける機敏さが必要だ。`,[`clumsy`,`sluggish`,`stiff`]],[`alleged`,`形容詞`,`claimed to be true, but not proved`,`（真偽不明だが）～とされる、うわさの`,`Nobody has ever seen proof of the ____ monster living in the lake.`,`湖にすむといわれる怪物の証拠を見た人は誰もいない。`,`The ____ treasure map turned out to be a drawing a child had made for fun.`,`宝の地図だといわれていたものが、実は子どもが遊びで描いた絵だった。`,[`proven`,`confirmed`,`verified`]],[`ambitious`,`形容詞`,`having a strong desire to succeed or achieve something big`,`野心的な、大望のある`,`Ken is very ____; he wants to become the best swimmer in Japan one day.`,`ケンはとても大きな夢を持っていて、いつか日本一の水泳選手になりたいと思っている。`,`Our ____ plan is to build a robot that can climb stairs by the end of the month.`,`月末までに階段を上れるロボットを作るという大きな目標。`,[`lazy`,`idle`,`timid`]],[`ample`,`形容詞`,`more than enough`,`十分な、たっぷりの`,`There is ____ time to finish the test, so you do not need to hurry.`,`テストを終える時間は十分あるので、急ぐ必要はない。`,`The new gym has ____ space for all the students to play at once.`,`新しい体育館には全員が一度に遊べる広さが十分にある。`,[`insufficient`,`limited`,`meager`]],[`amusing`,`形容詞`,`funny and entertaining`,`おもしろい、楽しい`,`The clown's ____ tricks made all the children laugh loudly.`,`ピエロのおもしろい芸に子どもたちはみんな大笑いした。`,`Grandpa's story about his cat was so ____ that we laughed until we cried.`,`祖父の猫の話がおかしくて、涙が出るほど笑った場面。`,[`boring`,`dull`,`tedious`]],[`animate`,`動詞`,`to make drawings or models seem to move, as in cartoons`,`（絵などを）動かす、アニメ化する`,`The team used a computer to ____ the drawings so the dragon could fly across the screen.`,`チームはコンピューターで絵を動かし、竜が画面を飛び回れるようにした。`,`Artists ____ clay figures by moving them a little and taking a photo each time.`,`粘土の人形を少しずつ動かして一枚ずつ撮影し、動いているように見せる方法。`,[`erase`,`freeze`,`delete`]],[`appoint`,`動詞`,`to officially choose someone for a job or position`,`任命する、指名する`,`The principal will ____ Yuki as the new leader of the science club.`,`校長はユキを科学クラブの新しいリーダーに任命する予定だ。`,`The coach decided to ____ Mika as team captain because she always encourages others.`,`いつも仲間を励ますミカを、コーチがキャプテンに選んだ場面。`,[`dismiss`,`remove`,`expel`]],[`aptitude`,`名詞`,`a natural ability to do something well`,`才能、適性`,`Mai has a real ____ for languages; she learned Spanish in just one year.`,`マイには語学の才能があり、たった1年でスペイン語を習得した。`,`The test measures students' ____ for music, such as how well they can hear pitch.`,`音の高さを聞き分ける力など、音楽の適性を測るテスト。`,[`dislike`,`distaste`,`disregard`]],[`assemble`,`動詞`,`to put all the parts of something together`,`組み立てる`,`It took us two hours to ____ the new bookshelf from all the pieces.`,`部品から新しい本棚を組み立てるのに2時間かかった。`,`The kids will ____ the model rocket before launching it in the park.`,`公園で打ち上げる前に、子どもたちが模型ロケットを組み立てる。`,[`dismantle`,`scatter`,`destroy`]],[`astonishment`,`名詞`,`a feeling of very great surprise`,`驚き、びっくりすること`,`To our ____, the tiny puppy pulled the heavy sled all by itself.`,`驚いたことに、小さな子犬が重いそりを自分だけで引っ張った。`,`The crowd gasped in ____ when the magician's rabbit vanished.`,`手品師のウサギが消えて、観客が驚いて息をのんだ場面。`,[`boredom`,`indifference`,`calmness`]],[`attest`,`動詞`,`to clearly show or prove that something is true (used with "to")`,`証明する、裏付ける`,`Many happy customers can ____ to the fact that this bakery's bread is the best in town.`,`このパン屋のパンが町一番だということは、多くの満足した客が証明できる。`,`The medals on her wall ____ to years of hard training.`,`壁のメダルが、長年の厳しい練習を物語っている。`,[`belong`,`travel`,`listen`]],[`awkward`,`形容詞`,`making you feel uncomfortable or embarrassed`,`気まずい、ぎこちない`,`After the joke failed, there was a long, ____ silence in the room.`,`冗談がすべったあと、部屋には長く気まずい沈黙が流れた。`,`I felt ____ when I forgot my friend's name in front of everyone.`,`みんなの前で友だちの名前を忘れて気まずくなった場面。`,[`comfortable`,`relaxed`,`graceful`]],[`bait`,`名詞`,`food put on a hook or in a trap to attract fish or animals`,`えさ、おとり`,`Grandpa put a worm on the hook as ____ to catch a fish.`,`祖父は魚を釣るために針にミミズをえさとしてつけた。`,`The scientists used fruit as ____ to lure butterflies into the net.`,`果物で蝶を網へ誘い込む、研究者の工夫。`,[`shelter`,`fence`,`anchor`]],[`bearable`,`形容詞`,`not pleasant, but possible to accept or put up with`,`耐えられる、我慢できる`,`The summer heat was strong, but the cool breeze made it ____.`,`夏の暑さは厳しかったが、涼しい風のおかげで我慢できた。`,`The shot hurt a little, but the pain was ____, so I didn't cry.`,`注射は少し痛かったが我慢できる程度で、泣かなかった。`,[`intolerable`,`dreadful`,`awful`]],[`bizarre`,`形容詞`,`very strange and unusual`,`奇妙な、風変わりな`,`The fish had a ____ shape, with eyes on top of its head and a glowing light.`,`その魚は頭のてっぺんに目があり、光を放つ奇妙な形をしていた。`,`It was ____ to see a penguin walking down the street in the city.`,`都会の通りをペンギンが歩いているという不思議な光景。`,[`ordinary`,`normal`,`typical`]],[`blissful`,`形容詞`,`extremely happy and peaceful`,`この上なく幸せな`,`The first day of summer vacation felt ____: no homework and lots of ice cream.`,`夏休み初日は宿題もなくアイスもたくさんで、最高に幸せだった。`,`The baby had a ____ smile after drinking her milk.`,`ミルクを飲んだ赤ちゃんの、とても幸せそうな笑顔。`,[`miserable`,`gloomy`,`painful`]],[`blockade`,`名詞`,`a barrier that stops people or things from going in or out of a place`,`封鎖、通行止め`,`The police set up a ____ on the bridge, so no cars could cross during the parade.`,`警察が橋を封鎖したので、パレードの間は車が一台も渡れなかった。`,`In the board game, you can place a ____ to stop other players from reaching the castle.`,`ボードゲームで、ほかのプレイヤーが城に行けないよう道をふさぐ駒を置くルール。`,[`passage`,`shortcut`,`bridge`]],[`bothersome`,`形容詞`,`annoying and causing small troubles`,`やっかいな、うるさい`,`The mosquito buzzing near my ear all night was really ____.`,`一晩中耳元でブンブン飛ぶ蚊は本当にうっとうしかった。`,`Doing the same homework twice is ____, so please save your work often.`,`同じ宿題を二度やるのは面倒なので、こまめに保存するよう勧めている。`,[`pleasant`,`soothing`,`welcome`]],[`breach`,`名詞`,`an act of not keeping a rule, promise, or agreement`,`違反、（信頼などを）破ること`,`Looking at your friend's answers is a ____ of the test rules.`,`友だちの答えを見るのはテストの規則違反だ。`,`Taking the club's robot home without asking was a ____ of trust.`,`許可なくクラブのロボットを持ち帰り、信頼を裏切ってしまった場面。`,[`reminder`,`summary`,`review`]],[`browse`,`動詞`,`to look through things in a relaxed way, without searching for anything in particular`,`（気ままに）見て回る、ざっと目を通す`,`I like to ____ the shelves at the library until I find an interesting book.`,`おもしろい本が見つかるまで、図書館の棚を見て回るのが好きだ。`,`On weekends, Dad likes to ____ online shops without buying anything.`,`週末、父は何も買わずにネットショップを眺めるのが好き。`,[`ignore`,`avoid`,`lock`]],[`cascade`,`名詞`,`a small waterfall, or a large amount of something falling quickly`,`小さな滝、どっと落ちてくるもの`,`Water fell down the rocks in a beautiful ____ into the pool below.`,`水が岩を流れ落ち、美しい滝となって下の池へ注いだ。`,`When she opened the closet, a ____ of toys tumbled onto the floor.`,`クローゼットを開けたらおもちゃがどっと床に落ちてきた場面。`,[`puddle`,`drought`,`pond`]],[`cautious`,`形容詞`,`careful to avoid danger or mistakes`,`用心深い、慎重な`,`Be ____ when you cross the icy bridge, and hold the rail.`,`凍った橋を渡るときは慎重にし、手すりにつかまりなさい。`,`The ____ cat sniffed the new toy for a long time before touching it.`,`用心深い猫が新しいおもちゃに触る前に長いことにおいをかいでいる様子。`,[`reckless`,`careless`,`daring`]],[`charitable`,`形容詞`,`giving money, food, or help to people in need`,`慈善の、寛大な`,`The ____ group collects old toys and gives them to children who need them.`,`その慈善団体は古いおもちゃを集めて、必要としている子どもたちに贈っている。`,`Our class did a ____ bake sale and sent all the money to an animal shelter.`,`焼き菓子を売った売上をすべて動物保護施設に寄付した募金活動。`,[`selfish`,`greedy`,`stingy`]],[`cheery`,`形容詞`,`happy, bright, and friendly`,`陽気な、明るい`,`The shop owner greeted every customer with a ____ smile.`,`店主はお客さん一人ひとりを明るい笑顔で迎えた。`,`Bright yellow walls make the room look ____ even on rainy days.`,`明るい黄色の壁のおかげで、雨の日でも部屋が明るく見える。`,[`gloomy`,`grumpy`,`sullen`]],[`cherish`,`動詞`,`to love something and treat it as very important`,`大切にする、大事に思う`,`I will always ____ the letters my grandmother wrote to me.`,`祖母が書いてくれた手紙をいつまでも大切にするつもりだ。`,`Many people ____ memories of their first pet for the rest of their lives.`,`初めて飼ったペットの思い出を一生大切にする人が多いこと。`,[`discard`,`neglect`,`despise`]],[`clarity`,`名詞`,`the quality of being easy to understand or see`,`明快さ、鮮明さ`,`The teacher explained the rules with great ____, so everyone understood them at once.`,`先生がとても明快にルールを説明したので、みんなすぐに理解した。`,`The new camera takes photos with amazing ____; you can see every hair on the cat.`,`猫の毛一本一本まで見える、新しいカメラの写真の鮮明さ。`,[`confusion`,`vagueness`,`obscurity`]],[`classify`,`動詞`,`to arrange things in groups according to their type`,`分類する`,`Scientists ____ animals into groups such as mammals, birds, and fish.`,`科学者は動物を哺乳類、鳥類、魚類などのグループに分類する。`,`Please ____ the rubbish into paper, plastic, and cans before you throw it away.`,`ごみを捨てる前に紙・プラスチック・缶に分けるよう頼んでいる。`,[`mix`,`scramble`,`jumble`]],[`cling`,`動詞`,`to hold on tightly to someone or something`,`しがみつく、くっつく`,`The frightened kitten would ____ to my sweater and not let go.`,`おびえた子猫は私のセーターにしがみついて離れようとしなかった。`,`Wet sand tends to ____ to your feet after a day at the beach.`,`海辺で過ごしたあと、ぬれた砂が足にくっつくこと。`,[`wave`,`reply`,`listen`]],[`coherent`,`形容詞`,`clear and logical, with all parts fitting together well`,`筋の通った、首尾一貫した`,`Your essay is ____ because each paragraph connects clearly to the next.`,`各段落が次の段落とはっきりつながっているので、君の作文は筋が通っている。`,`Even when very tired, she gave a ____ answer that everyone could follow.`,`とても疲れていても、彼女は誰にでも分かる筋の通った答えをした。`,[`confused`,`muddled`,`jumbled`]],[`coincidence`,`名詞`,`when two things happen at the same time by chance, in a surprising way`,`偶然の一致`,`What a ____! My best friend and I were born on exactly the same day.`,`なんという偶然！親友と私はまったく同じ日に生まれた。`,`It was just a ____ that we both wore the same shirt; we didn't plan it.`,`示し合わせたわけではないのに、二人が同じシャツを着ていた偶然。`,[`plan`,`routine`,`strategy`]],[`coincidental`,`形容詞`,`happening by chance, not planned`,`偶然の`,`Our matching backpacks were purely ____; we bought them in different towns.`,`おそろいのリュックはまったくの偶然で、別々の町で買ったものだった。`,`The teacher said the two similar drawings were ____ since the students had never met.`,`会ったこともない二人の生徒の絵が似ていたのは偶然だと先生が判断した。`,[`deliberate`,`intentional`,`planned`]],[`compelling`,`形容詞`,`so convincing or interesting that you pay full attention`,`説得力のある、引きつける`,`The scientist gave ____ evidence that the dinosaur could fly, and everyone was convinced.`,`科学者がその恐竜は飛べたという説得力のある証拠を示し、誰もが納得した。`,`The mystery novel was so ____ that I read it all in one afternoon.`,`推理小説がとても引き込まれる内容で、一日の午後で読み切ってしまった。`,[`weak`,`unconvincing`,`dull`]],[`compile`,`動詞`,`to collect information from different places into one list, book, or report`,`（情報を集めて）まとめる、編集する`,`Our class will ____ everyone's favorite recipes into one cookbook.`,`私たちのクラスはみんなの好きなレシピを集めて一冊の料理本にまとめる。`,`Scientists ____ data from many weather stations to make a report.`,`多くの気象観測所のデータを集めて報告書にまとめる作業。`,[`scatter`,`discard`,`destroy`]],[`compliant`,`形容詞`,`following rules or standards, or willing to do what you are asked`,`（規則に）従う、従順な`,`All the toys sold here are ____ with safety rules, so they are safe for babies.`,`ここで売られているおもちゃはすべて安全基準に従っているので、赤ちゃんにも安全だ。`,`The robot is very ____; it does exactly what you tell it to do.`,`言われたとおりに動く、とても素直なロボット。`,[`defiant`,`rebellious`,`disobedient`]],[`compromise`,`名詞`,`an agreement in which each side gives up part of what it wants`,`妥協、歩み寄り`,`We reached a ____: I chose the movie, and my sister chose the snacks.`,`私たちは歩み寄った。映画は私が選び、おやつは妹が選んだ。`,`After a long talk, the two teams found a ____ that made everyone fairly happy.`,`長い話し合いの末、2チームがみんながほぼ納得できる妥協案を見つけた。`,[`quarrel`,`deadlock`,`dispute`]],[`compulsion`,`名詞`,`a very strong feeling that you must do something`,`（抑えがたい）衝動、強い欲求`,`Before the trip, I felt a strong ____ to check my bag, so I opened it five more times.`,`旅行の前、かばんを確かめたくてたまらなくなり、さらに5回も開けてしまった。`,`Whenever he sees a puddle, my little brother feels a strong ____ to jump in, and he always does.`,`水たまりを見ると飛び込みたくてたまらず、いつも飛び込んでしまう弟。`,[`reluctance`,`refusal`,`hesitation`]],[`conceptual`,`形容詞`,`related to ideas rather than real objects`,`概念上の、構想段階の`,`The robot is still in the ____ stage; it exists only as ideas and sketches.`,`そのロボットはまだ構想段階で、アイデアとスケッチしかない。`,`The lesson was mostly ____, about ideas like time and space rather than hands-on experiments.`,`実験ではなく、時間や空間といった考え方を中心にした授業。`,[`practical`,`concrete`,`manual`]],[`condense`,`動詞`,`to make a piece of writing shorter while keeping the main ideas`,`要約する、短くまとめる`,`Please ____ your three-page report into one short paragraph.`,`3ページのレポートを短い1段落にまとめてください。`,`The editor had to ____ the long story so it would fit on a single page.`,`長い話を1ページに収まるように編集者が短くする場面。`,[`expand`,`lengthen`,`stretch`]],[`conform`,`動詞`,`to follow rules or act in the way that is expected (used with "to")`,`（規則・基準に）従う、合わせる`,`All robots in the contest must ____ to the size rules, or they cannot enter.`,`大会のロボットはすべてサイズの規則に従わなければ出場できない。`,`New buildings in this old town must ____ to the traditional style, with wooden walls and tiled roofs.`,`古い町並みの新しい建物は、木の壁と瓦屋根の伝統的な様式に合わせる必要がある。`,[`object`,`travel`,`reply`]],[`contradiction`,`名詞`,`a situation in which two statements or facts cannot both be true`,`矛盾`,`Saying "I never lie" and then telling a lie is a clear ____.`,`「うそはつかない」と言ったあとでうそをつくのは明らかな矛盾だ。`,`There is a ____ between his two stories: first he said he was at home, then at the park.`,`家にいたと言ったり公園にいたと言ったり、話が食い違っている。`,[`harmony`,`match`,`likeness`]],[`contrary`,`形容詞`,`completely different or opposite`,`反対の、逆の`,`Bats are not blind, ____ to what many people believe.`,`多くの人が思っているのとは反対に、コウモリは目が見えないわけではない。`,`The two friends had ____ opinions: one loved winter, and the other hated it.`,`一人は冬が大好き、もう一人は大嫌いという正反対の意見。`,[`similar`,`equal`,`identical`]],[`convey`,`動詞`,`to express or communicate feelings, ideas, or information`,`伝える、表す`,`Emojis help us ____ our feelings in short messages.`,`絵文字は短いメッセージで気持ちを伝えるのに役立つ。`,`The painting uses bright colors to ____ a feeling of joy.`,`明るい色を使って喜びの気持ちを表現している絵。`,[`hide`,`conceal`,`suppress`]],[`courteous`,`形容詞`,`polite and showing respect for others`,`礼儀正しい、丁寧な`,`The ____ boy held the door open for everyone behind him.`,`礼儀正しい男の子は後ろの人みんなのためにドアを押さえていた。`,`Please be ____ to visitors and greet them with a smile.`,`来客には礼儀正しく、笑顔であいさつするよう求めている。`,[`rude`,`impolite`,`disrespectful`]],[`cowardly`,`形容詞`,`too afraid to face danger or difficulty`,`臆病な、卑怯な`,`The ____ lion in the story hid under the bed whenever a tiny mouse squeaked.`,`物語の臆病なライオンは、小さなネズミがチューと鳴くたびにベッドの下に隠れた。`,`It was ____ of Ken to blame his little brother instead of admitting he broke the vase.`,`自分が花瓶を割ったのに弟のせいにしたケンの行動を表す。`,[`brave`,`heroic`,`fearless`]],[`crafty`,`形容詞`,`clever at getting what you want by tricking others`,`ずる賢い、悪知恵の働く`,`In the story, the ____ monkey tricked the crocodile into carrying him across the river.`,`物語の中で、ずる賢いサルはワニをだまして川を渡らせてもらった。`,`The ____ player pretended to pass left, then quickly ran right and scored.`,`左にパスするふりをして右に走り、得点した選手を表す。`,[`honest`,`clumsy`,`naive`]],[`daring`,`形容詞`,`brave enough to do something dangerous or surprising`,`大胆な、勇敢な`,`Only the most ____ kids tried the scary new jump on the ski slope; the others just watched.`,`最も大胆な子どもたちだけがスキー場の怖い新しいジャンプに挑戦し、ほかの子は見ているだけだった。`,`The circus performer made a ____ leap from one high swing to another without a net.`,`サーカスの演者がネットなしで高いブランコから別のブランコへ飛び移る場面。`,[`timid`,`cautious`,`fearful`]],[`debatable`,`形容詞`,`not certain, so people may have different opinions about it`,`議論の余地がある、疑わしい`,`Whether cats or dogs make better `,`反乱を起こしたロボットたちが欲張りな王の命令に従わず、働くのをやめた場面。`,[`obey`,`follow`,`respect`]],[`dehydrate`,`動詞`,`to lose too much water, especially from the body`,`脱水状態になる`,`Runners can ____ quickly on hot days if they forget to drink water.`,`暑い日に水を飲み忘れると、ランナーはすぐに脱水状態になることがある。`,`Desert plants store water inside their thick stems so they do not ____ in the strong sun.`,`砂漠の植物が強い日差しの中で水分を失いすぎないよう、茎に水をためている説明。`,[`freeze`,`shiver`,`recover`]],[`deliberately`,`副詞`,`in a way that is planned and intended, not by chance`,`わざと、故意に`,`Mia ____ lost the game so that her little brother could win for once.`,`ミアは弟がたまには勝てるように、わざとゲームに負けた。`,`The magician ____ dropped a card to trick us, then pulled it out of his hat.`,`手品師がだますためにわざとカードを落とし、帽子から取り出した場面。`,[`accidentally`,`unintentionally`,`unknowingly`]],[`denial`,`名詞`,`a statement saying that something is not true`,`否定、否認`,`Despite Tom's ____, everyone knew he had eaten the last cookie because of the crumbs on his shirt.`,`トムは否定したが、シャツについたくずで最後のクッキーを食べたのは彼だと皆わかっていた。`,`The captain said, "That's not true!" It was a clear ____ of the rumor that she was leaving the team.`,`チームを辞めるといううわさを、キャプテンがはっきり打ち消した場面。`,[`confession`,`apology`,`approval`]],[`dense`,`形容詞`,`having many things packed closely together; thick`,`密集した、濃い`,`The explorers could hardly walk through the ____ jungle full of vines and trees.`,`探検家たちはツルや木がびっしり生えた密林をほとんど歩けなかった。`,`The fog was so ____ that we could not see the car right in front of us.`,`霧が濃くて目の前の車さえ見えなかった状況。`,[`sparse`,`thin`,`open`]],[`deploy`,`動詞`,`to put people or equipment in place so they are ready to be used`,`配置する、展開する`,`The city will ____ extra snowplows on the roads before the big storm arrives.`,`市は大雪が来る前に、道路に除雪車を追加で配置する。`,`After landing on Mars, the rover will ____ its solar panels to collect sunlight.`,`火星に着陸した探査車が、太陽光を集めるためにパネルを広げる場面。`,[`remove`,`withdraw`,`hide`]],[`designate`,`動詞`,`to officially choose someone or something for a particular job or purpose`,`指定する、任命する`,`The school will ____ Room 5 as the new science lab and put a sign on the door.`,`学校は5号室を新しい理科室に指定し、ドアに表示を付ける予定だ。`,`Each group should ____ one member to report their ideas to the class.`,`各グループがクラスに発表する代表を1人決める場面。`,[`conceal`,`demolish`,`forget`]],[`devour`,`動詞`,`to eat something quickly and hungrily`,`むさぼり食う、がつがつ食べる`,`The hungry campers began to ____ the pizza and finished it in under two minutes.`,`お腹をすかせたキャンパーたちはピザをむさぼり食い、2分もかからずに平らげた。`,`Watch the lions ____ their meat in seconds after the zookeeper throws it in.`,`飼育員が肉を投げ入れると、ライオンが数秒で食べ尽くす様子。`,[`nibble`,`refuse`,`save`]],[`devout`,`形容詞`,`deeply religious and serious about faith`,`信心深い、敬虔な`,`My ____ grandmother visits the temple every morning to pray.`,`私の信心深い祖母は毎朝お寺にお参りに行く。`,`He is so ____ that he never misses his weekly prayers at the shrine, even in heavy snow.`,`大雪の日でも神社での毎週のお祈りを欠かさない信心深い人を表す。`,[`indifferent`,`skeptical`,`faithless`]],[`diagnosis`,`名詞`,`a doctor's decision about what illness or problem someone has`,`診断`,`After looking at the X-ray, the doctor's ____ was a broken wrist, not a sprain.`,`レントゲンを見た後、医師の診断は捻挫ではなく手首の骨折だった。`,`The vet's ____ was that our puppy simply had an upset stomach from eating grass.`,`獣医が、子犬は草を食べてお腹をこわしただけだと判断した場面。`,[`recovery`,`surgery`,`vaccine`]],[`dialect`,`名詞`,`a form of a language spoken in one area, with its own words and sounds`,`方言`,`Grandpa speaks the Osaka ____, so he says "ookini" instead of "arigatou."`,`祖父は大阪の方言を話すので、「ありがとう」の代わりに「おおきに」と言う。`,`Each region of Japan has its own ____, with special words that visitors may not understand.`,`日本の各地域に、よそから来た人にはわからない言葉をもつ独自の方言があるという説明。`,[`alphabet`,`recipe`,`currency`]],[`digest`,`動詞`,`to break down food in the stomach so the body can use it`,`消化する`,`Snakes can take days to ____ a large meal after swallowing it whole.`,`ヘビは大きな獲物を丸のみした後、消化するのに何日もかかることがある。`,`Your stomach needs time to ____ lunch, so wait a bit before running.`,`昼食を消化する時間が必要なので、走る前に少し待つよう言う場面。`,[`cook`,`grow`,`spill`]],[`discharge`,`動詞`,`to officially allow someone to leave a hospital`,`退院させる、解放する`,`Ken's leg has healed, so the doctors will ____ him tomorrow and he can finally go home.`,`ケンの足が治ったので、医師たちは明日彼を退院させ、ケンはやっと家に帰れる。`,`The vet will ____ the owl once its wing is strong again, and it can go back to the forest.`,`翼が再び丈夫になったら、獣医がフクロウを動物病院から出し、森に帰れるようにする場面。`,[`admit`,`hospitalize`,`confine`]],[`dismiss`,`動詞`,`to decide that something is not worth thinking about`,`退ける、はねつける`,`Please don't ____ my idea as silly before you hear the whole plan.`,`計画を全部聞く前に、私のアイデアをばかげていると退けないでください。`,`Scientists should not ____ strange results, because they sometimes lead to great discoveries.`,`奇妙な結果も大発見につながることがあるので、軽く扱うべきではないという話。`,[`accept`,`praise`,`adopt`]],[`disposable`,`形容詞`,`made to be thrown away after being used once or a few times`,`使い捨ての`,`To reduce trash, our class stopped using ____ cups and brought our own bottles.`,`ごみを減らすため、私たちのクラスは使い捨てのコップをやめて自分の水筒を持ってくるようにした。`,`The hotel gave us ____ slippers that we could throw away after one night.`,`一晩使ったら捨てられるスリッパをホテルがくれた場面。`,[`reusable`,`permanent`,`durable`]],[`dispute`,`名詞`,`a serious argument or disagreement`,`論争、争い`,`The ____ between the two neighbors about the noisy dog lasted for weeks until they finally made peace.`,`うるさい犬をめぐる隣人同士の争いは、ようやく仲直りするまで何週間も続いた。`,`The referee settled the ____ over whether the ball was in or out.`,`ボールがインかアウトかの言い争いを審判がおさめた場面。`,[`agreement`,`harmony`,`celebration`]],[`distortion`,`名詞`,`a change that makes a shape, picture, or sound different from how it really is`,`ゆがみ、ひずみ`,`The funhouse mirror creates so much ____ that your legs look three meters long.`,`びっくりハウスの鏡はゆがみが大きく、脚が3メートルもあるように見える。`,`The old speaker had so much ____ that the music sounded fuzzy and strange.`,`古いスピーカーの音がひずんで、音楽がぼやけて変に聞こえる状況。`,[`clarity`,`accuracy`,`precision`]],[`distress`,`名詞`,`a feeling of great worry, sadness, or pain`,`苦悩、苦痛`,`The lost kitten was in ____, crying loudly for its mother.`,`迷子の子猫は困り果てて、母猫を求めて大声で鳴いていた。`,`Ken's ____ was clear when he couldn't find his passport at the airport; he was almost in tears.`,`空港でパスポートが見つからず、ケンが rden.`,`毎週末祖父母の庭仕事を手伝う、よく尽くす息子を表す。`,[`lazy`,`rebellious`,`careless`]],[`dwindle`,`動詞`,`to slowly become smaller in number or amount`,`だんだん減る、縮小する`,`Our food supplies began to ____, so we ate only one small snack a day.`,`食料が少しずつ減り始めたので、私たちは1日に小さなおやつを1つだけ食べた。`,`If people keep cutting down the forest, the number of pandas will ____.`,`森林伐採が続けばパンダの数が減っていくという話。`,[`grow`,`increase`,`multiply`]],[`earnest`,`形容詞`,`serious and sincere about what you say or do`,`真剣な、まじめな`,`Kai was very ____ when he promised to look after the class rabbit, and he kept his word every day.`,`カイはクラスのウサギの世話を真剣に約束し、毎日その約束を守った。`,`Her ____ face showed that she really meant every word of her apology.`,`謝罪の言葉を心から言っていることが伝わる真剣な表情を表す。`,[`insincere`,`careless`,`dishonest`]],[`elaborate`,`形容詞`,`having many parts or details and planned with great care`,`手の込んだ、精巧な`,`The toy-block castle was so ____ that it took three months to build.`,`そのブロックの城はとても手が込んでいて、作るのに3か月かかった。`,`For the festival, the dancers wore ____ costumes covered with hundreds of tiny beads and feathers.`,`何百もの小さなビーズと羽で飾られた手の込んだ衣装を表す。`,[`simple`,`plain`,`basic`]],[`elastic`,`形容詞`,`able to stretch and then return to its original shape`,`伸縮性のある、弾力のある`,`Pajama pants often have ____ waistbands that stretch and then go back to their normal size.`,`パジャマのズボンには、伸びてまた元のサイズに戻る伸縮性のあるウエストがよく付いている。`,`This rubber band is so ____ that you can pull it to twice its length without breaking it.`,`輪ゴムが元の2倍の長さまで伸びても切れない様子。`,[`rigid`,`stiff`,`brittle`]],[`elevate`,`動詞`,`to lift something to a higher position`,`持ち上げる、高くする`,`If you hurt your ankle, ____ your foot above your heart to reduce the swelling.`,`足首をけがしたら、腫れを抑えるために足を心臓より高く上げなさい。`,`The builders will ____ the new house on tall posts to keep it safe from floods.`,`洪水から守るため、新しい家を高い柱の上に建てる場面。`,[`lower`,`sink`,`drop`]],[`emphasize`,`動詞`,`to show that something is especially important`,`強調する`,`The teacher used a red marker to ____ the most important words on the whiteboard.`,`先生はホワイトボードの最も大切な言葉を赤いマーカーで強調した。`,`Coaches always ____ the importance of warming up before practice.`,`コーチたちが練習前のウォーミングアップの大切さを強く言う場面。`,[`ignore`,`hide`,`downplay`]],[`envy`,`名詞`,`a feeling of wanting something that another person has`,`うらやましさ、ねたみ`,`Watching his friend ride the shiny new bike he had always wanted, Ken was filled with ____.`,`ずっと欲しかったぴかぴかの新しい自転車に友達が乗るのを見て、ケンはうらやましさでいっぱいになった。`,`Her perfect test score was the ____ of the whole class; everyone wished they had done as well.`,`クラス全員がうらやむ満点を表す。`,[`pity`,`boredom`,`relief`]],[`erupt`,`動詞`,`to suddenly explode and throw out lava, smoke, ash, or hot water`,`噴火する、噴出する`,`Scientists warned that the volcano might ____ soon, so people left the area.`,`科学者たちが火山がまもなく噴火するかもしれないと警告したので、人々はその地域を離れた。`,`Every hour, the famous geyser in the park will ____ and shoot hot water high into the air.`,`公園の有名な間欠泉が1時間ごとに熱湯を高く噴き上げる様子。`,[`freeze`,`settle`,`shrink`]],[`esteem`,`名詞`,`respect and a good opinion of someone`,`尊敬、高い評価`,`The kind old doctor was held in high ____ by everyone in the village.`,`その親切な老医師は村の誰からも大いに尊敬されていた。`,`The players showed their ____ for the retiring coach by giving him a standing ovation.`,`引退するコーチへの敬意を、選手たちがスタンディングオベーションで示した場面。`,[`contempt`,`scorn`,`disgust`]],[`exhibit`,`動詞`,`to show something in public, for example in a museum`,`展示する`,`Next month, the museum will ____ dinosaur bones found in the desert.`,`来月、博物館は砂漠で見つかった恐竜の骨を展示する。`,`Students will ____ their science projects in the gym for parents to see.`,`生徒が保護者に見てもらうため、体育館で自由研究を展示する場面。`,[`hide`,`conceal`,`destroy`]],[`expertise`,`名詞`,`special skill or knowledge in a particular subject`,`専門知識、専門技術`,`We needed a mechanic's ____ to fix the strange noise in the car engine.`,`車のエンジンの変な音を直すには、整備士の専門技術が必要だった。`,`With her ____ in insects, Dr. Sato quickly named the rare beetle.`,`昆虫に詳しい佐藤博士が珍しい甲虫の名前をすぐに言い当てた場面。`,[`ignorance`,`inexperience`,`laziness`]],[`fainthearted`,`形容詞`,`lacking courage and easily frightened`,`気の弱い、臆病な`,`This roller coaster is not for the ____; it drops straight down from 60 mete ay`,`嘆願する、懇願する`,`The kids began to ____ with their dad: "Just one more ride on the roller coaster! We promise it's the last one!"`,`子どもたちは「ジェットコースターにもう1回だけ!これで最後にするって約束する!」と父親に必死に頼み始めた。`,`I had to ____ with my sister again and again, promising to be careful, before she lent me her comic book.`,`大事に扱うと約束しながら何度も姉に頼み込み、やっと漫画を貸してもらった場面。`,[`agree`,`laugh`,`play`]],[`pledge`,`動詞`,`to make a serious promise to do something`,`誓う、約束する`,`Before the match, all players stand up and ____ to follow the rules and play fair.`,`試合前、全選手が立ち上がり、ルールを守りフェアに戦うことを誓う。`,`At the ceremony, the students ____ to keep the school clean and sign a promise card.`,`式典で生徒たちが学校をきれいに保つことを誓い、約束カードに署名する場面。`,[`refuse`,`forget`,`fail`]],[`pose`,`動詞`,`to stay in one position so that someone can take a photo of you or paint you`,`ポーズをとる`,`The whole team will ____ in front of the trophy for a photo.`,`チーム全員がトロフィーの前で写真のためにポーズをとる。`,`The artist asked the girl to ____ quietly while he painted her picture.`,`画家が絵を描く間、少女にじっとポーズをとってもらう場面。`,[`hide`,`wander`,`vanish`]],[`possessive`,`形容詞`,`not wanting to share your things with others`,`独占欲の強い`,`My little brother is very ____ about his toys and won't let anyone touch them.`,`弟は自分のおもちゃへの独占欲が強く、誰にも触らせない。`,`Our cat is ____ of its favorite box and hisses if the dog comes near.`,`猫がお気に入りの箱を独り占めし、犬が近づくと威嚇する場面。`,[`generous`,`careless`,`forgetful`]],[`potency`,`名詞`,`the strength or power of something, such as a medicine or a flavor`,`効力、強さ`,`The ____ of this garlic is so great that one clove flavors the whole pot of soup.`,`このニンニクは味がとても強く、1かけで鍋全体のスープに風味がつく。`,`Sunscreen loses its ____ after a few hours, so put more on at the beach.`,`日焼け止めは数時間で効き目が落ちるので、海辺で塗り直す場面。`,[`weakness`,`silence`,`shortage`]],[`precise`,`形容詞`,`exact and correct in every detail`,`正確な、精密な`,`A robot arm must make ____ movements to place tiny parts on a circuit board.`,`ロボットアームは小さな部品を回路基板に置くため、精密な動きをしなければならない。`,`Tell me the ____ time the train leaves, not just 'around noon.'`,`「昼ごろ」ではなく電車の正確な出発時刻を尋ねる場面。`,[`clumsy`,`sloppy`,`careless`]],[`prejudice`,`名詞`,`an unfair opinion about someone that is formed without knowing them`,`偏見`,`The coach judged players by their skills, not by ____ about where they came from.`,`コーチは出身地への偏見ではなく、実力で選手を評価した。`,`Getting to know people from other countries can help break down ____.`,`外国の人と知り合うことが偏見をなくす助けになる場面。`,[`fairness`,`kindness`,`respect`]],[`prescribe`,`動詞`,`(of a doctor) to say officially what medicine or treatment a sick person should have`,`処方する`,`The doctor will ____ some medicine for your cough and write its name on a note for the pharmacy.`,`医者はせきの薬を処方し、薬局用のメモに薬の名前を書いてくれる。`,`Doctors often ____ rest and plenty of water for a bad cold.`,`ひどい風邪には、医者が休養と十分な水分をとるよう指示する場面。`,[`forbid`,`spill`,`swallow`]],[`preside`,`動詞`,`to be in charge of a meeting or ceremony`,`司会をする、議長を務める`,`The class leader will ____ over the student meeting and decide who speaks next.`,`学級委員長が生徒会議の議長を務め、次に話す人を決める。`,`Who will ____ at the school's award ceremony and hand out the prizes?`,`学校の表彰式で進行役を務め、賞を手渡す人を尋ねる場面。`,[`doze`,`giggle`,`trip`]],[`prompt`,`形容詞`,`done quickly and without delay`,`迅速な、即座の`,`Thank you for your ____ reply; I got your answer in only five minutes.`,`迅速なお返事ありがとう。たった5分で答えが届きました。`,`Thanks to the plumber's ____ arrival, the leaking pipe was fixed before the kitchen flooded.`,`配管工がすぐに来てくれたおかげで、台所が水浸しになる前に修理できた場面。`,[`late`,`delayed`,`slow`]],[`punctuate`,`動詞`,`to put marks such as commas and periods into a piece of writing`,`句読点を付ける`,`Remember to ____ your sentences with periods and question marks.`,`文にはピリオドや疑問符をきちんと付けることを忘れないで。`,`The teacher asked us to ____ the paragraph correctly by adding commas.`,`先生に言われて、段落にコンマを正しく入れる場面。`,[`erase`,`whisper`,`shrink`]],[`radiate`,`動詞`,`to send out light or heat in all directions`,`放つ、放射する`,`The old stove continues to ____ warmth across the room, keeping everyone cozy.`,`古いストーブは部屋中に暖かさを放ち続け、みんなをぽかぽかにしている。`,`Light bulbs ____ light in every direction, so the whole room gets bright.`,`電球が四方に光を放ち、部屋全体が明るくなる場面。`,[`absorb`,`block`,`hide`]],[`rash`,`形容詞`,`done too quickly without thinking about what might happen`,`軽率な、早まった`,`Buying the first bike he saw was ____; he should have compared prices first.`,`最初に見た自転車を買ったのは軽率だった。まず値段を比べるべきだった。`,`It was ____ of Ken to jump into the cold lake without checking how deep it was.`,`深さも確かめずに冷たい湖に飛び込んだケンの軽はずみな行動の場面。`,[`careful`,`wise`,`sensible`]],[`rebel`,`動詞`,`to fight against or refuse to obey the people in charge`,`反抗する、反乱を起こす`,`When Mom made a new rule of no video games on weekdays, my brother decided to ____ and played secretly under his blanket.`,`お母さんが平日はゲーム禁止という新しいルールを作ると、弟は反抗して布団の中でこっそり遊んだ。`,`The students began to ____ when the school tried to cancel their sports day.`,`運動会を中止しようとした学校に生徒たちが反発した場面。`,[`obey`,`agree`,`comply`]],[`rebound`,`動詞`,`to bounce back after hitting something`,`跳ね返る`,`Throw the ball hard and watch it ____ off the wall and come back to you.`,`壁にボールを投げて、はね返って戻ってくるのを見てごらん。`,`Tennis balls ____ higher on hard courts than on grass.`,`テニスボールは芝生よりハードコートの方が高く跳ね返るという場面。`,[`sink`,`melt`,`vanish`]],[`recession`,`名詞`,`a time when a country's business and trade become much weaker`,`景気後退、不況`,`During the ____, many companies lost money, and lots of people could not find jobs.`,`不況の間、多くの会社が損をし、仕事を見つけられない人がたくさんいた。`,`Experts hope the country's ____ will end soon so that companies can hire more workers.`,`専門家が、景気後退が早く終わり企業が人を雇えるようになることを願う場面。`,[`boom`,`celebration`,`festival`]],[`recite`,`動詞`,`to say a poem or piece of writing aloud from memory`,`暗唱する`,`Each student had to ____ a short poem from memory in front of the class.`,`生徒は一人ずつ、クラスの前で短い詩を暗唱しなければならなかった。`,`Can you ____ the alphabet backwards out loud without looking?`,`アルファベットを見ずに逆から声に出して言えるか尋ねる場面。`,[`forget`,`erase`,`hide`]],[`reform`,`動詞`,`to change a system or organization to make it better`,`改革する、改善する`,`The principal wants to ____ the school lunch system so that kids waste less food.`,`校長は、子どもが食べ物を無駄にしないよう給食の仕組みを改革したいと考えている。`,`The city plans to ____ its old bus routes to make trips faster.`,`市が古いバス路線を見直して移動を速くしようとする場面。`,[`ruin`,`ignore`,`worsen`]],[`regal`,`形容詞`,`looking like or suitable for a king or queen`,`王者らしい、堂々とした`,`In her gold crown and long red cape, the princess in the school play looked truly ____.`,`金の冠と長い赤いマントを身につけ、学芸会の王女は本当に堂々として見えた。`,`The lion walked with ____ steps, as if it were the king of the jungle.`,`ライオンがジャングルの王のように堂々と歩く場面。`,[`humble`,`clumsy`,`shabby`]],[`reign`,`動詞`,`to rule a country as its king or queen`,`君臨する、統治する`,`In the story, the young prince will ____ as king after his father retires.`,`物語の中で、若い王子は父が退位した後に王として国を治める。`,`In this game, the dragon king will ____ for a thousand years until a hero takes his crown.`,`ゲームで、竜の王が勇者に冠を奪われるまで千年にわたって国を支配する場面。`,[`obey`,`bow`,`kneel`]],[`renounce`,`動詞`,`to say officially that you are giving up something, such as a right or title`,`放棄する、断念する`,`The prince decided to ____ his right to the throne and become a farmer.`,`王子は王位継承権を放棄し、農家になることにした。`,`The explorer agreed to ____ any right to the island so that it could become a nature park.`,`探検家が島の権利を手放し、島を自然公園にする場面。`,[`claim`,`demand`,`seize`]],[`reprimand`,`動詞`,`to tell someone officially and strictly that they did something wrong`,`叱責する、戒める`,`The teacher had to ____ the students for running in the hallway.`,`先生は廊下を走った生徒たちを叱らなければならなかった。`,`The coach will ____ any player who is late to practice.`,`練習に遅刻した選手をコーチが注意する場面。`,[`praise`,`reward`,`thank`]],[`resign`,`動詞`,`to officially leave your job or position`,`辞任する、辞職する`,`The captain decided to ____ because she was moving to another city, so the team chose a new captain.`,`キャプテンは別の町へ引っ越すので辞任することにし、チームは新しいキャプテンを選んだ。`,`Mr. Sato will ____ as head coach at the end of the year to spend more time with his family.`,`佐藤さんが家族との時間を増やすため、年末に監督を辞める場面。`,[`join`,`begin`,`enter`]],[`resist`,`動詞`,`to not be harmed or damaged by something`,`耐える、抵抗する`,`This jacket can ____ water, so you stay dry in the rain.`,`このジャケットは水をはじくので、雨の中でもぬれない。`,`The castle walls were built to ____ strong winds and storms.`,`城壁が強い風や嵐に耐えるよう造られている場面。`,[`attract`,`collect`,`create`]],[`retain`,`動詞`,`to keep or continue to have something`,`保持する、保つ`,`Wool socks ____ heat, so your feet stay warm even in the snow.`,`ウールの靴下は熱を保つので、雪の中でも足が温かい。`,`Reviewing new words every day helps you ____ them for a long time.`,`毎日新しい単語を復習すると長く覚えていられるという場面。`,[`lose`,`release`,`waste`]],[`revolve`,`動詞`,`to move in a circle around a central point`,`回転する、公転する`,`The Earth and the other planets ____ around the sun.`,`地球やほかの惑星は太陽の周りを回っている。`,`Watch the merry-go-round slowly ____ as the music plays.`,`音楽に合わせてメリーゴーラウンドがゆっくり回る場面。`,[`stand`,`shrink`,`melt`]],[`righteous`,`形容詞`,`morally good and fair`,`正義の、公正な`,`The hero in the story is ____ and always chooses to do what is fair and good.`,`物語の主人公は正義感が強く、いつも公正で良い行いを選ぶ。`,`She felt ____ anger when she saw older kids teasing a smaller student.`,`年上の子が小さな子をからかうのを見て、正義の怒りを感じた場面。`,[`wicked`,`selfish`,`dishonest`]],[`sane`,`形容詞`,`sensible and able to think clearly`,`正気の、分別のある`,`With a storm coming, the only ____ choice was to cancel the picnic.`,`嵐が近づいていたので、ピクニック中止が唯一の賢明な選択だった。`,`No ____ person would climb a snowy mountain in flip-flops.`,`分別のある人なら、ビーチサンダルで雪山に登ったりしないという場面。`,[`foolish`,`silly`,`absurd`]],[`sarcasm`,`名詞`,`saying the opposite of what you mean in order to make fun of something`,`皮肉、いやみ`,`'Oh, great, more homework,' Ken said with ____, rolling his eyes.`,`「わあ、最高、また宿題か」とケンは目をぐるりと回して皮肉を込めて言った。`,`Emi didn't notice the ____ in her brother's voice and thought he really liked her drawing.`,`兄の声の皮肉に気づかず、本当に絵を気に入ってくれたと思った場面。`,[`joy`,`sincerity`,`gratitude`]],[`scatter`,`動詞`,`to throw things, or to move, in many different directions`,`まき散らす、散らばる`,`Farmers ____ seeds all over the field so that plants will grow everywhere.`,`農家は畑のどこにでも植物が育つよう、畑一面に種をまく。`,`Pigeons ____ in all directions when a dog runs toward them.`,`犬が走ってくるとハトが四方八方に散らばる場面。`,[`gather`,`collect`,`stack`]],[`scorch`,`動詞`,`to burn the surface of something and change its color`,`焦がす`,`Don't leave the hot iron on your shirt too long, or it will ____ the cloth.`,`シャツに熱いアイロンを長く当てたままにすると、布が焦げてしまう。`,`The hot summer sun can ____ the grass and turn it brown.`,`夏の強い日差しで芝生が焼けて茶色になる場面。`,[`cool`,`soak`,`fold`]],[`seclusion`,`名詞`,`the state of being alone, away from other people`,`隔離、隠遁`,`The writer moved to a cabin in the mountains to work in ____, far from noisy crowds.`,`その作家は騒がしい人混みから離れ、一人で仕事をするため山小屋に移った。`,`The rare panda lives in ____ deep in the bamboo forest, away from people.`,`珍しいパンダが人から離れた竹林の奥でひっそり暮らす場面。`,[`public`,`chaos`,`traffic`]],[`serene`,`形容詞`,`calm, peaceful, and quiet`,`穏やかな、静かな`,`The lake was ____ at dawn, with no wind and no sound except birds.`,`夜明けの湖は穏やかで、風もなく、鳥の声しか聞こえなかった。`,`Even before the big match, the goalkeeper looked ____ and relaxed.`,`大事な試合の前でも、ゴールキーパーが落ち着いて見える場面。`,[`noisy`,`stormy`,`chaotic`]],[`shrewd`,`形容詞`,`clever at understanding situations and making smart decisions`,`抜け目のない、鋭い`,`The ____ shopkeeper bought umbrellas cheaply in winter and sold them quickly in the rainy season.`,`抜け目のない店主は冬に傘を安く仕入れ、梅雨にすぐ売った。`,`Yuki was ____ enough to trade her extra cards for the rare card everyone wanted.`,`ユキが余ったカードを、皆が欲しがる珍しいカードと上手に交換する場面。`,[`foolish`,`naive`,`careless`]],[`sinister`,`形容詞`,`seeming evil and likely to cause harm`,`不吉な、邪悪な`,`The villain in the cartoon had a ____ laugh that made everyone expect trouble.`,`アニメの悪役は、みんなに何か悪いことが起こりそうだと思わせる不気味な笑い方をした。`,`In the game, ____ music plays whenever the evil wizard is close, warning players of danger.`,`悪い魔法使いが近づくと流れる、危険を知らせる不気味な音楽を表す。`,[`cheerful`,`harmless`,`gentle`]],[`sizzle`,`動詞`,`to make a hissing sound, like food frying in hot oil`,`ジュージューと音を立てる`,`The sausages began to ____ as soon as Dad put them in the hot pan.`,`お父さんが熱いフライパンに入れるとすぐに、ソーセージがジュージューと音を立て始めた。`,`You could hear the onions ____ on the grill from across the campsite.`,`キャンプ場の向こうまで、グリルで焼ける玉ねぎの音が聞こえる様子。`,[`freeze`,`bloom`,`rust`]],[`slender`,`形容詞`,`long and thin in a graceful way`,`ほっそりした、細長い`,`The giraffe bent its long, ____ neck to reach the leaves.`,`キリンは長くほっそりした首を曲げて葉に届かせた。`,`The ____ reeds by the pond swayed like thin green threads in the breeze.`,`池のほとりの細い葦が、緑の糸のように風に揺れる様子。`,[`bulky`,`stubby`,`chubby`]],[`slippery`,`形容詞`,`smooth or wet and hard to hold or stand on`,`滑りやすい`,`Be careful—the floor is ____ because it was just mopped.`,`気をつけて。モップをかけたばかりで床が滑りやすいよ。`,`The fish was so ____ that it slid right out of my hands.`,`魚がつるつるで手から滑り落ちてしまった場面。`,[`rough`,`dusty`,`dry`]],[`smuggle`,`動詞`,`to move something somewhere secretly, against the rules`,`こっそり持ち込む、密輸する`,`Ken tried to ____ his pet hamster into school inside his lunch box.`,`ケンはペットのハムスターを弁当箱に入れて、こっそり学校に持ち込もうとした。`,`The kids tried to ____ snacks into the movie theater under their jackets.`,`子どもたちが上着の下にお菓子を隠して映画館に持ち込もうとした場面。`,[`parade`,`welcome`,`escort`]],[`solidify`,`動詞`,`to become hard or firm`,`固まる、固体になる`,`Put the jelly in the fridge so it can ____ overnight.`,`ゼリーが一晩で固まるように冷蔵庫に入れてね。`,`As hot lava cools, it begins to ____ into dark rock.`,`熱い溶岩が冷えて黒い岩になっていく様子。`,[`melt`,`evaporate`,`dissolve`]],[`sparse`,`形容詞`,`few in number and thinly scattered`,`まばらな、乏しい`,`Trees are ____ in the desert, so there is little shade.`,`砂漠では木がまばらなので、日陰がほとんどない。`,`The crowd was ____ on the rainy day, with only a few fans scattered in the stands.`,`雨の日で、観客席にファンが数人ぽつぽつといるだけの様子。`,[`dense`,`plentiful`,`crowded`]],[`spectator`,`名詞`,`a person who watches an event, such as a sports game`,`観客、見物人`,`Every ____ in the stadium stood up and cheered when the goal was scored.`,`ゴールが決まると、スタジアムの観客全員が立ち上がって歓声を上げた。`,`Only one ____ sat in the stands to watch the early morning practice.`,`早朝練習を見に来た人がスタンドに一人だけいた場面。`,[`pedestrian`,`passenger`,`tenant`]],[`stimulus`,`名詞`,`something that causes a living thing to react`,`刺激`,`Bright light is a ____ that makes the pupils of your eyes get smaller.`,`明るい光は、目の瞳孔を小さくさせる刺激だ。`,`In the experiment, the sound of a bell was the ____ that made the dog run to its bowl.`,`実験で、ベルの音が犬をえさ入れへ走らせるきっかけになった場面。`,[`barrier`,`fossil`,`souvenir`]],[`strain`,`動詞`,`to hurt or tire a part of the body by using it too hard`,`（体の一部を）痛める、酷使する`,`Don't ____ your eyes by reading in the dark.`,`暗い所で本を読んで目を酷使しないようにね。`,`Warm up first, or you might ____ a muscle during the race.`,`準備運動をしないとレース中に筋肉を痛めるかもしれないという注意。`,[`rest`,`relax`,`protect`]],[`strenuous`,`形容詞`,`needing a lot of physical effort`,`骨の折れる、激しい`,`Climbing the steep mountain was so ____ that we had to rest every ten minutes.`,`険しい山を登るのはとてもきつく、10分ごとに休まなければならなかった。`,`Moving all the heavy boxes up five floors was ____ work.`,`重い箱を全部5階まで運ぶ、体力のいる作業。`,[`effortless`,`relaxing`,`leisurely`]],[`stronghold`,`名詞`,`a place that is strongly protected against attack`,`要塞、とりで`,`The knights hid in their mountain ____, safe behind thick stone walls.`,`騎士たちは山の要塞に隠れ、厚い石の壁に守られていた。`,`In the game, you must break into the dragon's ____, protected by high walls and iron gates, to rescue the treasure.`,`ゲームで、高い壁と鉄の門に守られた竜のとりでに攻め込む場面。`,[`meadow`,`marsh`,`glacier`]],[`stunned`,`形容詞`,`so surprised or shocked that you cannot speak or move`,`呆然とした、びっくりした`,`The class was ____ into silence when the tiny robot suddenly started to sing.`,`小さなロボットが突然歌い出すと、クラスはびっくりして静まり返った。`,`Mia was so ____ by the surprise party that she couldn't say a word.`,`サプライズパーティーに驚いて言葉が出なかったミアの様子。`,[`bored`,`relaxed`,`sleepy`]],[`subdued`,`形容詞`,`unusually quiet and not lively`,`沈んだ、元気のない`,`After losing the final match, the team was unusually ____ on the bus ride home.`,`決勝戦に負けた後、チームは帰りのバスでいつになく静かだった。`,`Kenta, usually the loudest boy in class, was ____ all day because his dog was sick.`,`普段は一番にぎやかなケンタが、犬が病気で一日中元気がない様子。`,[`cheerful`,`noisy`,`energetic`]],[`subside`,`動詞`,`to become less strong, loud, or intense`,`収まる、静まる`,`We waited in the cabin for the storm to ____ before walking to the lake.`,`私たちは嵐が収まるまで小屋で待ってから湖へ歩いて行った。`,`The pain in my ankle began to ____ after I put ice on it.`,`足首を氷で冷やしたら痛みが和らいできた場面。`,[`intensify`,`strengthen`,`worsen`]],[`subsidy`,`名詞`,`money a government gives to help pay the cost of something`,`補助金、助成金`,`The city gives a ____ to families who buy electric bikes, so they cost less.`,`市は電動自転車を買う家庭に補助金を出すので、安く買える。`,`The farmers received a ____ from the government to help pay for new equipment.`,`農家が新しい機械の費用を助けるお金を政府から受け取った場面。`,[`penalty`,`tax`,`fee`]],[`subtle`,`形容詞`,`small and not easy to notice`,`かすかな、微妙な`,`There is a ____ difference between the twins: one has a tiny freckle on her chin.`,`その双子にはわずかな違いがある。一人はあごに小さなそばかすがあるのだ。`,`The soup had a ____ taste of ginger that you could barely notice.`,`ほとんど気づかないほどほのかなショウガの味がするスープ。`,[`huge`,`striking`,`dramatic`]],[`subtract`,`動詞`,`to take one number away from another number`,`引く、引き算する`,`If you ____ 3 from 10, you get 7.`,`10から3を引くと7になる。`,`To find out how many cookies are left, ____ the number you ate from the total.`,`残りのクッキーの数を出すために、食べた数を全体から引く計算。`,[`add`,`multiply`,`divide`]],[`successor`,`名詞`,`a person who takes over a job or role after someone else`,`後継者、後任`,`When the old captain retired, the team chose Yuki as his ____.`,`前のキャプテンが引退すると、チームはユキを後任に選んだ。`,`The wise king trained his daughter to be his ____ so she could rule after him.`,`賢い王が、自分の後に国を治められるよう娘を跡継ぎとして育てた話。`,[`predecessor`,`opponent`,`landlord`]],[`supernatural`,`形容詞`,`like magic, and impossible for science to explain`,`超自然的な`,`In the story, the wizard used ____ powers to make the river flow backward.`,`物語の中で、魔法使いは超自然的な力を使って川を逆流させた。`,`Many old legends describe foxes with ____ abilities, such as turning into people.`,`人に化けるなど、不思議な力を持つキツネが出てくる昔話。`,[`ordinary`,`scientific`,`everyday`]],[`surplus`,`名詞`,`an extra amount that is more than what is needed`,`余剰、余り`,`The farm grew so many apples that it gave the ____ to the school cafeteria.`,`その農場はリンゴがたくさんとれたので、余った分を学校の食堂にあげた。`,`After the bake sale, we had a ____ of cupcakes, so we shared the extra with our neighbors.`,`焼き菓子販売の後にカップケーキが余り、近所の人に分けた場面。`,[`shortage`,`lack`,`deficit`]],[`suspension`,`名詞`,`a temporary stop of an activity or service`,`一時停止、中断`,`Because of the heavy snow, there was a ____ of all train services until noon.`,`大雪のため、正午まですべての電車の運 il they are ____, then mash them for the baby.`,`赤ちゃん用に、にんじんを柔らかくなるまでゆでてつぶす手順。`,[`tough`,`chewy`,`rubbery`]],[`thorough`,`形容詞`,`careful and complete, with every detail checked`,`徹底的な、念入りな`,`The scientist did a ____ check of every part of the robot before the test.`,`科学者はテストの前に、ロボットのすべての部品を念入りに点検した。`,`Before the party, we gave the house a ____ cleaning, even under the beds.`,`パーティーの前に、ベッドの下まで家を隅々まで掃除した場面。`,[`careless`,`sloppy`,`partial`]],[`timid`,`形容詞`,`shy and easily scared`,`臆病な、内気な`,`The ____ rabbit ran into its burrow whenever it heard a noise.`,`その臆病なウサギは、物音がするたびに巣穴に逃げ込んだ。`,`At first, Hana was too ____ to speak in front of the class.`,`最初は恥ずかしがりで、クラスの前で話せなかったハナの様子。`,[`bold`,`brave`,`fearless`]],[`tolerable`,`形容詞`,`not pleasant, but possible to put up with`,`我慢できる、まあまあの`,`The heat was barely ____, so we stayed in the shade and drank lots of water.`,`暑さはぎりぎり我慢できる程度だったので、日陰にいて水をたくさん飲んだ。`,`The noise from the construction was annoying but ____, so we kept studying.`,`工事の音はうるさいが耐えられる程度で、勉強を続けた場面。`,[`unbearable`,`delightful`,`freezing`]],[`tranquil`,`形容詞`,`calm, quiet, and peaceful`,`静かな、穏やかな`,`The lake was so ____ that it looked like a mirror.`,`湖はとても穏やかで、鏡のように見えた。`,`We found a ____ spot in the garden where we could read without any noise.`,`庭の中で物音一つせず本が読める静かな場所を見つけた場面。`,[`stormy`,`noisy`,`chaotic`]],[`trigger`,`動詞`,`to make something start to happen`,`引き起こす、きっかけとなる`,`Pollen can ____ sneezing in people with allergies.`,`花粉はアレルギーのある人にくしゃみを引き起こすことがある。`,`A small spark can ____ a big fire, so be careful with matches.`,`小さな火花が大火事のきっかけになるので、マッチに気をつけるという注意。`,[`prevent`,`cure`,`stop`]],[`triumph`,`名詞`,`a great win or success`,`大勝利、大成功`,`Winning the national robot contest was a ____ for our small school.`,`全国ロボットコンテストでの優勝は、私たちの小さな学校にとって大成功だった。`,`The players raised the trophy and shouted in ____.`,`選手たちが優勝トロフィーを掲げて勝利の喜びに叫んだ場面。`,[`failure`,`defeat`,`disaster`]],[`turmoil`,`名詞`,`a state of great confusion and disorder`,`混乱、騒ぎ`,`The classroom was in ____ after the hamster escaped thers in the pond.`,`うぬぼれ屋のクジャクは、一日中池に映る自分の羽に見とれていた。`,`The prince in the story was so ____ that he looked in the mirror a hundred times a day.`,`物語の王子が、1日に100回も鏡を見るほど自分に見とれている様子。`,[`humble`,`modest`,`shy`]],[`vast`,`形容詞`,`extremely large in size or amount`,`広大な、莫大な`,`The Pacific is a ____ ocean that covers about a third of Earth.`,`太平洋は地球の約3分の1を覆う広大な海だ。`,`From the plane, we saw a ____ desert that stretched as far as the eye could see.`,`飛行機から、見渡す限り続く広い砂漠が見えた場面。`,[`tiny`,`narrow`,`cramped`]],[`ventilate`,`動詞`,`to let fresh air move into a place`,`換気する、風を通す`,`Open the windows to ____ the classroom after the science experiment.`,`理科の実験の後は、窓を開けて教室を換気しよう。`,`Tiny holes in the box ____ it so the beetle can breathe.`,`箱の小さな穴が空気を通し、カブトムシが呼吸できるようにしている様子。`,[`seal`,`darken`,`flood`]],[`violate`,`動詞`,`to break a rule, law, or promise`,`（規則などに）違反する、破る`,`Players who ____ the rules of the game will get a yellow card.`,`試合のルールに違反した選手にはイエローカードが出される。`,`Parking in front of the fire station would ____ city rules.`,`消防署の前に車を止めると市の決まりを破ることになるという説明。`,[`obey`,`follow`,`respect`]],[`virtually`,`副詞`,`almost completely; nearly`,`事実上、ほとんど`,`After the storm, the playground was ____ empty; only one child was on the swings.`,`嵐の後、遊び場はほとんど空っぽで、ブランコに子どもが一人いるだけだった。`,`The snow was so deep that the road was ____ invisible; we could only see the tops of the signs.`,`雪が深く、標識の先しか見えないほど道がほぼ見えなくなった様子。`,[`hardly`,`rarely`,`never`]],[`virtue`,`名詞`,`a good quality in someone's character`,`美徳、長所`,`Patience is a ____ that helps you learn difficult skills like playing the piano.`,`忍耐はピアノのような難しい技術を身につけるのに役立つ美徳だ。`,`Honesty is the ____ that her friends admire most in her.`,`友達が彼女について一番尊敬している良いところは正直さだという話。`,[`flaw`,`weakness`,`fault`]],[`vital`,`形容詞`,`extremely important and necessary`,`極めて重要な、不可欠な`,`Water is ____ for all plants; without it, they soon die.`,`水はすべての植物にとって不可欠で、水がないとすぐに枯れてしまう。`,`Teamwork is ____ to winning a relay race, since every runner must pass the baton well.`,`全員がうまくバトンを渡す必要があるリレーで、チームワークがとても大切だという話。`,[`useless`,`harmful`,`optional`]],[`vulnerability`,`名詞`,`a weak point that makes something easy to harm or attack`,`弱点、もろさ`,`The dragon's only ____ was a small soft spot under its chin.`,`竜の唯一の弱点は、あごの下の小さな柔らかい部分だった。`,`Engineers found a ____ in the app that could let hackers steal passwords.`,`ハッカーにパスワードを盗まれるおそれのある、アプリの弱点が見つかった場面。`,[`strength`,`talent`,`benefit`]],[`weary`,`形容詞`,`very tired, especially after long effort`,`疲れ果てた、くたくたの`,`After hiking all day, the ____ campers fell asleep as soon as they lay down.`,`一日中ハイキングをして疲れ果てたキャンパーたちは、横になるとすぐに眠った。`,`Mom looked ____ after working late every night this week.`,`今週毎晩遅くまで働いて、お母さんがくたくたに見える様子。`,[`energetic`,`lively`,`refreshed`]],[`wreck`,`動詞`,`to damage something so badly that it is ruined`,`壊す、台無しにする`,`The heavy rain will ____ our sandcastle if we don't protect it.`,`守らないと、大雨で砂の城が壊れてしまう。`,`Don't let one mistake ____ your whole day.`,`一つの失敗で一日全体を台無しにしないでという励まし。`,[`build`,`repair`,`decorate`]],[`wretched`,`形容詞`,`very unhappy or in a very bad state`,`惨めな、ひどい`,`The kitten looked ____ after being caught in the rain, cold and shivering.`,`雨に降られた子猫は、寒さで震えていてかわいそうな姿だった。`,`I felt ____ all day because of my terrible cold.`,`ひどい風邪のせいで一日中つらかった様子。`,[`cheerful`,`cozy`,`delighted`]],[`yield`,`動詞`,`to produce crops, results, or profits`,`（作物・結果を）生み出す、もたらす`,`These apple trees ____ hundreds of apples every autumn.`,`これらのリンゴの木は毎年秋に何百個ものリンゴを実らせる。`,`Careful experiments often ____ useful results.`,`丁寧な実験が役立つ結果を生むことが多いという話。`,[`consume`,`borrow`,`forget`]]]),_=d(`grade1`,[[`abate`,`動詞`,`to become less strong or intense`,`(勢いが)弱まる、和らぐ`,`We waited inside until the storm began to ____, and then we walked home safely.`,`嵐が弱まり始めるまで私たちは屋内で待ち、それから安全に歩いて帰った。`,`The coach told me to rest until the pain in my knee started to ____.`,`ひざの痛みが和らぐまで休むようコーチに言われた場面。`,[`intensify`,`escalate`,`surge`]],[`abhor`,`動詞`,`to hate something very strongly`,`ひどく嫌う、忌み嫌う`,`Cats usually ____ getting wet, so they run away from the bath.`,`猫はたいてい濡れるのをひどく嫌うので、お風呂から逃げ出す。`,`I ____ the smell of rotten eggs; it makes me feel sick.`,`腐った卵のにおいが大嫌いで、気分が悪くなる。`,[`adore`,`cherish`,`relish`]],[`acclaim`,`名詞`,`strong public praise and approval`,`称賛、絶賛`,`The young pianist's first concert won great ____ from critics all over the world.`,`その若いピアニストの初コンサートは、世界中の評論家から大きな称賛を受けた。`,`The new robot game received wide ____ and sold millions of copies.`,`新しいロボットゲームが広く絶賛され、何百万本も売れた。`,[`scorn`,`ridicule`,`neglect`]],[`adamant`,`形容詞`,`refusing to change your opinion or decision`,`断固とした、譲らない`,`Mia was ____ that she would finish the race, and nothing could change her mind.`,`ミアはレースを完走すると断固として言い張り、誰も彼女の考えを変えられなかった。`,`Dad was ____ about bedtime: nine o'clock, no exceptions.`,`父は就寝時間について一歩も譲らず、9時と決めて例外を認めない。`,[`hesitant`,`uncertain`,`indifferent`]],[`adept`,`形容詞`,`very skilled at doing something`,`熟達した、上手な`,`Ken is ____ at solving puzzles; he finished the hardest one in two minutes.`,`ケンはパズルを解くのが得意で、一番難しいものを2分で解いた。`,`Our cat is ____ at catching toys that fly through the air; she never misses.`,`うちの猫は宙を飛ぶおもちゃを捕まえるのがとても上手で、決して逃さない。`,[`clumsy`,`inept`,`awkward`]],[`admonish`,`動詞`,`to warn or scold someone firmly but calmly`,`注意する、たしなめる`,`The librarian had to ____ the boys for talking loudly in the quiet reading room.`,`司書は静かな閲覧室で大声で話していた男の子たちを注意しなければならなかった。`,`Teachers often ____ students who forget their homework again and again.`,`何度も宿題を忘れる生徒を先生がたしなめる場面。`,[`praise`,`commend`,`reward`]],[`adverse`,`形容詞`,`harmful or not favorable`,`不利な、有害な`,`The race was delayed because of ____ weather, with strong winds and heavy rain.`,`強風と大雨という悪天候のため、レースは延期された。`,`Too much screen time can have ____ effects on your sleep.`,`画面を見すぎると睡眠に悪い影響が出ることを表す。`,[`favorable`,`beneficial`,`pleasant`]],[`affluent`,`形容詞`,`having a lot of money and a comfortable life`,`裕福な、豊かな`,`The ____ family owned three large houses and a private jet.`,`その裕福な一家は大きな家を3軒と自家用ジェット機を持っていた。`,`People in ____ neighborhoods often have large gardens and expensive cars.`,`裕福な地域の人々が広い庭や高級車を持っていることを表す。`,[`impoverished`,`needy`,`penniless`]],[`ambivalent`,`形容詞`,`having mixed feelings about something`,`相反する感情を持つ、複雑な気持ちの`,`I feel ____ about moving to a new school: excited to make friends but sad to leave old ones.`,`転校については複雑な気持ちだ。友達ができるのは楽しみだけど、今の友達と離れるのは悲しい。`,`Sam was ____ about the camping trip; he loved nature but hated bugs.`,`自然は好きだが虫は嫌いで、キャンプに対して気持ちが揺れている。`,[`certain`,`enthusiastic`,`decisive`]],[`amplify`,`動詞`,`to make a sound louder or stronger`,`(音を)増幅する、大きくする`,`The band used big speakers to ____ their music for the huge crowd.`,`バンドは大観衆のために大きなスピーカーで音楽の音量を上げた。`,`A megaphone can ____ your voice so people far away can hear it.`,`メガホンで声を大きくし、遠くの人にも聞こえるようにする。`,[`muffle`,`mute`,`soften`]],[`apathetic`,`形容詞`,`showing no interest, energy, or feeling`,`無関心な、無気力な`,`The students seemed ____ about the lesson, yawning and staring out the window.`,`生徒たちは授業に無関心な様子で、あくびをしたり窓の外を眺めたりしていた。`,`The cat was completely ____ toward the new toy and just went back to sleep.`,`猫が新しいおもちゃに全く興味を示さず、また眠ってしまった。`,[`eager`,`enthusiastic`,`curious`]],[`appease`,`動詞`,`to calm someone down by giving them what they want`,`なだめる、機嫌をとる`,`Mom gave the crying baby a toy to ____ him.`,`母は泣いている赤ちゃんをなだめるためにおもちゃを渡した。`,`The team tried to ____ the angry fans by promising a better season.`,`怒ったファンをなだめるため、チームが来季の活躍を約束した。`,[`provoke`,`irritate`,`enrage`]],[`ardent`,`形容詞`,`very enthusiastic and passionate`,`熱心な、熱烈な`,`Grandpa is a truly ____ supporter of the local baseball team and never misses a game.`,`祖父は地元の野球チームの本当に熱心なファンで、一試合も見逃さない。`,`Her ____ love of dinosaurs led her to read every book about them in the library.`,`恐竜が大好きな少女が、図書館の恐竜の本を全部読んだ。`,[`indifferent`,`lukewarm`,`reluctant`]],[`articulate`,`形容詞`,`able to express ideas clearly in words`,`はっきりと話せる、表現力のある`,`She is very ____ and can explain difficult science ideas in simple words.`,`彼女はとても表現力があり、難しい科学の考えを簡単な言葉で説明できる。`,`The ____ speaker explained her plan so clearly that everyone understood at once.`,`話し手が計画をとても明快に説明し、全員がすぐ理解した。`,[`incoherent`,`muddled`,`tongue-tied`]],[`aus d argument`,`議論を呼ぶ、論争の的になる`,`Whether to ban phones at school is a ____ topic, and students argue about it for hours.`,`学校でスマホを禁止するかどうかは議論を呼ぶ話題で、生徒たちは何時間も言い合う。`,`The referee's ____ decision led to shouting from both teams' fans.`,`審判の判定が物議をかもし、両チームのファンが声を上げた。`,[`harmless`,`settled`,`peaceful`]],[`covet`,`動詞`,`to strongly want something that belongs to someone else`,`(他人の物を)ひどく欲しがる`,`Many kids at school ____ Taro's shiny new bicycle and wish it were theirs.`,`学校の多くの子がタロウのぴかぴかの新しい自転車を欲しがり、自分のものならいいのにと思っている。`,`The younger players ____ the captain's armband and dream of wearing it someday.`,`若い選手たちがキャプテンの腕章にあこがれ、いつか着けたいと夢見ている。`,[`dislike`,`ignore`,`reject`]],[`culprit`,`名詞`,`the person or thing that caused a problem`,`犯人、原因`,`The ____ who ate all the cookies turned out to be our dog.`,`クッキーを全部食べた犯人は、うちの犬だとわかった。`,`Too much sugar is the main ____ behind tooth decay.`,`虫歯の主な原因が砂糖のとりすぎであることを表す。`,[`victim`,`bystander`,`rescuer`]],[`curtail`,`動詞`,`to reduce or limit something`,`削減する、切り詰める`,`Heavy rain forced the coach to ____ practice, so we went home an hour early.`,`大雨のためコーチは練習を短縮せざるを得ず、私たちは1時間早く帰った。`,`Parents may ____ screen time if children stay up too late playing games.`,`ゲームで夜更かしする子どもの画面時間を親が制限する。`,[`extend`,`expand`,`lengthen`]],[`dainty`,`形容詞`,`small, delicate, and pretty`,`上品で小さい、繊細な`,`The princess in the picture book drank tea from a ____ little cup with painted flowers.`,`絵本のお姫様は、花の絵が描かれた小さく上品なカップで紅茶を飲んだ。`,`The kitten took ____ steps across the table, careful not to knock anything over.`,`子猫が何も倒さないよう、テーブルの上をそっと上品に歩いた。`,[`bulky`,`clumsy`,`massive`]],[`deduce`,`動詞`,`to reach an answer by thinking carefully about the facts`,`推論する、推測する`,`From the muddy paw prints, we could ____ that the dog had been in the garden.`,`泥だらけの足跡から、犬が庭にいたと推理できた。`,`Good detectives in stories ____ the answer from tiny clues.`,`物語の名探偵が小さな手がかりから答えを導き出す。`,[`forget`,`ignore`,`deny`]],[`deference`,`名詞`,`polite respect for another person's wishes or opinions`,`敬意、服従`,`Out of ____ to their guest, the
