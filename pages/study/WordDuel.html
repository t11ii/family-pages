st of the match.`,`けがをした選手の代わりが試合に出た。`,[`companion`,`addition`,`decoration`]],[`distract`,`動詞`,`to pull attention away from what someone is doing`,`注意をそらす`,`Please do not ____ me with jokes while I count these pieces.`,`部品を数えている間は、冗談で気を散らさないで。`,`Flashing lights can ____ drivers, making them look away from the road.`,`点滅する光が運転者の注意を道路からそらす。`,[`assist`,`instruct`,`guide`]],[`privatize`,`動詞`,`to move a business or service from public to private ownership`,`国や自治体の事業を民間のものにする`,`The city plans to ____ the bus company by selling it to a private firm.`,`市はバス会社を民間企業に売り、民営化する予定だ。`,`The government voted to ____ the airline, transferring ownership to investors.`,`政府が航空会社を民間の投資家の所有に移す。`,[`nationalize`,`subsidize`,`inspect`]],[`irrelevant`,`形容詞`,`not connected to the matter being discussed`,`今の話題に関係のない`,`Your shoe color is ____ to solving this math problem.`,`靴の色は、この算数の問題を解くことに関係がない。`,`Leave out the ____ details about lunch; the report is only about the robot test.`,`ロボットの試験に関係のない昼食の話を報告から省く。`,[`essential`,`central`,`pertinent`]],[`hazardous`,`形容詞`,`likely to cause harm or danger`,`危険を伴う`,`Crossing the cracked ice is ____, so we must use the bridge instead.`,`ひびの入った氷を渡るのは危険なので、橋を使わなければならない。`,`The lab keeps ____ chemicals locked away because they can cause harm.`,`害を及ぼす危険のある薬品を施錠して保管する。`,[`harmless`,`beneficial`,`safe`]],[`invalid`,`形容詞`,`not officially acceptable or usable`,`正式には認められない、無効な`,`This ticket is ____ because it expired yesterday, so it cannot be used.`,`この切符は昨日で期限が切れて無効になり、使えない。`,`A vote with two names is ____ under the rule allowing only one name.`,`1人の名前だけを書く規則で、2人書いた票は無効になる。`,[`valid`,`acceptable`,`authorized`]],[`loophole`,`名詞`,`a gap in a rule that lets someone avoid its intended limits`,`規則の抜け穴`,`The rule banned cars but forgot trucks, creating a ____ that drivers could exploit.`,`規則は車を禁止したがトラックを除外してしまい、運転者が利用できる抜け穴ができた。`,`A ____ let players claim the same reward twice, so the designers rewrote the rule.`,`同じ報酬を2回受け取れる規則の抜け穴を直す。`,[`safeguard`,`penalty`,`obligation enty minutes every day.`,`新年の決意は、毎日20分読書することだ。`,`She made a firm ____ to stop leaving her homework until the last minute.`,`宿題をぎりぎりまで残すのをやめる、と強く決めた。`,[`prediction`,`memory`,`excuse`]],[`blueprint`,`名詞`,`a detailed plan showing how something will be built`,`建物や機械などの詳しい設計図`,`The builder followed the ____ showing every wall and doorway of the new house.`,`建築作業員は、新しい家の壁や出入口をすべて示す設計図に従った。`,`Before building the robot, draw a ____ showing where all its parts belong.`,`ロボットの部品の位置を建造前に設計図にする。`,[`receipt`,`biography`,`forecast`]],[`aftermath`,`名詞`,`the period and effects following a harmful event`,`災害などの直後の状況や影響`,`In the ____ of the storm, neighbors cleared fallen branches from the road.`,`嵐の後、近所の人々が道から倒れた枝を片付けた。`,`The story describes the ____ of the flood, when families repaired their homes.`,`洪水後に家を修理している時期の状況を表す。`,[`prelude`,`anticipation`,`preparation`]],[`imminent`,`形容詞`,`about to happen very soon`,`今にも起こりそうな`,`The countdown reached three seconds; the rocket launch was ____.`,`秒読みが残り3秒になり、ロケットの打ち上げが目前だった。`,`Dark clouds and nearby thunder warned that a storm was ____.`,`黒い雲と近くの雷が、嵐がすぐ来ると知らせる。`,[`remote`,`unlikely`,`completed`]],[`vigorous`,`形容詞`,`full of strength, effort, and energy`,`力強く、活発な`,`After a ____ workout of running and jumping, I was breathing hard.`,`走ったり跳んだりする激しい運動の後、息が上がった。`,`The healthy puppy gave a ____ shake, sending water flying everywhere.`,`元気な子犬が力いっぱい体を振って水を飛ばす。`,[`feeble`,`sluggish`,`gentle`]],[`monotonous`,`形容詞`,`boring because it stays the same or repeats`,`同じことの繰り返しで退屈な、単調な`,`Pressing the same button for an hour was ____; nothing ever changed.`,`1時間同じボタンを押すのは単調で、何も変化がなかった。`,`The speech sounded ____ because every sentence used exactly the same flat tone.`,`話し方に抑揚がなく、ずっと同じ調子で退屈に聞こえる。`,[`varied`,`lively`,`unpredictable`]],[`constrain`,`動詞`,`to limit what someone or something can do`,`できることを制限する`,`A small budget will ____ our choices; we cannot buy every tool we want.`,`予算が少ないと選択肢が制限され、欲しい道具をすべては買えない。`,`The narrow walls ____ the robot's movements, leaving little room to turn.`,`壁が狭く、ロボットの動きが制限される。`,[`expand`,`liberate`,`encourage`]],[`precede`,`動詞`,`to happen or come before something else`,`時間や順序で先に来る`,`A short warm-up will ____ the race; the runners stretch before it begins.`,`レースの前に短い準備運動があり、走者は開始前に体を伸ばす。`,`In this book, two pages of maps ____ the first chapter.`,`第1章の前に地図のページが2ページある。`,[`follow`,`interrupt`,`replace`]]]),h=d(`grade1`,[[`equivocate`,`動詞`,`to avoid a clear answer by using vague or double-meaning language`,`曖昧な言い方で答えをにごす`,`Do not ____ by saying both yes and no; tell us clearly whether you agree.`,`はいともいいえとも言って答えをにごさず、賛成かどうかはっきり言おう。`,`When asked who broke the cup, he began to ____, giving vague replies that hid the truth.`,`コップを割った人を聞かれ、曖昧な返事で事実を隠そうとする。`,[`confess`,`clarify`,`confirm`]],[`bolster`,`動詞`,`to make something stronger or better supported`,`強める、支える`,`We added wooden beams to ____ the weak bridge and make it stronger.`,`弱い橋を補強して強くするため、木の梁を加えた。`,`A few encouraging words can ____ a nervous player's confidence before a match.`,`励ましの言葉で、緊張する選手の自信を高める。`,[`undermine`,`weaken`,`diminish`]],[`defer`,`動詞`,`to put an action or decision off until later`,`後に延期する`,`Because of heavy rain, we will ____ the outdoor match until next week.`,`大雨のため、屋外の試合を来週まで延期する。`,`Let us ____ the decision until we have all the results.`,`結果がそろうまで決定を後に延ばす。`,[`expedite`,`hasten`,`accelerate`]],[`envoy`,`名詞`,`a person sent to represent a government or group`,`代表として派遣される使節`,`The queen sent an ____ to the neighboring kingdom with a message of peace.`,`女王は隣の王国へ、和平の伝言を持たせた使節を送った。`,`Each city chose an ____ to represent it at the meeting.`,`会議で市を代表する人を選ぶ。`,[`fugitive`,`spectator`,`hostage`]],[`incumbent`,`名詞`,`the person who currently holds a particular official position`,`現在その役職に就いている人、現職者`,`The ____ has been mayor for four years and wants to keep the job in the election.`,`現職の市長は4年間務めており、選挙で続投を目指している。`,`As the club president, Aya is the ____; Ken hopes to replace her in the vote.`,`アヤが現在の会長で、ケンは選挙で代わりたいと思っている。`,[`successor`,`newcomer`,`challenger`]],[`auspicious`,`形容詞`,`giving signs that things are likely to go well`,`うまくいきそうな兆しのある、さい先のよい`,`Winning our first three matches was an ____ start to the season.`,`最初の3試合に勝ったのは、シーズンのさい先のよい始まりだった。`,`The clear skies and calm sea seemed ____ for a successful voyage.`,`晴天と穏やかな海が、よい航海を期待させた。`,[`ominous`,`discouraging`,`unpromising`]],[`contrite`,`形容詞`,`feeling sorry and guilty about something wrong you did`,`悪いことをしたと心から反省している`,`The ____ child apologized for breaking the model and offered to repair it.`,`心から反省した子は、模型を壊したことを謝り、直すと申し出た。`,`He felt ____ after lying to his friend and sincerely asked for forgiveness.`,`友達にうそをついたことを悔やみ、心から許しを求める。`,[`unrepentant`,`defiant`,`smug`]],[`obliterate`,`動詞`,`to destroy or remove something so completely that little or nothing remains`,`跡形もなく消す、完全に破壊する`,`A huge wave can ____ a sandcastle, leaving no trace of its towers.`,`大きな波は砂の城を完全に壊し、塔の跡も残さないことがある。`,`Heavy snow will ____ our footprints by covering them completely.`,`雪が足跡をすっかり覆い、見えなくする。`,[`preserve`,`restore`,`reveal`]],[`staunch`,`形容詞`,`firmly loyal and unlikely to stop supporting something`,`強く支持し続ける、忠実な`,`Even after ten defeats, our ____ supporter came to every match and cheered.`,`10回負けた後も、その熱心な支持者は毎試合応援に来た。`,`She remained a ____ defender of the forest and never gave up protecting it.`,`森を守る強い姿勢を最後まで変えなかった。`,[`wavering`,`disloyal`,`indifferent`]],[`gist`,`名詞`,`the main meaning or point, without every detail`,`話や文章のおおまかな要点`,`I missed a few words, but I understood the ____: we must leave before sunset.`,`数語は聞き逃したが、日没前に出発するという要点はわかった。`,`Give me the ____ of the story in one sentence; save the details for later.`,`細部を省き、物語の要点を1文で伝える。`,[`wording`,`spelling`,`punctuation`]],[`dearth`,`名詞`,`a serious lack or shortage of something`,`ひどい不足`,`A ____ of rain left the pond dry for months.`,`雨がひどく不足し、池は何か月も干上がっていた。`,`There is a ____ of volunteers; only two people came when we needed twenty.`,`20人必要なのに2人しかおらず、人手が大幅に足りない。`,[`surplus`,`wealth`,`profusion`]],[`entail`,`動詞`,`to make something necessary as a part or result`,`当然必要とする、伴う`,`Keeping a puppy will ____ feeding and walking it every day.`,`子犬を飼うには、毎日の餌やりと散歩が必要になる。`,`Building a larger robot would ____ buying extra motors; it cannot work without them.`,`大きなロボットを作るため、追加のモーターが必要になる。`,[`eliminate`,`forbid`,`prevent`]],[`convergence`,`名詞`,`the coming together of things from different directions`,`別々のものが集まったり合流したりすること`,`The map marks the ____ of three rivers where they join into one.`,`地図には、3本の川が1本になる合流地点が示されている。`,`A ____ of ideas occurred when both teams finally reached the same conclusion.`,`両チームの考えが同じ結論にまとまる。`,[`separation`,`divergence`,`isolation`]],[`coax`,`動詞`,`to gently persuade someone to do something`,`優しく根気よく説得する`,`We used a soft voice and a treat to ____ the frightened dog out of its hiding place.`,`優しい声とおやつで、怖がる犬が隠れ場所から出るよう誘った。`,`The teacher tried to ____ the shy singer onto the stage with gentle encouragement.`,`内気な歌い手を優しく励まし、舞台へ誘う。`,[`force`,`frighten`,`threaten`]],[`boisterous`,`形容詞`,`noisy and full of lively energy`,`にぎやかで元気いっぱいの`,`The ____ fans jumped, shouted, and sang after the winning goal.`,`決勝点が入ると、元気いっぱいのファンたちが跳びはね、叫び、歌った。`,`The puppies were ____ all morning, barking and racing around the yard.`,`子犬たちが吠えながら庭を走り回り、にぎやかだった。`,[`subdued`,`silent`,`motionless`]],[`perennial`,`形容詞`,`continuing for a long time or returning again and again`,`長く続く、繰り返し現れる`,`Lost pencils are a ____ problem in our class; it happens every year.`,`鉛筆の紛失は毎年起こり、クラスで繰り返される問題だ。`,`This story is a ____ favorite, loved by readers generation after generation.`,`何世代もの読者に長く愛される作品を指す。`,[`temporary`,`short-lived`,`fleeting`]],[`clemency`,`名詞`,`mercy shown by someone with the power to reduce a punishment`,`罰を軽くする権限のある人が示す寛大さ`,`In the tale, the king showed ____ by reducing the prisoner's sentence.`,`物語で、王は囚人の刑を軽くする寛大さを示した。`,`The judge granted ____ and ordered a lighter punishment than the law normally required.`,`裁判官が通常より軽い罰にした。`,[`vengeance`,`severity`,`cruelty`]],[`unruly`,`形容詞`,`difficult to control and unwilling to follow rules`,`言うことを聞かず、手に負えない`,`The ____ crowd kept pushing past the barriers despite repeated warnings.`,`何度注意されても、その手に負えない群衆は柵を押しのけ続けた。`,`The ____ students ignored every instruction and ran around the room.`,`指示を聞かず、教室を走り回る生徒たち。`,[`obedient`,`orderly`,`disciplined`]],[`elucidate`,`動詞`,`to explain something difficult so it becomes clear`,`難しいことを説明して明らかにする`,`Please ____ the puzzle's rule with a simple example so everyone understands.`,`みんなが理解できるよう、簡単な例でパズルの規則を説明してください。`,`The scientist used a model to ____ how the complicated engine worked.`,`模型を使い、複雑なエンジンの仕組みを明らかにする。`,[`obscure`,`conceal`,`complicate`]],[`lucrative`,`形容詞`,`earning a large amount of money or profit`,`多くの利益を生む`,`The toy shop became ____ when sales rose far above its costs.`,`売上が費用を大きく上回り、おもちゃ屋は多くの利益を生むようになった。`,`Designing the hit game was ____; it earned the studio millions in profit.`,`ヒットしたゲームの制作で多額の利益が生まれた。`,[`unprofitable`,`unpaid`,`fruitless`]],[`hindsight`,`名詞`,`understanding a past event better after knowing what happened`,`結果がわかった後で振り返って得る理解`,`In ____, taking an umbrella would have been wise, but we had not expected rain.`,`後から考えると傘を持つべきだったが、雨は予想していなかった。`,`With ____, we can see why our first robot failed; we did not notice the flaw then.`,`当時は見えなかった失敗の理由が、後から振り返るとわかる。`,[`foresight`,`anticipation`,`prediction`]],[`rescind`,`動詞`,`to officially cancel a rule, order, or agreement`,`規則や命令などを正式に取り消す`,`The council voted to ____ the park ban, officially allowing visitors back in.`,`議会は公園の立入禁止を正式に取り消し、再び来園できるようにした。`,`We must ____ the old rule before replacing it with the new one.`,`新規則に置き換える前に、古い規則を正式に取り消す。`,[`enforce`,`uphold`,`renew`]],[`niche`,`名詞`,`a special role or area that suits a person or business`,`得意なことを生かせる役割や専門分野`,`Leo found his ____ in the team as its mapmaker, the job that suited him best.`,`レオは地図作りという、自分に最も合う役割をチームで見つけた。`,`The tiny shop found a ____ selling unusual parts that big robot stores did not offer.`,`大型店にない部品を扱い、小さな店が独自の専門分野を見つける。`,[`rival`,`obstacle`,`shortage`]],[`quarantine`,`名詞`,`separation to prevent a possible infection from spreading`,`感染の広がりを防ぐための隔離`,`The new animals stayed in ____ away from the others while vets checked for infection.`,`新しい動物は、獣医師が感染の有無を調べる間、他の動物から隔離された。`,`The space story puts returning explorers in ____ so unknown germs cannot reach the town.`,`宇宙から帰った探検家を隔離し、未知の病原体が町に広がるのを防ぐ。`,[`reunion`,`circulation`,`exhibition`]],[`incursion`,`名詞`,`a sudden entry into another territory, often an attack`,`他の領域への突然の侵入`,`The game warned of an enemy ____ when hostile robots crossed into our base.`,`敵のロボットが基地に入り、ゲームに敵の侵入警報が出た。`,`The guards stopped an ____ by raiders who tried to cross the border.`,`境界を越えようとした襲撃者の侵入を止める。`,[`retreat`,`evacuation`,`withdrawal`]],[`exuberant`,`形容詞`,`showing a great deal of joy, energy, and excitement`,`喜びや元気にあふれた`,`The ____ winners laughed and leaped into the air, unable to hide their joy.`,`喜びにあふれた勝者たちは、うれしさを隠せず笑って跳びはねた。`,`Her ____ greeting filled the room with excited laughter.`,`元気いっぱいのあいさつで部屋が楽しい笑いに包まれる。`,[`gloomy`,`apathetic`,`dejected`]],[`jeopardy`,`名詞`,`danger of being lost, harmed, or ruined`,`失敗や損失につながる危険`,`Our lead was in ____ when the other team scored four times in a row.`,`相手が4回続けて得点し、私たちのリードが危うくなった。`,`A broken engine put the mission in ____; the crew might not reach the station.`,`エンジン故障で、任務を果たせない危険が生じた。`,[`safety`,`harmony`,`comfort`]],[`provisions`,`名詞（複数）`,`food and other supplies prepared for a journey or future need`,`旅などに備えた食料や必要品`,`We packed enough ____ to feed the explorers for a week.`,`探検家たちが1週間食べられるだけの食料を詰めた。`,`The ship stopped at the port to load fresh ____ before the long voyage.`,`長い航海の前に、港で食料などの必要品を積む。`,[`souvenirs`,`ornaments`,`trophies`]],[`appraise`,`動詞`,`to judge the value or quality of something carefully`,`価値や質をよく調べて評価する`,`An expert will ____ the old coin to estimate how much it is worth.`,`専門家が古い硬貨を鑑定し、どのくらいの価値か見積もる。`,`The judges will ____ each model, carefully assessing its design and quality.`,`審査員が模型の設計と質をよく調べて評価する。`,[`manufacture`,`conceal`,`transport`]],[`cajole`,`動詞`,`to persuade someone through repeated requests or flattering words`,`おだてたり何度も頼んだりしてその気にさせる`,`They tried to ____ me into singing by praising my voice again and again.`,`みんなは何度も声を褒め、私を歌う気にさせようとした。`,`He hoped to ____ his sister into helping by flattering her skill at puzzles.`,`パズルが得意だとおだて、姉に手伝ってもらおうとした。`,[`force`,`frighten`,`bully`]],[`inane`,`形容詞`,`silly and lacking any useful meaning or thought`,`ばかげていて中身がない`,`The ____ comment added nothing useful and made no sense at all.`,`その中身のない発言には役立つことも、意味もまったくなかった。`,`We stopped the ____ chatter about nothing and finally discussed the real problem.`,`中身のないおしゃべりをやめ、本題を話し合った。`,[`insightful`,`profound`,`thoughtful`]],[`wrest`,`動詞`,`to take something from someone with force or great effort`,`力ずくや大変な努力で奪い取る`,`The hero struggled to ____ the stolen key from the villain's tight grip.`,`主人公は、悪役が強く握る盗まれた鍵を奪い取ろうと格闘した。`,`After a long battle, our team managed to ____ control of the tower from its defenders.`,`長い戦いの末、塔を守る相手から支配権を奪う。`,[`receive`,`inherit`,`borrow`]],[`tacit`,`形容詞`,`understood or accepted without being directly expressed`,`直接表現せず了解されている、暗黙の`,`We had a ____ agreement to share the bench; nobody stated or wrote it, but we all acted as if it was understood.`,`誰も口や文章にはしなかったが、ベンチを分け合う了解があるように皆が行動した。`,`Their ____ approval was inferred from their continued cooperation; they never directly expressed it.`,`直接の表明はなかったが、協力を続ける様子から暗黙の承認があるとわかった。`,[`explicit`,`verbal`,`written`]],[`dilapidated`,`形容詞`,`in poor condition because of age or lack of care`,`古さや手入れ不足でぼろぼろの`,`The ____ hut had a broken roof, rotten walls, and missing windows.`,`ぼろぼろの小屋には、壊れた屋根と腐った壁があり、窓もなかった。`,`They repaired the ____ station after years of neglect had left it falling apart.`,`長年放置され、崩れかけた駅を修理する。`,[`pristine`,`immaculate`,`sturdy`]],[`caustic`,`形容詞`,`very harsh and cutting in the way something is said`,`言葉が辛辣で、人を傷つける`,`His ____ remark mocked her effort so cruelly that she left in tears.`,`彼の辛辣な発言が努力をひどくあざけったので、彼女は泣いて立ち去った。`,`The critic's ____ review was full of bitter insults instead of helpful advice.`,`批評には役立つ助言でなく、辛辣な悪口が並んでいた。`,[`gentle`,`tactful`,`complimentary`]],[`repulse`,`動詞`,`to make someone feel strong disgust`,`強い嫌悪感を抱かせる`,`The rotten smell may ____ visitors so much that they turn away in disgust.`,`腐ったにおいで来場者が強い嫌悪感を覚え、顔を背けるかもしれない。`,`Scenes of cruelty ____ me; I find them deeply disgusting.`,`残酷な場面に強い嫌悪感を覚える。`,[`attract`,`delight`,`fascinate`]],[`impasse`,`名詞`,`a situation where disagreement prevents further progress`,`意見が合わず、先に進めない状態、行き詰まり`,`The teams reached an ____: neither would accept the other's proposed rules.`,`どちらのチームも相手の規則案を受け入れず、話し合いは行き詰まった。`,`A mediator helped end the ____ after both sides had refused to compromise.`,`互いに譲らず止まっていた話し合いを、仲介者が進めた。`,[`breakthrough`,`agreement`,`solution`]],[`intangible`,`形容詞`,`real or valuable but not physical and touchable`,`実体がなく、手で触れられない`,`Trust is ____: it matters greatly, but you cannot hold it in your hands.`,`信頼はとても大切だが、手で持つことのできないものだ。`,`The team gained an ____ benefit: a feeling of friendship rather than a physical prize.`,`形のある賞品ではなく、友情という目に見えないよさを得る。`,[`tangible`,`concrete`,`material`]],[`fortuitous`,`形容詞`,`happening by chance rather than by design`,`計画せず、偶然に起こる`,`Our meeting was ____; neither of us had planned to visit that shop.`,`2人ともその店へ行く予定はなく、出会いは偶然だった。`,`A ____ gust of wind uncovered the hidden coin; nobody had arranged it.`,`偶然吹いた風で隠れた硬貨が現れた。`,[`deliberate`,`planned`,`intentional`]],[`belittle`,`動詞`,`to make a person or achievement seem unimportant`,`人や努力などを小さく見せてけなす`,`Do not ____ her victory by saying it was easy; she trained for months.`,`何か月も練習したのだから、簡単だったと言って彼女の勝利をけなしてはいけない。`,`A kind captain will not ____ a beginner's effort by calling it worthless.`,`努力を「価値がない」と言って初心者を見下すことをしない。`,[`praise`,`celebrate`,`applaud`]]]),g={pre1202601:{course:`pre1`,title:`2026年度 第1回 準1級`,url:`https://www.eiken.or.jp/eiken/exam/kakomon/2026-1-1ji-p1kyu.pdf`},pre1202503:{course:`pre1`,title:`2025年度 第3回 準1級`,url:`https://www.eiken.or.jp/eiken/exam/kakomon/2025
