mething in order to catch it`,`飛びかかる`,`The kitten crouched low, waiting to ____ on the rolling ball of yarn.`,`子猫は身をかがめ、転がる毛糸玉に飛びかかろうと待っていた。`,`Foxes ____ on mice hiding under the snow by jumping high and diving down.`,`キツネが高く跳んで雪の下のネズミに飛びかかる様子。`,[`dwell`,`frown`,`rely`]],[`precocious`,`形容詞`,`showing skills or knowledge much earlier than most children`,`早熟な、ませた`,`The ____ four-year-old could already read chapter books and play chess.`,`その早熟な4歳の子は、もう長い物語の本を読み、チェスもできた。`,`Mozart was so ____ that he wrote music at age five.`,`モーツァルトが5歳で作曲するほど才能の発達が早かったという話。`,[`sluggish`,`immature`,`clumsy`]],[`prowess`,`名詞`,`great skill at doing something`,`卓越した技量、腕前`,`Everyone admired Yuki's ____ on the soccer field after she scored three goals.`,`3得点を決めたユキのサッカーの腕前に、みんなが感心した。`,`The chef showed his ____ in the kitchen by cooking ten dishes in an hour.`,`1時間で10品を作り、料理の高い技術を見せたシェフ。`,[`clumsiness`,`weakness`,`ignorance`]],[`quench`,`動詞`,`to satisfy your thirst by drinking`,`(渇きを)癒やす`,`After the long hike, we drank cold water to ____ our thirst.`,`長いハイキングの後、のどの渇きを癒やすために冷たい水を飲んだ。`,`The runners stopped at the table to ____ their thirst with sports drinks.`,`ランナーたちが給水所でスポーツドリンクを飲み、のどの渇きをいやす場面。`,[`intensify`,`worsen`,`provoke`]],[`ravenous`,`形容詞`,`extremely hungry`,`飢えた、腹ぺこの`,`After swimming all afternoon, the children were ____ and ate three plates of rice each.`,`午後ずっと泳いだ後、子どもたちは腹ぺこで、それぞれご飯を3皿食べた。`,`The ____ bear cub gobbled up every berry on the bush in minutes.`,`おなかをすかせた子グマが、数分で茂みのベリーを全部平らげた様子。`,[`satiated`,`stuffed`,`full`]],[`reassure`,`動詞`,`to say or do something to make someone stop worrying`,`安心させる`,`The teacher tried to ____ the nervous students that the test would be easy.`,`先生は緊張している生徒たちに、テストは簡単だと言って安心させようとした。`,`Mom called from the airport to ____ us that she had landed safely.`,`母が無事に着いたと空港から電話して、家族を安心させた場面。`,[`alarm`,`frighten`,`unsettle`]],[`rebuff`,`動詞`,`to refuse an offer or friendly attempt in an unkind way`,`はねつける、拒絶する`,`The proud cat would always ____ my attempts to pet it by walking away.`,`気位の高い猫は、なでようとする私をいつも歩き去ってはねつけた。`,`Don't ____ your friends when they offer to help; say thank you instead.`,`友達の手助けの申し出を冷たく断らず、お礼を言おうという助言。`,[`welcome`,`accept`,`embrace`]],[`reminisce`,`動詞`,`to talk or think about pleasant experiences from the past`,`思い出にふける、昔を懐かしむ`,`At the reunion, the old classmates loved to ____ about their school trips long ago.`,`同窓会で、昔の同級生たちはずっと前の修学旅行の思い出話をするのが大好きだった。`,`Grandpa likes to ____ about the summers he spent fishing as a boy.`,`祖父が少年時代に釣りをした夏を懐かしんで話す様子。`,[`speculate`,`prophesy`,`fret`]],[`resonant`,`形容詞`,`deep, clear, and continuing to sound for a long time`,`響き渡る、よく響く`,`The ____ sound of the temple bell could be heard across the whole valley.`,`お寺の鐘のよく響く音は、谷じゅうに聞こえた。`,`The singer's ____ voice filled the huge concert hall without a microphone.`,`マイクなしで大きなホールいっぱいに響いた歌手の声。`,[`faint`,`muffled`,`feeble`]],[`rudimentary`,`形容詞`,`very basic and simple, not fully developed`,`初歩的な、基本的な`,`My knowledge of Chinese is ____, so I can only say hello and thank you.`,`私の中国語の知識は初歩的なので、こんにちはとありがとうしか言えない。`,`The first robot we built was very ____ and could only move forward.`,`最初に作ったロボットは簡単な作りで、前に進むことしかできなかったという話。`,[`advanced`,`sophisticated`,`extensive`]],[`rummage`,`動詞`,`to search for something by moving things around in a messy way`,`かき回して探す`,`Kenji had to ____ through his messy backpack to find his pencil case.`,`ケンジは筆箱を見つけるために、散らかったリュックの中をかき回して探さなければならなかった。`,`Raccoons often ____ through trash cans looking for food at night.`,`アライグマが夜にごみ箱をあさって食べ物を探す様子。`,[`sleep`,`sail`,`breeze`]],[`ruthless`,`形容詞`,`showing no pity or kindness toward others`,`冷酷な、容赦ない`,`In the fairy tale, the ____ king took all the farmers' food and did not care if they went hungry.`,`おとぎ話で、冷酷な王は農民の食べ物をすべて取り上げ、彼らが飢えても気にしなかった。`,`The robot villain in the game was ____ and never showed kindness to anyone.`,`ゲームの悪役ロボットが誰にも情けをかけない冷酷なキャラクターだという説明。`,[`merciful`,`compassionate`,`gentle`]],[`savory`,`形容詞`,`tasting salty or spicy rather than sweet`,`塩味の、風味のある`,`I don't want dessert; I'd like something ____ like cheese crackers or soup.`,`デザートはいらない。チーズクラッカーやスープのような塩味のものがほしい。`,`The bakery sells ____ pies filled with meat and vegetables instead of fruit.`,`果物ではなく肉や野菜が入った、甘くないパイを売るパン屋。`,[`sugary`,`sweet`,`tasteless`]],[`savvy`,`形容詞`,`having practical knowledge and good judgment about something`,`精通した、抜け目のない`,`My ____ grandmother always knows which store has the cheapest vegetables.`,`やり手の祖母は、どの店の野菜がいちばん安いかいつも知っている。`,`Even at ten, Lisa is ____ about computers and fixes her family's tablets.`,`10歳でパソコンに詳しく、家族のタブレットを直せるリサ。`,[`naive`,`clueless`,`ignorant`]],[`scamper`,`動詞`,`to run quickly with small, light steps`,`ちょこちょこ走る`,`We watched the squirrels ____ up the tree when the dog barked.`,`犬がほえると、リスたちが木をちょこちょこ駆け上がるのを私たちは見た。`,`The excited puppies ____ across the floor to greet us whenever we come home.`,`帰宅すると、はしゃいだ子犬たちが床を小走りで出迎えに来る様子。`,[`trudge`,`plod`,`lumber`]],[`sedentary`,`形容詞`,`involving a lot of sitting and not much physical activity`,`座りがちの、運動不足の`,`Playing video games for hours is too ____, so take breaks to run outside.`,`何時間もテレビゲームをするのは座りっぱなしすぎるので、休憩して外を走ろう。`,`Our cat has become ____ and now spends most of the day sleeping on the sofa.`,`猫があまり動かなくなり、一日のほとんどをソファで寝て過ごすようになった様子。`,[`active`,`energetic`,`vigorous`]],[`shimmer`,`動詞`,`to shine with a soft light that seems to move gently`,`きらめく、ゆらめく`,`Tiny waves made the lake ____ with silver moonlight.`,`小さな波のせいで、湖は銀色の月明かりにきらきらと揺らめいた。`,`Soap bubbles ____ with rainbow colors when sunlight hits them.`,`日光が当たるとシャボン玉が虹色にきらめく様子。`,[`darken`,`dim`,`smolder`]],[`shrill`,`形容詞`,`high-pitched and loud in an unpleasant way`,`甲高い、耳をつんざく`,`The ____ whistle of the referee made everyone cover their ears.`,`審判の甲高い笛の音に、みんなが耳をふさいだ。`,`The parrot let out a ____ squawk that hurt our ears.`,`オウムが耳が痛くなるほど甲高い声で鳴いた場面。`,[`hushed`,`muffled`,`faint`]],[`somber`,`形容詞`,`sad and serious`,`陰気な、沈んだ`,`The mood in the locker room was ____ after the team lost the championship.`,`決勝で負けた後、ロッカールームの雰囲気は沈んでいた。`,`The sky was gray and ____ all day, which matched how sad we felt.`,`一日中どんよりと暗い空が、みんなの悲しい気分と重なった様子。`,[`cheerful`,`jolly`,`festive`]],[`sporadic`,`形容詞`,`happening only sometimes and not regularly`,`散発的な、時折の`,`There will be ____ showers today, so it will rain now and then.`,`今日は散発的なにわか雨があり、ときどき雨が降るでしょう。`,`The Wi-Fi signal at the cabin was ____, working for a few minutes and then stopping.`,`山小屋のWi-Fiが数分つながっては切れる、途切れがちな状態。`,[`constant`,`continuous`,`steady`]],[`squander`,`動詞`,`to waste money, time, or chances in a foolish way`,`浪費する、無駄にする`,`Don't ____ your allowance by buying candy every day; save some for the new book you want.`,`毎日お菓子を買っておこづかいを無駄づかいしないで、ほしい新しい本のために少しためておこう。`,`It would be sad to ____ such a great chance to visit the science museum.`,`科学館に行ける絶好の機会を無駄にするのはもったいないという気持ち。`,[`hoard`,`conserve`,`invest`]],[`stammer`,`動詞`,`to speak with pauses and repeated sounds because you are nervous`,`どもる、口ごもる`,`When Ken got nervous on stage, he began to ____ and forgot his lines.`,`ケンは舞台で緊張すると、口ごもり始めてせりふを忘れた。`,`Surprised by the question, Mia could only ____, "W-w-well, I don't know."`,`突然質問されて驚き、ミアが言葉につかえながら答えた場面。`,[`articulate`,`enunciate`,`boast`]],[`stifle`,`動詞`,`to stop yourself from letting out a laugh, yawn, or feeling`,`抑える、こらえる`,`In the silent library, Aya covered her mouth to ____ a giggle when her friend made a funny face.`,`静かな図書館で友達が変な顔をしたとき、アヤは口を押さえてくすくす笑いをこらえた。`,`He tried to ____ a yawn so the speaker would not think he was bored.`,`話し手に退屈していると思われないよう、あくびをかみ殺そうとした場面。`,[`release`,`unleash`,`express`]],[`superfluous`,`形容詞`,`more than is needed; not necessary`,`余分な、不必要な`,`The teacher crossed out the ____ words in my essay to make it shorter.`,`先生は作文を短くするために、余分な言葉を線で消した。`,`Packing five extra flashlights for one night felt ____, so we left most at home.`,`一晩のために懐中電灯を5本も余分に持つのは不要だと感じ、ほとんど家に置いていった状況。`,[`essential`,`vital`,`indispensable`]],[`tedious`,`形容詞`,`long, dull, and boring`,`退屈な、うんざりする`,`Copying the same sentence one hundred times was so ____ that I almost fell asleep.`,`同じ文を100回写すのはとても退屈で、眠ってしまいそうだった。`,`Sorting thousands of tiny beads by color is ____ work that takes hours.`,`何千個もの小さなビーズを色分けする、何時間もかかる単調な作業。`,[`thrilling`,`exciting`,`riveting`]],[`tenacity`,`名詞`,`the quality of not giving up easily`,`粘り強さ`,`Thanks to her ____, Mei practiced the piano piece every day until she could play it perfectly.`,`メイは粘り強く、完璧に弾けるようになるまで毎日そのピアノ曲を練習した。`,`The climbers showed great ____ by continuing up the mountain despite the strong wind.`,`強風の中でも登り続け、あきらめない強さを見せた登山者たち。`,[`laziness`,`apathy`,`timidity`]],[`tenuous`,`形容詞`,`very weak or slight and easy to break or lose`,`薄弱な、かすかな`,`The link between eating carrots and getting good grades is ____ at best.`,`ニンジンを食べることと良い成績をとることの関係は、せいぜい薄弱なものだ。`,`Our team's lead was ____, just one point with five minutes left.`,`残り5分でたった1点差という、いつ崩れてもおかしくないリード。`,[`solid`,`robust`,`compelling`]],[`thwart`,`動詞`,`to stop someone from doing what they planned`,`阻止する、くじく`,`The goalkeeper jumped high to ____ the other team's attempt to score.`,`ゴールキーパーは高く跳んで、相手チームの得点を阻止した。`,`Heavy rain may ____ our plans for a picnic at the park.`,`大雨で公園でのピクニックの計画が台なしになるかもしれない状況。`,[`assist`,`support`,`encourage`]],[`trajectory`,`名詞`,`the curved path of an object moving through the air or space`,`軌道、弾道`,`Scientists calculated the rocket's ____ so it would reach the moon.`,`科学者たちは、ロケットが月に届くようにその軌道を計算した。`,`The soccer ball's ____ curved around the wall of players and into the net.`,`サッカーボールが選手の壁を回り込む弧を描いてゴールに入った場面。`,[`aroma`,`texture`,`harvest`]],[`transient`,`形容詞`,`lasting only a short time`,`一時的な、はかない`,`The rainbow was ____, disappearing just a few minutes after the rain stopped.`,`虹は一時的なもので、雨がやんでほんの数分で消えてしまった。`,`Luckily, the pain from the bee sting was ____ and faded within an hour.`,`ハチに刺された痛みが一時的で、1時間以内に消えたという話。`,[`permanent`,`everlasting`,`enduring`]],[`translucent`,`形容詞`,`letting some light pass through but not clear enough to see through`,`半透明の`,`The bathroom window is made of ____ glass, so light comes in but no one can see inside.`,`浴室の窓は半透明のガラスなので、光は入るが中は見えない。`,`The jellyfish had a ____ body, and we could see sunlight glowing through it.`,`日光が透けて光って見える、半透明のクラゲの体。`,[`opaque`,`wooden`,`metallic`]],[`upheaval`,`名詞`,`a big change that causes a lot of confusion or trouble`,`大変動、激変`,`Moving to a new country and a new school was a huge ____ in Taro's life.`,`新しい国と新しい学校への引っ越しは、タロウの人生にとって大きな激変だった。`,`The new principal's many changes caused ____ at school, and everyone felt confused for the first few months.`,`新しい校長の多くの改革で学校が大混乱し、最初の数か月はみんなが戸惑った状況。`,[`stability`,`routine`,`tranquility`]],[`venerable`,`形容詞`,`respected because of great age, wisdom, or long history`,`由緒ある、尊敬すべき`,`The ____ oak tree in the park is over 500 years old and loved by the whole town.`,`公園の由緒あるカシの木は樹齢500年を超え、町じゅうに愛されている。`,`The ____ professor had taught at the university for fifty years and was admired by everyone.`,`50年間大学で教え、みんなに尊敬されている年配の教授。`,[`youthful`,`despised`,`trivial`]],[`vivacious`,`形容詞`,`full of life and energy in a cheerful, attractive way`,`快活な、陽気な`,`The ____ tour guide made everyone laugh with her lively jokes and big smiles.`,`快活なツアーガイドは、元気な冗談と満面の笑みでみんなを笑わせた。`,`Even at eighty, Grandma is so ____ that she dances at every festival.`,`80歳でも元気いっぱいで、お祭りのたびに踊る祖母。`,[`listless`,`sullen`,`lethargic`]],[`whim`,`名詞`,`a sudden wish to do something without a good reason`,`気まぐれ、思いつき`,`On a ____, we decided to take the train to the beach instead of going home.`,`思いつきで、私たちは家に帰らずに電車で海へ行くことにした。`,`Choosing the purple paint was not a careful decision, just a ____.`,`紫のペンキを選んだのはよく考えた結果ではなく、ただの気まぐれだったという話。`,[`schedule`,`routine`,`deadline`]],[`whimsical`,`形容詞`,`playful and unusual in a fun, imaginative way`,`風変わりで遊び心のある`,`The children's book has ____ drawings of cats riding bicycles on the moon.`,`その絵本には、月で自転車に乗る猫の遊び心あふれる絵が描かれている。`,`The café has ____ decorations, like teacup lamps and chairs shaped like giant mushrooms.`,`ティーカップのランプや巨大なキノコ形のいすなど、楽しく奇抜な飾りのカフェ。`,[`dreary`,`solemn`,`realistic`]],[`wield`,`動詞`,`to hold and use a tool or weapon with skill`,
