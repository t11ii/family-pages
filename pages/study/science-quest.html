も等しい。これを反射の法則というよ。"},{"t":"choice","lv":2,"q":"「入射角」とは、どの角度のこと？","c":["鏡に当たる光と、鏡に垂直な線（法線）とがつくる角","鏡に当たる光と、鏡の面とがつくる角","はね返った光と、鏡の面とがつくる角","鏡に当たる光とはね返った光とがつくる角"],"e":"入射角も反射角も、鏡に垂直な線（法線）との間の角度で表す。鏡の面との角度ではないので注意しよう。"},{"t":"choice","lv":3,"q":"光が鏡の面に対して40°の角度で当たった。このとき反射角は何度？","c":["50度","40度","80度","90度"],"e":"反射角は法線（鏡に垂直な線）との角度。法線と鏡の面は90°なので、90−40＝50度。入射角も50度だよ。"},{"t":"choice","lv":1,"q":"鏡にうつった像は、実物とくらべてどのように見える？","c":["左右が反対","上下が反対","上下左右が反対","実物とまったく同じ"],"e":"鏡の像は上下はそのままで、左右が反対になる。紙を裏返したような形だよ。上下左右が反対なのはピンホールカメラ。"},{"t":"choice","lv":2,"q":"鏡の前に立って右手をあげると、鏡にうつった像はどちらの手をあげているように見える？","c":["左手","右手","両手"],"e":"鏡の像は左右が反対に見えるので、右手をあげると像は左手をあげているように見えるよ。"},{"t":"choice","lv":3,"q":"鏡にうつった時計を見たら、3時40分に見えた。実際の時刻は何時何分？","c":["8時20分","3時40分","9時20分","8時40分"],"e":"鏡の像は左右反対なので、実際の時刻と鏡で見えた時刻を足すと12時になる。12時−3時40分＝8時20分だよ。"},{"t":"choice","lv":2,"q":"鏡から5mはなれて立つと、自分の像は鏡から何mはなれたところにあるように見える？","c":["5m","10m","2.5m","0m（鏡の表面）"],"e":"自分から鏡までの距離と、鏡から像までの距離はいつも同じ。鏡は自分と像のちょうど真ん中にあるよ。"},{"t":"choice","lv":3,"q":"鏡から3mはなれて立っている人が、鏡に向かって1m近づいた。このとき、この人と像の間の距離は何m？","c":["4m","2m","6m","5m"],"e":"近づいたあと、人から鏡までは2m。像も鏡から2mのところにできるので、人と像の距離は2＋2＝4mになるよ。"},{"t":"choice","lv":3,"q":"鏡に自分の全身をうつすには、少なくともどれくらいの長さの鏡が必要？","c":["身長の半分","身長の4分の1","身長と同じ","身長の2倍"],"e":"鏡に近づいても遠ざかっても、身長の半分の長さの鏡があれば全身がうつる。鏡の下のはしを、地面から目の高さの半分の位置におけばいいよ。"},{"t":"choice","lv":1,"q":"光が性質のちがう物の中へ進むとき、その境目で折れ曲がる性質を何という？","c":["光の屈折","光の反射","光の直進"],"e":"境目で折れ曲がるのが屈折（くっせつ）。水を入れた茶わんのはしが曲がって見えるのも屈折のせいだよ。"},{"t":"choice","lv":2,"q":"光が空気中から水中（またはガラスの中）へななめに入るとき、境目でどちらに曲がる？","c":["水面から遠ざかる方向","水面に近づく方向","曲がらずにまっすぐ進む","すべてはね返される"],"e":"空気→水・ガラスでは、境目の面から遠ざかる方向へ屈折する。反対に水・ガラス→空気では、面に近づく方向へ曲がるよ。"},{"t":"choice","lv":2,"q":"光が水中から空気中へななめに出るとき、境目でどちらに曲がる？","c":["水面に近づく方向","水面から遠ざかる方向","曲がらずにまっすぐ進む"],"e":"水→空気では水面に近づく方向へ屈折する。空気→水のときと、ちょうど逆の道すじになるよ。"},{"t":"choice","lv":2,"q":"おふろで自分の手足が短く見えたり、プールの底が浅く見えたりするのは、光のどの性質によるもの？","c":["屈折","反射","直進"],"e":"水中の物から出た光は水面で屈折して目にとどく。人は光がまっすぐ来たと思うので、実際より浅い位置（浮き上がった位置）に見えるんだ。"},{"t":"choice","lv":1,"q":"虫めがねに太陽の光を通したとき、光が集まる点を何という？","c":["焦点","光源","法線","南中"],"e":"光が集まる点が焦点（しょうてん）。虫めがねを通った平行な光は、必ず焦点を通るよ。"},{"t":"choice","lv":1,"q":"虫めがねから、光が集まる点までの長さを何という？","c":["焦点距離","反射角","入射角","直径"],"e":"虫めがねから焦点までの長さを焦点距離（しょうてんきょり）というよ。"},{"t":"choice","lv":2,"q":"同じ直径の虫めがねのうち、焦点距離が短いのはどちら？","c":["レンズのふくらみが大きい虫めがね","レンズのふくらみが小さい虫めがね","どちらも同じ"],"e":"ふくらみ（厚み）が大きいほど光を大きく曲げるので、より近くに光が集まる。つまり焦点距離が短くなるよ。"},{"t":"choice","lv":2,"q":"4つの虫めがねで太陽の光を1点に集め、黒い紙をこがした。最も早くこげるのはどれ？","c":["レンズの直径が最も大きい虫めがね","レンズの直径が最も小さい虫めがね","レンズのふくらみが最も小さい虫めがね","レンズのふくらみが最も大きい虫めがね"],"e":"直径が大きいレンズほど、たくさんの光を焦点に集められる。集まる光が多いほど熱くなり、早くこげるよ。ふくらみは焦点の位置を変えるだけ。"},{"t":"tf","lv":2,"q":"虫めがねで光を集めるとき、白い紙より黒い紙の方が早くこげる。","a":true,"e":"黒い色は光を吸収しやすく、熱くなりやすい。だから黒い紙の方が早くこげるよ。"},{"t":"choice","lv":3,"q":"虫めがねで太陽の光を紙の上に集めた。明るい部分のまわりは、もとの日光が当たっているところとくらべてどうなっている？","c":["暗い（影になっている）","同じ明るさ","もっと明るい"],"e":"虫めがねに当たった光は曲がって真ん中に集まるので、そのまわりには光がとどかず影になる。だから暗くなるんだ。"},{"t":"choice","lv":3,"q":"木もれ日の中に、丸い形の光が見えることがある。丸くなるのはなぜ？","c":["葉のすき間がピンホールカメラの穴のようになり、丸い太陽の形がうつるから","葉のすき間がどれも丸い形をしているから","光が葉で屈折して丸く集まるから","光が地面で反射して丸く広がるから"],"e":"すき間が十分小さいと、すき間がどんな形でも太陽の形がうつる。ピンホールカメラで穴の形を変えても像の形が変わらないのと同じだよ。"},{"t":"order","lv":3,"q":"光の進む速さが速い順にならべよう","c":["真空","空気","水","ガラス"],"e":"光は物によって進む速さがちがう（真空＞空気＞水＞ガラス）。速さが変わるところで折れ曲がるのが屈折なんだ。"}]},{"id":"growth","title":"植物の<ruby>成長<rt>せいちょう<\/rt><\/ruby>","yomi":"しょくぶつのせいちょう","emoji":"🌱","source":"上 第11回","points":[{"h":"植物の一生","t":"多くの植物は<b>発芽<\/b>→<b>開花<\/b>→<b>結実<\/b>の順に成長する。発芽のときはじめに出る葉を<b><ruby>子葉<rt>しよう<\/rt><\/ruby><\/b>、後から出る葉を<b><ruby>本葉<rt>ほんば<\/rt><\/ruby><\/b>という。"},{"h":"花のつくりと受粉","t":"花は種子をつくるためのつくりで、<b>花びら・がく・めしべ・おしべ<\/b>がある。おしべの<b>やく<\/b>でつくられた花粉がめしべの<b><ruby>柱頭<rt>ちゅうとう<\/rt><\/ruby><\/b>につくことを<b><ruby>受粉<rt>じゅふん<\/rt><\/ruby><\/b>という。"},{"h":"実と種子のでき方","t":"受粉すると、めしべの<b><ruby>子房<rt>しぼう<\/rt><\/ruby><\/b>が成長して<b>実<\/b>に、子房の中の<b><ruby>胚珠<rt>はいしゅ<\/rt><\/ruby><\/b>が<b>種子<\/b>になる。"},{"h":"花粉を運ぶのはだれ？","t":"アブラナ・アサガオ・サクラなどは<b>昆虫<\/b>が運ぶ（花びらが目立ち、においがある）。スギ・イネ・トウモロコシなどは<b>風<\/b>が運ぶ（花びらが目立たない、またはない）。"},{"h":"アサガオ（ヒルガオ科）","t":"<b>5月ごろ<\/b>種をまく。つるは上から見て<b>左回り（反時計回り）<\/b>に支柱に巻きつく。昼が<b>短く<\/b>なるとつぼみができ、<b>明け方<\/b>に下から順にさく。実の3つの部屋に2個ずつ、最大<b>6個<\/b>の種子ができる。"},{"h":"ヘチマ（ウリ科）","t":"<b>5月ごろ<\/b>種をまく。くきが変化した<b>巻きひげ<\/b>で支柱に巻きつく（とちゅうで巻く向きが変わり、ばねの役目）。7月ごろ<b>お花<\/b>と<b>め花<\/b>がさき、実ができるのは<b>め花だけ<\/b>。"},{"h":"アブラナ（アブラナ科）","t":"<b>10月ごろ（秋）<\/b>種をまき、くきをあまりのばさず<b>葉を広げたすがたで冬越し<\/b>する。昼が長くなりはじめるとつぼみができ、<b>下から順に<\/b>さく。花びら4枚・おしべ6本・めしべ1本。"},{"h":"クヌギ（ブナ科）","t":"秋に落ちた実（ドングリ）が翌年の春に発芽する。お花とめ花がさき、<b>風<\/b>が花粉を運ぶ。受粉した年にできた実は<b>翌年の秋<\/b>に熟す。ブナ・コナラ・カシ・シイ・クリもなかま。"},{"h":"植物のなかま分け","t":"ヒルガオ科：ヒルガオ・ヨルガオ・サツマイモ。ウリ科：ツルレイシ・ヒョウタン・ユウガオ・カボチャ・キュウリ・スイカ。アブラナ科：ナズナ・ダイコン・キャベツ・カブ・ハクサイ。"},{"h":"親のからだの一部からふえる","t":"ジャガイモは<b>種いも<\/b>、チューリップ・スイセン・ヒヤシンスは<b><ruby>球根<rt>きゅうこん<\/rt><\/ruby><\/b>（秋に植える）、アジサイは枝を切って地面にさす<b><ruby>挿<rt>さ<\/rt><\/ruby>し木<\/b>でふやす。"},{"h":"両性花と単性花","t":"アサガオ・アブラナのように1つの花におしべとめしべがある花を<b><ruby>両性花<rt>りょうせいか<\/rt><\/ruby><\/b>、ヘチマ・キュウリのようにお花とめ花を別々にさかせる花を<b><ruby>単性花<rt>たんせいか<\/rt><\/ruby><\/b>という。"}],"trivia":["ウリ科の植物は漢字に「瓜」がつくよ。ヘチマは「糸瓜」、スイカは「西瓜」、カボチャは「南瓜」、キュウリは「胡瓜」と書くんだ。","わたしたちが食べる白米は、イネの種子の中身。精米でけずられる「ぬか」は、実や種の皮の部分なんだよ。","イチョウやホウレンソウには「おすの株」と「めすの株」があって、実や種子ができるのはめすの株だけなんだ（<ruby>雌雄異株<rt>しゆういしゅ<\/rt><\/ruby>）。"],"questions":[{"t":"choice","lv":1,"q":"アサガオの種子をまくのに合っている時期はいつごろ？","c":["5月ごろ","1月ごろ","3月ごろ","7月ごろ"],"e":"アサガオは5月、ヘチマは4月の終わり〜5月のはじめにまく。あたたかくなるゴールデンウィークのころと覚えよう。"},{"t":"choice","lv":1,"q":"アサガオのつるは、どのようにしてからだを支えている？","c":["上から見て左回り（反時計回り）に支柱に巻きつく","上から見て右回り（時計回り）に支柱に巻きつく","くきが変化した巻きひげを支柱に巻きつける","葉が変化した巻きひげを支柱に巻きつける"],"e":"アサガオはつるそのものが上から見て左回りに巻きつく。巻きひげを使うのはヘチマ（くきが変化）やエンドウ（葉が変化）だよ。"},{"t":"choice","lv":1,"q":"アサガオの花がさくのは、1日のうちいつごろ？","c":["明け方","昼ごろ","昼すぎ","夕方"],"e":"アサガオは夜明け前からさき始め、昼すぎにはしぼんでしまう。だから「朝顔」という名前なんだ。"},{"t":"choice","lv":1,"q":"アサガオのなかま（ヒルガオ科）ではない植物はどれ？","c":["ジャガイモ","ヒルガオ","ヨルガオ","サツマイモ"],"e":"ヒルガオ・ヨルガオ・サツマイモはヒルガオ科。ジャガイモはナス・ピーマン・トマトと同じナス科だよ。"},{"t":"choice","lv":2,"q":"ヘチマの種子はどんなようす？","c":["黒くて平たい、だ円形の種子","ごく小さくて丸いつぶのような種子","黒っぽくて、ミカンの1ふさのような形の種子","白と黒のしまもようがある種子"],"e":"ヘチマの種子は黒くて平たいだ円形。小さく丸いのはアブラナ、ミカンの1ふさのような形はアサガオ、しまもようはヒマワリの種子だよ。"},{"t":"tf","lv":2,"q":"ヘチマの花のうち、花びらのすぐ下（つけ根）がふくらんでいるのはお花である。","a":false,"e":"ふくらんでいるのはめ花。め花の花びらの下には、成長して実になる<ruby>子房<rt>しぼう<\/rt><\/ruby>があるからだよ。お花には子房がない。"},{"t":"choice","lv":2,"q":"アブラナの芽生えはどれ？","c":["先が少しへこんだハート形の小さな子葉が2枚開く","細長いだ円形の、あつみのある子葉が2枚開く","子葉は土の中に残り、本葉だけが地上に出てくる","細長い子葉が1枚だけ出てくる"],"e":"アブラナのなかまの子葉は先がへこんだハート形。細長いだ円形の子葉はヘチマ、子葉が土の中に残るのはエンドウだよ。"},{"t":"choice","lv":1,"q":"アブラナは、どんなすがたで冬を越す？","c":["くきをあまりのばさず、葉を広げたすがた","種子のすがた","地下のくきのすがた","養分をたくわえた根だけのすがた"],"e":"アブラナは10月ごろにまかれて芽を出し、葉を地面に広げたすがたで冬越しする。春になると大きく成長して黄色い花をさかせるよ。"},{"t":"choice","lv":1,"q":"アブラナの花は、どのような順にさく？","c":["下から順にさく","上から順にさく","すべての花がいっせいにさく","順番はなく、ばらばらにさく"],"e":"アブラナはくきの下の方から順に花がさき、下から順に実ができていく。"},{"t":"choice","lv":1,"q":"チューリップ・スイセン・ヒヤシンスは、何を植えてふやす？","c":["<ruby>球根<rt>きゅうこん<\/rt><\/ruby>","種いも","<ruby>挿<rt>さ<\/rt><\/ruby>し木","むかご"],"e":"地下にある球のような形のつくりを球根という。秋に植えた球根が春に芽を出し、花をさかせるよ。"},{"t":"tf","lv":1,"q":"発芽のとき、はじめに出る葉を「本葉」という。","a":false,"e":"はじめに出る葉は<ruby>子葉<rt>しよう<\/rt><\/ruby>。そのあとに出てくる葉が<ruby>本葉<rt>ほんば<\/rt><\/ruby>だよ。"},{"t":"choice","lv":2,"q":"ヘチマの説明として正しいものはどれ？","c":["花はお花とめ花の2種類がある","つるが上から見て左回りに支柱に巻きつく","実はお花にもめ花にもできる","種子は1つの実に最大で6個できる"],"e":"ヘチマはお花とめ花をさかせ、実ができるのはめ花だけ。つるが左回りなのと、種子が最大6個なのはアサガオの特ちょうだよ。"},{"t":"choice","lv":1,"q":"ヘチマと同じウリ科のなかまはどれ？","c":["ツルレイシ","ジャガイモ","チューリップ","スイセン"],"e":"ツルレイシ（ニガウリ、ゴーヤ）はウリ科。カボチャ・キュウリ・スイカ・ヒョウタン・ユウガオもウリ科だよ。"},{"t":"choice","lv":1,"q":"アブラナの種子をまく季節はいつ？","c":["秋","春","夏","冬"],"e":"アブラナは10月ごろ（秋）に種をまき、冬を越して春に花をさかせる。春にまくアサガオやヘチマとのちがいに注意しよう。"},{"t":"choice","lv":1,"q":"アブラナのなかま（アブラナ科）ではない植物はどれ？","c":["カボチャ","カブ","ダイコン","ハクサイ"],"e":"カボチャはウリ科。カブ・ダイコン・ハクサイ・キャベツ・ナズナ・コマツナはアブラナ科で、黄色か白色の花をさかせ、食用の野菜が多いよ。"},{"t":"tf","lv":3,"q":"ニンジンは、ダイコンと同じアブラナ科の植物である。","a":false,"e":"ニンジンはセロリやパセリと同じセリ科の植物。根を食べる野菜どうしでも、なかまがちがうので注意しよう。"},{"t":"choice","lv":1,"q":"クヌギのなかまで、実が「ドングリ」とよばれるものはどれ？","c":["ブナ","アジサイ","バラ","ツツジ"],"e":"ブナ科のブナ・コナラ・カシ・シイなどの実はドングリとよばれる。アジサイ・バラ・ツツジは<ruby>挿<rt>さ<\/rt><\/ruby>し木でふやせる植物だよ。"},{"t":"choice","lv":1,"q":"種子ではなく、親のからだの一部からふえる植物はどれ？","c":["ジャガイモ","キャベツ","シイ","キュウリ"],"e":"ジャガイモは種いものくぼみから芽と根が出て、種いもの養分を使って成長する。花はさくが、実はあまりできないよ。"},{"t":"choice","lv":1,"q":"アジサイは、ふつうどのようにしてふやす？","c":["枝を切って地面にさす（<ruby>挿<rt>さ<\/rt><\/ruby>し木）","球根を植える","種いもを植える","種子をまく"],"e":"アジサイは実ができないので、切った枝から根を出させてふやす。バラやツツジも挿し木でふやせるよ。"},{"t":"choice","lv":1,"q":"「<ruby>受粉<rt>じゅふん<\/rt><\/ruby>」とはどんなこと？","c":["おしべでつくられた花粉が、めしべの先につくこと","めしべでつくられた花粉が、おしべの先につくこと","種子から芽が出ること","花びらが散って実ができること"],"e":"花粉はおしべの先の「やく」でつくられる。それがめしべの先（<ruby>柱頭<rt>ちゅうとう<\/rt><\/ruby>）につくのが受粉で、受粉すると実や種子ができる。"},{"t":"choice","lv":2,"q":"受粉したあと、成長して「実」になるのはめしべのどの部分？","c":["<ruby>子房<rt>しぼう<\/rt><\/ruby>","<ruby>柱頭<rt>ちゅうとう<\/rt><\/ruby>","やく","がく"],"e":"めしべの根もとのふくらんだ子房が実になり、子房の中の<ruby>胚珠<rt>はいしゅ<\/rt><\/ruby>が種子になる。やくはおしべの部分だよ。"},{"t":"choice","lv":2,"q":"花粉が風で運ばれる植物はどれ？","c":["スギ","アブラナ","アサガオ","タンポポ"],"e":"風で花粉を運ぶ植物は、花びらが目立たないかない（スギ・ヒノキ・イネ・トウモロコシなど）。昆虫に運んでもらう花は、目立つ色の花びらやにおいで昆虫をよぶよ。"},{"t":"choice","lv":2,"q":"アサガオのつぼみができるのは、どんなころ？","c":["昼の長さが短くなってくるころ","昼の長さが長くなってくるころ","気温が0℃より低くなるころ","雨がたくさんふるころ"],"e":"アサガオは昼が短くなってくると葉のつけ根につぼみをつける。反対にアブラナは、昼が長くなりはじめるとくきの先につぼみをつけるよ。"},{"t":"choice","lv":3,"q":"昼の長さがある時間より「長く」なると花をさかせる植物（長日植物）はどれ？","c":["アブラナ","アサガオ","コスモス","イネ"],"e":"アブラナは春〜初夏にさく長日植物。アサガオ・コスモス・イネは、昼が短くなるとさく短日植物だよ。"},{"t":"tf","lv":3,"q":"短日植物の花がさくかどうかは、1日のうちで「続けて暗い時間」がどれだけ長いかで決まる。","a":true,"e":"暗い時間の合計が同じでも、とちゅうで光を当てて暗い時間を分けるとさかなくなる。大切なのは「連続した暗い時間」の長さなんだ。"},{"t":"choice","lv":1,"q":"アサガオの1つの実の中には、種子が最大で何個できる？","c":["6個","4個","10個","20個"],"e":"アサガオの実の中は3つの部屋に分かれていて、1部屋に2個ずつ、合計で最大6個の種子ができる。"},{"t":"choice","lv":2,"q":"ヘチマの巻きひげについて、正しい説明はどれ？","c":["くきが変化したもので、とちゅうで巻く向きが変わる","葉が変化したもので、とちゅうで巻く向きが変わる","くきが変化したもので、いつも同じ向きに巻く","根が変化したもので、地面にささってからだを支える"],"e":"ヘチマの巻きひげはくきが変化したもので、とちゅうで巻く向きが変わり、ばねのような役目をして風などでちぎれにくくしている。"},{"t":"tf","lv":2,"q":"ヘチマの受粉は、おもに風が花粉を運ぶことで行われる。","a":false,"e":"ヘチマの受粉は昆虫が行う。黄色く目立つ花びらで昆虫をよんで、お花の花粉をめ花に運んでもらうんだ。"},{"t":"choice","lv":2,"q":"アブラナの花の花びらの枚数とおしべの本数の組み合わせはどれ？","c":["花びら4枚・おしべ6本","花びら5枚・おしべ5本","花びら4枚・おしべ4本","花びら3枚・おしべ6本"],"e":"アブラナは花びら4枚、おしべ6本（長いもの4本・短いもの2本）、めしべ1本。花びらが5枚なのはアサガオやヘチマだよ。"},{"t":"choice","lv":3,"q":"クヌギの実（ドングリ）が熟すのはいつ？","c":["受粉した翌年の秋","受粉した年の夏","受粉した年の秋","受粉した翌年の春"],"e":"クヌギは風で受粉したあと、実が熟すまでに時間がかかり、受粉した年にできた実は翌年の秋に熟す。落ちた実はさらに翌年の春に発芽するよ。"},{"t":"choice","lv":2,"q":"お花とめ花を別々にさかせる植物（単性花）はどれ？","c":["キュウリ","アサガオ","アブラナ","サクラ"],"e":"キュウリ・カボチャ・トウモロコシ・ヘチマは単性花。アサガオ・アブラナ・サクラ・エンドウは1つの花におしべとめしべがある両性花だよ。"},{"t":"choice","lv":3,"q":"ヘチマのような単性花には、どんな利点があると考えられる？","c":["ほかの株の花粉で受粉しやすく、親とちがう特ちょうをもつ子ができやすい","1つの花の中で受粉するので、必ず種子ができる","親とまったく同じ特ちょうをもつ子だけができる","受粉しなくても実ができる"],"e":"お花とめ花が分かれていると、ほかの株の花粉がつきやすい。いろいろな特ちょうをもつ子ができ、環境が変わっても生き残りやすくなるんだ。"},{"t":"choice","lv":3,"q":"種子ではなく「<ruby>胞子<rt>ほうし<\/rt><\/ruby>」でふえる植物はどれ？","c":["スギナ（ツクシ）","スギ","クヌギ","イネ"],"e":"スギナ・ゼンマイ・ワラビなどのシダ植物や、ゼニゴケなどのコケ植物は胞子でふえる。スギは名前がにているけれど、種子でふえる植物だよ。"},{"t":"order","lv":2,"q":"アサガオが育つようすを順にならべよう","c":["5月ごろに種をまく","子葉が2枚開く","本葉が出て、つるがのびる","つぼみができ、明け方に花がさく","実ができ、中に種子ができる"],"e":"種まき→発芽（子葉）→成長（本葉・つる）→開花→結実の順。成長すると子葉はかれてしまうよ。"},{"t":"order","lv":2,"q":"アブラナの一生を順にならべよう","c":["秋（10月ごろ）に種をまく","芽生えて、葉を広げたすがたで冬越しする","春、くきがのびて下から順に花がさく","実ができ、かわくと種子をまき散らす"],"e":"アブラナは秋にまいて冬を越し、春に花をさかせるのがポイント。春にまいて夏〜秋にさくアサガオやヘチマとちがうね。"}]},{"id":"plantbody","title":"植物のつくりとはたらき","yomi":"しょくぶつのつくりとはたらき","emoji":"🌿","source":"上 第12回","points":[{"h":"単子葉類と双子葉類","t":"子葉が1枚のなかまを<b><ruby>単子葉類<rt>たんしようるい<\/rt><\/ruby><\/b>（イネ・ムギ・トウモロコシ・ツユクサ・チューリップ）、2枚のなかまを<b><ruby>双子葉類<rt>そうしようるい<\/rt><\/ruby><\/b>（ホウセンカ・アサガオ・ヘチマ・ヒマワリ・ジャガイモ）という。"},{"h":"根のつくり","t":"単子葉類の根は<b>ひげ根<\/b>、双子葉類の根は太い<b><ruby>主根<rt>しゅこん<\/rt><\/ruby><\/b>と細い<b><ruby>側根<rt>そっこん<\/rt><\/ruby><\/b>からなる。根は水や肥料を<b>吸収<\/b>し、地上部を<b>支える<\/b>。"},{"h":"くきの中の管","t":"根から吸った水や肥料を運ぶ<b><ruby>道管<rt>どうかん<\/rt><\/ruby><\/b>（内側）と、葉でつくられた養分を運ぶ<b><ruby>師管<rt>しかん<\/rt><\/ruby><\/b>（外側）がある。この2つの束を<b><ruby>維管束<rt>いかんそく<\/rt><\/ruby><\/b>という。"},{"h":"維管束のならび方","t":"単子葉類はくき全体に<b>散らばっている<\/b>。双子葉類は<b>輪のように並ぶ<\/b>。"},{"h":"葉脈","t":"葉のすじ（<ruby>葉脈<rt>ようみゃく<\/rt><\/ruby>）は維管束が葉までのびたもの。単子葉類は<b><ruby>平行脈<rt>へいこうみゃく<\/rt><\/ruby><\/b>、双子葉類はあみの目のような<b><ruby>網状脈<rt>もうじょうみゃく<\/rt><\/ruby><\/b>。"},{"h":"養分をたくわえる場所","t":"<b>根<\/b>：ニンジン・サツマイモ。<b>地下のくき<\/b>：ジャガイモ・サトイモ・ハス。<b>葉<\/b>：タマネギ・ニンニク。"},{"h":"光合成","t":"<b><ruby>葉緑体<rt>ようりょくたい<\/rt><\/ruby><\/b>で、<b>光<\/b>のエネルギーを使い、<b>水<\/b>と<b>二酸化炭素<\/b>から<b>デンプン<\/b>（養分）をつくる。このとき<b>酸素<\/b>もできる。"},{"h":"光合成を確かめる実験","t":"日光に当てた葉を<b>熱湯<\/b>（やわらかくする）→<b>あたためたアルコール<\/b>（葉を白くする）→<b>湯<\/b>で洗う→<b>ヨウ素液<\/b>。デンプンがあると<b>青紫色<\/b>になる。ふ入りの葉とアルミはくで、光合成には<b>光と葉緑体の両方<\/b>が必要とわかる。"},{"h":"呼吸","t":"<b>酸素<\/b>を使って養分からエネルギーを取り出し、<b>二酸化炭素と水<\/b>ができる。若い葉を暗い所に置いたびんに<b>石灰水<\/b>を入れてふると<b>白くにごる<\/b>。"},{"h":"蒸散","t":"葉やくきの小さいあなから水を<b>水蒸気<\/b>として出す。根からの<b>水の吸い上げ<\/b>がよくなり、<b>体温の上がりすぎ<\/b>を防ぐ（水が蒸発するとき<ruby>気化熱<rt>きかねつ<\/rt><\/ruby>をうばう）。"}],"trivia":["ゴーヤのグリーンカーテンは、すだれのように日光をさえぎるだけでなく、葉からの<ruby>蒸散<rt>じょうさん<\/rt><\/ruby>で熱をうばうので、まわりの空気まですずしくしてくれるよ。","サボテンのとげは、もともと葉が変化したもの。葉を細いとげにして、蒸散で水が出ていくのをおさえているんだ。","ホウセンカに赤い色水を吸わせてから根・くき・葉を切ってみると、水の通り道の<ruby>道管<rt>どうかん<\/rt><\/ruby>だけが赤くそまって見えるよ。"],"questions":[{"t":"choice","lv":2,"q":"次の植物の葉のうち、葉脈が平行に並んでいる（平行脈の）ものはどれ？","c":["ササ","サクラ","アサガオ","ヘチマ"],"e":"ササはイネのなかまの単子葉類なので、葉脈が平行脈。サクラ・アサガオ・ヘチマは双子葉類で、あみの目のような網状脈だよ。"},{"t":"choice","lv":1,"q":"双子葉類にあてはまらない植物はどれ？","c":["チューリップ","ヘチマ","ヒマワリ","ホウセンカ"],"e":"チューリップは子葉が1枚の単子葉類。ヘチマ・ヒマワリ・ホウセンカは子葉が2枚の双子葉類だよ。"},{"t":"choice","lv":1,"q":"植物が光合成を行う、葉の中にある緑色のつくりを何という？","c":["<ruby>葉緑体<rt>ようりょくたい<\/rt><\/ruby>","<ruby>道管<rt>どうかん<\/rt><\/ruby>","<ruby>師管<rt>しかん<\/rt><\/ruby>","<ruby>維管束<rt>いかんそく<\/rt><\/ruby>"],"e":"葉緑体は緑色の色素をもち、光合成を行う。葉は日光がよく当たる表側の方が葉緑体が多く、緑色がこいよ。"},{"t":"choice","lv":1,"q":"植物が光合成を行うためにとり入れるものは、水ともう1つは何？","c":["二酸化炭素","酸素","デンプン","ちっ素"],"e":"光合成は水と二酸化炭素をもとに、日光のエネルギーを使ってデンプンをつくるはたらき。酸素はできるもので、とり入れるものではないよ。"},{"t":"choice","lv":1,"q":"葉が光合成を行ったかどうかを確かめるために、葉にかける薬品はどれ？","c":["ヨウ素液","石灰水","アルコール","食塩水"],"e":"ヨウ素液は光合成でできたデンプンと反応して青紫色になる。色が変われば光合成を行った、と確かめられるよ。"},{"t":"choice","lv":1,"q":"植物の呼吸で出された気体を確かめる方法と、その結果の組み合わせはどれ？","c":["石灰水に通すと白くにごる","ヨウ素液に通すと青紫色になる","石灰水に通すと青紫色になる","ヨウ素液に通すと白くにごる"],"e":"呼吸で出る二酸化炭素を石灰水に通すと、水にとけない白いつぶができて白くにごる。ヨウ素液はデンプンを調べる薬品だよ。"},{"t":"choice","lv":1,"q":"くきの内側にある<ruby>道管<rt>どうかん<\/rt><\/ruby>は、何を運ぶ通り道？","c":["根から吸収した水や肥料","根でつくられた養分","葉から出る水蒸気","葉でつくられた養分"],"e":"道管は維管束の内側にあって、根から吸った水や肥料を運ぶ。葉でつくられた養分を運ぶのは外側の師管だよ。"},{"t":"choice","lv":2,"q":"地下の「くき」に養分をたくわえている植物としてあてはまらないものはどれ？","c":["サツマイモ","サトイモ","ジャガイモ","ハス"],"e":"サツマイモの食べる部分は、養分をたくわえた「根」。サトイモ・ジャガイモ・ハス（レンコン）は地下のくきだよ。同じイモでもちがうので注意！"},{"t":"choice","lv":1,"q":"ひげ根をもつ植物の組み合わせはどれ？","c":["イネ、ツユクサ","アサガオ、ヒマワリ","アサガオ、イネ","ヒマワリ、ツユクサ"],"e":"ひげ根をもつのは子葉が1枚の単子葉類（イネ・ムギ・トウモロコシ・ツユクサ・チューリップなど）。アサガオ・ヒマワリは主根と側根をもつよ。"},{"t":"choice","lv":1,"q":"葉やくきから、水を水蒸気として出すはたらきを何という？","c":["<ruby>蒸散<rt>じょうさん<\/rt><\/ruby>","<ruby>光合成<rt>こうごうせい<\/rt><\/ruby>","<ruby>呼吸<rt>こきゅう<\/rt><\/ruby>","<ruby>受粉<rt>じゅふん<\/rt><\/ruby>"],"e":"蒸散によって、根からの水の吸い上げがよくなり、体温の上がりすぎも防いでいるよ。"},{"t":"choice","lv":1,"q":"子葉が1枚の植物のグループを何という？","c":["<ruby>単子葉類<rt>たんしようるい<\/rt><\/ruby>","<ruby>双子葉類<rt>そうしようるい<\/rt><\/ruby>","シダ植物","コケ植物"],"e":"「単」は1つ、「双」は2つという意味。子葉の数でなかま分けしているんだ。"},{"t":"choice","lv":1,"q":"子葉が1枚の植物はどれ？","c":["トウモロコシ","ホウセンカ","アサガオ","ヒマワリ"],"e":"トウモロコシはイネのなかまの単子葉類。ホウセンカ・アサガオ・ヒマワリは子葉が2枚の双子葉類だよ。"},{"t":"choice","lv":1,"q":"葉でつくられた養分が通る管を何という？","c":["<ruby>師管<rt>しかん<\/rt><\/ruby>","<ruby>道管<rt>どうかん<\/rt><\/ruby>","<ruby>葉緑体<rt>ようりょくたい<\/rt><\/ruby>"],"e":"師管は維管束の外側にあり、葉でつくられた養分をからだ全体に運ぶ。"},{"t":"tf","lv":1,"q":"道管と師管が集まって束になったものを<ruby>維管束<rt>いかんそく<\/rt><\/ruby>という。","a":true,"e":"維管束は根・くき・葉までつながっている。葉のすじ（葉脈）は、維管束が葉までのびたものだよ。"},{"t":"choice","lv":2,"q":"子葉が1枚のグループの、根・くき・葉の特ちょうはどれ？","c":["根はひげ根、維管束はくき全体に散らばり、葉脈は平行脈","根はひげ根、維管束は輪のように並び、葉脈は網状脈","根は主根と側根、維管束はくき全体に散らばり、葉脈は平行脈","根は主根と側根、維管束は輪のように並び、葉脈は網状脈"],"e":"単子葉類は「ひげ根・散らばる・平行脈」、双子葉類は「主根と側根・輪のように並ぶ・網状脈」とセットで覚えよう。"},{"t":"choice","lv":2,"q":"子葉が2枚のグループの、くきの維管束のならび方はどれ？","c":["輪のように並んでいる","くき全体に散らばっている","くきの中心に1本だけある","くきの表面にだけある"],"e":"双子葉類のくきでは、維管束が輪のように並ぶ。単子葉類はくき全体に散らばっているよ。"},{"t":"choice","lv":1,"q":"光合成のときに出される気体は何？","c":["酸素","二酸化炭素","ちっ素","水素"],"e":"光合成では、水と二酸化炭素からデンプンがつくられ、同時に酸素が出される。"},{"t":"choice","lv":1,"q":"デンプンにヨウ素液を加えると、何色に変わる？","c":["青紫色","赤色","黄色","白色"],"e":"ヨウ素液はデンプンと反応して青紫色になる。ジャガイモや食パンにかけても青紫色になるよ。"},{"t":"tf","lv":2,"q":"くきの維管束の中では、道管が外側、師管が内側にある。","a":false,"e":"反対だよ。道管が内側（中心側）、師管が外側にある。単子葉類も双子葉類も同じなんだ。"},{"t":"choice","lv":2,"q":"根のはたらきとしてあてはまらないものはどれ？","c":["光合成を行う","水や肥料を吸収する","地上の部分を支える","養分をたくわえる植物もある"],"e":"光合成を行うのは葉緑体のある葉。根は水や肥料を吸収し、からだを支え、ニンジンのように養分をたくわえるものもある。"},{"t":"choice","lv":2,"q":"「葉」に養分をたくわえている植物はどれ？","c":["タマネギ","ニンジン","ジャガイモ","ハス"],"e":"タマネギやニンニクの食べる部分は、養分をたくわえた葉が重なったもの。ニンジンは根、ジャガイモとハスは地下のくきだよ。"},{"t":"order","lv":2,"q":"ヨウ素液で葉にデンプンがあるか調べる実験の手順を順にならべよう","c":["日光に十分に当てた葉をつみとる","葉を熱湯につける","葉をあたためたアルコールにつける","葉を湯につけてアルコールを洗い流す","広げた葉にヨウ素液をかける"],"e":"熱湯でやわらかくし、アルコールで緑色をぬいて白くし、かたくなった葉を湯でやわらかくしてからヨウ素液をかけるよ。"},{"t":"choice","lv":2,"q":"光合成の実験で、葉をあたためたアルコールにつけるのはなぜ？","c":["葉の緑色をぬいて白くし、ヨウ素液の色の変化を見やすくするため","葉をやわらかくするため","葉の中にある養分をなくすため","葉の水分がなくならないようにするため"],"e":"葉の緑色がアルコールにとけ出し、葉は白く、アルコールは緑色になる。葉をやわらかくするのは熱湯や湯につける理由だよ。"},{"t":"choice","lv":2,"q":"ふ（葉緑体のない白い部分）のある葉の一部をアルミはくでおおい、日光に当ててからヨウ素液で調べた。青紫色になったのはどこ？","c":["アルミはくでおおわなかった緑色の部分","アルミはくでおおわなかったふの部分","アルミはくでおおった緑色の部分","葉全体"],"e":"光が当たり、しかも葉緑体がある部分だけでデンプンができる。アルミはくの部分は光がなく、ふの部分は葉緑体がないので変化しないよ。"},{"t":"choice","lv":3,"q":"ふ入りの葉を日光に当ててからヨウ素液で調べると、日光が当たった緑色の部分は青紫色になったが、日光が当たったふ（葉緑体のない白い部分）は色が変わらなかった。このことからわかることは？","c":["光合成には葉緑体が必要なこと","光合成には光が必要なこと","光合成には二酸化炭素が必要なこと","光合成には水が必要なこと"],"e":"どちらにも光は当たっていて、ちがうのは葉緑体があるかどうかだけ。1つの条件だけを変えて比べると、その条件が必要かどうかがわかるよ。"},{"t":"choice","lv":3,"q":"ビニル袋をかぶせた葉の袋の中に、水酸化ナトリウム水溶液をしみこませたろ紙を入れて日光に当てた。何を調べるための実験？","c":["光合成に二酸化炭素が必要かどうか","光合成に光が必要かどうか","光合成に葉緑体が必要かどうか","蒸散で水が出るかどうか"],"e":"水酸化ナトリウム水溶液は二酸化炭素を吸収する。袋の中の二酸化炭素をなくして、デンプンができるかを調べるんだ。"},{"t":"choice","lv":2,"q":"呼吸を確かめる実験で、若い葉を入れたびんを暗い場所に置くのはなぜ？","c":["光合成をさせないようにするため","葉をかれさせるため","葉を冷やすため","蒸散をさかんにするため"],"e":"明るいと光合成で二酸化炭素が使われてしまう。暗くして呼吸だけをさせると、出た二酸化炭素を石灰水ではっきり確かめられるよ。"},{"t":"choice","lv":3,"q":"葉を入れたびんAを日光の当たる場所に、びんBを暗い部屋にしばらく置き、葉を出して石灰水を入れてふった。結果はどうなる？","c":["Bだけ白くにごる","Aだけ白くにごる","AもBも白くにごる","AもBもほとんど変わらない"],"e":"Aの葉は呼吸と光合成の両方をするので、二酸化炭素がふえない。Bの葉は光合成ができず呼吸だけなので、二酸化炭素がふえて白くにごる。"},{"t":"tf","lv":2,"q":"呼吸を調べる実験には、成長がさかんな若い葉を使うとよい。","a":true,"e":"成長がさかんなところは呼吸もさかん。発芽しかけの種子や、開花前のつぼみも呼吸がさかんだよ。"},{"t":"choice","lv":2,"q":"蒸散が植物の役に立っていることとして正しいものはどれ？","c":["根からの水の吸い上げをよくし、体温の上がりすぎを防ぐ","光のエネルギーを使って養分をつくる","酸素を使って養分からエネルギーを取り出す","根に養分をたくわえる"],"e":"水が蒸発するときにまわりから熱（気化熱）をうばうので、植物の温度が下がる。養分をつくるのは光合成、エネルギーを取り出すのは呼吸だよ。"},{"t":"choice","lv":2,"q":"植物の枝にビニル袋をかぶせてしばらくおくと、袋の内側に水てきがついてくもった。なぜ？","c":["葉から出た水蒸気が冷えて水てきになったから","葉から出た酸素が水に変わったから","袋の外の雨水がしみこんだから","根から吸った水がそのまま葉からたれたから"],"e":"蒸散で出る水蒸気は目に見えないが、袋の中にとじこめると冷えて水てきになり、くもって見える。"},{"t":"choice","lv":3,"q":"夏の暑さをしのぐとき、すだれと比べて、ゴーヤのグリーンカーテンにする利点はどれ？","c":["葉からの蒸散で熱がうばわれ、まわりの温度が下がる","葉が光合成で熱をつくり出す","葉が呼吸をして酸素をたくさん出す","日光を完全にさえぎり、風も通さない"],"e":"すだれも日光をさえぎって風を通すが、植物は蒸散で気化熱をうばうので、さらにすずしくなる。打ち水やドライミストも同じしくみだよ。"},{"t":"choice","lv":3,"q":"同じような枝4本を水の入った試験管にさし（水面には油をうかべる）、水の減り方を調べた。葉の表と裏にワセリンをぬった枝は2cm³、表だけにぬった枝は18cm³、何もしない枝は30cm³減った。裏だけにぬった枝では何cm³減る？","c":["14cm³","12cm³","16cm³","28cm³"],"e":"ワセリンは蒸散のあなをふさぐ。くきから2、表だけぬると裏とくきで18なので裏は16、全体30から表は12。裏だけぬると表12＋くき2＝14cm³だよ。"},{"t":"choice","lv":3,"q":"サボテンのとげは、もとはからだのどの部分が変化したもの？","c":["葉","くき","根","花"],"e":"サボテンのとげは葉が変化したもので、蒸散をおさえて水を失わないようにしている。ヤマノイモのむかごはくき、トウモロコシの支柱根は根が変化したものだよ。"},{"t":"tf","lv":3,"q":"ホウセンカに赤い色水を吸わせると、根・くき・葉の「師管」の部分が赤くそまる。","a":false,"e":"赤くそまるのは、根から吸った水が通る「道管」の部分。師管は葉でつくられた養分の通り道だよ。"}]},{"id":"airwater","title":"身のまわりの空気と水","yomi":"みのまわりのくうきとみず","emoji":"🎈","source":"上 第13回","points":[{"h":"空気にふくまれる気体","t":"空気には、生物の呼吸に使われる<b>酸素<\/b>や、植物の光合成に使われる<b>二酸化炭素<\/b>がふくまれる。いちばん多いのは<b>ちっ素<\/b>（約78％）で、酸素は約21％。"},{"h":"身のまわりの水","t":"ヒトのからだの約<b>60〜70％<\/b>は水分。水は、気体の<b>水蒸気<\/b>・液体の<b>水<\/b>・固体の<b>氷<\/b>というすがたになる。"},{"h":"空気にも重さがある","t":"空気1Lの重さは約<b>1.3g<\/b>、水1Lの重さは約<b>1000g<\/b>（1kg）。スプレーかんから空気をぬくと<b>軽く<\/b>なる。"},{"h":"空気はおし縮められる","t":"とじこめた空気をおすと<b>体積が小さく<\/b>なり、力をぬくと<b>元にもどる<\/b>。強くおすほど、元にもどろうとする力（<ruby>弾性<rt>だんせい<\/rt><\/ruby>）が<b>強く<\/b>なる。"},{"h":"水はおし縮められない","t":"とじこめた水はおしても<b>ほとんどおし縮められない<\/b>。"},{"h":"縮めた空気の利用","t":"空気でっぽうは、おし縮められた空気が元にもどろうとする力で前玉を飛ばす。ペットボトルの水でっぽうは、<b>おし縮められた空気が水面をおして<\/b>水を飛ばす。"},{"h":"温度と体積","t":"空気も水も、あたためると体積が<b>ふえ<\/b>、冷やすと<b>へる<\/b>。変化は<b>空気＞水<\/b>（水はわずか）。体積が変わっても<b>重さは変わらない<\/b>。水は<b>4℃<\/b>のとき体積が最も小さい。"},{"h":"対流","t":"あたためられた空気や水は<b>上<\/b>に動き、上にあったものと入れかわって全体があたたまる。このあたたまり方を<b><ruby>対流<rt>たいりゅう<\/rt><\/ruby><\/b>という。"},{"h":"エアコンの暖ぼう","t":"ふき出し口を<b>下<\/b>に向けると、あたたかい空気が上に動いて部屋全体があたたまる。上向きだと、あたたかい空気が上にたまってしまう。"},{"h":"水のすがたの変化","t":"水は<b>100℃<\/b>で<ruby>沸<rt>ふっ<\/rt><\/ruby>とうし、<b>0℃<\/b>でこおる。沸とう中やこおっている間は温度が変わらない。水が氷になると体積は約<b>1.1倍<\/b>になるが、重さは変わらない。"},{"h":"物が燃えるとき","t":"<b>酸素<\/b>には物が燃えるのを助けるはたらきがある。ろうそくが燃えると酸素が使われ、<b>二酸化炭素<\/b>と<b>水<\/b>ができる。"}],"trivia":["熱気球は、中の空気を熱して体積を大きくし、同じ体積あたりの重さをまわりの空気より軽くすることで空にうかんでいるよ。","こわれ物を包む「プチプチ」（気泡緩衝材）は、おし縮められた空気が元にもどろうとする性質（弾性）を利用した道具なんだ。","冬の湖は表面からこおるけれど、底には4℃の水が残るので、大きな湖は底までこおることは少ないんだよ。"],"questions":[{"t":"choice","lv":1,"q":"空気を入れた注射器を消しゴムの上に立ててピストンをおすと、少し下がった。次におしている力をぬくと、中の空気はどうなる？","c":["元にもどろうとして、ピストンをおし返す","縮んだままで、元にもどらない","さらに縮んで、ピストンが下がる","注射器の外へにげていく"],"e":"おし縮められた空気には、元にもどろうとする力（<ruby>弾性<rt>だんせい<\/rt><\/ruby>）がはたらく。だから力をぬくとピストンは元の位置までもどるよ。"},{"t":"choice","lv":1,"q":"水をいっぱいに入れた注射器を消しゴムの上に立ててピストンをおすと、ピストンはどうなる？","c":["ほとんど下がらない","少し下がる","大きく下がる","水におし返されて上がる"],"e":"水は空気とちがって、ほとんどおし縮めることができない。だからピストンはほとんど動かないよ。"},{"t":"choice","lv":2,"q":"同じ注射器に「空気だけ」「空気と水を半分ずつ」「水だけ」を入れて、ピストンを同じ力でおした。最も下までおせるのはどれ？","c":["空気だけ","空気と水を半分ずつ","水だけ","どれも同じ"],"e":"おし縮められるのは空気だけ。空気の量が多いほど大きく縮むので、空気だけのものが最も下までおせる。水だけのものはほとんど動かない。"},{"t":"choice","lv":1,"q":"空気をいっぱいにつめたスプレーかんと、同じ種類のからのスプレーかんの重さを比べると、どうなる？","c":["空気をつめたかんの方が重い","からのかんの方が重い","同じ重さ"],"e":"空気にも重さがあるので、空気をつめこんだ方が重い。てんびんにつるすと、空気をつめたかんの方が下がるよ。"},{"t":"choice","lv":1,"q":"水1Lの重さはおよそ何g？","c":["1000g","1g","10g","100g"],"e":"水1mLが1gなので、1L（1000mL）では1000g＝1kgになる。"},{"t":"choice","lv":1,"q":"空気をあたためると、体積と重さはどうなる？","c":["体積は大きくなり、重さは変わらない","体積は大きくなり、重さは重くなる","体積は変わらず、重さは重くなる","体積も重さも変わらない"],"e":"あたためると空気の体積はふえるが、空気の量そのものは変わらないので重さは変わらない。"},{"t":"choice","lv":1,"q":"口に石けん水のまくをつけた丸底フラスコを冷やすと、まくはどうなる？","c":["フラスコの内側にへこむ","外側にふくらむ","変わらない","すぐにわれてなくなる"],"e":"中の空気が冷やされて体積が小さくなるので、まくは内側にへこむ。反対にあたためると、まくはふくらむよ。"},{"t":"choice","lv":3,"q":"ある空気が0℃のとき体積100cm³で、60℃にすると122cm³になった。この空気を30℃にすると、体積は何cm³？","c":["111cm³","106cm³","116cm³","122cm³"],"e":"空気の体積は温度にあわせて規則正しく変化する。60℃上がって22cm³ふえたので、30℃ならその半分の11cm³ふえて111cm³になる。"},{"t":"choice","lv":2,"q":"水の入ったビーカーの底の真ん中を熱した。水はどのように動く？","c":["真ん中の水が上がり、まわりの水が下がって、ぐるりと回るように動く","まわりの水が上がり、真ん中の水が下がる","熱したところの水は下にたまり、動かない","水はまったく動かず、熱したところからとなりへ順に伝わる"],"e":"あたためられた水は上に動き、あたためられていないまわりの水が入れかわるように下がる。こうして流れができて全体があたたまる。"},{"t":"choice","lv":1,"q":"あたためられた空気や水が動いて、全体があたたまっていくあたたまり方を何という？","c":["<ruby>対流<rt>たいりゅう<\/rt><\/ruby>","<ruby>伝導<rt>でんどう<\/rt><\/ruby>","<ruby>蒸散<rt>じょうさん<\/rt><\/ruby>","<ruby>沸<rt>ふっ<\/rt><\/ruby>とう"],"e":"空気（気体）や水（液体）は対流であたたまる。金属のように物の中を順に熱が伝わるのは伝導だよ。"},{"t":"choice","lv":1,"q":"ヒトのからだの約何％が水分？","c":["約70％","約10％","約30％","約50％"],"e":"ヒトのからだの約60〜70％は水分。水は生きるためにとても大切なんだ。"},{"t":"tf","lv":2,"q":"とじこめた空気は、強くおすほど、元にもどろうとする力が強くなる。","a":true,"e":"空気はばねと同じような性質をもつ。大きく縮めるほど、おし返す手ごたえが大きくなるよ。"},{"t":"tf","lv":2,"q":"同じ注射器なら、中の空気の量が多いほど、同じ力でおしたときピストンを大きく下げられる。","a":true,"e":"空気の量が多いほど、縮むことのできる分も多くなる。空気を少ししか入れないと、少ししか下がらないよ。"},{"t":"order","lv":2,"q":"ビーカーの水の底を熱したとき、対流で全体があたたまるまでの流れを順にならべよう","c":["熱したところの水の温度が上がる","水の体積が大きくなり、同じ体積あたりの重さが軽くなる","あたたまった水が上へ移動する","まわりから冷たい水が入りこみ、くり返すうちに全体があたたまる"],"e":"あたためられた水は体積がふえて軽くなるので上へ動き、冷たい水と入れかわる。この流れが対流だよ。空気も同じしくみであたたまる。"},{"t":"choice","lv":1,"q":"空気や水をあたためたときの動きとして正しいものはどれ？","c":["空気も水も上に動く","空気は上に動くが、水は下に動く","空気も水も下に動く","空気は下に動くが、水は上に動く"],"e":"あたためられると体積が大きくなり、同じ体積あたりの重さが軽くなるので、空気も水も上に動く。線香のけむりで空気の動きを見ることができるよ。"},{"t":"choice","lv":2,"q":"エアコンの暖ぼうで、部屋全体を効率よくあたためるには、ふき出し口をどちらに向けるとよい？","c":["下に向ける","上に向ける","ゆかと平行にする"],"e":"あたたかい空気は上に動く。下にふき出すと、上に移動しながら部屋全体に流れができる。上向きにすると、あたたかい空気が天井近くにたまってしまうよ。"},{"t":"choice","lv":2,"q":"水を入れたペットボトルに空気入れで空気を送りこむと、ボールペンのつつの先から水が飛び出した。水が出る理由はどれ？","c":["おし縮められた空気が、ペットボトル内の水面をおすから","おし縮められた空気が、ペットボトルをおすから","おし縮められた水が、ペットボトルをおすから","おし縮められた水が、ペットボトル内の空気をおすから"],"e":"ペットボトル内の空気が圧縮され、元にもどろうとして水面をおす。水はおし縮められないので、おされた分だけつつから飛び出すんだ。"},{"t":"choice","lv":3,"q":"ペットボトルの水でっぽうで、空気入れから空気を送っても水が出ないのはどんなとき？","c":["水を外に出す管の先が、ペットボトルの中の水に入っておらず空気の部分にあるとき","空気入れにつながる管の先が、ペットボトルの上の方の空気の部分にあるとき","空気入れにつながる管の先が、水の中に入っているとき","ペットボトルの中の水の量が半分くらいのとき"],"e":"水を外に出すには、外へつながる管が水の中に入っている必要がある。管の先が空気の部分にあると、水ではなく空気が出ていくよ。"},{"t":"tf","lv":2,"q":"水でっぽうは、水が出るつつの先が細いほど、水が勢いよく飛び出す。","a":true,"e":"同じ量の水が細い出口から出ようとするので、勢いが強くなる。ホースの先を指でつぶすと水が遠くに飛ぶのと同じだね。"},{"t":"choice","lv":3,"q":"空気をつめたスプレーかんと、からのかんをてんびんにつるすと、からのかん側に3.84gのねん土をつけたときにつり合った。つめた空気を集めると3L分あった。空気1Lの重さは何g？","c":["1.28g","3.84g","0.78g","11.52g"],"e":"つめた空気3Lの重さが3.84g。3.84÷3＝1.28gになる。空気1Lの重さが約1.3gであることが実験でも確かめられるね。"},{"t":"choice","lv":1,"q":"空気1Lの重さはおよそ何g？","c":["約1.3g","約13g","約130g","約1000g"],"e":"空気1Lは約1.3gと、とても軽い。同じ体積で比べると、水の重さは空気の約770倍にもなるよ。"},{"t":"tf","lv":3,"q":"水は温度が低いほど体積が小さくなるので、0℃のときに体積が最も小さい。","a":false,"e":"水は4℃のとき体積が最も小さい。4℃より冷えると、ぎゃくに少しずつ体積がふえていく、ふしぎな性質があるんだ。"},{"t":"choice","lv":2,"q":"水の体積の変化を調べるとき、フラスコにさすガラス管に「細い」ものを使うのはなぜ？","c":["小さな体積の変化でも水位が大きく動き、わかりやすいから","水があたたまりやすくなるから","水がこおりにくくなるから","ガラス管がわれにくいから"],"e":"水の体積変化はわずかなので、太い管だと水位がほとんど動かない。細い管なら、同じ変化でも水位が大きく上下して見やすいよ。"},{"t":"choice","lv":1,"q":"水と空気を同じようにあたためたとき、体積のふえ方を比べるとどうなる？","c":["空気の方が大きい","水の方が大きい","どちらも同じ"],"e":"温度による体積の変化は「空気＞水」。空気はあたためると大きくふえるが、水はわずかしかふえない。"},{"t":"choice","lv":2,"q":"空気でっぽうで、おしぼうをすばやくおすと前玉が飛び出すのはなぜ？","c":["つつの中でおし縮められた空気が、元にもどろうとして前玉をおすから","おしぼうが直接前玉をおすから","つつの中の空気がふえて重くなるから","後玉が先に飛んで前玉にぶつかるから"],"e":"後玉がつつの中の空気をおし縮め、元にもどろうとする力（弾性）が前玉をおし出す。前玉は、空気がおし縮められるときの「ふた」の役目をしているよ。"},{"t":"choice","lv":3,"q":"空気でっぽうのつつに、空気のかわりに水を入れておしぼうをおすと、前玉はどうなる？","c":["水におされて、水といっしょにぽとりと落ちる","空気のときよりも遠くまで飛ぶ","まったく動かない","つつの中にすいこまれる"],"e":"水には空気のような弾性がほとんどないので、おし縮められる力がたまらない。後玉をおすと同時に前玉が動き、勢いがつかないんだ。"},{"t":"choice","lv":3,"q":"空気でっぽうの玉をもう1つふやして3つにする。前玉をできるだけ遠くに飛ばすには、3つ目の玉をどこに置く？","c":["前玉のすぐ後ろ","後玉のすぐ前","つつの真ん中","おしぼうの先の、後玉のさらに後ろ"],"e":"前玉のすぐ後ろに置くと「ふた」の役目が強くなり、空気がさらにおし縮められてから飛び出すので、おし出す力が大きくなる。"},{"t":"tf","lv":3,"q":"空気でっぽうは、つつが長い方が前玉を遠くまで飛ばしやすい。","a":true,"e":"つつが長いほど、おし縮められる空気の体積が大きくなり、元にもどろうとする力も大きくなるからだよ。"},{"t":"choice","lv":2,"q":"空気を入れた注射器の口にせんをして熱湯につけるとピストンは上がった。中身を空気から水にかえて同じようにすると、ピストンはどうなる？","c":["ほとんど動かない","空気のときよりも上がる","空気のときよりも大きく下がる"],"e":"水もあたためると体積がふえるが、そのふえ方は空気よりずっと小さいので、注射器に入るくらいの水ではピストンはほとんど動かない。"},{"t":"choice","lv":1,"q":"空気にふくまれる気体のうち、生物の呼吸に使われるものはどれ？","c":["酸素","二酸化炭素","水素","ちっ素"],"e":"生物は呼吸で酸素をとり入れる。二酸化炭素は植物の光合成に使われる気体だよ。"},{"t":"choice","lv":1,"q":"水が<ruby>沸<rt>ふっ<\/rt><\/ruby>とうする温度は何℃？","c":["100℃","0℃","50℃","4℃"],"e":"水は100℃で沸とうし、水の中から水蒸気のあわがさかんに出る。沸とうしている間は、熱しつづけても温度は100℃のまま変わらないよ。"},{"t":"choice","lv":2,"q":"10gの水をこおらせて氷にすると、体積と重さはどうなる？","c":["体積はふえるが、重さは変わらない","体積も重さもふえる","体積はへるが、重さは変わらない","体積も重さもへる"],"e":"水が氷になると体積は約1.1倍になるが、重さは10gのまま。だから氷は水にうくんだ。"},{"t":"choice","lv":2,"q":"空気の成分で、いちばん多くふくまれている気体はどれ？","c":["ちっ素","酸素","二酸化炭素","水蒸気"],"e":"空気の約78％はちっ素、約21％が酸素。二酸化炭素は約0.04％とごくわずかだよ。"},{"t":"tf","lv":2,"q":"酸素には、物が燃えるのを助けるはたらきがある。","a":true,"e":"酸素だけを入れたびんの中ではろうそくが空気中より激しく燃え、ちっ素だけのびんでは火がすぐ消える。"},{"t":"choice","lv":3,"q":"ふたをしたびんの中でろうそくを燃やした。燃やす前と比べて、燃えたあとのびんの中の空気はどう変わる？","c":["酸素がへって、二酸化炭素がふえる","酸素がふえて、二酸化炭素がへる","ちっ素がへって、酸素がふえる","何も変わらない"],"e":"物が燃えるとき酸素が使われ、二酸化炭素ができる（酸素約21％→約17％、二酸化炭素は約4％に）。ちっ素の量は変わらないよ。"}]},{"id":"metal","title":"<ruby>金属<rt>きんぞく<\/rt><\/ruby>","yomi":"きんぞく","emoji":"🔩","source":"上 第14回","points":[{"h":"金属の特ちょう","t":"<b><ruby>水銀<rt>すいぎん<\/rt><\/ruby><\/b>以外は20℃で<b>固体<\/b>。<b>電気や熱を伝えやすい<\/b>。細く引きのばしたり、たたいてうすく広げたりできる。つやがあり、みがくと光をよく<b>反射<\/b>する。"},{"h":"金属の色","t":"<b>銀白色<\/b>か<b>灰白色<\/b>のものが多いが、<b>金は黄金色<\/b>、<b>銅は赤かっ色<\/b>をしている。"},{"h":"金・銀・銅","t":"<b>金<\/b>：さびにくく変色しにくい。電子機器に使われる。<b>銀<\/b>：熱・電気を<b>最も<\/b>伝えやすく、光を最も反射しやすい（鏡）。<b>銅<\/b>：銀の次に熱を伝えやすく、なべなどに使われる。"},{"h":"鉄・アルミニウム・タングステン","t":"<b>鉄<\/b>：かたくて強く、建物や車の材料。磁石につく。炭素を混ぜて強くしたものが<b><ruby>鋼<rt>はがね<\/rt><\/ruby><\/b>。<b>アルミニウム<\/b>：とても軽くさびに強い。缶や1円硬貨。<b>タングステン<\/b>：最もとけにくく、電球のフィラメント。"},{"h":"合金","t":"2種類以上の金属を混ぜ合わせたものを<b>合金<\/b>という。<b>ニクロム<\/b>（ニッケル＋クロム、電熱線）、<b>真ちゅう<\/b>（銅＋<ruby>亜鉛<rt>あえん<\/rt><\/ruby>、5円硬貨）、<b>ステンレス<\/b>（鉄＋ニッケル・クロム、さびにくい）。"},{"h":"伝導","t":"温度の高い方から低い方へ、物の中を順に熱が伝わることを<b><ruby>伝導<rt>でんどう<\/rt><\/ruby><\/b>という。金属の棒を熱すると、ほのおに<b>近い順<\/b>にろうがとける（棒をかたむけても同じ）。"},{"h":"金属の板のあたたまり方","t":"板の1点を熱すると、熱はその点を中心に<b>円をえがくように<\/b>広がる。熱した点から<b>同じきょり<\/b>のところは同時にあたたまる。切れこみがあると遠回りになる。"},{"h":"伝わりやすさの順","t":"熱の伝わりやすさは<b>銅＞アルミニウム＞鉄<\/b>。なべややかんは、加熱するところは金属、持つところは熱を伝えにくいプラスチック。"},{"h":"金属の体積と温度","t":"金属も熱すると<b>体積が大きく<\/b>なり、冷やすと小さくなる。<b>重さは変わらない<\/b>。金属球が輪を通らなくても、<b>輪を熱すれば<\/b>穴が大きくなって通る。"},{"h":"のびやすさの順","t":"熱したときののびやすさは<b>アルミニウム＞銅＞鉄<\/b>。変化の大きさは空気に比べるととても小さい。"},{"h":"対流と伝導のちがい","t":"空気や水は、あたためられたものが動いて全体があたたまる<b>対流<\/b>。金属は、物の中を熱が順に伝わる<b>伝導<\/b>であたたまる。"}],"trivia":["使われなくなったスマートフォンなどには金・銀・銅がたくさんふくまれていて「都市鉱山」とよばれるよ。東京2020オリンピックのメダルは、この都市鉱山の金属から作られたんだ。","電球のフィラメントに使われるタングステンは、3000℃をこえないととけない！鉄がとける温度（1538℃）の2倍くらいだよ。","金属の板にぎりぎり入らない穴をあけ、板を熱して穴を広げてから棒をさしこみ、冷やしてぬけなくする技を「焼き<ruby>嵌<rt>ば<\/rt><\/ruby>め」というよ。電車の車輪や歯車づくりに使われているんだ。"],"questions":[{"t":"choice","lv":1,"q":"金属の中で、最も熱や電気を伝えやすい金属はどれ？","c":["銀","鉄","金","アルミニウム"],"e":"最も熱や電気を伝えやすいのは銀、2番目は銅。銀は光の反射率も高く、鏡などにも使われるよ。"},{"t":"choice","lv":1,"q":"2種類以上の金属を混ぜ合わせた金属を何という？","c":["合金","純金","レアメタル","ベースメタル"],"e":"合金には、ニッケルとクロムを混ぜたニクロムや、銅と亜鉛を混ぜた真ちゅうなどがある。"},{"t":"choice","lv":1,"q":"かたくて強いため、建物の材料などに利用される金属はどれ？","c":["鉄","アルミニウム","金","水銀"],"e":"鉄はかたくて強く、建物や車の材料、ぬい針やクリップ、フライパンなどさまざまなところで使われている。"},{"t":"choice","lv":1,"q":"温度の高い方から低い方へ、物の中を順に伝わっていく熱の伝わり方を何という？","c":["<ruby>伝導<rt>でんどう<\/rt><\/ruby>","<ruby>対流<rt>たいりゅう<\/rt><\/ruby>","<ruby>蒸散<rt>じょうさん<\/rt><\/ruby>","<ruby>反射<rt>はんしゃ<\/rt><\/ruby>"],"e":"伝導は1つの物の中だけでなく、ふれ合っている2つの物の間でも起こる。空気や水が動いてあたたまるのは対流だよ。"},{"t":"choice","lv":1,"q":"鉄・銅・アルミニウムの中で、最も熱を伝えやすい金属はどれ？","c":["銅","鉄","アルミニウム"],"e":"熱の伝わりやすさは、銅＞アルミニウム＞鉄の順。銅はなべなどの調理器具にも使われているよ。"},{"t":"choice","lv":2,"q":"同じ大きさの正方形の銅板の左上のかどAを熱し、右下のかどBにろうをぬった。Bのろうが最も早くとけるのはどの板？","c":["切れこみのない、ふつうの正方形の板","下側から切れこみを入れた板","横から切れこみを入れた板","ななめに切れこみを入れてジグザグにした板"],"e":"熱は板の中を順に伝わるので、AからBまでの道のりが最も短い板が最も早い。切れこみがあると熱が遠回りしなければならないよ。"},{"t":"choice","lv":1,"q":"金属球が金属の輪をぎりぎり通らないとき、どうすれば通るようになる？","c":["金属の輪をあたためる","金属球をあたためる","金属球と輪の両方をあたためる","金属の輪を冷やす"],"e":"輪を熱してぼう張させると、穴が大きくなって球が通る。球をあたためると球が大きくなり、ますます通らなくなるよ。"},{"t":"tf","lv":1,"q":"金属を冷やすと、その重さは減る。","a":false,"e":"金属も空気や水と同じように、温度が変わって体積が変化しても重さは変わらない。"},{"t":"choice","lv":3,"q":"台の上に金属棒をのせ、右はしの下に針をはさみ、針にストローをさしておく（左はしは動かないようにする）。棒の真ん中を熱すると、正面から見てストローはどちら回りに回る？","c":["右回り（時計回り）","左回り（反時計回り）","回らない"],"e":"熱すると棒が右へのびる。棒の下の針は、上の部分だけ右へ動かされるので、ころがるように右回りに回転し、ストローも右回りに回る。"},{"t":"choice","lv":1,"q":"鉄・銅・アルミニウムの中で、熱したとき最ものびやすい金属はどれ？","c":["アルミニウム","鉄","銅"],"e":"同じように熱すると、アルミニウム＞銅＞鉄の順にのびやすい。熱の伝わりやすさの順（銅＞アルミニウム＞鉄）とはちがうので注意！"},{"t":"choice","lv":2,"q":"金属の特ちょうとしてあてはまらないものはどれ？","c":["すべての金属は銀白色や灰白色をしている","電気や熱を伝えやすい","表面につやがあり、みがくと光をよく反射する","細く引きのばしたり、たたいてうすく広げたりできる"],"e":"銀白色や灰白色のものが多いが、金は黄金色、銅は赤かっ色をしている。「すべて」ではないね。"},{"t":"choice","lv":1,"q":"20℃で固体ではない（液体の）金属はどれ？","c":["<ruby>水銀<rt>すいぎん<\/rt><\/ruby>","鉄","銅","アルミニウム"],"e":"水銀は常温で液体の金属。昔は体温計などに使われていたが、人体や環境への影響から今はあまり使われない。"},{"t":"choice","lv":2,"q":"次のうち、合金であるものはどれ？","c":["ステンレス","鉄","銅","銀"],"e":"ステンレスは鉄にニッケルやクロムを混ぜた合金で、さびにくいので流し台やなべに使われる。鉄・銅・銀は1種類だけでできた金属だよ。"},{"t":"choice","lv":1,"q":"軽くてさびにくいため、飲み物の缶や1円玉に使われている金属はどれ？","c":["アルミニウム","鉄","銅","金"],"e":"アルミニウムはとても軽く、さびに強い金属。1円硬貨は1種類の金属（アルミニウム）だけでできているよ。"},{"t":"choice","lv":1,"q":"金属を熱すると、体積と重さはどうなる？","c":["体積は大きく、重さは変わらない","体積は大きく、重さも大きくなる","体積は小さく、重さも小さくなる","体積は小さく、重さは変わらない"],"e":"金属も熱するとぼう張して体積が大きくなるが、重さは変わらない。ただし、その変化はとても小さいよ。"},{"t":"choice","lv":2,"q":"さびにくく変色しにくいため、スマートフォンなどの電子機器に使われる金属はどれ？","c":["金","鉄","アルミニウム","タングステン"],"e":"金はさびにくく変色しにくく、電気もよく伝えるので、電子機器の部品に使われている。"},{"t":"choice","lv":1,"q":"最も熱に強く（とけにくく）、電気のエネルギーを光に変えやすいので、電球のフィラメントに使われる金属はどれ？","c":["タングステン","アルミニウム","銅","水銀"],"e":"タングステンは金属の中で最もとけ始める温度が高く、3000℃をこえる。だから高温になるフィラメントに向いているんだ。"},{"t":"choice","lv":2,"q":"ニッケルとクロムの合金で、電気を通すと熱をよく出すため、電気ストーブの電熱線に使われるものはどれ？","c":["ニクロム","ステンレス","真ちゅう","<ruby>鋼<rt>はがね<\/rt><\/ruby>"],"e":"ニクロムは電気を通すと熱をよく出す。ステンレスは鉄が中心の合金、真ちゅうは銅と亜鉛の合金だよ。"},{"t":"choice","lv":2,"q":"銅と<ruby>亜鉛<rt>あえん<\/rt><\/ruby>の合金で、黄金色に近い色をしており、5円硬貨に使われているものはどれ？","c":["真ちゅう（黄銅）","ステンレス","ニクロム","<ruby>鋼<rt>はがね<\/rt><\/ruby>"],"e":"真ちゅうは黄銅ともいい、アクセサリーや家具、5円硬貨などに使われている。"},{"t":"choice","lv":3,"q":"いろいろな金属について説明した文のうち、正しくないものはどれ？","c":["金属の中で最もとけ始める温度が低いのはタングステンである","金属の中で最も熱を伝えやすいのは銀で、2番目は銅である","鉄に炭素を混ぜて強くしたものを鋼という","1円硬貨に使われているアルミニウムはとても軽い金属である"],"e":"タングステンは反対に、金属の中で最もとけ始める温度が高い。だから電球のフィラメントに使われているんだ。"},{"t":"tf","lv":2,"q":"金属の棒をななめにかたむけて真ん中を熱すると、熱したところより上の方にあるろうだけが先にとけていく。","a":false,"e":"金属の熱は伝導で伝わるので、上下に関係なく、ほのおに近いところから順にろうがとける。上に動くのは空気や水の対流の特ちょうだよ。"},{"t":"choice","lv":2,"q":"ろうをぬった銅板の真ん中あたりの1点を熱すると、ろうはどのようにとけていく？","c":["熱した点を中心に、円が広がるようにとける","熱した点より上の方だけとける","板のふちから内側に向かってとける","熱した点の真横の方向だけにとける"],"e":"熱は熱した点から四方八方に同じように伝わる。熱した点から同じきょりのところは、同時にろうがとけるよ。"},{"t":"order","lv":2,"q":"同じ太さ・長さの銅・アルミニウム・鉄の棒の同じ位置に、ろうでマッチをつけて同じように熱した。マッチがたおれるのが早い順にならべよう","c":["銅","アルミニウム","鉄"],"e":"熱の伝わりやすさは銅＞アルミニウム＞鉄。熱が早く伝わる棒ほど、ろうが早くとけてマッチがたおれる。"},{"t":"choice","lv":2,"q":"金属球が輪Aは通り、輪Bは通らなかった。金属球が両方の輪を通るようにするには、何を熱すればよい？","c":["輪B","輪A","金属球"],"e":"輪Bを熱すると輪がぼう張して穴が大きくなり、球が通るようになる。球を熱すると、球が大きくなってしまうよ。"},{"t":"choice","lv":3,"q":"金属球が輪Aも輪Bも通る状態から、あることをしたら、金属球はどちらの輪も通らなくなった。何をした？","c":["金属球を熱した","輪Aを熱した","輪Bを熱した","金属球を冷やした"],"e":"金属球を熱すると球の体積が大きくなるので、どちらの輪も通らなくなる。輪を熱すると穴が大きくなるので通りやすくなるよ。"},{"t":"order","lv":3,"q":"金属の板Aにあけた穴に、金属の棒Bを取れないようにはめこむ「焼き<ruby>嵌<rt>ば<\/rt><\/ruby>め」の手順を順にならべよう","c":["棒Bがぎりぎり入らない大きさの穴を板Aにあける","板Aを加熱して、穴を大きくする","大きくなった穴に棒Bをさしこむ","板Aを冷やして、穴を元の大きさにもどす"],"e":"熱すると穴が大きくなり、冷やすと元にもどってしっかりしめつける。金属球ぼう張試験器で、すばやく実験しないと球が輪にはまって取れなくなる失敗を利用したものだよ。"},{"t":"tf","lv":3,"q":"同じ大きさの氷を、銅板・アルミニウム板・鉄板の上にのせると、鉄板の上の氷が最も早くとける。","a":false,"e":"熱を伝えやすい板ほど、まわりの熱を早く氷に伝える。銅板→アルミニウム板→鉄板の順にとけるので、最も早いのは銅板だよ。"},{"t":"choice","lv":2,"q":"なべややかんの持つところに、プラスチックが使われているのはなぜ？","c":["熱を伝えにくく、熱くならないから","熱を伝えやすく、早くあたたまるから","電気をよく通すから","みがくと光をよく反射するから"],"e":"加熱するところは熱を伝えやすい金属、持つところは熱を伝えにくいプラスチック。性質のちがいをうまく使い分けているね。"},{"t":"choice","lv":2,"q":"金属と水のあたたまり方のちがいとして正しいものはどれ？","c":["金属は伝導、水は対流であたたまる","金属は対流、水は伝導であたたまる","どちらも対流であたたまる","どちらも伝導であたたまる"],"e":"水はあたためられた部分が上に動いて入れかわる対流、金属は物そのものは動かず熱だけが順に伝わる伝導だよ。"},{"t":"choice","lv":2,"q":"銅の色はどれ？","c":["赤かっ色","黄金色","銀白色","青色"],"e":"多くの金属は銀白色や灰白色だが、銅は赤かっ色、金は黄金色をしている。"},{"t":"choice","lv":3,"q":"日本の硬貨のうち、1種類の金属だけでできているのはどれ？","c":["1円硬貨","5円硬貨","10円硬貨","100円硬貨"],"e":"1円硬貨はアルミニウムだけでできている。それ以外の硬貨は、銅にほかの金属を混ぜ合わせた合金だよ。"},{"t":"choice","lv":2,"q":"鉄に炭素を混ぜて、かたく強くしたものを何という？","c":["<ruby>鋼<rt>はがね<\/rt><\/ruby>","ステンレス","真ちゅう","ニクロム"],"e":"鉄に炭素を混ぜると鋼になる。鉄は磁石に引きつけられる性質もあるよ。"},{"t":"tf","lv":2,"q":"金属の棒の真ん中を熱すると、熱は両はしに向かって同じように伝わっていく。","a":true,"e":"伝導では、熱したところから温度の低い方へ順に熱が伝わる。真ん中を熱すれば、左右どちらのはしにも同じように伝わるよ。"},{"t":"choice","lv":3,"q":"ヒトのからだで、血液の成分になっている金属はどれ？","c":["鉄","水銀","<ruby>鉛<rt>なまり<\/rt><\/ruby>","タングステン"],"e":"鉄は血液の成分、カルシウムは骨や歯の成分になる。水銀・鉛・カドミウムは、からだに有害な影響のある金属だよ。"}]},{"id":"summer","title":"夏の<ruby>生物<rt>せいぶつ<\/rt><\/ruby>","yomi":"なつのせいぶつ","emoji":"🌻","source":"上 第16回","points":[{"h":"夏になると","t":"1年で昼がいちばん長い<b><ruby>夏至<rt>げし<\/rt><\/ruby><\/b>は<b>6月<\/b>。最高になる月は<b>太陽高度＝6月 → 地温＝7月 → 気温＝8月<\/b>の順におくれてやってくる。"},{"h":"昼の長さと花","t":"<b>アサガオ・イネ・ダイズ<\/b>は、昼が短くなっていくのを感じて花芽をつくる（<ruby>短日植物<rt>たんじつしょくぶつ<\/rt><\/ruby>）。<b>ヒマワリ・キュウリ・トマト<\/b>は昼の長さに関係なくさく。"},{"h":"さく時刻","t":"<b>ツユクサ・アサガオ<\/b>は早朝にさき、アサガオは数時間でしぼむ。<b>オシロイバナ<\/b>は夕方にさいて翌日の昼までにしぼむ。<b>オオマツヨイグサ<\/b>は夜にさく。"},{"h":"野原の植物","t":"ツユクサは青い花（花びら3枚）。<b>ヒルガオ・ヤブガラシ<\/b>はほかの植物などにつるを巻きつけてのびる<b>つる性<\/b>の植物。"},{"h":"お花とめ花","t":"<b>ヘチマ<\/b>（ウリのなかま）と<b>トウモロコシ<\/b>はお花とめ花をさかせる。実になる<b><ruby>子房<rt>しぼう<\/rt><\/ruby><\/b>はめ花にある。トウモロコシは<b>くきの先にお花<\/b>、ひげは<b>めしべ<\/b>。"},{"h":"花びらのない花","t":"<b>イネ<\/b>は花びらがなく、<b>えい<\/b>がおしべとめしべを包む。1つの穂に<b>約80個<\/b>の花があり、午前9時ごろ穂の上からさく。トウモロコシも花びらがない。"},{"h":"いろいろな花のつくり","t":"<b>ヒマワリ<\/b>は小さい花がたくさん集まって1つの花に見える（外側からさく）。<b>ナス・トマト・ピーマン・ジャガイモ<\/b>はナス科で花のつくりが似ている。"},{"h":"樹木と実","t":"<b>アジサイ<\/b>は大きな<b>がく<\/b>が目立つ。<b>ネムノキ<\/b>は夜に葉を閉じる。<b>イチョウ（ギンナン）・クヌギやコナラ（ドングリ）<\/b>の実は秋に熟す。"},{"h":"花に来る<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>","t":"チョウ・ガ・ハチのなかまは<b>花のみつや花粉<\/b>を食べに来る。<b>カマキリ<\/b>は花に来る昆虫を食べるために待ちぶせる。"},{"h":"<ruby>樹液<rt>じゅえき<\/rt><\/ruby>に集まる昆虫","t":"クヌギ・コナラの樹液は糖分が多い。<b>昼<\/b>：オオムラサキ・カナブン・スズメバチ。<b>夜<\/b>：カブトムシ・クワガタ。"},{"h":"水辺の昆虫とセミ","t":"<b>ヤゴ<\/b>（トンボの幼虫）、<b>ホタルの幼虫<\/b>（カワニナを食べる）、日本最大級の<b>タガメ<\/b>。セミは<b>おすだけ<\/b>がめすを呼ぶために鳴く。"},{"h":"いろいろな動物","t":"潮だまりに<b>ヤドカリ・カニ<\/b>（<ruby>節足<rt>せっそく<\/rt><\/ruby>動物）。大きな<b>アユ<\/b>はなわばりをもつ。<b>ヒキガエル<\/b>は昼はじっとして夜に活動。<b>ツバメ<\/b>は秋に南の国へわたる。"}],"trivia":["アジサイの花の色は土の性質で変わるよ。土が<b>酸性<\/b>だと<b>青<\/b>、<b>アルカリ性<\/b>だと<b>赤<\/b>っぽくなるんだ。雨は酸性なので、雨の多い年は青い花になりやすいんだって。","夜にさく花（オオマツヨイグサ・カラスウリなど）は、においが強くてうすい色のものが多いよ。暗くても<b>スズメガ<\/b>などの夜の昆虫に見つけてもらい、花粉を運んでもらうためなんだ。","アブラゼミは卵で約10か月、土の中の幼虫で約<b>5年<\/b>もすごすのに、成虫として地上で生きるのは約<b>1か月<\/b>だけなんだよ。"],"questions":[{"t":"choice","lv":1,"q":"1年のうちで昼がいちばん長くなる「<ruby>夏至<rt>げし<\/rt><\/ruby>」は何月？","c":["6月","5月","7月","8月"],"e":"夏至は6月。このころ太陽がいちばん高くのぼるので、昼がいちばん長くなるよ。"},{"t":"order","lv":2,"q":"1年のうちで最高になる月が早いものから順にならべよう","c":["太陽高度（太陽の高さ）","地温（地面の温度）","気温（空気の温度）"],"e":"太陽高度は6月、地温は7月、気温は8月に最高になる。太陽が地面をあたため、その地面が空気をあたためるので、少しずつおくれるんだ。"},{"t":"choice","lv":2,"q":"昼の長さが短くなっていくのを感じとって、花芽をつくりはじめる植物はどれ？","c":["アサガオ","ヒマワリ","トマト","キュウリ"],"e":"アサガオ・イネ・ダイズは、夏至をすぎて昼が短くなっていくと花芽をつくる。ヒマワリ・トマト・キュウリは昼の長さに関係なく花をさかせるよ。"},{"t":"tf","lv":3,"q":"ヒマワリは、昼の長さが短くなっていくのを感じとって花をさかせる植物である。","a":false,"e":"ヒマワリは昼の長さに関係なくさく植物。昼が短くなるのを感じてさくのはアサガオ・イネ・ダイズだよ。"},{"t":"choice","lv":1,"q":"夜になってから花をさかせる植物はどれ？","c":["オオマツヨイグサ","ツユクサ","アサガオ","シロツメクサ"],"e":"オオマツヨイグサは夜に黄色い花をさかせる。ツユクサとアサガオは早朝にさくよ。"},{"t":"choice","lv":1,"q":"夏の野原で、朝に青い花をさかせ、その日のうちにしぼんでしまう植物はどれ？","c":["ツユクサ","ヒメジョオン","ドクダミ","カタバミ"],"e":"ツユクサは花びらが3枚の青い花。朝さいて、その日のうちにしぼむよ。カタバミは黄色、ヒメジョオンやドクダミは白い花だね。"},{"t":"choice","lv":1,"q":"ヒルガオやヤブガラシなどの植物には、どんなとくちょうがある？","c":["ほかの植物などにつるを巻きつけてのびる","日あたりの悪い木かげだけで花をさかせる","太い幹をのばして大きな木になる","夏の間は地下の球根ですごす"],"e":"ヒルガオ・ヤブガラシは「つる性」の植物。ほかのものに巻きついて、日光の当たる高いところへのびていくよ。"},{"t":"choice","lv":1,"q":"花がさいてから、その日のうちや次の日までに花がしぼんでしまう植物はどれ？","c":["アサガオ","アジサイ","トマト","ヒマワリ"],"e":"アサガオは早朝にさいて数時間でしぼむ。オシロイバナも夕方にさいて次の日の昼までにしぼむよ。"},{"t":"order","lv":2,"q":"1日のうちで花がさく時刻が早いものから順にならべよう","c":["アサガオ","イネ","オシロイバナ","オオマツヨイグサ"],"e":"アサガオは早朝、イネは午前9時ごろ、オシロイバナは夕方、オオマツヨイグサは夜にさくよ。"},{"t":"choice","lv":1,"q":"お花とめ花の2種類の花をさかせる植物はどれ？","c":["ヘチマ","オオマツヨイグサ","オシロイバナ","オオバコ"],"e":"ヘチマやカボチャ・キュウリなどウリのなかまは、お花とめ花をさかせる。トウモロコシもお花とめ花があるよ。"},{"t":"choice","lv":2,"q":"ヘチマで、成長して実になる「<ruby>子房<rt>しぼう<\/rt><\/ruby>」があるのはどこ？","c":["め花","お花","お花とめ花の両方","巻きひげ"],"e":"め花の花びらの下には、ふくらんだ子房がある。受粉すると子房が育って実になるよ。お花はおしべで花粉をつくる。"},{"t":"choice","lv":1,"q":"花びらのない花をさかせる植物はどれ？","c":["イネ","アサガオ","ヘチマ","シロツメクサ"],"e":"イネの花には花びらがなく、かわりに「えい」がおしべとめしべを包んでいる。トウモロコシの花にも花びらはないよ。"},{"t":"choice","lv":2,"q":"イネの花で、花びらのかわりにおしべやめしべを包んでいるつくりを何という？","c":["えい","がく","子房","巻きひげ"],"e":"イネの花は外えいと内えいに包まれ、その中におしべとめしべがある。午前9時ごろ、穂の上のほうからさくよ。"},{"t":"choice","lv":2,"q":"トウモロコシの花について正しいものはどれ？","c":["くきのいちばん上の先にお花がさく","くきのいちばん上の先にめ花がさく","大きな花びらのある花がさく","お花とめ花の区別がない"],"e":"トウモロコシは、くきの先にお花（花粉をとばす）、下のほうの葉のつけ根にめ花（食べる部分になる）がさく。花びらはないよ。"},{"t":"tf","lv":3,"q":"トウモロコシの実の先についている「ひげ」は、めしべである。","a":true,"e":"め花からのびている糸のようなものは、めしべ（の花柱）。お花からとんできた花粉を受けとるよ。"},{"t":"choice","lv":2,"q":"ヒマワリの花のつくりとして正しいものはどれ？","c":["小さい花がたくさん集まって、1つの花のように見える","1つの大きな花に花びらが5枚ある","お花とめ花が別々にさく","花びらがなく、えいがある"],"e":"ヒマワリは、外側の目立つ花びらをつける花と、内側の種子をつくる花が集まったもの。外側からじゅんにさくよ。"},{"t":"choice","lv":1,"q":"夏に実をつける野菜ではないものはどれ？","c":["キャベツ","ナス","キュウリ","トマト"],"e":"ナス・キュウリ・トマトは夏野菜。キャベツは葉を食べる野菜で、夏に実をつける野菜ではないよ。"},{"t":"choice","lv":1,"q":"イチョウの実を何という？","c":["ギンナン","ドングリ","枝豆","クリ"],"e":"イチョウの実はギンナン。クヌギやコナラの実（ドングリ）と同じく、秋に熟すよ。"},{"t":"choice","lv":1,"q":"ドングリとよばれる実をつける植物はどれ？","c":["コナラ","イチョウ","サクラ","イロハカエデ"],"e":"ドングリをつくるのはコナラやクヌギ、シイ、カシなど。サクラの実は夏に熟すよ。"},{"t":"choice","lv":2,"q":"アジサイで、花びらのように大きく目立っている部分は何？","c":["がく","花びら","子房","おしべ"],"e":"アジサイは、大きな「がく」が花びらのように目立っているんだ。梅雨のころにさくよ。"},{"t":"choice","lv":1,"q":"花に来る<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>をえさにするために、花のそばで待ちかまえている昆虫はどれ？","c":["カマキリ","アゲハ","ミツバチ","カブトムシ"],"e":"カマキリは花をおとずれた昆虫をとらえて食べる。アゲハやミツバチは花のみつや花粉を食べに来る昆虫だよ。"},{"t":"choice","lv":2,"q":"幼虫も成虫もほかの動物を食べる、肉食の<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>はどれ？","c":["トンボ","アゲハ","セミ","クワガタ"],"e":"トンボは幼虫（ヤゴ）も成虫も肉食。アゲハは花のみつ、セミは木のしる、クワガタは樹液をえさにするよ。"},{"t":"choice","lv":2,"q":"クヌギやコナラの<ruby>樹液<rt>じゅえき<\/rt><\/ruby>に、主に夜に集まる<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>はどれ？","c":["カブトムシ","オオムラサキ","スズメバチ","カナブン"],"e":"夜に集まるのはカブトムシやクワガタ。オオムラサキ・スズメバチ・カナブンは主に昼に集まるよ。"},{"t":"choice","lv":2,"q":"昼間にクヌギやコナラの<ruby>樹液<rt>じゅえき<\/rt><\/ruby>に集まるチョウはどれ？","c":["オオムラサキ","モンシロチョウ","アオスジアゲハ","カラスアゲハ"],"e":"オオムラサキは樹液を吸いに来るチョウ。アオスジアゲハやカラスアゲハはヤブガラシなどの花に、モンシロチョウは白や黄色の目立つ花に集まるよ。"},{"t":"choice","lv":1,"q":"水中で生活する日本最大級の<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>で、水中の動物をえさにするのはどれ？","c":["タガメ","アメンボ","ゲンゴロウ","ヤゴ"],"e":"タガメは肉食の昆虫で、成虫は体長5〜6cmにもなる。アメンボは水面、ゲンゴロウは水中で生活する昆虫だよ。"},{"t":"choice","lv":1,"q":"セミが鳴くのはどうして？","c":["おすがめすを呼ぶため","めすがおすを呼ぶため","おすとめすの両方が、なかまに危険を知らせるため"],"e":"鳴くのはおすだけ。おすは腹をさかんに動かして鳴き、めすを呼びよせるよ。めすは鳴かない。"},{"t":"choice","lv":1,"q":"「ジージー…」と鳴くセミはどれ？","c":["アブラゼミ","ミンミンゼミ","ヒグラシ","ツクツクボウシ"],"e":"ミンミンゼミは「ミーンミンミン」、ヒグラシは「カナカナカナ」、ツクツクボウシは「オーシツクツク」と鳴くよ。"},{"t":"order","lv":3,"q":"アブラゼミの一生を順にならべよう","c":["成虫のめすが木の幹に卵をうむ","卵からかえった幼虫が地面に落ち、穴をほってもぐる","幼虫が土の中で5年ほどすごす","幼虫が木の幹をのぼって羽化し、成虫になる"],"e":"卵で約10か月（次の年にふ化）、幼虫で約5年、成虫で約1か月。成虫の期間はとても短いんだ。"},{"t":"choice","lv":1,"q":"潮だまりや砂浜で見られるヤドカリやカニのように、あしに節をもつ動物を何という？","c":["節足動物","軟体動物","両生類","は虫類"],"e":"あしに節があり、かたいからをもつ動物を節足動物という。昆虫やクモ、ムカデもなかまだよ。"},{"t":"choice","lv":2,"q":"夏の昼間、ヒキガエルはふつうどうしている？","c":["雑木林の中でじっとしている","えさを探して動き回っている","池の底でじっとしている"],"e":"ヒキガエルは体がかわきにくい夜に活動し、昼はじっとしている。親は主に肺で呼吸するので、池の底ではくらせないよ。"},{"t":"choice","lv":2,"q":"夏には見られないようすはどれ？","c":["ハクチョウが北の国からやってくる","潮だまりでヤドカリが見られる","ツバメの子が飛び方やえさのとり方を練習している","アユがなわばりをつくってコケを食べている"],"e":"ハクチョウは秋に北の国からやってくる冬鳥。夏には見られないよ。"},{"t":"tf","lv":2,"q":"ツバメは春に日本でふ化して成長し、秋になると南の国へわたっていく。","a":true,"e":"ツバメは夏鳥。夏の間に子は飛び方やえさのとり方を練習して、秋に南の国へわたるよ。"},{"t":"choice","lv":3,"q":"アジサイの花の色は、何によって決まる？","c":["生えている場所の土の性質（酸性かアルカリ性か）","花がさく時刻","株の大きさ","花にやってくる昆虫の種類"],"e":"土が酸性だと青、アルカリ性だと赤っぽい花になる。雨は酸性なので、雨の多い年は土が酸性になり、青い花になりやすいよ。"},{"t":"choice","lv":3,"q":"夜にさく花に多いとくちょうはどれ？","c":["においが強く、うすい色のものが多い","においがなく、こい赤色のものが多い","花びらがなく、風で花粉を運ぶ","昼の間だけ花粉をつくる"],"e":"暗い夜でも見つけてもらえるように、においが強くうすい色の花が多い。スズメガなど夜に活動する昆虫を呼んで花粉を運んでもらうよ。"},{"t":"choice","lv":3,"q":"ふみつけに強く、人がよく通る道ばたでも育つ植物はどれ？","c":["オオバコ","ドクダミ","ヒルガオ","ヤブガラシ"],"e":"オオバコやタンポポ、カタバミはふみつけに強い。ドクダミは日かげに生え、ヒルガオやヤブガラシはほかの植物に巻きついて日光をうばい合うよ。"}]},{"id":"stars","title":"<ruby>星座<rt>せいざ<\/rt><\/ruby>をつくる星","yomi":"せいざをつくるほし","emoji":"⭐","source":"上 第17回","points":[{"h":"星座をつくる星","t":"夜空の星は自ら光りかがやく<b><ruby>恒星<rt>こうせい<\/rt><\/ruby><\/b>。昼間も空にあるが、太陽が明るすぎて見えない。星座は全部で<b>88<\/b>。日本（東京付近）では約60見られる。"},{"h":"星の明るさ","t":"明るさは<b>等級<\/b>で表す。<b>1等星は6等星の100倍<\/b>明るい（1等級ちがうと約2.5倍）。6等星は肉眼でやっと見える明るさ。"},{"h":"星の色と温度","t":"星の色は<b>表面温度<\/b>で決まる。温度が高い順に<b>青白 → 白 → 黄 → オレンジ → 赤<\/b>。"},{"h":"色ごとの代表の星","t":"青白：<b>リゲル・スピカ<\/b>／白：シリウス・デネブ・アルタイル／黄：カペラ・太陽／オレンジ：アルデバラン・アルクトゥルス／赤：<b>ベテルギウス・アンタレス<\/b>"},{"h":"見かけの間かく","t":"星と星の本当の距離は見た目ではわからない。見かけの間かくは<b>角度<\/b>で表す。"},{"h":"春の星座","t":"北の空に<b><ruby>北斗七星<rt>ほくとしちせい<\/rt><\/ruby>（おおぐま座）<\/b>。天頂付近にアルクトゥルス（うしかい座）。南の空に<b>スピカ（おとめ座）<\/b>、レグルス（しし座）。"},{"h":"夏の星座","t":"<b>デネブ（はくちょう座）・ベガ（こと座／おりひめ星）・アルタイル（わし座／ひこ星）<\/b>で<b>夏の大三角<\/b>。南の低い空に赤い<b>アンタレス（さそり座）<\/b>。天の川は無数の星の集まり。"},{"h":"秋の星座","t":"北の空に<b>カシオペヤ座<\/b>。天頂付近にペガスス座・アンドロメダ座。南の低い空にフォーマルハウト（みなみのうお座）。"},{"h":"冬の星座","t":"<b>ベテルギウス（オリオン座）・シリウス（おおいぬ座）・プロキオン（こいぬ座）<\/b>で<b>冬の大三角<\/b>。<b>シリウス<\/b>は星座をつくる星の中でいちばん明るい。"},{"h":"<ruby>星座早見<rt>せいざはやみ<\/rt><\/ruby>のつくり","t":"下の大きいばん＝<b>星座ばん<\/b>（日付・時計回り）、上の小さいばん＝<b>地平ばん<\/b>（時刻・反時計回り）。中心のピンは<b>北極星<\/b>、窓わくが地平線。"},{"h":"星座早見の使い方","t":"観測する方位を<b>下<\/b>にして持ち、<b>頭上にかかげる<\/b>。頭上で使うので、方位は地図と<b>東西が逆<\/b>。"},{"h":"星座早見にない星","t":"<b><ruby>惑星<rt>わくせい<\/rt><\/ruby><\/b>（水星・金星・火星・木星・土星など）や太陽・月・すい星は、星座の中を動くので星座早見にはのっていない。"}],"trivia":["オーストラリアでは、日本で冬の星座のオリオン座が<b>夏<\/b>によく見えるよ。南半球では季節が逆で、しかもベテルギウスとリゲルの上下もさかさまに見えるんだ。","おうし座の<b>すばる（プレアデス星団）<\/b>は100個以上の星の集まり。肉眼でも5〜7個見えて、日本では平安時代から記録があるよ。「六連星（むつらぼし）」ともよばれるんだ。","天の川は、わたしたちの住む<b>天の川銀河<\/b>を内側から見たすがた。たくさんの星が帯のように重なって見えているんだよ。"],"questions":[{"t":"choice","lv":1,"q":"<ruby>星座<rt>せいざ<\/rt><\/ruby>は全部でいくつある？","c":["88","20","50","108"],"e":"星座は全部で88。そのうち日本（東京付近）で見ることができるのは約60だよ。"},{"t":"choice","lv":1,"q":"星座をつくる星のように、自ら光りかがやいている星を何という？","c":["恒星","惑星","衛星","すい星"],"e":"星座をつくる星は、太陽と同じく自分で光を出す恒星。惑星（金星や火星など）は太陽の光を反射して光っているよ。"},{"t":"tf","lv":2,"q":"星座をつくる星は、昼間は空からなくなっている。","a":false,"e":"昼間も星は空にある。でも太陽がとても明るいので、星の光が見えないだけなんだ。"},{"t":"choice","lv":1,"q":"1等星の明るさは、6等星の明るさの何倍？","c":["100倍","2.5倍","6倍","20倍"],"e":"1等星は、肉眼でやっと見える6等星の100倍の明るさ。5等級のちがいで100倍になるよ。"},{"t":"choice","lv":3,"q":"星の等級が1等級ちがうと、明るさはおよそ何倍ちがう？","c":["約2.5倍","約6倍","約10倍","約20倍"],"e":"1等星と6等星は5等級ちがいで100倍。2.5×2.5×2.5×2.5×2.5 がほぼ100になるので、1等級ではおよそ2.5倍だよ。"},{"t":"choice","lv":1,"q":"星の色のちがいは、何によって決まる？","c":["星の表面温度","地球からの距離","星の大きさ","星の重さ"],"e":"星の色は表面温度で決まる。温度が高いほど青白く、低いほど赤く見えるよ。"},{"t":"order","lv":2,"q":"星の色を、表面温度が高いものから順にならべよう","c":["青白","白","黄","オレンジ","赤"],"e":"表面温度が高い星ほど青白く、低い星ほど赤く見える。太陽は黄色の星だよ。"},{"t":"order","lv":3,"q":"次の1等星を、表面温度が高いものから順にならべよう","c":["スピカ","シリウス","カペラ","アルデバラン","アンタレス"],"e":"スピカは青白、シリウスは白、カペラは黄、アルデバランはオレンジ、アンタレスは赤。色の順番と同じになるよ。"},{"t":"choice","lv":2,"q":"表面温度が高く、青白い色に見える1等星はどれ？","c":["スピカ","カペラ","アルクトゥルス","アルデバラン"],"e":"おとめ座のスピカは青白い星。カペラは黄色、アルクトゥルスとアルデバランはオレンジ色に見えるよ。"},{"t":"choice","lv":2,"q":"赤く見える1等星の組み合わせはどれ？","c":["ベテルギウスとアンタレス","リゲルとスピカ","シリウスとデネブ","カペラとアルタイル"],"e":"オリオン座のベテルギウスとさそり座のアンタレスは、表面温度が低い赤い星。リゲルとスピカは青白い星だよ。"},{"t":"choice","lv":1,"q":"オリオン座にある1等星で、赤く見える星はどれ？","c":["ベテルギウス","リゲル","シリウス","プロキオン"],"e":"オリオン座には1等星が2つ。左上の赤いベテルギウスと、右下の青白いリゲルだよ。"},{"t":"choice","lv":2,"q":"星と星の見かけの間かくは、何で表す？","c":["角度","距離（km）","等級","表面温度"],"e":"星までの本当の距離は見た目ではわからない。だから見かけの間かくは、見た目の角度で表すよ。"},{"t":"choice","lv":1,"q":"<ruby>北斗七星<rt>ほくとしちせい<\/rt><\/ruby>は何座の一部？","c":["おおぐま座","こぐま座","おおいぬ座","こいぬ座"],"e":"北斗七星はおおぐま座の一部。北極星はこぐま座の星だよ。まちがえやすいので注意！"},{"t":"choice","lv":2,"q":"春の南の空に見える1等星レグルスをもつ星座はどれ？","c":["しし座","おとめ座","うしかい座","おおぐま座"],"e":"春の南の空には、しし座のレグルスとおとめ座のスピカが見える。北の空には北斗七星（おおぐま座）だよ。"},{"t":"choice","lv":1,"q":"デネブは何座の1等星？","c":["はくちょう座","こと座","わし座","さそり座"],"e":"デネブははくちょう座の1等星。夏の大三角の1つで、北の空のほうに見えるよ。"},{"t":"choice","lv":1,"q":"七夕の「おりひめ星」とよばれる星はどれ？","c":["ベガ","アルタイル","デネブ","スピカ"],"e":"おりひめ星はこと座のベガ。夏の夜、天頂付近で明るくかがやくよ。"},{"t":"choice","lv":1,"q":"七夕の「ひこ星」アルタイルは何座の星？","c":["わし座","こと座","はくちょう座","さそり座"],"e":"ひこ星のアルタイルはわし座の1等星。天の川をはさんでおりひめ星（こと座のベガ）と向かい合っているよ。"},{"t":"choice","lv":1,"q":"夏の大三角をつくる3つの1等星の組み合わせはどれ？","c":["デネブ・ベガ・アルタイル","ベテルギウス・シリウス・プロキオン","デネブ・ベガ・アンタレス","スピカ・アルクトゥルス・レグルス"],"e":"はくちょう座のデネブ、こと座のベガ、わし座のアルタイルで夏の大三角。ベテルギウス・シリウス・プロキオンは冬の大三角だよ。"},{"t":"choice","lv":1,"q":"夏の南の空の低いところに見える、さそり座の赤い1等星はどれ？","c":["アンタレス","ベテルギウス","アルデバラン","アルタイル"],"e":"さそり座のアンタレスは、さそりの心臓の位置で赤くかがやく。夏の南の空の低いところを通るよ。"},{"t":"tf","lv":1,"q":"天の川は、無数の星が集まったものである。","a":true,"e":"天の川は、ものすごくたくさんの星の集まり。夏の夜によく見えるよ。"},{"t":"choice","lv":1,"q":"秋の北の空によく見える星座はどれ？","c":["カシオペヤ座","ペガスス座","みなみのうお座","おとめ座"],"e":"秋の北の空にはカシオペヤ座。ペガスス座やアンドロメダ座は天頂付近、みなみのうお座は南の低い空に見えるよ。"},{"t":"choice","lv":1,"q":"冬の大三角をつくる3つの1等星の組み合わせはどれ？","c":["ベテルギウス・シリウス・プロキオン","リゲル・シリウス・プロキオン","ベテルギウス・リゲル・シリウス","デネブ・ベガ・アルタイル"],"e":"オリオン座のベテルギウス、おおいぬ座のシリウス、こいぬ座のプロキオンで冬の大三角。リゲルは入らないので注意！"},{"t":"choice","lv":1,"q":"星座をつくる星の中で、最も明るく見える星はどれ？","c":["シリウス","ベガ","ベテルギウス","北極星"],"e":"おおいぬ座のシリウスは、全天で最も明るい1等星。冬の大三角の1つだよ。北極星は2等星で、それほど明るくない。"},{"t":"choice","lv":2,"q":"プロキオンは何座の1等星？","c":["こいぬ座","おおいぬ座","オリオン座","ふたご座"],"e":"プロキオンはこいぬ座。シリウスがおおいぬ座だよ。「大きい犬＝いちばん明るいシリウス」と覚えよう。"},{"t":"choice","lv":3,"q":"冬の六角形をつくる星にふくまれないものはどれ？","c":["おとめ座のスピカ","おうし座のアルデバラン","ぎょしゃ座のカペラ","ふたご座のポルックス"],"e":"冬の六角形はプロキオン・シリウス・リゲル・アルデバラン・カペラ・ポルックスでつくる。スピカは春の星だよ。"},{"t":"choice","lv":3,"q":"おうし座にある星の集まりで、日本では平安時代から記録があり、肉眼で5〜7個の星が見えるものは？","c":["すばる（プレアデス星団）","天の川","北斗七星","冬の大三角"],"e":"すばるは100個以上の恒星の集まり。「六連星（むつらぼし）」ともよばれるよ。"},{"t":"choice","lv":2,"q":"南の空に夏の星座が見えているとき、東の空に見えはじめているのはどの季節の星座？","c":["秋","春","冬"],"e":"ある季節の星座が南に見えるとき、東の空には次の季節の星座がのぼりはじめ、西の空では前の季節の星座がしずもうとしているよ。"},{"t":"choice","lv":3,"q":"夕方、東の空からのぼってくるのはどの星座？","c":["その季節の星座","前の季節の星座","次の季節の星座","逆の季節の星座"],"e":"夕方は、その季節の星座が東からのぼり、南には前の季節、西には逆の季節の星座が見える。真夜中にはその季節の星座が南にくるよ。"},{"t":"choice","lv":1,"q":"<ruby>星座早見<rt>せいざはやみ<\/rt><\/ruby>の中心のピンは、どの星を表している？","c":["北極星","太陽","シリウス","ベガ"],"e":"星座早見は北極星を中心に回る。星空全体が北極星を中心に回って見えるからだよ。"},{"t":"choice","lv":2,"q":"<ruby>星座早見<rt>せいざはやみ<\/rt><\/ruby>の上の小さいばん（地平ばん）にかかれている目もりはどれ？","c":["時刻","日付","星の等級","星の温度"],"e":"上の地平ばんには時刻、下の大きい星座ばんには日付の目もりがある。時刻は反時計回り、日付は時計回りにならんでいるよ。"},{"t":"choice","lv":2,"q":"<ruby>星座早見<rt>せいざはやみ<\/rt><\/ruby>で東の空を観測するときは、どのように持つ？","c":["東の方位を下にして持ち、頭上にかかげる","東の方位を上にして持ち、頭上にかかげる","北を下にして持ち、足もとに置いて見る","西の方位を下にして持ち、胸の前で持つ"],"e":"星座早見は、観測する方位を下にして持ち、頭上にかかげて使う。北の空を見るときは北を下にするよ。"},{"t":"tf","lv":2,"q":"<ruby>星座早見<rt>せいざはやみ<\/rt><\/ruby>の方位は、地図と東西が逆になっている。","a":true,"e":"星座早見は頭上にかかげて空を見上げて使うので、実際の空と合うように東と西が地図と逆にかかれているよ。"},{"t":"choice","lv":3,"q":"<ruby>星座早見<rt>せいざはやみ<\/rt><\/ruby>を12月15日の20時に合わせた。これと同じ星空になるのはどれ？","c":["11月30日の21時","12月30日の21時","11月30日の19時","1月15日の22時"],"e":"星は同じ時刻に見ると1か月で30度（半月で15度）西へずれる。1時間では15度動くので、半月前なら1時間おそい時刻に同じ星空になるよ。"},{"t":"choice","lv":2,"q":"<ruby>星座早見<rt>せいざはやみ<\/rt><\/ruby>にのっていないものはどれ？","c":["金星","シリウス","北極星","プロキオン"],"e":"金星などの<ruby>惑星<rt>わくせい<\/rt><\/ruby>や月は、星座の中をふくざつに動いて位置が変わるので、星座早見にはのっていないよ。"},{"t":"choice","lv":3,"q":"オーストラリアの冬（8月ごろ）の夜空に、オリオン座が見られないのはなぜ？","c":["8月にはオリオン座が太陽と同じ方向にあるから","オーストラリアからはオリオン座が一年中見えないから","冬は雲が多く、星が見えないから","オリオン座は北極星の近くにしか見えないから"],"e":"オリオン座が夜に見えるのは1月ごろ（日本は冬、オーストラリアは夏）。8月は太陽と同じ方向にあるので、日本からもオーストラリアからも見えないよ。"}]},{"id":"starmove","title":"<ruby>星座<rt>せいざ<\/rt><\/ruby>の動き","yomi":"せいざのうごき","emoji":"🌌","source":"上 第18回","points":[{"h":"南の空の1日の動き","t":"星座は太陽と同じく<b>東から出て南の空を通り、西にしずむ<\/b>。地球が<b>西から東へ自転<\/b>しているから。"},{"h":"オリオン座の三つ星","t":"<b>真東から出て真西にしずむ<\/b>。出ている時間は約12時間。東の空では<b>たて<\/b>、南では<b>ななめ<\/b>、西の空では<b>横<\/b>にならぶ。"},{"h":"北の空の1日の動き","t":"<b>北極星<\/b>を中心に<b>反時計回り<\/b>に、<b>1時間で15度<\/b>ずつ動いて見える。地球が24時間で1回（360度）自転するから（360÷24＝15）。"},{"h":"北極星","t":"<b>こぐま座の2等星<\/b>。<ruby>地軸<rt>ちじく<\/rt><\/ruby>をのばした先にあるので、ほとんど動かず一年中ほぼ同じ位置に見える。"},{"h":"北極星の見つけ方","t":"<b><ruby>北斗七星<rt>ほくとしちせい<\/rt><\/ruby>（おおぐま座）<\/b>のひしゃくの先の2つの星の間かくを<b>約5倍<\/b>のばす。<b>カシオペヤ座<\/b>からも見つけられる。北斗七星とカシオペヤ座は北極星をはさんで約150度はなれている。"},{"h":"北と南で回る向き","t":"星はどちらも東から西へ動くが、見る人の向きが反対なので、写真では<b>北の空は反時計回り<\/b>、<b>南の空は時計回り<\/b>に見える。"},{"h":"1年の動き（南の空）","t":"<b>毎日同じ時刻<\/b>に見ると、星座は少しずつ<b>東から西へ<\/b>ずれていく。地球が太陽のまわりを1年かけて<b>公転<\/b>しているから。"},{"h":"1年の動き（北の空）","t":"同じ時刻に見ると、北極星を中心に<b>反時計回りに1か月で30度<\/b>（1日約1度）動いて見える（360÷12＝30）。半年で反対側、1年でもとの位置。"},{"h":"時刻と月の計算","t":"<b>1時間＝15度<\/b>、<b>1か月＝30度<\/b>。だから<b>1か月後に同じ位置に見たいなら2時間早く<\/b>見ればよい（30÷15＝2）。"},{"h":"<ruby>天頂<rt>てんちょう<\/rt><\/ruby>を通る星","t":"東京で天頂（真上）を通る星（夏のベガなど）は、北東から出て天頂を通り、<b>北西<\/b>へしずんでいく。"}],"trivia":["北の空にカメラを向けて長い時間シャッターを開けておくと、星が北極星を中心にした円の線になって写るよ。これを「スタートレイル」というんだ。","南半球のオーストラリアでは、オリオン座は北の空に見えるので、東→北→西と動き、日本とは反対の<b>反時計回り<\/b>に見えるんだって。","北極星は2等星で少し暗いけれど、北斗七星やカシオペヤ座を目じるしにすると、かんたんに見つけられるよ。"],"questions":[{"t":"choice","lv":1,"q":"南の空の星座を観測すると、時間とともにどのように動いて見える？","c":["東から西へ","西から東へ","北から南へ","南から北へ"],"e":"南の空の星座は、太陽と同じように東から出て、南の空を通り、西にしずんでいくよ。"},{"t":"choice","lv":1,"q":"南の空の星座が時間とともに東から西へ動いて見えるのはなぜ？","c":["地球が西から東へ自転しているから","地球が東から西へ自転しているから","地球が1日に1回公転しているから","太陽が自転しているから"],"e":"地球が1日かけて西から東へ自転しているので、地球から見ると星は反対に東から西へ動いて見えるんだ。"},{"t":"tf","lv":1,"q":"オリオン座の三つ星は、真東から出て真西にしずむ。","a":true,"e":"オリオン座の三つ星は真東から出て真西にしずむ。春分・秋分の日の太陽と同じ通り道だよ。"},{"t":"choice","lv":2,"q":"オリオン座の三つ星が地平線の上に出ている時間は、およそ何時間？","c":["約12時間","約6時間","約18時間","約24時間"],"e":"真東から出て真西にしずむ星は、1日のちょうど半分、約12時間地平線の上に出ているよ。"},{"t":"order","lv":2,"q":"オリオン座の三つ星が東からのぼって西にしずむまでの、ならび方の変化を順にならべよう","c":["三つ星がたてにならぶ","三つ星がななめにならぶ","三つ星が横にならぶ"],"e":"東の空ではたてにならんで右上へのぼり、南の空ではななめ、西の空では横にならんで右下へしずんでいくよ。"},{"t":"tf","lv":1,"q":"北の空の星は、北極星を中心に時計回りに動いて見える。","a":false,"e":"北の空の星は、北極星を中心に反時計回り（左回り）に動いて見えるよ。"},{"t":"choice","lv":1,"q":"北の空の星は、北極星を中心に1時間で何度ずつ動いて見える？","c":["15度","1度","30度","45度"],"e":"地球は24時間で1回（360度）自転するので、360÷24＝15で、1時間に15度動いて見えるよ。"},{"t":"choice","lv":2,"q":"北の空の<ruby>北斗七星<rt>ほくとしちせい<\/rt><\/ruby>やカシオペヤ座は、3時間でおよそ何度動いて見える？","c":["45度","15度","30度","90度"],"e":"1時間に15度なので、3時間では15×3＝45度。反時計回りに動くよ。"},{"t":"choice","lv":2,"q":"北の空の星が北極星を中心に1時間に15度ずつ動いて見えるのはなぜ？","c":["地球が24時間で1回（360度）自転しているから","地球が12か月で1回（360度）公転しているから","北極星が1時間に15度ずつ回っているから","月が地球のまわりを回っているから"],"e":"星の1日の動きの原因は地球の自転。1年の動きの原因は公転だよ。区別して覚えよう。"},{"t":"choice","lv":3,"q":"7月25日の20時に北の空で見えた星が、北極星を中心に反時計回りに90度動いた位置に見えるのはいつ？","c":["7月26日の午前2時","7月25日の22時","7月26日の午前4時","7月25日の18時"],"e":"1時間に15度なので、90÷15＝6時間後。7月25日20時の6時間後は、7月26日の午前2時だよ。"},{"t":"choice","lv":1,"q":"北の空で一年中ほぼ同じ位置に見える北極星は、何座の何等星？","c":["こぐま座の2等星","おおぐま座の1等星","こぐま座の1等星","カシオペヤ座の2等星"],"e":"北極星はこぐま座の2等星。北斗七星はおおぐま座の一部だよ。"},{"t":"choice","lv":2,"q":"北極星が、時間がたってもほとんど動かないように見えるのはなぜ？","c":["地球の地軸をのばした先にあるから","地球にいちばん近い星だから","夜空でいちばん明るい星だから","北極星だけは自分で光っていないから"],"e":"地球は<ruby>地軸<rt>ちじく<\/rt><\/ruby>を中心に自転している。北極星は地軸を北にのばした先にあるので、回転の中心になってほとんど動かないんだ。"},{"t":"choice","lv":1,"q":"北極星を見つけるときに目じるしにする、北の空の星の集まりや星座の組み合わせは？","c":["北斗七星とカシオペヤ座","オリオン座とさそり座","冬の大三角とすばる","しし座とおとめ座"],"e":"北斗七星（おおぐま座）とカシオペヤ座を使うと、2等星で少し暗い北極星もかんたんに見つけられるよ。"},{"t":"choice","lv":2,"q":"北極星は、<ruby>北斗七星<rt>ほくとしちせい<\/rt><\/ruby>のひしゃくの先にある2つの星の間かくを、約何倍のばしたところにある？","c":["約5倍","約2倍","約10倍","約100倍"],"e":"ひしゃくの先の2つの星を結んで、その間かくを約5倍のばした先に北極星があるよ。"},{"t":"order","lv":2,"q":"<ruby>北斗七星<rt>ほくとしちせい<\/rt><\/ruby>を使って北極星を見つける手順を順にならべよう","c":["北の空で北斗七星をさがす","ひしゃくの先にある2つの星を結ぶ","その線を、2つの星の間かくの約5倍のばす","のばした先にある2等星が北極星"],"e":"北斗七星のひしゃくの先の2つの星が「指し示す方向」に北極星がある。カシオペヤ座からも見つけられるよ。"},{"t":"choice","lv":3,"q":"カシオペヤ座は、北極星を中心に<ruby>北斗七星<rt>ほくとしちせい<\/rt><\/ruby>から反時計回りに150度はなれた位置にある。北斗七星が、今カシオペヤ座がある位置にくるのは何時間後？","c":["10時間後","5時間後","15時間後","150時間後"],"e":"北の空の星は反時計回りに1時間15度動く。150÷15＝10で、10時間後だよ。"},{"t":"choice","lv":2,"q":"北の空の星の動きと南の空の星の動きで、回る向きが反対に見えるのはなぜ？","c":["観測する人の向きが反対になり、左右が逆に見えるから","北の空の星と南の空の星は、本当に反対向きに動いているから","北の空は自転、南の空は公転によって動くから","北極星が南の空の星を反対に引っぱっているから"],"e":"どちらの星も東から西へ動いている。でも北を向くと東は右、南を向くと東は左になるので、北の空は反時計回り、南の空は時計回りに見えるんだ。"},{"t":"choice","lv":2,"q":"北の空にカメラを向け、長い時間シャッターを開けて写真をとると、星はどのように写る？","c":["北極星を中心とした円をえがくように写る","東から西へまっすぐな線になって写る","星は動かず、点のまま写る","北極星に向かって集まる線になって写る"],"e":"北の空の星は北極星を中心に回るので、円の一部のような線（スタートレイル）になって写る。北極星はほとんど動かないよ。"},{"t":"choice","lv":1,"q":"毎日同じ時刻にオリオン座を観測すると、オリオン座は少しずつどちらへ動いていく？","c":["西","東","南","北"],"e":"同じ時刻に見ると、星座は1日に約1度ずつ西へずれていく。だから季節によって見える星座が変わるんだ。"},{"t":"choice","lv":2,"q":"同じ時刻に見た星座の位置が、毎日少しずつ西へずれていくのはなぜ？","c":["地球が太陽のまわりを1年かけて公転しているから","地球が1日に1回自転しているから","星座が1年かけて地球のまわりを回っているから","太陽が自転しているから"],"e":"星の1年の動きの原因は、地球の公転。季節によって見える星座がちがうのも公転のせいだよ。"},{"t":"choice","lv":1,"q":"北の空の星を毎日同じ時刻に観察すると、北極星を中心に1か月で何度動いて見える？","c":["30度","15度","1度","60度"],"e":"地球は12か月で1回（360度）公転するので、360÷12＝30で1か月に30度。反時計回りだよ。"},{"t":"tf","lv":2,"q":"同じ時刻に観測すると、北の空の星は1日あたりおよそ1度ずつ動いた位置に見える。","a":true,"e":"1か月（約30日）で30度なので、1日ではおよそ1度。1年（約365日）でぐるっと360度回ってもとの位置にもどるよ。"},{"t":"choice","lv":2,"q":"毎日同じ時刻に<ruby>北斗七星<rt>ほくとしちせい<\/rt><\/ruby>を観測したとき、北極星をはさんでちょうど反対の位置にくるのは何か月後？","c":["6か月後","3か月後","9か月後","12か月後"],"e":"1か月に30度なので、反対側（180度）にくるのは180÷30＝6か月後。12か月後にはもとの位置にもどるよ。"},{"t":"choice","lv":3,"q":"1か月後に、今日と同じ位置に<ruby>北斗七星<rt>ほくとしちせい<\/rt><\/ruby>を見るには、今日の観測時刻より何時間前（または後）に観測すればよい？","c":["2時間前","1時間前","1時間後","2時間後"],"e":"1か月後の同じ時刻には、反時計回りに30度進んでいる。30度もどすには30÷15＝2時間なので、2時間早く見ればいいよ。"},{"t":"choice","lv":2,"q":"5月5日の20時に北の空で見えた<ruby>北斗七星<rt>ほくとしちせい<\/rt><\/ruby>の星は、9月5日の20時にはどの位置に見える？","c":["北極星を中心に反時計回りに120度動いた位置","北極星を中心に時計回りに120度動いた位置","北極星を中心に反時計回りに60度動いた位置","5月5日と同じ位置"],"e":"9−5＝4か月後。1か月に30度なので30×4＝120度、反時計回りに動いた位置だよ。"},{"t":"choice","lv":3,"q":"5月5日の20時に北の空で星Pを観測した。10月5日の18時には、星Pはどの位置に見える？","c":["反時計回りに120度動いた位置","反時計回りに150度動いた位置","反時計回りに180度動いた位置","時計回りに120度動いた位置"],"e":"5か月後の20時なら30×5＝150度進む。18時はその2時間前なので15×2＝30度もどす。150−30＝120度、反時計回りだよ。"},{"t":"choice","lv":3,"q":"北の空の星Bが、ある日の20時にある位置に見えた。同じ20時に、その位置から時計回りに90度もどった位置に星Bが見えるのはいつ？","c":["3か月前","6か月前","3か月後","6か月後"],"e":"同じ時刻に見ると、星は1か月に30度ずつ反時計回りに進む。時計回りに90度もどった位置なら、90÷30＝3か月前だよ。"},{"t":"choice","lv":3,"q":"5月5日の20時に北の空で星Pを観測した。3月5日に、星Pが「5月5日20時の位置から時計回りに30度ずれた位置」に見えたのは何時ごろ？","c":["22時","18時","19時","21時"],"e":"3月5日（2か月前）の20時には、時計回りに60度ずれた位置にある。そこから反時計回りに30度進むのは30÷15＝2時間後なので、22時だよ。"},{"t":"choice","lv":3,"q":"東京で夏の夜、<ruby>天頂<rt>てんちょう<\/rt><\/ruby>（真上）あたりを通ったベガは、そのあとどちらの空へ動いていく？","c":["北西の空","南西の空","真西の空","真南の空"],"e":"天頂を通る星は、北東から出て天頂を通り、北西へしずむ。夏至のころの太陽の通り道とよく似ているよ。"},{"t":"choice","lv":1,"q":"地球が、<ruby>地軸<rt>ちじく<\/rt><\/ruby>を中心にして1日に1回こまのように回ることを何という？","c":["自転","公転","南中","満ち欠け"],"e":"地球は西から東へ1日に1回自転している。これが星や太陽の1日の動きの原因だよ。"},{"t":"choice","lv":1,"q":"地球が、太陽のまわりを1年かけて1回まわることを何という？","c":["公転","自転","南中","満ち欠け"],"e":"地球は1年で太陽のまわりを1回公転する。これが、季節によって見える星座が変わる原因だよ。"},{"t":"choice","lv":1,"q":"<ruby>北斗七星<rt>ほくとしちせい<\/rt><\/ruby>は何座の一部？","c":["おおぐま座","こぐま座","カシオペヤ座","こいぬ座"],"e":"北斗七星はおおぐま座の背中からしっぽの部分。北極星はこぐま座の星だよ。"}]},{"id":"animal","title":"動物","yomi":"どうぶつ","emoji":"🐾","source":"上 第19回","points":[{"h":"背骨があるか・ないか","t":"動物は、<ruby>背骨<rt>せぼね<\/rt><\/ruby>のない<b>無セキツイ動物<\/b>と、背骨のある<b>セキツイ動物<\/b>（内骨格）に分けられる。"},{"h":"からだがやわらかい動物","t":"<b>イカ・タコ・マイマイ・アサリ<\/b>など、からだがやわらかい動物を<b><ruby>軟体<rt>なんたい<\/rt><\/ruby>動物<\/b>という。"},{"h":"<ruby>節足<rt>せっそく<\/rt><\/ruby>動物","t":"かたいから（<b>外骨格<\/b>）と<b>節のあるあし<\/b>をもつ。昆虫は<b>あし6本<\/b>、クモは<b>あし8本<\/b>、エビ・カニは10本。"},{"h":"セキツイ動物の5つのなかま","t":"<b>魚類・両生類・は虫類・鳥類・ほ乳類<\/b>の5つ。"},{"h":"魚類","t":"海水魚（マグロ・イワシ）、淡水魚（<b>メダカ・コイ<\/b>）。<b>サケ<\/b>は川でふ化して海で成長、<b>ウナギ<\/b>は海でふ化して川で成長する。"},{"h":"両生類","t":"<b>子は水中でえら呼吸<\/b>、<b>親は陸上（水辺）で肺呼吸<\/b>。かんそうに弱い。カエル・イモリ・<b>オオサンショウウオ<\/b>（国の特別天然記念物）。"},{"h":"は虫類","t":"かんそうに強い<b>うろこやこうら<\/b>をもち、水辺からはなれて広いはんいで活動できる。ヘビ・ヤモリ・カメ・ワニ。"},{"h":"鳥類","t":"<b>前あしがつばさ<\/b>。飛ぶためにからだが軽い（ツバメ・カラス）。泳ぐ<b>ペンギン<\/b>、走るダチョウもいる。"},{"h":"ほ乳類","t":"<b>母親が子に乳をあたえて育てる<\/b>。多くは毛でおおわれ、4本のあしでからだを支える。イルカ・クジラ・コウモリもほ乳類。"},{"h":"えさによる分け方","t":"<b>草食動物<\/b>（ミツバチ・コアラ・カブトムシの成虫）、<b>肉食動物<\/b>（ヤゴ・テントウムシ・ライオン）、<b><ruby>雑食<rt>ざっしょく<\/rt><\/ruby>動物<\/b>（サル・メダカ・クマ）。"},{"h":"メダカの飼い方","t":"おすとめすをいっしょに。<b>水面が広い<\/b>入れ物、<b>水草<\/b>を入れる。<b>くみおいた水道水<\/b>、<b>直射日光の当たらない明るい場所<\/b>。えさは<b>1日1〜2回、食べ残しがない量<\/b>。"},{"h":"カブトムシの飼い方","t":"クヌギなどの<b><ruby>腐葉土<rt>ふようど<\/rt><\/ruby><\/b>をしく（<b>幼虫のえさ<\/b>）。きりふきでしめらせる。<b>成虫には樹液（昆虫ゼリー）<\/b>をあたえる。"}],"trivia":["ホッキョクグマ（シロクマ）の毛は実は<b>とうめいなストロー状<\/b>で、地はだは<b>黒<\/b>いんだ。黒い地はだが熱を吸収し、毛の中の空気で体をあたためているよ。白く見えるのは、とうめいな管がたくさん集まっているからなんだって。","<b>カモノハシ<\/b>や<b>ハリモグラ<\/b>はほ乳類なのに卵をうむよ。でも、生まれた子どもはちゃんと母乳で育てるんだ。","空を飛ぶように見える動物でも、モモンガ（ほ乳類）やトビウオ（魚類）は「滑空」しているだけ。本当に羽ばたいて飛ぶほ乳類は<b>コウモリ<\/b>だけなんだ。"],"questions":[{"t":"choice","lv":1,"q":"<ruby>背骨<rt>せぼね<\/rt><\/ruby>がある動物をまとめて何という？","c":["セキツイ動物","無セキツイ動物","節足動物","軟体動物"],"e":"背骨（セキツイ）がある動物をセキツイ動物、背骨がない動物を無セキツイ動物というよ。"},{"t":"choice","lv":1,"q":"イカ・タコのように、からだがやわらかいつくりの動物を何という？","c":["軟体動物","節足動物","両生類","魚類"],"e":"<ruby>軟体<rt>なんたい<\/rt><\/ruby>動物には、ほかにマイマイ（カタツムリ）・アサリ・サザエ・ウミウシなどがいるよ。"},{"t":"choice","lv":1,"q":"外骨格（かたいから）をもち、あしに節がある動物を何という？","c":["節足動物","軟体動物","セキツイ動物","両生類"],"e":"<ruby>節足<rt>せっそく<\/rt><\/ruby>動物には、昆虫・クモ・エビ・カニ・ムカデなどがいる。背骨はないので無セキツイ動物だよ。"},{"t":"choice","lv":1,"q":"<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>のあしは何本？","c":["6本","4本","8本","10本"],"e":"昆虫のあしは6本で、すべて「むね」についているよ。"},{"t":"choice","lv":2,"q":"クモのあしは何本？","c":["8本","6本","10本","14本"],"e":"クモのあしは8本。あしが6本ではないので、クモは昆虫ではないよ。ダニやサソリもあしが8本だ。"},{"t":"choice","lv":3,"q":"ダンゴムシは、どのなかまに入る？","c":["エビ・カニのなかま（甲殻類）","昆虫のなかま","クモのなかま","ムカデ・ヤスデのなかま（多足類）"],"e":"ダンゴムシはあしが14本あり、エビ・カニ・ザリガニと同じ甲殻類のなかま。虫とよばれるけれど昆虫ではないよ。"},{"t":"choice","lv":3,"q":"ナマコ・ヒトデ・ウニに共通するからだのとくちょうはどれ？","c":["からだのつくりが五角形になっている","からだが輪っか状の節がつながってできている","さすつくり（毒針のようなもの）をもっている","節のあるあしをもっている"],"e":"ナマコ・ヒトデ・ウニは棘皮（きょくひ）動物で、からだが五角形のつくり。輪っか状の節はミミズ、さすつくりはクラゲ・イソギンチャクのとくちょうだよ。"},{"t":"choice","lv":2,"q":"無セキツイ動物とセキツイ動物の説明として、正しくないものはどれ？","c":["セキツイ動物には、軟体動物や節足動物がふくまれる","無セキツイ動物には背骨がなく、セキツイ動物には背骨がある","外骨格をもつものは無セキツイ動物、内骨格をもつものはセキツイ動物である","海にすむイソギンチャク・ナマコ・ヒトデは無セキツイ動物である"],"e":"軟体動物や節足動物には背骨がないので、無セキツイ動物にふくまれるよ。"},{"t":"choice","lv":1,"q":"セキツイ動物は、魚類・両生類・は虫類・鳥類と、あと何類の5つに分けられる？","c":["ほ乳類","昆虫類","甲殻類","軟体類"],"e":"セキツイ動物は魚類・両生類・は虫類・鳥類・ほ乳類の5つ。ヒトはほ乳類だよ。"},{"t":"choice","lv":1,"q":"両生類はどれ？","c":["カエル","ヘビ","ワニ","カメ"],"e":"カエルは両生類。ヘビ・ワニ・カメは、かんそうに強いうろこやこうらをもつは虫類だよ。"},{"t":"choice","lv":2,"q":"両生類の育ち方と呼吸のしかたとして正しいものはどれ？","c":["子は水中でえら呼吸、親は陸上で肺呼吸","子も親も水中でえら呼吸","子も親も陸上で肺呼吸","子は陸上で肺呼吸、親は水中でえら呼吸"],"e":"オタマジャクシ（子）は水中でえら呼吸、カエル（親）は陸上で肺呼吸。親になってもかんそうに弱いので水辺でくらすよ。"},{"t":"order","lv":2,"q":"カエルの育ち方を順にならべよう","c":["水中に、からのない卵がうみつけられる","オタマジャクシになり、水中でえら呼吸をする","カエルになり、陸上（水辺）で肺呼吸をする"],"e":"両生類は、子のときは水中、親になると陸上で生活する。卵にはかたいからがないので、水中やしめった場所にうむよ。"},{"t":"choice","lv":1,"q":"国の特別天然記念物に指定されているオオサンショウウオは、何類のなかま？","c":["両生類","は虫類","魚類","ほ乳類"],"e":"オオサンショウウオはカエルやイモリと同じ両生類。世界最大級の両生類だよ。"},{"t":"choice","lv":1,"q":"ヘビ・ヤモリ・カメ・ワニなどのなかまを何という？","c":["は虫類","両生類","魚類","ほ乳類"],"e":"は虫類は、かんそうに強いうろこやこうらをもつので、水辺からはなれて広いはんいで活動できるよ。"},{"t":"choice","lv":2,"q":"一生を淡水（真水）ですごす魚はどれ？","c":["メダカ","サケ","ウナギ","イワシ"],"e":"メダカやコイは一生淡水でくらす。イワシは一生海、サケやウナギは海と川を行き来するよ。"},{"t":"choice","lv":2,"q":"海でふ化したあと、川で成長する魚はどれ？","c":["ウナギ","サケ","メダカ","マグロ"],"e":"ウナギは海でふ化して川で成長する。サケはその反対で、川でふ化して海で成長するよ。"},{"t":"choice","lv":1,"q":"泳ぐのに適したからだのつくりになっている鳥はどれ？","c":["ペンギン","カラス","カワセミ","インコ"],"e":"ペンギンは空を飛べないかわりに、海中で魚をとらえるために泳ぐのが得意なからだになっているよ。"},{"t":"choice","lv":1,"q":"ほ乳類に共通するとくちょうはどれ？","c":["母親が子に乳をあたえて育てる","水中に卵をうむ","からだがうろこでおおわれている","前あしがつばさになっている"],"e":"ほ乳類は、母親が子に乳をあたえて育てる。多くは毛でおおわれ、4本のあしでからだを支えるよ。"},{"t":"choice","lv":3,"q":"イルカ・クジラ・シャチは、どのなかま？","c":["ほ乳類","魚類","は虫類","両生類"],"e":"海にすんでいても、肺で呼吸し、子に乳をあたえて育てるのでほ乳類。見た目が似ているサメは魚類だよ。"},{"t":"tf","lv":3,"q":"カモノハシは卵をうむが、ほ乳類のなかまである。","a":true,"e":"カモノハシやハリモグラは卵をうむけれど、生まれた子を母乳で育てるのでほ乳類だよ。"},{"t":"choice","lv":3,"q":"ヒトがほかの多くのほ乳類とちがう点はどれ？","c":["2本のあしでからだを支え、歩行する","母親が子に乳をあたえて育てる","背骨をもっている","肺で呼吸する"],"e":"ほとんどのほ乳類は4本のあしで歩くけれど、ヒトは2本のあしでからだを支えて歩くよ。"},{"t":"choice","lv":1,"q":"植物をえさにする動物を何という？","c":["草食動物","肉食動物","雑食動物"],"e":"植物を食べる動物は草食動物。コアラ・シマウマ・ウシなどがいるよ。"},{"t":"choice","lv":1,"q":"草食動物にあてはまるものはどれ？","c":["ミツバチ","ヤゴ","テントウムシ","ライオン"],"e":"ミツバチは花のみつや花粉を食べる草食動物。ヤゴ・テントウムシ・ライオンはほかの動物を食べる肉食動物だよ。"},{"t":"choice","lv":2,"q":"肉食動物はどれ？","c":["ライオン","シマウマ","コアラ","シカ"],"e":"ライオンはシマウマなどを食べる肉食動物。シマウマ・コアラ・シカは草食動物だよ。"},{"t":"choice","lv":2,"q":"テントウムシは何をえさにしている？","c":["アブラムシ","樹液","花のみつ","ユーカリの葉"],"e":"テントウムシはアブラムシを食べる肉食の昆虫。アブラムシは植物のしるをすう草食の昆虫だよ。"},{"t":"choice","lv":1,"q":"動物と植物の両方をえさにする動物を何という？","c":["雑食動物","草食動物","肉食動物"],"e":"<ruby>雑食<rt>ざっしょく<\/rt><\/ruby>動物には、木の実や昆虫を食べるサル、ドングリや魚を食べるクマ、小さな動物や水草を食べるメダカなどがいるよ。"},{"t":"choice","lv":2,"q":"雑食動物ではないものはどれ？","c":["ゾウ","サル","ヒト","クマ"],"e":"ゾウは陸上でいちばん重い動物だけど、植物だけを食べる草食動物だよ。"},{"t":"choice","lv":3,"q":"肉食動物の目のつき方と、その利点として正しいものはどれ？","c":["前向きについていて、えものとの距離を正確に測れる","横向きについていて、まわりを広く見わたせる","頭の上についていて、空の敵を見はれる"],"e":"肉食動物は目が前向きで、えものまでの距離を正確に測れる。草食動物は目が横向きで視野が広く、敵に早く気づけるよ。"},{"t":"choice","lv":3,"q":"草食動物の「きゅう歯（おくの歯）」のはたらきはどれ？","c":["草をすりつぶす","えものをしとめる","草をかみちぎる","肉や骨を切りさく"],"e":"草食動物は、前の門歯で草をかみちぎり、きゅう歯ですりつぶす。肉食動物は犬歯でえものをしとめ、きゅう歯で肉や骨を切りさくよ。"},{"t":"choice","lv":2,"q":"メダカの飼い方として最も適当なものはどれ？","c":["水そうに水草を入れる","川から持ってきた砂やどろをそのまま入れる","くんだばかりの水道水をすぐに使う","直射日光が当たる場所に水そうを置く"],"e":"水草は酸素をつくり、メダカが卵をうんだりかくれたりする場所になる。砂はよく洗い、水道水はくみおいてから使い、直射日光の当たらない明るい場所に置くよ。"},{"t":"choice","lv":1,"q":"メダカのえさのあたえ方として正しいものはどれ？","c":["1日1〜2回、食べ残しがない量をあたえる","1日1〜2回、できるだけたくさんあたえる","1日3〜4回、できるだけたくさんあたえる","1日3〜4回、食べ残しがない量をあたえる"],"e":"食べ残しがあると水がよごれてしまう。えさは1日1〜2回、食べきれる量だけあたえよう。"},{"t":"choice","lv":1,"q":"カブトムシのえさとして正しいものはどれ？","c":["幼虫は腐葉土、成虫は樹液（昆虫ゼリー）","幼虫も成虫も腐葉土","幼虫は樹液（昆虫ゼリー）、成虫は腐葉土","幼虫も成虫も樹液（昆虫ゼリー）"],"e":"カブトムシの幼虫は<ruby>腐葉土<rt>ふようど<\/rt><\/ruby>（落ち葉が土のようになったもの）を食べて育ち、成虫はクヌギなどの<ruby>樹液<rt>じゅえき<\/rt><\/ruby>をなめるよ。"},{"t":"choice","lv":2,"q":"カブトムシの飼い方として、まちがっているものはどれ？","c":["飼育ケースに、草原に生えている草をしく","幼虫は腐葉土をえさにして育てる","腐葉土がかんそうしすぎないよう、きりふきで水をあたえる","成虫のえさとして昆虫ゼリーをあたえる"],"e":"飼育ケースには腐葉土をしく。腐葉土は幼虫のえさにもなるよ。草原の草はしかないよ。"},{"t":"order","lv":2,"q":"カブトムシの育ち方を順にならべよう","c":["卵","幼虫","さなぎ","成虫"],"e":"カブトムシは卵→幼虫→さなぎ→成虫と育つ（完全変態）。幼虫は腐葉土の中で育つよ。"},{"t":"choice","lv":3,"q":"ホッキョクグマの毛が「とうめいなストロー状」で、地はだが「黒い」ことの利点はどれ？","c":["黒い地はだが熱を吸収しやすく、毛の中の空気で体があたたかく保たれる","黒い地はだが日光をはね返し、体を冷やせる","とうめいな毛が水をたくわえ、のどのかわきをふせぐ","とうめいな毛で体を見えにくくし、敵から完全に消えられる"],"e":"黒い地はだは光の熱を吸収しやすく、ストロー状の毛は中に空気をふくむので保温性が高い。寒い地域でくらすための工夫だよ。"}]},{"id":"body","title":"ヒトのからだ","yomi":"ひとのからだ","emoji":"🦴","source":"下 第1回","points":[{"h":"骨格のはたらき","t":"<b><ruby>頭骨<rt>とうこつ<\/rt><\/ruby>（頭がい骨）<\/b>は<ruby>脳<rt>のう<\/rt><\/ruby>を守り、<b>ろっ骨<\/b>は<ruby>肺<rt>はい<\/rt><\/ruby>や<ruby>心臓<rt>しんぞう<\/rt><\/ruby>を守り、<b>骨ばん<\/b>は<ruby>内臓<rt>ないぞう<\/rt><\/ruby>を支える。<ruby>背骨<rt>せぼね<\/rt><\/ruby>をもつ動物を<b>セキツイ動物<\/b>といい、ヒトもそのなかま。"},{"h":"<ruby>関節<rt>かんせつ<\/rt><\/ruby>とけん","t":"骨と骨をつなぐつくりが<b><ruby>関節<rt>かんせつ<\/rt><\/ruby><\/b>、骨と<ruby>筋肉<rt>きんにく<\/rt><\/ruby>をつなぐ筋肉のはしのじょうぶなつくりが<b>けん<\/b>。関節では骨の先がなん骨になっていて、骨どうしが直接こすれない。"},{"h":"うでの曲げのばし","t":"<ruby>筋肉<rt>きんにく<\/rt><\/ruby>は<b><ruby>縮<rt>ちぢ<\/rt><\/ruby>むときに力を出す<\/b>。うでを曲げるときは<b>内側<\/b>の筋肉が縮み、のばすときは<b>外側<\/b>の筋肉が縮む。"},{"h":"<ruby>呼吸<rt>こきゅう<\/rt><\/ruby>と<ruby>肺<rt>はい<\/rt><\/ruby>","t":"<b><ruby>呼吸<rt>こきゅう<\/rt><\/ruby><\/b>は、<ruby>酸素<rt>さんそ<\/rt><\/ruby>と養分からエネルギーをつくり出すはたらき。このとき<b><ruby>二酸化炭素<rt>にさんかたんそ<\/rt><\/ruby><\/b>ができる。空気は気管→<ruby>気管支<rt>きかんし<\/rt><\/ruby>→<b><ruby>肺<rt>はい<\/rt><\/ruby><\/b>へ送られ、肺で血液に酸素を取り入れ、二酸化炭素を出す。"},{"h":"吸う息とはく息","t":"<b>ちっ素<\/b>（約78％）はほとんど変化しない。<b><ruby>酸素<rt>さんそ<\/rt><\/ruby><\/b>は約21％→16〜17％に減り、<b><ruby>二酸化炭素<rt>にさんかたんそ<\/rt><\/ruby><\/b>は約0.04％→約4％に増える。"},{"h":"消化と歯","t":"<b>消化<\/b>は、食べ物を体内に<ruby>吸収<rt>きゅうしゅう<\/rt><\/ruby>できる形に変えるはたらき。<b><ruby>門歯<rt>もんし<\/rt><\/ruby>・<ruby>犬歯<rt>けんし<\/rt><\/ruby><\/b>でかみ切り、<b>きゅう歯<\/b>ですりつぶす。大人の<ruby>永久歯<rt>えいきゅうし<\/rt><\/ruby>は全部で<b>32本<\/b>。"},{"h":"消化管と消化器官","t":"口→食道→<ruby>胃<rt>い<\/rt><\/ruby>→<ruby>十二指腸<rt>じゅうにしちょう<\/rt><\/ruby>→<b><ruby>小腸<rt>しょうちょう<\/rt><\/ruby><\/b>→<ruby>大腸<rt>だいちょう<\/rt><\/ruby>→<ruby>肛門<rt>こうもん<\/rt><\/ruby>の食べ物の通り道が<b>消化管<\/b>。これに<ruby>肝臓<rt>かんぞう<\/rt><\/ruby>・たんのう・すい臓などを加えたものが<b>消化器官<\/b>。養分はおもに<b>小腸<\/b>で<ruby>吸収<rt>きゅうしゅう<\/rt><\/ruby>される。"},{"h":"3つの<ruby>栄養素<rt>えいようそ<\/rt><\/ruby>","t":"<b>炭水化物<\/b>は米やジャガイモ、<b>タンパク質<\/b>は肉や魚、<b>しぼう<\/b>は肉のあぶら身やゴマに多くふくまれる。"},{"h":"<ruby>心臓<rt>しんぞう<\/rt><\/ruby>と血管","t":"<b><ruby>心臓<rt>しんぞう<\/rt><\/ruby><\/b>は胸のほぼ中央にあるにぎりこぶし1個分の大きさのポンプ。心臓から出る血液が通る<b><ruby>動脈<rt>どうみゃく<\/rt><\/ruby><\/b>はかべが厚く<ruby>弾力<rt>だんりょく<\/rt><\/ruby>がある。心臓にもどる血液が通る<b><ruby>静脈<rt>じょうみゃく<\/rt><\/ruby><\/b>には<ruby>逆流<rt>ぎゃくりゅう<\/rt><\/ruby>を防ぐ<b><ruby>弁<rt>べん<\/rt><\/ruby><\/b>がある。2つをつなぐのが<b><ruby>毛細血管<rt>もうさいけっかん<\/rt><\/ruby><\/b>。"},{"h":"感覚器官","t":"外からの<ruby>刺激<rt>しげき<\/rt><\/ruby>は<b>感覚器官<\/b>→<b><ruby>神経<rt>しんけい<\/rt><\/ruby><\/b>→<b><ruby>脳<rt>のう<\/rt><\/ruby><\/b>と伝わる。目（見る）・耳（聞く）・鼻（かぐ）・舌（味わう）・皮ふ（ふれる）が感覚器官。"},{"h":"目のつくり","t":"光は角まく→ひとみ→レンズ→<b>もうまく<\/b>と進み、もうまくに像ができる。<b>こうさい<\/b>がひとみの大きさを変えて光の量を調節し（暗いとひとみは大きくなる）、<b>レンズ<\/b>は厚みを変えてピントを合わせる。"},{"h":"耳のつくり","t":"音は<b>こまく<\/b>→<ruby>耳小骨<rt>じしょうこつ<\/rt><\/ruby>→<b>うずまき管<\/b>と伝わり、<ruby>神経<rt>しんけい<\/rt><\/ruby>から<ruby>脳<rt>のう<\/rt><\/ruby>へ送られる。<b><ruby>三半規管<rt>さんはんきかん<\/rt><\/ruby><\/b>はからだの回転やかたむきを感じてバランスを保つ。"}],"trivia":["手のひらや足のうら、ほお、耳たぶには<ruby>動脈<rt>どうみゃく<\/rt><\/ruby>と<ruby>静脈<rt>じょうみゃく<\/rt><\/ruby>を直接つなぐ「AVA血管」がある。ふだんは閉じているけれど、暑いときに開いて<ruby>毛細血管<rt>もうさいけっかん<\/rt><\/ruby>の1万倍もの血液を流し、熱をにがして体温を下げるよ。だから熱中症の予防には手のひらを15℃くらいの水で冷やすのが効果的！","小さい動物ほど<ruby>心臓<rt>しんぞう<\/rt><\/ruby>の<ruby>拍動<rt>はくどう<\/rt><\/ruby>が速い！ ネズミは1分間に300〜700回、ゾウは1分間に20回くらいしか打たないんだって。","<ruby>肺<rt>はい<\/rt><\/ruby>の中には「<ruby>肺ほう<rt>はいほう<\/rt><\/ruby>」という小さなふくろが両方で4〜6億個もある。表面積を大きくして、<ruby>酸素<rt>さんそ<\/rt><\/ruby>と<ruby>二酸化炭素<rt>にさんかたんそ<\/rt><\/ruby>の交かんをしやすくしているんだ。"],"questions":[{"t":"choice","lv":1,"q":"からだを動かす骨と骨がつながっている部分を何という？","c":["<ruby>関節<rt>かんせつ<\/rt><\/ruby>","けん","なん骨","骨ばん"],"e":"骨と骨をつなぐつくりが<ruby>関節<rt>かんせつ<\/rt><\/ruby>。骨の先はなん骨になっていて、まくの中の液体で動きがなめらかになっている。"},{"t":"choice","lv":1,"q":"<ruby>筋肉<rt>きんにく<\/rt><\/ruby>のはしにあり、筋肉と骨をつないでいるじょうぶなつくりを何という？","c":["けん","<ruby>関節<rt>かんせつ<\/rt><\/ruby>","<ruby>神経<rt>しんけい<\/rt><\/ruby>","<ruby>弁<rt>べん<\/rt><\/ruby>"],"e":"<ruby>筋肉<rt>きんにく<\/rt><\/ruby>は、はしの「けん」で骨とつながっている。かかとにある「アキレスけん」はからだの中で最も太いけんだよ。"},{"t":"choice","lv":1,"q":"鼻や口から取り入れた空気は、気管とそこから枝分かれした<ruby>気管支<rt>きかんし<\/rt><\/ruby>を通って、どこへ送られる？","c":["<ruby>肺<rt>はい<\/rt><\/ruby>","<ruby>心臓<rt>しんぞう<\/rt><\/ruby>","<ruby>胃<rt>い<\/rt><\/ruby>","<ruby>肝臓<rt>かんぞう<\/rt><\/ruby>"],"e":"空気は気管→<ruby>気管支<rt>きかんし<\/rt><\/ruby>→<ruby>肺<rt>はい<\/rt><\/ruby>へ送られる。肺は左右に1つずつあり、血液中に<ruby>酸素<rt>さんそ<\/rt><\/ruby>を取り入れて<ruby>二酸化炭素<rt>にさんかたんそ<\/rt><\/ruby>を出している。"},{"t":"choice","lv":1,"q":"口→食道→<ruby>胃<rt>い<\/rt><\/ruby>→<ruby>小腸<rt>しょうちょう<\/rt><\/ruby>→<ruby>大腸<rt>だいちょう<\/rt><\/ruby>→<ruby>肛門<rt>こうもん<\/rt><\/ruby>という、食べ物の通り道をまとめて何という？","c":["消化管","消化器官","気管","血管"],"e":"食べ物が実際に通る道が「消化管」。これに<ruby>肝臓<rt>かんぞう<\/rt><\/ruby>やすい臓などを加えた、消化に関係するつくり全体が「消化器官」だよ。"},{"t":"choice","lv":1,"q":"タンパク質が多くふくまれている食べ物はどれ？","c":["肉","ジャガイモ","米","ゴマ"],"e":"タンパク質は肉や魚に多い。<ruby>筋肉<rt>きんにく<\/rt><\/ruby>や皮ふ、<ruby>内臓<rt>ないぞう<\/rt><\/ruby>などからだをつくる材料になる。米・ジャガイモは炭水化物、ゴマはしぼうが多い。"},{"t":"choice","lv":2,"q":"<ruby>静脈<rt>じょうみゃく<\/rt><\/ruby>の特ちょうを正しく表しているのはどれ？","c":["血管のかべがうすく、ところどころに<ruby>弁<rt>べん<\/rt><\/ruby>がある","血管のかべが厚く、ところどころに<ruby>弁<rt>べん<\/rt><\/ruby>がある","血管のかべがうすく、脈をうっている","血管のかべが厚く、脈をうっている"],"e":"<ruby>心臓<rt>しんぞう<\/rt><\/ruby>にもどる血液が流れる<ruby>静脈<rt>じょうみゃく<\/rt><\/ruby>は、<ruby>動脈<rt>どうみゃく<\/rt><\/ruby>よりかべがうすく、血液の<ruby>逆流<rt>ぎゃくりゅう<\/rt><\/ruby>を防ぐ<ruby>弁<rt>べん<\/rt><\/ruby>がある。かべが厚く<ruby>弾力<rt>だんりょく<\/rt><\/ruby>があり脈をうつのは動脈。"},{"t":"choice","lv":2,"q":"<ruby>動脈<rt>どうみゃく<\/rt><\/ruby>と<ruby>静脈<rt>じょうみゃく<\/rt><\/ruby>をつなぎ、全身にあみの目のように広がっている細い血管を何という？","c":["<ruby>毛細血管<rt>もうさいけっかん<\/rt><\/ruby>","<ruby>動脈<rt>どうみゃく<\/rt><\/ruby>","<ruby>静脈<rt>じょうみゃく<\/rt><\/ruby>","<ruby>気管支<rt>きかんし<\/rt><\/ruby>"],"e":"<ruby>毛細血管<rt>もうさいけっかん<\/rt><\/ruby>は全身にあみの目のように広がり、からだの<ruby>細胞<rt>さいぼう<\/rt><\/ruby>に<ruby>酸素<rt>さんそ<\/rt><\/ruby>や養分をわたし、<ruby>二酸化炭素<rt>にさんかたんそ<\/rt><\/ruby>や不要物を受け取っている。"},{"t":"choice","lv":1,"q":"目・耳・鼻・舌・皮ふのように、外からの<ruby>刺激<rt>しげき<\/rt><\/ruby>を感じとるからだのつくりをまとめて何という？","c":["感覚器官","消化器官","<ruby>神経<rt>しんけい<\/rt><\/ruby>","<ruby>関節<rt>かんせつ<\/rt><\/ruby>"],"e":"外からの<ruby>刺激<rt>しげき<\/rt><\/ruby>は感覚器官で受け取られ、<ruby>神経<rt>しんけい<\/rt><\/ruby>を通って<ruby>脳<rt>のう<\/rt><\/ruby>に伝わる。"},{"t":"choice","lv":1,"q":"耳で、音による空気のしん動を受け取ってふるえる、うすいまくを何という？","c":["こまく","<ruby>耳小骨<rt>じしょうこつ<\/rt><\/ruby>","うずまき管","<ruby>三半規管<rt>さんはんきかん<\/rt><\/ruby>"],"e":"音が耳に入るとまず「こまく」がしん動し、そのふるえが<ruby>耳小骨<rt>じしょうこつ<\/rt><\/ruby>からうずまき管へ伝わる。"},{"t":"choice","lv":1,"q":"目に入ってくる光の量を調節しているつくりはどれ？","c":["こうさい","レンズ","もうまく","角まく"],"e":"こうさいはドーナツのような形のまくで、のびたり<ruby>縮<rt>ちぢ<\/rt><\/ruby>んだりしてひとみの大きさを変え、入る光の量を調節している。"},{"t":"tf","lv":1,"q":"<ruby>背骨<rt>せぼね<\/rt><\/ruby>をもつ動物をセキツイ動物といい、ヒトのほか魚類・両生類・は虫類・鳥類もセキツイ動物である。","a":true,"e":"セキツイ動物は、骨がからだの内側にある「内骨格」をもつ。魚類・両生類・は虫類・鳥類・ほ乳類の5つのなかまがいる。"},{"t":"choice","lv":1,"q":"<ruby>脳<rt>のう<\/rt><\/ruby>を守っている骨はどれ？","c":["<ruby>頭骨<rt>とうこつ<\/rt><\/ruby>（頭がい骨）","ろっ骨","骨ばん","<ruby>背骨<rt>せぼね<\/rt><\/ruby>"],"e":"<ruby>頭骨<rt>とうこつ<\/rt><\/ruby>は<ruby>脳<rt>のう<\/rt><\/ruby>を守る。ろっ骨は<ruby>肺<rt>はい<\/rt><\/ruby>や<ruby>心臓<rt>しんぞう<\/rt><\/ruby>を守り、骨ばんは<ruby>内臓<rt>ないぞう<\/rt><\/ruby>を支えている。"},{"t":"choice","lv":2,"q":"うでを曲げるときの<ruby>筋肉<rt>きんにく<\/rt><\/ruby>のようすとして正しいものはどれ？","c":["内側の<ruby>筋肉<rt>きんにく<\/rt><\/ruby>が<ruby>縮<rt>ちぢ<\/rt><\/ruby>み、外側の筋肉がゆるむ","内側の<ruby>筋肉<rt>きんにく<\/rt><\/ruby>がゆるみ、外側の筋肉が<ruby>縮<rt>ちぢ<\/rt><\/ruby>む","内側も外側も<ruby>縮<rt>ちぢ<\/rt><\/ruby>む","内側も外側もゆるむ"],"e":"<ruby>筋肉<rt>きんにく<\/rt><\/ruby>は<ruby>縮<rt>ちぢ<\/rt><\/ruby>むときに力を出して骨を引っぱる。うでを曲げるときは内側の筋肉が縮み、外側はゆるんでいる。"},{"t":"choice","lv":3,"q":"うでをまっすぐのばしたとき、ゆるんでいる<ruby>筋肉<rt>きんにく<\/rt><\/ruby>はどちら？","c":["内側の<ruby>筋肉<rt>きんにく<\/rt><\/ruby>","外側の<ruby>筋肉<rt>きんにく<\/rt><\/ruby>","内側と外側の両方"],"e":"うでをのばすときは外側の<ruby>筋肉<rt>きんにく<\/rt><\/ruby>が<ruby>縮<rt>ちぢ<\/rt><\/ruby>んで骨を引っぱり、内側の筋肉はゆるむ。曲げるときの反対だよ。"},{"t":"choice","lv":1,"q":"<ruby>酸素<rt>さんそ<\/rt><\/ruby>と養分から生きるためのエネルギーをつくり出すはたらきを<ruby>呼吸<rt>こきゅう<\/rt><\/ruby>という。このとき、からだの外に出される不要な気体はどれ？","c":["<ruby>二酸化炭素<rt>にさんかたんそ<\/rt><\/ruby>","<ruby>酸素<rt>さんそ<\/rt><\/ruby>","ちっ素","水素"],"e":"<ruby>酸素<rt>さんそ<\/rt><\/ruby>を使って養分からエネルギーを取り出すと<ruby>二酸化炭素<rt>にさんかたんそ<\/rt><\/ruby>ができる。二酸化炭素は<ruby>肺<rt>はい<\/rt><\/ruby>からはく息として外に出される。"},{"t":"choice","lv":3,"q":"ヒトがはく息に、いちばん多くふくまれている気体はどれ？（水蒸気はのぞく）","c":["ちっ素","<ruby>二酸化炭素<rt>にさんかたんそ<\/rt><\/ruby>","<ruby>酸素<rt>さんそ<\/rt><\/ruby>","水素"],"e":"はく息でもいちばん多いのはちっ素（約78％）。ちっ素は<ruby>呼吸<rt>こきゅう<\/rt><\/ruby>ではほとんど変化しない。次に多いのは<ruby>酸素<rt>さんそ<\/rt><\/ruby>（16〜17％）で、<ruby>二酸化炭素<rt>にさんかたんそ<\/rt><\/ruby>は約4％だよ。"},{"t":"tf","lv":3,"q":"はく息には、<ruby>酸素<rt>さんそ<\/rt><\/ruby>はまったくふくまれていない。","a":false,"e":"吸いこんだ<ruby>酸素<rt>さんそ<\/rt><\/ruby>がすべてからだに取りこまれるわけではない。空気中に約21％ある酸素は、はく息でも16〜17％くらい残っている。"},{"t":"choice","lv":2,"q":"運動すると、<ruby>呼吸<rt>こきゅう<\/rt><\/ruby>の回数や<ruby>心臓<rt>しんぞう<\/rt><\/ruby>の<ruby>拍動<rt>はくどう<\/rt><\/ruby>の回数がふえるのはなぜ？","c":["<ruby>筋肉<rt>きんにく<\/rt><\/ruby>がたくさんのエネルギーを使うので、<ruby>酸素<rt>さんそ<\/rt><\/ruby>や養分を多く運ぶ必要があるから","からだを冷やすために<ruby>二酸化炭素<rt>にさんかたんそ<\/rt><\/ruby>を多く取り入れるから","<ruby>肺<rt>はい<\/rt><\/ruby>が大きくなるから","血液の量が減るから"],"e":"運動中は多くのエネルギーが必要。空気の出入りはすいみん中の約8L/分から約50L/分に、<ruby>心臓<rt>しんぞう<\/rt><\/ruby>が送り出す血液も約5L/分から約25L/分にふえる。"},{"t":"choice","lv":1,"q":"食べ物をかみくだいたり、別の物質に変えたりして、体内に<ruby>吸収<rt>きゅうしゅう<\/rt><\/ruby>できる形に変えるはたらきを何という？","c":["消化","<ruby>吸収<rt>きゅうしゅう<\/rt><\/ruby>","<ruby>呼吸<rt>こきゅう<\/rt><\/ruby>","排出"],"e":"食べ物をそのままでは体内に取りこめないので、消化して<ruby>吸収<rt>きゅうしゅう<\/rt><\/ruby>できる形に変える。吸収はおもに<ruby>小腸<rt>しょうちょう<\/rt><\/ruby>で行われる。"},{"t":"choice","lv":1,"q":"<ruby>門歯<rt>もんし<\/rt><\/ruby>・<ruby>犬歯<rt>けんし<\/rt><\/ruby>・きゅう歯のうち、食べ物をすりつぶすのにつごうのよい歯はどれ？","c":["きゅう歯","<ruby>門歯<rt>もんし<\/rt><\/ruby>","<ruby>犬歯<rt>けんし<\/rt><\/ruby>"],"e":"<ruby>門歯<rt>もんし<\/rt><\/ruby>と<ruby>犬歯<rt>けんし<\/rt><\/ruby>は食べ物をかみ切る歯、おくにあるきゅう歯（小きゅう歯・大きゅう歯）はすりつぶす歯だよ。"},{"t":"choice","lv":3,"q":"大人の<ruby>永久歯<rt>えいきゅうし<\/rt><\/ruby>がすべて生えると、全部で何本？","c":["32本","20本","28本","36本"],"e":"<ruby>永久歯<rt>えいきゅうし<\/rt><\/ruby>は32本。ただし、いちばんおくの第三大きゅう歯（親知らず）は生えないこともあり、1〜4本少ない人もいる。20本は子どもの歯（乳歯）の数。"},{"t":"order","lv":2,"q":"口から入った食べ物が通る順にならべよう（口のあと）","c":["食道","<ruby>胃<rt>い<\/rt><\/ruby>","<ruby>小腸<rt>しょうちょう<\/rt><\/ruby>","<ruby>大腸<rt>だいちょう<\/rt><\/ruby>","<ruby>肛門<rt>こうもん<\/rt><\/ruby>"],"e":"口→食道→<ruby>胃<rt>い<\/rt><\/ruby>→（<ruby>十二指腸<rt>じゅうにしちょう<\/rt><\/ruby>）→<ruby>小腸<rt>しょうちょう<\/rt><\/ruby>→<ruby>大腸<rt>だいちょう<\/rt><\/ruby>→<ruby>肛門<rt>こうもん<\/rt><\/ruby>。胃などで消化され、小腸で養分が、大腸で水分が<ruby>吸収<rt>きゅうしゅう<\/rt><\/ruby>され、残りかすが肛門から出される。"},{"t":"choice","lv":2,"q":"消化された養分を体内に<ruby>吸収<rt>きゅうしゅう<\/rt><\/ruby>する、おもな器官はどれ？","c":["<ruby>小腸<rt>しょうちょう<\/rt><\/ruby>","<ruby>胃<rt>い<\/rt><\/ruby>","<ruby>大腸<rt>だいちょう<\/rt><\/ruby>","食道"],"e":"養分はおもに<ruby>小腸<rt>しょうちょう<\/rt><\/ruby>で<ruby>吸収<rt>きゅうしゅう<\/rt><\/ruby>される。<ruby>大腸<rt>だいちょう<\/rt><\/ruby>では残った水分が吸収される。"},{"t":"choice","lv":2,"q":"消化管に、<ruby>肝臓<rt>かんぞう<\/rt><\/ruby>・たんのう・すい臓など消化に関係するつくりを加えたものをまとめて何という？","c":["消化器官","消化管","感覚器官","内骨格"],"e":"食べ物の通り道（消化管）に、消化を助ける<ruby>肝臓<rt>かんぞう<\/rt><\/ruby>やすい臓などを合わせて消化器官という。"},{"t":"tf","lv":3,"q":"<ruby>肝臓<rt>かんぞう<\/rt><\/ruby>は、食べ物が直接通る消化管の一部である。","a":false,"e":"<ruby>肝臓<rt>かんぞう<\/rt><\/ruby>は消化器官の1つだが、食べ物は通らないので消化管にはふくまれない。しぼうの消化を助けるたん汁をつくったり、養分をたくわえたりしている。"},{"t":"choice","lv":2,"q":"<ruby>栄養素<rt>えいようそ<\/rt><\/ruby>と、それが多くふくまれる食べ物の組み合わせとして正しいものはどれ？","c":["しぼう ― 肉のあぶら身","タンパク質 ― 米、ジャガイモ","炭水化物 ― 肉、魚","しぼう ― 米、ジャガイモ"],"e":"しぼうは肉のあぶら身やゴマ、タンパク質は肉や魚、炭水化物は米やジャガイモに多くふくまれる。"},{"t":"choice","lv":1,"q":"血液を全身に送り出すポンプの役割をしている器官はどれ？","c":["<ruby>心臓<rt>しんぞう<\/rt><\/ruby>","<ruby>肺<rt>はい<\/rt><\/ruby>","<ruby>肝臓<rt>かんぞう<\/rt><\/ruby>","<ruby>胃<rt>い<\/rt><\/ruby>"],"e":"<ruby>心臓<rt>しんぞう<\/rt><\/ruby>は胸のほぼ中央にある、にぎりこぶし1個分くらいの大きさの器官。血液をくり返し送り出している。"},{"t":"choice","lv":1,"q":"<ruby>心臓<rt>しんぞう<\/rt><\/ruby>から送り出された血液が流れる血管を何という？","c":["<ruby>動脈<rt>どうみゃく<\/rt><\/ruby>","<ruby>静脈<rt>じょうみゃく<\/rt><\/ruby>","<ruby>毛細血管<rt>もうさいけっかん<\/rt><\/ruby>"],"e":"<ruby>心臓<rt>しんぞう<\/rt><\/ruby>から出ていく血液は勢いが強いので、<ruby>動脈<rt>どうみゃく<\/rt><\/ruby>はかべが厚く<ruby>弾力<rt>だんりょく<\/rt><\/ruby>がある。心臓にもどる血液が流れるのは<ruby>静脈<rt>じょうみゃく<\/rt><\/ruby>。"},{"t":"choice","lv":2,"q":"目や耳などの感覚器官が受け取った<ruby>刺激<rt>しげき<\/rt><\/ruby>は、何を通って<ruby>脳<rt>のう<\/rt><\/ruby>に伝わる？","c":["<ruby>神経<rt>しんけい<\/rt><\/ruby>","血管","骨","<ruby>筋肉<rt>きんにく<\/rt><\/ruby>"],"e":"<ruby>刺激<rt>しげき<\/rt><\/ruby>は感覚器官→<ruby>神経<rt>しんけい<\/rt><\/ruby>→<ruby>脳<rt>のう<\/rt><\/ruby>と伝わる。目なら視神経、耳ならちょう神経が脳へ情報を送る。"},{"t":"order","lv":2,"q":"目に入った光が進む順にならべよう","c":["角まく","ひとみ","レンズ","もうまく"],"e":"光は角まく→ひとみ→レンズと進み、もうまくの上に像をつくる。その情報が視<ruby>神経<rt>しんけい<\/rt><\/ruby>で<ruby>脳<rt>のう<\/rt><\/ruby>に伝わり「見えた」と判断される。"},{"t":"choice","lv":1,"q":"目のつくりで、入ってきた光が像をつくる部分はどれ？","c":["もうまく","こまく","角まく","ひとみ"],"e":"像ができるのはもうまく。もうまくには上下左右が反対の像がうつる。こまくは耳のつくりだよ。"},{"t":"choice","lv":2,"q":"明るい場所から暗い場所に入ると、ひとみの大きさはどうなる？","c":["大きくなる","小さくなる","変わらない"],"e":"暗い場所では光を多く取り入れるため、こうさいが<ruby>縮<rt>ちぢ<\/rt><\/ruby>んでひとみが大きくなる。明るい場所ではひとみは小さくなる。"},{"t":"order","lv":2,"q":"耳に入った音が伝わる順にならべよう","c":["こまく","<ruby>耳小骨<rt>じしょうこつ<\/rt><\/ruby>","うずまき管","ちょう<ruby>神経<rt>しんけい<\/rt><\/ruby>","<ruby>脳<rt>のう<\/rt><\/ruby>"],"e":"音でこまくがしん動し、<ruby>耳小骨<rt>じしょうこつ<\/rt><\/ruby>→うずまき管へ伝わる。うずまき管からちょう<ruby>神経<rt>しんけい<\/rt><\/ruby>を通って<ruby>脳<rt>のう<\/rt><\/ruby>へ送られ「聞こえた」と判断される。"},{"t":"choice","lv":2,"q":"耳のおくにあり、からだの回転やかたむきを感じてバランスを保つつくりはどれ？","c":["<ruby>三半規管<rt>さんはんきかん<\/rt><\/ruby>","こまく","<ruby>耳小骨<rt>じしょうこつ<\/rt><\/ruby>","うずまき管"],"e":"うずまき管の根もとにある3つの半規管（<ruby>三半規管<rt>さんはんきかん<\/rt><\/ruby>）は、中の液体のゆれでからだの回転やかたむきを感じとる。"},{"t":"choice","lv":3,"q":"暑くて体温が上がりすぎそうなとき、手のひらなどにある「AVA血管」はどうなる？","c":["開いて多くの血液を流し、熱をにがして体温を下げる","閉じて血液を流さないようにし、熱をためる","血液を<ruby>心臓<rt>しんぞう<\/rt><\/ruby>に送り返さなくなる","汗をつくる"],"e":"AVA血管は<ruby>動脈<rt>どうみゃく<\/rt><\/ruby>と<ruby>静脈<rt>じょうみゃく<\/rt><\/ruby>を直接つなぐ血管。ふだんは閉じているが、暑いときには開いて血液をたくさん流し、ここで冷やされた血液が全身をめぐることで体温が下がる。"}]},{"id":"autumn","title":"秋の生物","yomi":"あきのせいぶつ","emoji":"🍁","source":"下 第2回","points":[{"h":"秋になると","t":"秋は昼が短くなり、気温が下がっていく季節。<b><ruby>秋分<rt>しゅうぶん<\/rt><\/ruby>の日<\/b>に昼と夜の長さがちょうど同じになる。生物は<ruby>種子<rt>しゅし<\/rt><\/ruby>をつくる・葉を落とす・<ruby>卵<rt>たまご<\/rt><\/ruby>を産む・<ruby>渡<rt>わた<\/rt><\/ruby>りをするなど、<b>冬の準備<\/b>をする。"},{"h":"ヒガンバナとススキ","t":"<b>ヒガンバナ<\/b>は秋の<ruby>彼岸<rt>ひがん<\/rt><\/ruby>のころに赤い花をさかせ、花がかれてから葉を出し、秋から春に<ruby>光合成<rt>こうごうせい<\/rt><\/ruby>をする。<b>ススキ<\/b>は気温が低くなると花をさかせ、開花は<b>北から南へ、山地から平地へ<\/b>進む。"},{"h":"秋の<ruby>七草<rt>ななくさ<\/rt><\/ruby>","t":"<b>ハギ・ススキ・キキョウ・ナデシコ・オミナエシ・クズ・フジバカマ<\/b>の7つ。"},{"h":"庭や花だんの花","t":"キク・<b>コスモス<\/b>・ダリア・マリーゴールド・マーガレットはすべて<b>キクのなかま<\/b>。<b>キンモクセイ<\/b>はあまい<ruby>香<rt>かお<\/rt><\/ruby>りの花をさかせる<ruby>樹木<rt>じゅもく<\/rt><\/ruby>。"},{"h":"<ruby>常緑樹<rt>じょうりょくじゅ<\/rt><\/ruby>と<ruby>落葉樹<rt>らくようじゅ<\/rt><\/ruby>","t":"一年中緑の葉をつけている木が<b><ruby>常緑樹<rt>じょうりょくじゅ<\/rt><\/ruby><\/b>（スギ・ツバキ・マツなど）、冬を前に葉を落とす木が<b><ruby>落葉樹<rt>らくようじゅ<\/rt><\/ruby><\/b>。落葉したあとの<ruby>枝<rt>えだ<\/rt><\/ruby>には<b><ruby>冬芽<rt>ふゆめ<\/rt><\/ruby><\/b>が残り、春に葉や花になる。"},{"h":"葉の色の変化","t":"<b><ruby>黄葉<rt>こうよう<\/rt><\/ruby><\/b>：イチョウ・ポプラ・ケヤキ。<b><ruby>紅葉<rt>こうよう<\/rt><\/ruby><\/b>：イロハモミジ・ニシキギ・ツタ。<b>茶色<\/b>：クヌギ・コナラ・クリ。紅葉前線は<b>北から南へ、山地から平地へ<\/b>進む。"},{"h":"<ruby>種子<rt>しゅし<\/rt><\/ruby>の<ruby>散<rt>ち<\/rt><\/ruby>らばり方","t":"<b>風<\/b>：ススキ・カエデ・マツ。<b>動物のからだにつく<\/b>：オナモミ・イノコズチ・ヌスビトハギ。<b>動物に食べられる<\/b>：ナンテン・ヤマブドウ・アケビ。<b>自分の重さで落ちる<\/b>：クヌギ・コナラ・シイ・カシ（実は<b>ドングリ<\/b>）。<b>実がはじける<\/b>：ホウセンカ・カタバミ。"},{"h":"<ruby>産卵<rt>さんらん<\/rt><\/ruby>する<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>","t":"<b>トンボ<\/b>は水中に<ruby>産卵<rt>さんらん<\/rt><\/ruby>し、<ruby>幼虫<rt>ようちゅう<\/rt><\/ruby>は<b>ヤゴ<\/b>。<b>カマキリ<\/b>は細い木の<ruby>枝<rt>えだ<\/rt><\/ruby>や草のくきに<ruby>卵<rt>たまご<\/rt><\/ruby>のかたまりを産みつける。<b>トノサマバッタ<\/b>やコオロギは土の中に産卵する。"},{"h":"鳴く<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>","t":"鳴くのは<b>オスだけ<\/b>で、左右の<b><ruby>前羽<rt>まえばね<\/rt><\/ruby>をこすり合わせて<\/b>音を出す。キリギリス「ギースチョン」、ウマオイ「スイーッチョン」、クツワムシ「ガチャガチャ」、エンマコオロギ「コロコロリー」、マツムシ「チンチロリン」、スズムシ「リーンリーン」。"},{"h":"サケ・アユ・ウナギ","t":"<b>サケ<\/b>は海で成長し、生まれた川の上流にもどって<ruby>産卵<rt>さんらん<\/rt><\/ruby>する。<b>アユ<\/b>は川で成長して川底に産卵する（<ruby>稚魚<rt>ちぎょ<\/rt><\/ruby>は海で冬をすごす）。<b>ウナギ<\/b>は川で成長し、遠い南の海で産卵する。"},{"h":"夏鳥と冬鳥","t":"<b>夏鳥<\/b>（ツバメ・カッコウ）は夏に日本で子育てし、秋に南の国へ<ruby>渡<rt>わた<\/rt><\/ruby>る。<b>冬鳥<\/b>（ハクチョウ・ガン・マガモ）は秋に北の国から渡ってきて日本で冬越しする。どちらも<b>春は北へ、秋は南へ<\/b>移動する。"},{"h":"<ruby>冬眠<rt>とうみん<\/rt><\/ruby>の準備","t":"ヤマネ・シマリス・コウモリ・クマは秋の間にえさをたくわえたり食べたりする。カエル・ヘビ・トカゲは秋の終わりに<b>土の中にもぐる<\/b>。"}],"trivia":["秋の<ruby>彼岸<rt>ひがん<\/rt><\/ruby>にそなえる「おはぎ」はハギの花に見立てた名前。同じ食べ物でも春の彼岸ではボタンの花に見立てて「ぼたもち」とよぶよ。","秋が旬のイチジク。果物のように見えるけれど、中の赤いつぶつぶの部分は実は「花」なんだって！","秋の<ruby>七草<rt>ななくさ<\/rt><\/ruby>のクズは、秋から冬にかけて根に養分（デンプン）をためる。その根からつくる「葛粉」は、葛もちや葛湯の材料になるよ。"],"questions":[{"t":"choice","lv":1,"q":"次のうち、秋の<ruby>七草<rt>ななくさ<\/rt
