><\/ruby>にあてはまらないものはどれ？","c":["ヒガンバナ","ハギ","オミナエシ","フジバカマ"],"e":"秋の<ruby>七草<rt>ななくさ<\/rt><\/ruby>はハギ・ススキ・キキョウ・ナデシコ・オミナエシ・クズ・フジバカマ。ヒガンバナは秋に花をさかせるが七草には入らない。"},{"t":"choice","lv":2,"q":"ススキの花がさく時期は、日本の中でどのように移っていく？","c":["北から南へ、山地から平地へ","南から北へ、平地から山地へ","南から北へ、山地から平地へ","北から南へ、平地から山地へ"],"e":"ススキは気温が低くなると花をさかせる。先にすずしくなる北の地方や山地から開花し、南や平地へ進んでいく。"},{"t":"choice","lv":1,"q":"オナモミやイノコズチの<ruby>種子<rt>しゅし<\/rt><\/ruby>は、どのようにして運ばれる？","c":["動物のからだにつく","風に運ばれる","実がはじけて飛ぶ","自分の重さで落ちて転がる"],"e":"オナモミ・イノコズチ・ヌスビトハギの<ruby>種子<rt>しゅし<\/rt><\/ruby>にはとげがあり、動物の毛や人の服にくっついて遠くへ運ばれる。"},{"t":"choice","lv":2,"q":"カエデやマツの<ruby>種子<rt>しゅし<\/rt><\/ruby>にある、風に乗って遠くへ運ばれるのに役立つつくりはどれ？","c":["うすいはねのようなつくり","かぎのようなとげ","あまくて目立つ色の実","かたくて重いから"],"e":"カエデやマツの<ruby>種子<rt>しゅし<\/rt><\/ruby>にはうすいはねがあり、風を受けてくるくる回りながら遠くへ飛んでいく。"},{"t":"choice","lv":1,"q":"イチョウやポプラの葉は、秋になると何色に変わる？","c":["黄色","赤色","茶色","緑色のまま"],"e":"イチョウ・ポプラ・ケヤキは黄色に変わる（<ruby>黄葉<rt>こうよう<\/rt><\/ruby>）。イロハモミジ・ツタ・ニシキギは赤（<ruby>紅葉<rt>こうよう<\/rt><\/ruby>）、クヌギ・コナラ・クリは茶色になる。"},{"t":"choice","lv":1,"q":"細い木の<ruby>枝<rt>えだ<\/rt><\/ruby>や草のくきに、あわに包まれた<ruby>卵<rt>たまご<\/rt><\/ruby>のかたまりを産みつける<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>はどれ？","c":["カマキリ","トンボ","トノサマバッタ","スズムシ"],"e":"カマキリは秋に、白っぽいあわのようなもの（らんのう）に包まれた<ruby>卵<rt>たまご<\/rt><\/ruby>のかたまりを産む。卵のすがたで冬を越すよ。"},{"t":"choice","lv":1,"q":"コオロギやキリギリスなどの鳴く<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>で、鳴いているのはどれ？","c":["オスだけ","メスだけ","オスとメスの両方"],"e":"鳴く<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>では、鳴くのはオスだけ。セミも同じで、鳴くのはオスだよ。"},{"t":"choice","lv":1,"q":"「ギースチョン」と鳴く<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>はどれ？","c":["キリギリス","スズムシ","エンマコオロギ","クツワムシ"],"e":"キリギリスはギースチョン。スズムシはリーンリーン、エンマコオロギはコロコロコロリー、クツワムシはガチャガチャと鳴く。"},{"t":"choice","lv":1,"q":"海で成長したあと、生まれた川にもどってきて、川の上流で<ruby>産卵<rt>さんらん<\/rt><\/ruby>して一生を終える魚はどれ？","c":["サケ","アユ","ウナギ","メダカ"],"e":"サケは海で大きく育ち、流れにさからって川をのぼり（そ上）、生まれた川の上流で<ruby>産卵<rt>さんらん<\/rt><\/ruby>する。"},{"t":"choice","lv":1,"q":"ツバメと同じように、秋になると南の国へ<ruby>渡<rt>わた<\/rt><\/ruby>っていく夏鳥はどれ？","c":["カッコウ","ハクチョウ","ガン","マガモ"],"e":"ツバメやカッコウは夏に日本で子育てをする夏鳥。ハクチョウ・ガン・マガモは冬に日本にやってくる冬鳥だよ。"},{"t":"choice","lv":1,"q":"1年のうち、春分の日のほかに、昼と夜の長さがちょうど同じになる日はどれ？","c":["<ruby>秋分<rt>しゅうぶん<\/rt><\/ruby>の日","夏至の日","冬至の日","立冬の日"],"e":"<ruby>秋分<rt>しゅうぶん<\/rt><\/ruby>の日（9月23日ごろ）に昼と夜の長さが同じになり、そのあとは昼がどんどん短くなっていく。"},{"t":"choice","lv":1,"q":"次のうち、秋に花をさかせる植物ではないものはどれ？","c":["スミレ","キク","コスモス","ヒガンバナ"],"e":"スミレは春に花をさかせる。キク・コスモス・ヒガンバナは秋の花だよ。"},{"t":"choice","lv":2,"q":"秋の<ruby>彼岸<rt>ひがん<\/rt><\/ruby>のころに赤い花をさかせ、花がかれたあとに葉を出す植物はどれ？","c":["ヒガンバナ","ススキ","キキョウ","コスモス"],"e":"ヒガンバナは花のあとに葉を出し、秋から春にかけて<ruby>光合成<rt>こうごうせい<\/rt><\/ruby>をして、地下の球根に養分をたくわえる。"},{"t":"choice","lv":3,"q":"次のうち、キクのなかまではない植物はどれ？","c":["ナシ","コスモス","ダリア","マリーゴールド"],"e":"コスモス・ダリア・マリーゴールド・マーガレットはキクのなかま。ナシはバラのなかま（バラ科）の果物だよ。"},{"t":"choice","lv":2,"q":"一年中緑色の葉をつけている<ruby>樹木<rt>じゅもく<\/rt><\/ruby>を<ruby>常緑樹<rt>じょうりょくじゅ<\/rt><\/ruby>という。常緑樹はどれ？","c":["スギ","クヌギ","イチョウ","イロハモミジ"],"e":"スギ・ツバキ・マツなどは<ruby>常緑樹<rt>じょうりょくじゅ<\/rt><\/ruby>。クヌギ・イチョウ・イロハモミジは冬を前に葉を落とす<ruby>落葉樹<rt>らくようじゅ<\/rt><\/ruby>だよ。"},{"t":"choice","lv":2,"q":"秋に葉の色が赤に変わる植物の組み合わせはどれ？","c":["イロハモミジとニシキギ","イチョウとポプラ","クヌギとコナラ","スギとツバキ"],"e":"赤くなる（<ruby>紅葉<rt>こうよう<\/rt><\/ruby>）のはイロハモミジ・ニシキギ・ツタ。イチョウ・ポプラは黄色、クヌギ・コナラは茶色、スギ・ツバキは<ruby>常緑樹<rt>じょうりょくじゅ<\/rt><\/ruby>で緑のまま。"},{"t":"tf","lv":1,"q":"クヌギやコナラの葉は、落葉する前に茶色になる。","a":true,"e":"<ruby>落葉樹<rt>らくようじゅ<\/rt><\/ruby>の葉の色は、赤（イロハモミジなど）・黄（イチョウなど）・茶色（クヌギ・コナラ・クリ）に分かれる。"},{"t":"order","lv":2,"q":"平地でイロハモミジの<ruby>紅葉<rt>こうよう<\/rt><\/ruby>が見られる時期が早い順にならべよう","c":["北海道","東北地方","関東地方","九州地方"],"e":"<ruby>紅葉<rt>こうよう<\/rt><\/ruby>は気温が下がると始まるので、すずしい北の地方から南の地方へ進む（紅葉前線）。同じ地方では山地から平地へ進む。"},{"t":"tf","lv":2,"q":"<ruby>落葉樹<rt>らくようじゅ<\/rt><\/ruby>は葉を落としたあと、<ruby>枝<rt>えだ<\/rt><\/ruby>に<ruby>冬芽<rt>ふゆめ<\/rt><\/ruby>を残し、春になるとそこから葉や花が出る。","a":true,"e":"<ruby>冬芽<rt>ふゆめ<\/rt><\/ruby>は寒い冬をこすための芽。サクラなども冬芽のすがたで冬を越し、春に花や葉をひらく。"},{"t":"choice","lv":3,"q":"イロハモミジの葉が秋に赤くなるしくみとして正しいものはどれ？","c":["緑色の<ruby>色素<rt>しきそ<\/rt><\/ruby>がこわれ、新しく赤い色素がつくられるから","緑色の<ruby>色素<rt>しきそ<\/rt><\/ruby>がこわれ、もともとあった黄色が目立つようになるから","葉がかれて水分がなくなり、こげたから","雨で葉の表面があらわれて赤くなるから"],"e":"<ruby>紅葉<rt>こうよう<\/rt><\/ruby>は、緑の<ruby>色素<rt>しきそ<\/rt><\/ruby>がこわれて赤い色素がつくられることで起こる。緑の色素がこわれて、もとからあった黄色が見えてくるのは<ruby>黄葉<rt>こうよう<\/rt><\/ruby>（イチョウなど）のしくみ。"},{"t":"choice","lv":1,"q":"次のうち、<ruby>種子<rt>しゅし<\/rt><\/ruby>が風で運ばれる植物はどれ？","c":["ススキ","イノコズチ","カタバミ","クヌギ"],"e":"ススキの<ruby>種子<rt>しゅし<\/rt><\/ruby>には毛があり、風で飛ばされる。イノコズチは動物のからだにつき、カタバミは実がはじけ、クヌギは実が落ちて転がる。"},{"t":"choice","lv":1,"q":"クヌギ・コナラ・シイ・カシなどの実はドングリとよばれる。ドングリはどのように<ruby>散<rt>ち<\/rt><\/ruby>らばる？","c":["木から落ちて、自分の重さで転がる","風に乗って遠くへ飛ぶ","動物のからだにくっつく","実がはじけて飛び出す"],"e":"ドングリは重い実なので、木から落ちて転がって<ruby>散<rt>ち<\/rt><\/ruby>らばる。しぼうが多くふくまれ、<ruby>冬眠<rt>とうみん<\/rt><\/ruby>前のクマの大切なえさにもなる。"},{"t":"choice","lv":2,"q":"<ruby>種子<rt>しゅし<\/rt><\/ruby>が動物に食べられて運ばれる植物の組み合わせはどれ？","c":["ナンテンとアケビ","オナモミとイノコズチ","カエデとマツ","ホウセンカとカタバミ"],"e":"ナンテン・ヤマブドウ・アケビの実は目立つ色をしていて鳥などに食べられ、ふんといっしょに<ruby>種子<rt>しゅし<\/rt><\/ruby>が<ruby>散<rt>ち<\/rt><\/ruby>らばる。"},{"t":"choice","lv":1,"q":"秋に<ruby>産卵<rt>さんらん<\/rt><\/ruby>する<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>のうち、土の中に細長い<ruby>卵<rt>たまご<\/rt><\/ruby>を産むのはどれ？","c":["トノサマバッタ","アキアカネ","カマキリ","ギンヤンマ"],"e":"トノサマバッタやコオロギは土の中に<ruby>産卵<rt>さんらん<\/rt><\/ruby>する。アキアカネ・ギンヤンマなどのトンボは水中、カマキリは草木に産む。"},{"t":"choice","lv":2,"q":"トンボが<ruby>卵<rt>たまご<\/rt><\/ruby>を産む場所と、その<ruby>幼虫<rt>ようちゅう<\/rt><\/ruby>の名前の組み合わせで正しいものはどれ？","c":["水中に産み、<ruby>幼虫<rt>ようちゅう<\/rt><\/ruby>はヤゴ","土の中に産み、<ruby>幼虫<rt>ようちゅう<\/rt><\/ruby>はヤゴ","木の<ruby>枝<rt>えだ<\/rt><\/ruby>に産み、<ruby>幼虫<rt>ようちゅう<\/rt><\/ruby>はヤゴ","水中に産み、<ruby>幼虫<rt>ようちゅう<\/rt><\/ruby>はボウフラ"],"e":"トンボは水辺で水中に<ruby>卵<rt>たまご<\/rt><\/ruby>を産み、<ruby>幼虫<rt>ようちゅう<\/rt><\/ruby>のヤゴは水中でくらす。アキアカネは秋の終わりに<ruby>産卵<rt>さんらん<\/rt><\/ruby>し、卵で冬を越す。"},{"t":"choice","lv":1,"q":"「チンチロリン」と鳴く<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>はどれ？","c":["マツムシ","スズムシ","ウマオイ","クツワムシ"],"e":"マツムシはチンチロリン。スズムシはリーンリーン、ウマオイはスイーッチョン、クツワムシはガチャガチャ。童謡「虫のこえ」にも出てくるよ。"},{"t":"choice","lv":2,"q":"コオロギやキリギリスは、どのようにして音を出している？","c":["左右の<ruby>前羽<rt>まえばね<\/rt><\/ruby>をこすり合わせる","口から声を出す","後ろあしで地面をたたく","はねを速くはばたかせる"],"e":"コオロギやキリギリスのオスは、左右の<ruby>前羽<rt>まえばね<\/rt><\/ruby>をこすり合わせて音を出す。キリギリスとコオロギでは前羽の重なり方が逆になっている。"},{"t":"choice","lv":2,"q":"アユの<ruby>産卵<rt>さんらん<\/rt><\/ruby>と<ruby>稚魚<rt>ちぎょ<\/rt><\/ruby>について、正しい説明はどれ？","c":["川底で<ruby>産卵<rt>さんらん<\/rt><\/ruby>し、<ruby>稚魚<rt>ちぎょ<\/rt><\/ruby>は冬を海ですごす","川底で<ruby>産卵<rt>さんらん<\/rt><\/ruby>し、<ruby>稚魚<rt>ちぎょ<\/rt><\/ruby>は冬を川ですごす","南の海で<ruby>産卵<rt>さんらん<\/rt><\/ruby>し、<ruby>稚魚<rt>ちぎょ<\/rt><\/ruby>は海流に乗って日本にくる","海で<ruby>産卵<rt>さんらん<\/rt><\/ruby>し、<ruby>稚魚<rt>ちぎょ<\/rt><\/ruby>はすぐに川の上流へのぼる"],"e":"アユは川で成長して川底に<ruby>産卵<rt>さんらん<\/rt><\/ruby>し、1年の一生を終える。<ruby>稚魚<rt>ちぎょ<\/rt><\/ruby>は海で冬をすごし、春に川へもどる。南の海で産卵するのはウナギ。"},{"t":"tf","lv":3,"q":"海で大きく成長したおとなのアユが、生まれた川にもどってきて川の上流で<ruby>産卵<rt>さんらん<\/rt><\/ruby>する。","a":false,"e":"これはサケの説明。アユは川で成長して川底に<ruby>産卵<rt>さんらん<\/rt><\/ruby>する。海ですごすのは冬の間の<ruby>稚魚<rt>ちぎょ<\/rt><\/ruby>だよ。"},{"t":"choice","lv":2,"q":"冬を日本ですごす<ruby>渡<rt>わた<\/rt><\/ruby>り鳥（冬鳥）の組み合わせはどれ？","c":["ハクチョウとマガモ","ツバメとカッコウ","スズメとハクチョウ","ツバメとマガモ"],"e":"ハクチョウ・ガン・マガモは秋に北の国から<ruby>渡<rt>わた<\/rt><\/ruby>ってくる冬鳥。ツバメ・カッコウは夏鳥、スズメは一年中日本にいる鳥（留鳥）。"},{"t":"tf","lv":3,"q":"夏鳥も冬鳥も、春には北へ、秋には南へ移動する。","a":true,"e":"夏鳥は春に南の国から日本（北）へ来て、秋に南へ帰る。冬鳥は春に日本から北の国へ帰り、秋に南の日本へ来る。日本にいる季節はちがっても、動く向きは同じだよ。"},{"t":"choice","lv":2,"q":"カエルやヘビ、トカゲは、秋の終わりになるとどうする？","c":["土の中にもぐって<ruby>冬眠<rt>とうみん<\/rt><\/ruby>する","南の国へ<ruby>渡<rt>わた<\/rt><\/ruby>る","<ruby>卵<rt>たまご<\/rt><\/ruby>を産んで一生を終える","木の穴にえさをたくさんためる"],"e":"カエル・ヘビ・トカゲは体温がまわりの気温と同じになる動物。寒いと活動できないので、秋の終わりに土の中にもぐって<ruby>冬眠<rt>とうみん<\/rt><\/ruby>する。"},{"t":"choice","lv":3,"q":"キキョウは、おしべが開いてから4〜5日たってからめしべが開く。これはなぜ？","c":["自分の花の花粉で<ruby>受粉<rt>じゅふん<\/rt><\/ruby>するのをさけるため","花粉を風で遠くへ飛ばすため","虫に花を食べられないようにするため","<ruby>種子<rt>しゅし<\/rt><\/ruby>を早くつくるため"],"e":"キキョウは1つの花の中で「オス」から「メス」へとはたらきが変わる。こうして自分の花粉での<ruby>受粉<rt>じゅふん<\/rt><\/ruby>（自花受粉）をさけ、ほかの株の花粉で受粉しやすくしている。"},{"t":"tf","lv":3,"q":"ドングリが豊作の年の次の年に不作になると、えさが足りなくなり、ツキノワグマが人里に出てくることが増える。","a":true,"e":"ドングリはしぼう分が多く、<ruby>冬眠<rt>とうみん<\/rt><\/ruby>前のツキノワグマの大切なえさ。豊作の年に子グマがたくさん生まれ、次の年に不作になるとえさ不足で出没がふえる。"}]},{"id":"elec1","title":"電気（１）","yomi":"でんき（いち）","emoji":"💡","source":"下 第3回","points":[{"h":"電気を通すもの・通さないもの","t":"<b><ruby>金属<rt>きんぞく<\/rt><\/ruby><\/b>（<ruby>硬貨<rt>こうか<\/rt><\/ruby>・くぎ・クリップ・アルミニウムはくなど）と<b><ruby>黒鉛<rt>こくえん<\/rt><\/ruby><\/b>（シャープペンシルのしん）は電気を通す。ゴム・プラスチック・ガラス・木・ビニルなど電気を通さないものを<b><ruby>絶縁体<rt>ぜつえんたい<\/rt><\/ruby><\/b>という。"},{"h":"豆電球のつくり","t":"光る部分は<b>フィラメント<\/b>で、<b>タングステン<\/b>という<ruby>金属<rt>きんぞく<\/rt><\/ruby>でできている。ガラス球の中はフィラメントが<ruby>燃<rt>も<\/rt><\/ruby>えないように<b>真空<\/b>（またはちっ素とアルゴン）になっている。"},{"h":"豆電球がつく配線","t":"豆電球の<b><ruby>口金<rt>くちがね<\/rt><\/ruby><\/b>（横のねじの部分）と<b>先のつき出た部分<\/b>を、かん電池の<b>別々の<ruby>極<rt>きょく<\/rt><\/ruby><\/b>につなぐとつく。配線されたときの電気の通り道を<b>回路<\/b>という。"},{"h":"ショート（<ruby>短絡<rt>たんらく<\/rt><\/ruby>）","t":"かん電池の＋<ruby>極<rt>きょく<\/rt><\/ruby>と−極が<ruby>導線<rt>どうせん<\/rt><\/ruby>で<b>直接<\/b>つながると、たくさんの電気が一度に流れて熱くなり<b>危険<\/b>。かん電池もすぐ使えなくなる。"},{"h":"かん電池と電流","t":"かん電池は中の<ruby>薬品<rt>やくひん<\/rt><\/ruby>のはたらきで電気を流す。電流は<b>＋<ruby>極<rt>きょく<\/rt><\/ruby>から出て、回路を通り、−極にもどる<\/b>。電気を流す力を<b><ruby>電圧<rt>でんあつ<\/rt><\/ruby><\/b>といい、かん電池はふつう<b>1.5V（ボルト）<\/b>。"},{"h":"発光ダイオード（LED）","t":"<b>LED<\/b>は使う電気の量が<b>少なく<\/b>、<ruby>寿命<rt>じゅみょう<\/rt><\/ruby>が<b>長い<\/b>。電光<ruby>掲示板<rt>けいじばん<\/rt><\/ruby>・信号機・イルミネーションに使われる。長い足を＋<ruby>極<rt>きょく<\/rt><\/ruby>につなぐと光り、<b><ruby>逆<rt>ぎゃく<\/rt><\/ruby>につなぐと光らない<\/b>。"},{"h":"モーター","t":"かん電池の＋<ruby>極<rt>きょく<\/rt><\/ruby>と−極を入れかえると、<b><ruby>逆<rt>ぎゃく<\/rt><\/ruby>向きに回転<\/b>する。せん風機・そうじ機・電気自動車などに使われている。"},{"h":"光電池","t":"<b>光があたると電気をつくる<\/b>。あたる光が強いほど電流は大きく、光が<b><ruby>垂直<rt>すいちょく<\/rt><\/ruby><\/b>にあたるように置くと最も大きくなる。二酸化炭素や<ruby>有害物質<rt>ゆうがいぶっしつ<\/rt><\/ruby>を出さないので<b><ruby>環境<rt>かんきょう<\/rt><\/ruby>にやさしい<\/b>。"},{"h":"手回し発電機","t":"ハンドルを回すと中の<b>モーター<\/b>が回って電気がつくられる。<b>速く回す<\/b>と大きな電気、<b><ruby>逆<rt>ぎゃく<\/rt><\/ruby>に回す<\/b>と電流の向きが逆になる。"},{"h":"<ruby>検流計<rt>けんりゅうけい<\/rt><\/ruby>","t":"回路に流れる<b>電流の大きさと向き<\/b>を調べる道具。<ruby>針<rt>はり<\/rt><\/ruby>のふれる大きさで電流の大きさ、ふれる向きで電流の向きがわかる。回路に<b>直列<\/b>につなぐ。"}],"trivia":["家のコンセントには＋と−の区別がない！ 家庭の電気は「<ruby>交流<rt>こうりゅう<\/rt><\/ruby>」といって、1秒間に50回または60回も電流の向きが入れかわっているからなんだ。","LEDを<ruby>交流<rt>こうりゅう<\/rt><\/ruby>につなぐと、本当は1秒間に50〜60回もついたり消えたりしている。でも人の目には速すぎて、ずっと光っているように見えるよ。","LEDの信号機は熱をほとんど出さないので、雪が積もってもとけず、信号が見えにくくなることがあるんだって。"],"questions":[{"t":"choice","lv":1,"q":"ゴムやプラスチック、ガラスのように、電気を通さないものを何という？","c":["<ruby>絶縁体<rt>ぜつえんたい<\/rt><\/ruby>","<ruby>金属<rt>きんぞく<\/rt><\/ruby>","<ruby>導線<rt>どうせん<\/rt><\/ruby>","回路"],"e":"電気を通さないものが<ruby>絶縁体<rt>ぜつえんたい<\/rt><\/ruby>。ゴム・プラスチック・ガラス・木・ビニルなどがある。<ruby>導線<rt>どうせん<\/rt><\/ruby>のまわりのビニルも絶縁体だよ。"},{"t":"choice","lv":2,"q":"豆電球のガラス球の中が真空になっているのはなぜ？","c":["フィラメントが<ruby>燃<rt>も<\/rt><\/ruby>えないようにするため","フィラメントがよく<ruby>燃<rt>も<\/rt><\/ruby>えるようにするため","ガラス球がよく冷えるようにするため","豆電球を軽くするため"],"e":"フィラメントは電気が流れると熱くなって光る。空気（酸素）があると<ruby>燃<rt>も<\/rt><\/ruby>えてしまうので、真空にするか、燃えないちっ素やアルゴンを入れている。"},{"t":"choice","lv":1,"q":"豆電球のフィラメントは、何という<ruby>金属<rt>きんぞく<\/rt><\/ruby>でできている？","c":["タングステン","アルミニウム","銅","鉄"],"e":"タングステンは熱に強くとけにくい<ruby>金属<rt>きんぞく<\/rt><\/ruby>で、電気のエネルギーを光に変えやすい性質がある。"},{"t":"choice","lv":1,"q":"手回し発電機は、中に入っている何が回転することで電気をつくっている？","c":["モーター","光電池","豆電球","かん電池"],"e":"モーターは電気を流すと回るが、反対に外から回すと電気をつくる。手回し発電機はこのしくみを使っている。"},{"t":"choice","lv":1,"q":"ふつうのかん電池1個の<ruby>電圧<rt>でんあつ<\/rt><\/ruby>は何V（ボルト）？","c":["1.5V","3V","9V","100V"],"e":"かん電池は1.5V。家庭用のコンセントは100Vだよ。"},{"t":"choice","lv":1,"q":"かん電池をつないだ回路で、<ruby>導線<rt>どうせん<\/rt><\/ruby>を流れる電流の向きとして正しいものはどれ？","c":["＋<ruby>極<rt>きょく<\/rt><\/ruby>から出て、回路を通り、−極にもどる","−<ruby>極<rt>きょく<\/rt><\/ruby>から出て、回路を通り、＋極にもどる","決まった向きはなく、そのときによって変わる"],"e":"電流はかん電池の＋<ruby>極<rt>きょく<\/rt><\/ruby>から出て、豆電球などを通り、−極にもどってくる。"},{"t":"choice","lv":1,"q":"電車や駅のホームの電光<ruby>掲示板<rt>けいじばん<\/rt><\/ruby>などに使われている、使う電気の量が少なく<ruby>寿命<rt>じゅみょう<\/rt><\/ruby>が長い光るものを何という？","c":["発光ダイオード（LED）","豆電球","光電池","手回し発電機"],"e":"発光ダイオード（LED）は熱をあまり出さないので使う電気の量が少なく、<ruby>寿命<rt>じゅみょう<\/rt><\/ruby>が長い。信号機やイルミネーションにも使われている。"},{"t":"choice","lv":2,"q":"かん電池の＋<ruby>極<rt>きょく<\/rt><\/ruby>と−極から出た2本の<ruby>導線<rt>どうせん<\/rt><\/ruby>を、どちらも豆電球の<ruby>口金<rt>くちがね<\/rt><\/ruby>（横のねじの部分）につないだ。豆電球はどうなる？","c":["つかない","明るくつく","暗くつく","ついたり消えたりする"],"e":"豆電球は、<ruby>口金<rt>くちがね<\/rt><\/ruby>と先のつき出た部分を別々の<ruby>極<rt>きょく<\/rt><\/ruby>につながないと、電流がフィラメントを通らない。この場合、電気は口金を通って電池から電池へ直接流れ、ショートしてしまう。"},{"t":"choice","lv":1,"q":"かん電池の＋<ruby>極<rt>きょく<\/rt><\/ruby>と−極を<ruby>導線<rt>どうせん<\/rt><\/ruby>で直接つなぎ、一度にたくさんの電気が流れてしまうことを何という？","c":["ショート（<ruby>短絡<rt>たんらく<\/rt><\/ruby>）","直列つなぎ","発電","絶縁"],"e":"ショートするとかん電池や<ruby>導線<rt>どうせん<\/rt><\/ruby>がとても熱くなって危険。かん電池もすぐに使えなくなってしまう。"},{"t":"choice","lv":1,"q":"<ruby>検流計<rt>けんりゅうけい<\/rt><\/ruby>で調べることができるのはどれ？","c":["電流の大きさと向き","電流の大きさだけ","電流の向きだけ","かん電池の重さ"],"e":"<ruby>検流計<rt>けんりゅうけい<\/rt><\/ruby>は<ruby>針<rt>はり<\/rt><\/ruby>のふれる大きさで電流の大きさ、ふれる向きで電流の向きがわかる。ただし細かい値まではわからない。"},{"t":"choice","lv":1,"q":"豆電球・かん電池・クリップで回路をつくり、クリップの間にものをはさんだ。豆電球がつかないのはどれ？","c":["プラスチック","一円<ruby>硬貨<rt>こうか<\/rt><\/ruby>","鉄のくぎ","シャープペンシルのしん"],"e":"一円<ruby>硬貨<rt>こうか<\/rt><\/ruby>（アルミニウム）やくぎ（鉄）は<ruby>金属<rt>きんぞく<\/rt><\/ruby>なので電気を通す。シャープペンシルのしんは<ruby>黒鉛<rt>こくえん<\/rt><\/ruby>で、金属ではないが電気を通す。プラスチックは<ruby>絶縁体<rt>ぜつえんたい<\/rt><\/ruby>。"},{"t":"tf","lv":2,"q":"シャープペンシルのしんは<ruby>金属<rt>きんぞく<\/rt><\/ruby>ではないが、電気を通す。","a":true,"e":"シャープペンシルのしんは「<ruby>黒鉛<rt>こくえん<\/rt><\/ruby>」でできていて、<ruby>金属<rt>きんぞく<\/rt><\/ruby>以外で電気を通すものの代表だよ。"},{"t":"choice","lv":3,"q":"かん電池1個と豆電球1個をつないで豆電球をつけた。この豆電球のソケットの両はしを、さらに別の<ruby>導線<rt>どうせん<\/rt><\/ruby>1本でつなぐとどうなる？","c":["豆電球は消え、電流が<ruby>導線<rt>どうせん<\/rt><\/ruby>を流れてショートする","豆電球がさらに明るくなる","豆電球の明るさは変わらない","豆電球が暗くつく"],"e":"電流は流れやすい<ruby>導線<rt>どうせん<\/rt><\/ruby>のほうを通るので、豆電球には電流が流れず消えてしまう。＋<ruby>極<rt>きょく<\/rt><\/ruby>と−極が導線だけでつながった形になるので、ショートしていて危険。"},{"t":"choice","lv":1,"q":"豆電球で、電流が流れると光る部分を何という？","c":["フィラメント","<ruby>口金<rt>くちがね<\/rt><\/ruby>","ガラス球","ソケット"],"e":"光るのはフィラメント。電気が流れると熱が出て光る。"},{"t":"choice","lv":1,"q":"豆電球の、ねじの形をしていてソケットにはめこむ部分を何という？","c":["<ruby>口金<rt>くちがね<\/rt><\/ruby>","フィラメント","ガラス球","<ruby>導線<rt>どうせん<\/rt><\/ruby>"],"e":"<ruby>口金<rt>くちがね<\/rt><\/ruby>はねじの形をしている。フィラメントの一方のはしは口金に、もう一方は口金の先のつき出た部分に<ruby>金属<rt>きんぞく<\/rt><\/ruby>の線でつながっている。"},{"t":"order","lv":2,"q":"＋<ruby>極<rt>きょく<\/rt><\/ruby>からの<ruby>導線<rt>どうせん<\/rt><\/ruby>を豆電球の先のつき出た部分に、−極からの導線を<ruby>口金<rt>くちがね<\/rt><\/ruby>につないだ。電流が通る順にならべよう","c":["かん電池の＋<ruby>極<rt>きょく<\/rt><\/ruby>","豆電球のつき出た部分","フィラメント","<ruby>口金<rt>くちがね<\/rt><\/ruby>","かん電池の−<ruby>極<rt>きょく<\/rt><\/ruby>"],"e":"電流は＋<ruby>極<rt>きょく<\/rt><\/ruby>→<ruby>導線<rt>どうせん<\/rt><\/ruby>→つき出た部分→<ruby>金属<rt>きんぞく<\/rt><\/ruby>の線→フィラメント→金属の線→<ruby>口金<rt>くちがね<\/rt><\/ruby>→導線→−極と流れる。フィラメントを通るので豆電球が光る。"},{"t":"choice","lv":3,"q":"豆電球の<ruby>口金<rt>くちがね<\/rt><\/ruby>には、ねじの部分と先のつき出た部分の間に<ruby>絶縁体<rt>ぜつえんたい<\/rt><\/ruby>がある。これは何のため？","c":["電流が直接流れずに、必ずフィラメントを通るようにするため","豆電球を軽くするため","光を反射して明るくするため","かん電池を長持ちさせるため"],"e":"<ruby>絶縁体<rt>ぜつえんたい<\/rt><\/ruby>がないと、電気がフィラメントを通らずにねじの部分とつき出た部分の間を直接流れてしまう。ソケットも同じように絶縁体で2つの部分を分けている。"},{"t":"choice","lv":2,"q":"豆電球をつないだかん電池の＋<ruby>極<rt>きょく<\/rt><\/ruby>と−極を入れかえると、豆電球の明るさはどうなる？","c":["変わらない","明るくなる","暗くなる","消える"],"e":"豆電球は電流の向きに関係なく光るので、電池の向きを入れかえても明るさは変わらない。"},{"t":"choice","lv":2,"q":"発光ダイオード（LED）を、かん電池の＋<ruby>極<rt>きょく<\/rt><\/ruby>と−極を<ruby>逆<rt>ぎゃく<\/rt><\/ruby>にしてつなぐとどうなる？","c":["光らない","明るく光る","暗く光る"],"e":"LEDは長い足を＋<ruby>極<rt>きょく<\/rt><\/ruby>、短い足を−極につなぐと光る。<ruby>逆<rt>ぎゃく<\/rt><\/ruby>につなぐと電流が流れず光らない。ここが豆電球とちがうところ。"},{"t":"tf","lv":1,"q":"発光ダイオード（LED）は、豆電球や蛍光灯にくらべて使う電気の量が少なく、<ruby>寿命<rt>じゅみょう<\/rt><\/ruby>が長い。","a":true,"e":"LEDは熱をあまり出さず、電気を効率よく光に変える。だから省エネで長持ちする。"},{"t":"choice","lv":1,"q":"プロペラをつけたモーターにつないだかん電池の＋<ruby>極<rt>きょく<\/rt><\/ruby>と−極を入れかえると、プロペラはどうなる？","c":["<ruby>逆<rt>ぎゃく<\/rt><\/ruby>向きに回る","同じ向きに回る","止まる","速く回る"],"e":"電流の向きが<ruby>逆<rt>ぎゃく<\/rt><\/ruby>になるので、モーターも逆向きに回転する。"},{"t":"choice","lv":2,"q":"電気を流す力の大きさを何という？また、その単位は？","c":["<ruby>電圧<rt>でんあつ<\/rt><\/ruby>・V（ボルト）","電流・V（ボルト）","<ruby>電圧<rt>でんあつ<\/rt><\/ruby>・L（リットル）","電流・g（グラム）"],"e":"電気を流す力を<ruby>電圧<rt>でんあつ<\/rt><\/ruby>といい、単位はV（ボルト）。電圧の単位は、電池を発明したボルタという人の名前からきている。"},{"t":"choice","lv":2,"q":"光電池の説明として正しいものはどれ？","c":["光があたれば電気をつくり出すことができる","二酸化炭素は出すが、<ruby>有害物質<rt>ゆうがいぶっしつ<\/rt><\/ruby>は出さない","中の<ruby>薬品<rt>やくひん<\/rt><\/ruby>のはたらきで電気をつくり出す","中のモーターを回転させて電気をつくり出す"],"e":"光電池は光があたると電気をつくる。二酸化炭素も<ruby>有害物質<rt>ゆうがいぶっしつ<\/rt><\/ruby>も出さないので<ruby>環境<rt>かんきょう<\/rt><\/ruby>にやさしい。<ruby>薬品<rt>やくひん<\/rt><\/ruby>を使うのはかん電池、モーターを回すのは手回し発電機。"},{"t":"choice","lv":2,"q":"モーターをつないだ光電池の一部を紙でおおってかげをつくると、モーターの回る速さはどうなる？","c":["おそくなる","速くなる","変わらない"],"e":"光電池にあたる光が弱くなると、つくられる電流が小さくなるので、モーターはおそく回る。"},{"t":"choice","lv":3,"q":"光電池でいちばん大きな電流を流すには、光電池をどのように置けばよい？","c":["日光が<ruby>垂直<rt>すいちょく<\/rt><\/ruby>にあたるように置く","日光とへい行になるように置く","かげの中に置く","光電池を裏返しにして置く"],"e":"光が<ruby>垂直<rt>すいちょく<\/rt><\/ruby>にあたると受け取る光が最も多くなり、電流が最も大きくなる。鏡で光を集めて強い光をあてても電流は大きくなる。"},{"t":"choice","lv":2,"q":"手回し発電機のハンドルを速く回すと、どうなる？","c":["大きな電気がつくられる","電流の向きが<ruby>逆<rt>ぎゃく<\/rt><\/ruby>になる","電気がつくられなくなる","変わらない"],"e":"ハンドルを速く回すほど大きな電気がつくられ、つないだ豆電球は明るくつく。"},{"t":"tf","lv":2,"q":"手回し発電機のハンドルを<ruby>逆<rt>ぎゃく<\/rt><\/ruby>向きに回すと、流れる電流の向きも逆になる。","a":true,"e":"回す向きを<ruby>逆<rt>ぎゃく<\/rt><\/ruby>にすると電流の向きが逆になるので、つないだモーターも逆向きに回る。"},{"t":"choice","lv":3,"q":"手回し発電機に何もつながないときと、<ruby>導線<rt>どうせん<\/rt><\/ruby>だけをつないだ（ショートさせた）ときでは、ハンドルの手ごたえはどうなる？","c":["<ruby>導線<rt>どうせん<\/rt><\/ruby>だけをつないだときのほうが重い","何もつながないときのほうが重い","どちらも同じ"],"e":"手回し発電機は回す運動を電気に変えている。流れる電流が大きいほど手ごたえは重くなる。何もつながないと電流が流れないので軽く、ショートさせると大きな電流が流れて重い。"},{"t":"choice","lv":1,"q":"豆電球やかん電池などを、電気が流れるように配線したときの電気の通り道を何という？","c":["回路","<ruby>絶縁体<rt>ぜつえんたい<\/rt><\/ruby>","<ruby>電圧<rt>でんあつ<\/rt><\/ruby>","フィラメント"],"e":"電気の通り道が回路。とちゅうで切れていると電流は流れない。"},{"t":"choice","lv":2,"q":"<ruby>検流計<rt>けんりゅうけい<\/rt><\/ruby>をつないだ豆電球の回路で、かん電池を1個から2個の一直線（直列）つなぎにすると、<ruby>針<rt>はり<\/rt><\/ruby>のふれ方はどうなる？","c":["同じ向きに、より大きくふれる","<ruby>逆<rt>ぎゃく<\/rt><\/ruby>向きにふれる","同じ向きに、より小さくふれる","ふれなくなる"],"e":"かん電池2個を一直線につなぐと、同じ向きに大きい電流が流れる。だから<ruby>針<rt>はり<\/rt><\/ruby>は同じ向きに大きくふれる。"},{"t":"choice","lv":2,"q":"<ruby>検流計<rt>けんりゅうけい<\/rt><\/ruby>をつないだ回路で、かん電池の向きを<ruby>逆<rt>ぎゃく<\/rt><\/ruby>にすると、検流計の<ruby>針<rt>はり<\/rt><\/ruby>はどうなる？","c":["反対向きにふれる","同じ向きにふれる","まったくふれなくなる"],"e":"電流の向きが<ruby>逆<rt>ぎゃく<\/rt><\/ruby>になるので、<ruby>針<rt>はり<\/rt><\/ruby>のふれる向きも逆になる。電流の向きがわからないときは<ruby>検流計<rt>けんりゅうけい<\/rt><\/ruby>で調べよう。"},{"t":"choice","lv":3,"q":"<ruby>検流計<rt>けんりゅうけい<\/rt><\/ruby>のつなぎ方として正しいものはどれ？","c":["豆電球などといっしょに、回路に一直線（直列）になるようにつなぐ","かん電池の＋<ruby>極<rt>きょく<\/rt><\/ruby>と−極に、<ruby>検流計<rt>けんりゅうけい<\/rt><\/ruby>だけを直接つなぐ","回路にはつながず、<ruby>導線<rt>どうせん<\/rt><\/ruby>の近くに置くだけにする"],"e":"<ruby>検流計<rt>けんりゅうけい<\/rt><\/ruby>は回路に直列につなぐ。豆電球などを通さずにかん電池に直接つなぐと、たくさんの電流が一度に流れて検流計がこわれるおそれがある。"},{"t":"choice","lv":3,"q":"家庭のコンセントに＋と−の区別がないのはなぜ？","c":["電流の流れる向きが一定ではなく、たえず入れかわっているから","コンセントには電気が流れていないから","<ruby>電圧<rt>でんあつ<\/rt><\/ruby>がかん電池と同じ1.5Vだから","コンセントが<ruby>絶縁体<rt>ぜつえんたい<\/rt><\/ruby>でできているから"],"e":"家庭の電気は「<ruby>交流<rt>こうりゅう<\/rt><\/ruby>」で、1秒間に50回または60回、電流の向きが入れかわっている。かん電池のように向きが決まった電流は「直流」という。"}]},{"id":"elec2","title":"電気（２）","yomi":"でんき（に）","emoji":"🔋","source":"下 第4回","points":[{"h":"回路図","t":"配線のようすを<b>電気用図記号<\/b>で表した図が<b>回路図<\/b>。<ruby>導線<rt>どうせん<\/rt><\/ruby>はまっすぐな直線でかき、ソケットや電池ホルダーは<ruby>省<rt>はぶ<\/rt><\/ruby>く。"},{"h":"電気用図記号","t":"<b>かん電池<\/b>は長い線と短い線（<b>長い方が＋<ruby>極<rt>きょく<\/rt><\/ruby><\/b>）。<b>豆電球<\/b>は○の中に×、<b>モーター<\/b>は○の中にM、<b>スイッチ<\/b>は<ruby>導線<rt>どうせん<\/rt><\/ruby>のとちゅうにななめの線。導線がつながっているところは●でかく。"},{"h":"直列つなぎと<ruby>並列<rt>へいれつ<\/rt><\/ruby>つなぎ","t":"<ruby>枝分<rt>えだわ<\/rt><\/ruby>かれせず<b>一直線<\/b>につなぐのが<b>直列つなぎ<\/b>、<b>枝分かれ<\/b>させて2つ以上の通り道にするのが<b><ruby>並列<rt>へいれつ<\/rt><\/ruby>つなぎ<\/b>。"},{"h":"かん電池の直列つなぎ","t":"かん電池1このときより豆電球は<b>明るくなる<\/b>。1こ外すと回路がとぎれて<b>消える<\/b>。電流が大きいので、かん電池は<b>早く使えなくなる<\/b>。"},{"h":"かん電池の<ruby>並列<rt>へいれつ<\/rt><\/ruby>つなぎ","t":"豆電球の明るさは1このときと<b>変わらない<\/b>。1こ外しても<b>消えない<\/b>。1このかん電池に流れる電流が小さくなるので<b>長持ち<\/b>する。"},{"h":"豆電球の直列つなぎ","t":"豆電球1このときより<b>暗くなる<\/b>。1こ外すと（切れると）もう1こも<b>消える<\/b>。電流が小さくなるので、かん電池は長持ちする。"},{"h":"豆電球の<ruby>並列<rt>へいれつ<\/rt><\/ruby>つなぎ","t":"明るさは1このときと<b>変わらない<\/b>。1こ外しても、ほかの豆電球は<b>ついたまま<\/b>。かん電池に流れる電流が大きくなるので、かん電池は早く使えなくなる。"},{"h":"いろいろなつなぎ方","t":"豆電球直列＋電池<ruby>並列<rt>へいれつ<\/rt><\/ruby>→<b>暗い<\/b>。豆電球並列＋電池直列→<b>明るい<\/b>。豆電球並列＋電池並列、豆電球直列＋電池直列→かん電池1こ・豆電球1こと<b>同じ明るさ<\/b>。"},{"h":"電流と明るさ・使える時間","t":"豆電球を流れる<b>電流が大きいほど明るい<\/b>。かん電池に流れる<b>電流が大きいほど、使える時間は短い<\/b>。"},{"h":"電流を数で考える","t":"電池1こ・豆電球1この電流を<b>1<\/b>とすると、電池2こ直列なら<b>2<\/b>、豆電球2こ直列なら<b>1/2<\/b>。豆電球2こ<ruby>並列<rt>へいれつ<\/rt><\/ruby>なら1こ1こに1ずつ流れ、電池からは合わせて<b>2<\/b>流れ出る。"}],"trivia":["冬にドアノブをさわって「ビリッ」とくるのは<ruby>静電気<rt>せいでんき<\/rt><\/ruby>のしわざ。服などにたまった電気が、手とドアノブの間で一気に流れるんだ。","<ruby>雷<rt>かみなり<\/rt><\/ruby>も<ruby>静電気<rt>せいでんき<\/rt><\/ruby>！ <ruby>積乱雲<rt>せきらんうん<\/rt><\/ruby>の中で氷の<ruby>粒<rt>つぶ<\/rt><\/ruby>がぶつかり合って電気がたまり、がまんできなくなると一気に流れ落ちる。その電圧は平均で約1億ボルトにもなるよ。","家のコンセントはすべて<ruby>並列<rt>へいれつ<\/rt><\/ruby>つなぎ。だから、テレビを消しても冷蔵庫は動き続けるし、1つ1つの電気製品を別々にON・OFFできるんだ。"],"questions":[{"t":"choice","lv":1,"q":"かん電池1こと豆電球1こをつないだ回路とくらべて、かん電池1こに豆電球2こを直列につなぐと、豆電球1こ1この明るさはどうなる？","c":["暗くなる","明るくなる","変わらない"],"e":"豆電球を直列につなぐと電流が流れにくくなり、流れる電流が小さくなるので暗くなる。"},{"t":"tf","lv":1,"q":"かん電池1こと豆電球1こをつないだ回路とくらべて、かん電池2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>につないで豆電球1こをつなぐと、豆電球の明るさは変わらない。","a":true,"e":"かん電池を<ruby>並列<rt>へいれつ<\/rt><\/ruby>につないでも豆電球の明るさは変わらない。そのかわり、かん電池1こ1こに流れる電流が小さくなり、長持ちする。"},{"t":"tf","lv":1,"q":"かん電池1こと豆電球1こをつないだ回路とくらべて、かん電池1こに豆電球2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>につなぐと、豆電球1こ1こは暗くなる。","a":false,"e":"豆電球を<ruby>並列<rt>へいれつ<\/rt><\/ruby>につないでも、1こ1この明るさは変わらない。それぞれの豆電球に、1このときと同じ大きさの電流が流れるからだよ。"},{"t":"choice","lv":1,"q":"かん電池1こと豆電球1こをつないだ回路とくらべて、かん電池2こを直列につないで豆電球1こをつなぐと、豆電球の明るさはどうなる？","c":["明るくなる","暗くなる","変わらない"],"e":"かん電池を直列につなぐと、流れる電流が大きくなるので豆電球は明るくなる。"},{"t":"choice","lv":2,"q":"かん電池1こに豆電球2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>につないだ回路で、豆電球を1こはずすと、もう1この豆電球はどうなる？","c":["同じ明るさのままつく","消える","暗くなる","明るくなる"],"e":"<ruby>並列<rt>へいれつ<\/rt><\/ruby>つなぎは電流の通り道が2つある。片方の通り道がとぎれても、もう片方には変わらず電流が流れ続ける。"},{"t":"choice","lv":2,"q":"かん電池2こを直列につないで豆電球1こをつないだ回路で、かん電池を1こはずすと、豆電球はどうなる？","c":["消える","暗くなる","同じ明るさのままつく"],"e":"直列つなぎは電流の通り道が1つしかない。かん電池を1こはずすと回路がとぎれて、電流が流れなくなる。"},{"t":"choice","lv":1,"q":"回路図で、かん電池の記号は長い線と短い線がならんでいる。＋<ruby>極<rt>きょく<\/rt><\/ruby>を表しているのはどちら？","c":["長い線","短い線","どちらでもない"],"e":"かん電池の記号は、長い線が＋<ruby>極<rt>きょく<\/rt><\/ruby>、短い線が−極を表す。"},{"t":"choice","lv":2,"q":"かん電池1こと豆電球1こをつないだ回路と、豆電球1こ1この明るさが同じになるのはどれ？","c":["かん電池2こを直列、豆電球2こを直列にした回路","かん電池1こに、豆電球2こを直列にした回路","かん電池2こを直列、豆電球2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>にした回路","かん電池2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>、豆電球2こを直列にした回路"],"e":"かん電池の直列で「明るく」、豆電球の直列で「暗く」なるので、打ち消し合って同じ明るさになる。かん電池も豆電球も<ruby>並列<rt>へいれつ<\/rt><\/ruby>の回路も同じ明るさだよ。"},{"t":"choice","lv":3,"q":"かん電池2こと豆電球2こを使った回路で、かん電池1こと豆電球1こをそれぞれ取りはずしても、残った豆電球が光り続けるのはどれ？","c":["かん電池2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>、豆電球2こを並列にした回路","かん電池2こを直列、豆電球2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>にした回路","かん電池2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>、豆電球2こを直列にした回路","かん電池2こを直列、豆電球2こを直列にした回路"],"e":"直列につないだものを1こはずすと回路がとぎれてしまう。かん電池も豆電球も<ruby>並列<rt>へいれつ<\/rt><\/ruby>につないだ回路なら、どちらをはずしても電流の通り道が残る。"},{"t":"choice","lv":1,"q":"電気用図記号で、○の中に×をかいた記号は何を表す？","c":["豆電球","モーター","スイッチ","かん電池"],"e":"豆電球は○の中に×。モーターは○の中にM、かん電池は長い線と短い線で表す。"},{"t":"choice","lv":1,"q":"スイッチを表す電気用図記号はどれ？","c":["<ruby>導線<rt>どうせん<\/rt><\/ruby>のとちゅうにななめの線がかかれた記号","○の中にMをかいた記号","○の中に×をかいた記号","長い線と短い線がならんだ記号"],"e":"スイッチは、<ruby>導線<rt>どうせん<\/rt><\/ruby>がとちゅうで切れていて、そこにななめの線（開いたスイッチ）がかかれた記号で表す。"},{"t":"choice","lv":2,"q":"かん電池2こと豆電球2こを使った回路のうち、豆電球が最も暗くつくのはどれ？","c":["かん電池2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>、豆電球2こを直列にした回路","かん電池2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>、豆電球2こを並列にした回路","かん電池2こを直列、豆電球2こを直列にした回路","かん電池2こを直列、豆電球2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>にした回路"],"e":"かん電池の<ruby>並列<rt>へいれつ<\/rt><\/ruby>では明るさは変わらず、豆電球の直列で暗くなる。だから「電池並列＋豆電球直列」が最も暗い。"},{"t":"choice","lv":2,"q":"かん電池2こと豆電球2こを使った回路のうち、豆電球が最も明るくつくのはどれ？","c":["かん電池2こを直列、豆電球2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>にした回路","かん電池2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>、豆電球2こを並列にした回路","かん電池2こを直列、豆電球2こを直列にした回路","かん電池2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>、豆電球2こを直列にした回路"],"e":"かん電池の直列で明るくなり、豆電球の<ruby>並列<rt>へいれつ<\/rt><\/ruby>では明るさが変わらない。だから「電池直列＋豆電球並列」が最も明るい。"},{"t":"choice","lv":1,"q":"配線のようすを、電気用図記号を使って表した図を何という？","c":["回路図","見取り図","設計図","天気図"],"e":"回路図を使うと、どこが直列でどこが<ruby>並列<rt>へいれつ<\/rt><\/ruby>かがわかりやすくなる。"},{"t":"tf","lv":2,"q":"回路図では、<ruby>導線<rt>どうせん<\/rt><\/ruby>は直線でかき、ソケットや電池ホルダーのように回路と直接関係のないものは<ruby>省<rt>はぶ<\/rt><\/ruby>いてかく。","a":true,"e":"回路図は電気の通り道をわかりやすく表す図。だから<ruby>導線<rt>どうせん<\/rt><\/ruby>はまっすぐにかき、ソケットなどはかかない。"},{"t":"tf","lv":2,"q":"回路図で、<ruby>導線<rt>どうせん<\/rt><\/ruby>どうしがつながっているところは黒い点（●）でかく。","a":true,"e":"つながっている<ruby>導線<rt>どうせん<\/rt><\/ruby>は交わるところに●をかく。●がないただの交わりや、とび越える形でかいたものは「つながっていない導線」。"},{"t":"tf","lv":1,"q":"回路が<ruby>枝分<rt>えだわ<\/rt><\/ruby>かれするようなつなぎ方を<ruby>並列<rt>へいれつ<\/rt><\/ruby>つなぎ、枝分かれしないで一直線につなぐつなぎ方を直列つなぎという。","a":true,"e":"かん電池も豆電球も、一直線なら直列つなぎ、<ruby>枝分<rt>えだわ<\/rt><\/ruby>かれしていれば<ruby>並列<rt>へいれつ<\/rt><\/ruby>つなぎ。"},{"t":"choice","lv":2,"q":"かん電池1こに豆電球2こを直列につないだ回路で、豆電球を1こはずすと、もう1この豆電球はどうなる？","c":["消える","明るくなる","同じ明るさのままつく","暗くなる"],"e":"直列つなぎでは、豆電球が1こ切れただけで回路がとぎれ、ほかの豆電球も消えてしまう。"},{"t":"tf","lv":2,"q":"かん電池2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>につないだ回路で、かん電池を1こはずすと豆電球は消える。","a":false,"e":"かん電池の<ruby>並列<rt>へいれつ<\/rt><\/ruby>つなぎでは、1こはずしても残りのかん電池で回路がつながっているので、豆電球は同じ明るさのままつく。"},{"t":"tf","lv":2,"q":"かん電池1こに豆電球3こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>につなぐと、3こともかん電池1こ・豆電球1このときと同じ明るさでつく。","a":true,"e":"<ruby>並列<rt>へいれつ<\/rt><\/ruby>につないだ豆電球には、それぞれ1このときと同じ大きさの電流が流れる。何こ並列にしても1こ1この明るさは変わらない。"},{"t":"tf","lv":1,"q":"豆電球を流れる電流が大きいほど、豆電球は明るくつく。","a":true,"e":"明るさは電流の大きさで決まる。かん電池の直列で電流が大きくなると明るく、豆電球の直列で電流が小さくなると暗くなる。"},{"t":"order","lv":2,"q":"豆電球が明るくつく順にならべよう","c":["かん電池2こを直列につなぎ、豆電球1こをつないだ回路","かん電池1こに豆電球1こをつないだ回路","かん電池1こに豆電球2こを直列につないだ回路"],"e":"電池1こ・豆電球1この電流を1とすると、電池2こ直列は2、豆電球2こ直列は1/2。電流が大きいほど明るい。"},{"t":"choice","lv":2,"q":"かん電池2こを直列につなぐと、かん電池1このときとくらべて、かん電池が使える時間はどうなる？","c":["短くなる","長くなる","変わらない"],"e":"直列つなぎでは大きな電流が流れるので豆電球は明るいが、かん電池は早く使えなくなる。"},{"t":"choice","lv":3,"q":"かん電池2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>につなぐと、かん電池1このときより長持ちする。その理由として正しいものはどれ？","c":["かん電池1こ1こに流れる電流が小さくなるから","豆電球が暗くなるから","回路に電流が流れなくなるから","電流の向きが逆になるから"],"e":"<ruby>並列<rt>へいれつ<\/rt><\/ruby>では、2このかん電池で1このときと同じ電流を分けて流す。1こあたりの電流が小さくなるので、長く使える。豆電球の明るさは変わらないよ。"},{"t":"tf","lv":3,"q":"かん電池1こに豆電球2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>につなぐと、豆電球の明るさは1このときと同じだが、かん電池は早く使えなくなる。","a":true,"e":"豆電球1こ1こに1の電流が流れるので、かん電池からは合わせて2の電流が流れ出る。電池に流れる電流が大きくなるので、早く使えなくなる。"},{"t":"choice","lv":3,"q":"かん電池1こに豆電球2こを<ruby>並列<rt>へいれつ<\/rt><\/ruby>につないだ。かん電池から流れ出る電流は、かん電池1こに豆電球1こをつないだときの何倍？","c":["2倍","同じ（1倍）","半分","4倍"],"e":"<ruby>並列<rt>へいれつ<\/rt><\/ruby>の豆電球にはそれぞれ1ずつの電流が流れ、それが合流してかん電池を通るので、全体では2になる。"},{"t":"order","lv":3,"q":"かん電池が長持ちする順（長く使える順）にならべよう","c":["かん電池2こ<ruby>並列<rt>へいれつ<\/rt><\/ruby>・豆電球2こ直列","かん電池1こ・豆電球2こ直列","かん電池1こ・豆電球1こ","かん電池1こ・豆電球2こ<ruby>並列<rt>へいれつ<\/rt><\/ruby>","かん電池2こ直列・豆電球2こ<ruby>並列<rt>へいれつ<\/rt><\/ruby>"],"e":"かん電池1こに流れる電流で考える。電池<ruby>並列<rt>へいれつ<\/rt><\/ruby>＋豆直列は1/4、電池1こ＋豆直列は1/2、電池1こ＋豆1こは1、電池1こ＋豆並列は2、電池直列＋豆並列は4。電流が小さいほど長持ちする。"},{"t":"tf","lv":3,"q":"2このかん電池を、＋<ruby>極<rt>きょく<\/rt><\/ruby>どうしが向かい合うように一直線につなぐと、豆電球は明るくつく。","a":false,"e":"かん電池を直列につなぐときは、一方の＋<ruby>極<rt>きょく<\/rt><\/ruby>ともう一方の−極をつなぐ。＋極どうしを向かい合わせると、電流を流そうとする力が打ち消し合って電流は流れない。"},{"t":"choice","lv":2,"q":"かん電池1こにモーター2こを直列につなぐと、モーター1こだけのときとくらべて、モーターの回り方はどうなる？","c":["おそくなる","速くなる","変わらない"],"e":"モーターも豆電球と同じで、直列につなぐと流れる電流が小さくなるので、回るのがおそくなる。"},{"t":"choice","lv":3,"q":"家庭のコンセントは、電源に対して何つなぎになっている？","c":["<ruby>並列<rt>へいれつ<\/rt><\/ruby>つなぎ","直列つなぎ","どこにもつながっていない"],"e":"<ruby>並列<rt>へいれつ<\/rt><\/ruby>つなぎなので、電気製品をいくつつないでもそれぞれにしっかり電気が届き、1つ1つ別々にON・OFFできる。たくさん使いすぎて電流が大きくなりすぎるとブレーカーが回路を切る。"},{"t":"choice","lv":3,"q":"<ruby>雷<rt>かみなり<\/rt><\/ruby>はどのようなしくみで起こる？","c":["<ruby>積乱雲<rt>せきらんうん<\/rt><\/ruby>の中で氷の<ruby>粒<rt>つぶ<\/rt><\/ruby>がぶつかり合ってたまった<ruby>静電気<rt>せいでんき<\/rt><\/ruby>が、一気に流れる","太陽の光が雲に反射して光る","雲の中の水が発電機のように回って電気をつくる","地面にたまった電気が空へのぼっていく"],"e":"<ruby>積乱雲<rt>せきらんうん<\/rt><\/ruby>の強い上昇気流で氷の<ruby>粒<rt>つぶ<\/rt><\/ruby>がはげしくぶつかり、電気がたまる。たまった電気が限界をこえると、地面に向かって一気に流れ（放電）、これが落<ruby>雷<rt>かみなり<\/rt><\/ruby>になる。"}]}];

const needFor = lv => 100 + 180 * (lv - 1); // lv → lv+1 に必要なXP（Lv18まで約175回）
function levelInfo(xp) {
  let lv = 1, rest = xp;
  while (rest >= needFor(lv)) { rest -= needFor(lv); lv++; }
  return { lv, rest, need: needFor(lv) };
}
const titleOf = lv => TITLES.filter(t => lv >= t[0]).pop()[1];

let AC = null;
function tone(freqs, dur = .12, type = "triangle", gap = .09, vol = .18) {
  if (!S.settings.sound) return;
  try {
    AC ||= new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
    });
  } catch (e) {}
}
const SFX = {
  ok: () => tone([660, 880], .14),
  ng: () => tone([220, 170], .2, "sawtooth", .12, .08),
  tap: () => tone([520], .05, "sine", 0, .08),
  win: () => tone([523, 659, 784, 1047], .18, "triangle", .11),
  level: () => tone([523, 659, 784, 1047, 1319], .2, "square", .09, .07),
  hit: () => tone([180, 120], .12, "square", .05, .1),
  stamp: () => tone([140], .18, "sine", 0, .35),
};

/* ================= 紙ふぶき ================= */
const fx = $("#fx"), ctx = fx.getContext("2d");
let parts = [], fxOn = false;
function confetti(n = 120) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio;
  const cols = ["#FFBF1F", "#E4472E", "#2F9E5B", "#2F6FE0", "#8A5CF0", "#E28300"];
  for (let i = 0; i < n; i++) parts.push({
    x: fx.width / 2 + (Math.random() - .5) * fx.width * .3, y: fx.height * .35,
    vx: (Math.random() - .5) * 18 * devicePixelRatio, vy: (-Math.random() * 16 - 6) * devicePixelRatio,
    s: (6 + Math.random() * 7) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: pick(cols), life: 140 + Math.random() * 60,
  });
  if (!fxOn) { fxOn = true; requestAnimationFrame(stepFx); }
}
function stepFx() {
  ctx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.life-- > 0 && p.y < fx.height + 40);
  for (const p of parts) {
    p.vy += .45 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66); ctx.restore();
  }
  if (parts.length) requestAnimationFrame(stepFx); else { fxOn = false; ctx.clearRect(0, 0, fx.width, fx.height); }
}

/* ================= 報酬・バッジ ================= */
let pendingModals = [];
function award(id) {
  if (S.badges[id]) return;
  const b = BADGES.find(x => x.id === id); if (!b) return;
  S.badges[id] = Date.now();
  pendingModals.push({ e: b.e, h: "バッジゲット！", p: `<b>${b.n}</b><br>${b.d}` });
}
function addXP(n) {
  const before = levelInfo(S.xp).lv;
  S.xp += n;
  const after = levelInfo(S.xp).lv;
  if (after > before) {
    const newTitle = titleOf(after) !== titleOf(before) ? `<br>しょうごう「<b>${titleOf(after)}</b>」になった！` : "";
    pendingModals.push({ e: "🎉", h: `レベル ${after}！`, p: `レベルアップ！コイン +30${newTitle}`, level: true });
    S.coins += 30;
  }
}
function touchStreak() {
  const t = today();
  if (S.streak.last === t) return;
  S.streak.days = S.streak.last === yesterday() ? S.streak.days + 1 : 1;
  S.streak.last = t;
  if (S.streak.days >= 3) award("streak3");
  if (S.streak.days >= 7) award("streak7");
}
function checkGlobalBadges() {
  if (S.stats.answered >= 100) award("q100");
  if (S.stats.answered >= 500) award("q500");
  if (S.stats.maxCombo >= 10) award("combo10");
  if (S.stats.maxCombo >= 25) award("combo25");
  if (S.stats.perfect >= 1) award("perfect");
  if (S.stats.perfect >= 10) award("perfect10");
  if (S.stats.nigateFixed >= 10) award("nigate10");
  if (Object.values(S.units).filter(u => u.studied).length >= 10) award("study10");
  if (UNITS.length && UNITS.every(u => us(u.id).stars >= 1)) award("allstamp");
  if (AREAS.every(a => S.bosses[a.id])) award("allboss");
  if (stats().full) award("gearset");
  if (UNITS.some(u => mastery(u.id) >= 1)) award("master");
}
function showModals(done) {
  const m = pendingModals.shift();
  if (!m) { done && done(); return; }
  if (m.level) { SFX.level(); confetti(90); } else SFX.win();
  modal(`<div class="e">${m.e}</div><h2>${m.h}</h2><p>${m.p}</p><button class="btn" id="mOk">やったー！</button>`,
    () => showModals(done));
}
function modal(html, onClose) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><div class="modal">${html}</div></div>`;
  const close = () => { root.innerHTML = ""; onClose && onClose(); };
  const ok = root.querySelector("#mOk"); if (ok) { ok.onclick = close; ok.focus(); }
  return { close, root };
}

}

}

let lastResult = null;
function finishQuiz() {
  const total = Q.list.length, answeredN = Q.idx + 1;
  const r = { mode: Q.mode, unit: Q.unit, area: Q.area, correct: Q.correct, total, answeredN, xp: Q.xp, coins: Q.coins, maxCombo: Q.maxCombo, missed: Q.missed, stars: 0, newStamp: null, win: null, boss: Q.boss };
  S.stats.quizzes++;
  touchStreak();
  if (Q.mode === "unit") {
    const st = us(Q.unit), rate = Q.correct / total;
    r.stars = rate === 1 ? 3 : rate >= .8 ? 2 : rate >= .6 ? 1 : 0;
    st.plays++; st.best = Math.max(st.best, Q.correct);
    if (r.stars > st.stars) {
      r.newStars = r.stars - st.stars;
      if (st.stars === 0) r.newStamp = "normal";
      if (r.stars === 3) { r.newStamp = "gold"; award("gold"); }
      r.coins += r.newStars * 15 + (st.stars === 0 ? 30 : 0);
      st.stars = r.stars;
    }
    if (rate === 1) S.stats.perfect++;
    award("first");
  } else if (Q.mode === "challenge") {
    r.win = Q.hearts > 0;
    if (r.win) { const first = !us(Q.unit).crown; r.coins += first ? 40 : 10; if (first) { us(Q.unit).crown = true; award("challenge"); } }
    us(Q.unit).plays++;
  } else if (Q.mode === "daily") {
    r.win = true;
    if (S.daily.date !== today()) { S.daily.date = today(); r.coins += 30; r.dailyBonus = true; }
    if (Q.correct === total) S.stats.perfect++;
  } else if (Q.mode === "boss") {
    r.win = Q.hp <= 0;
    if (r.win) {
      const first = !S.bosses[Q.area];
      S.bosses[Q.area] = true;
      r.coins += first ? (Q.area === "final" ? 300 : 100) : 15;
      r.xp += first ? 100 : 20;
      award(Q.area === "final" ? "final" : "boss");
    }
  } else if (Q.mode === "nigate") {
    r.win = true;
  }
  r.coins = Math.round(r.coins * (1 + stats().per / 100));
  if (Q.boost) { r.xp *= 2; r.boosted = true; S.xpBoost = false; }
  const rolls = Q.mode === "unit" ? (r.stars === 3 ? 2 : r.stars ? 1 : 0)
    : Q.mode === "boss" ? (r.win ? 3 : 0)
    : Q.mode === "challenge" ? (r.win ? 2 : 0)
    : Q.mode === "daily" ? 2 : (Q.correct ? 1 : 0);
  r.drops = rollDrops(rolls, Q.mode === "boss");
  r.dropCap = rolls > 0 && S.drops.n >= DROP_CAP;
  S.coins += r.coins;
  addXP(r.xp);
  checkGlobalBadges();
  save();
  lastResult = r;
  go("result");
}

  const t = { int: 0, str: 0, con: 0, per: 0 }, sets = {};

  eq.forEach(g => { Object.entries(g.st).forEach(([k, v]) => t[k] += v); sets[g.set] = (sets[g.set] || 0) + 1; });

  if (full) Object.keys(t).forEach(k => t[k] += 2);

}

const addInv = (kind, id, n = 1) => { S.inv[kind][id] = (S.inv[kind][id] || 0) + n; };
function randomDrop() {
  const r = Math.random();
  if (r < .3) { const e = pick(EGGS); addInv("eggs", e.id); return { html: eggIcon(e.id), n: `${e.n}のたまご` }; }
  if (r < .55) {
    const p = Math.random() < .06 ? POT_BY.rainbow : pick(POTIONS.filter(x => !x.anim));
    addInv("potions", p.id); return { html: potIcon(p.id), n: `${p.n}のくすり` };
  }
  const f = pick(FOODS); addInv("food", f.id); return { html: f.e, n: f.n };
}
function rollDrops(rolls, sure) {
  const t = today();
  if (S.drops.date !== t) S.drops = { date: t, n: 0 };
  const chance = Math.min(.95, .6 * (1 + stats().per / 100)), out = [];
  for (let i = 0; i < rolls && S.drops.n < DROP_CAP; i++) {
    if (!sure && Math.random() > chance) continue;
    out.push(randomDrop()); S.drops.n++;
  }
  return out;
}

function goodCard({ icon, name, sub = "", label, cls = "", attr = "", sale = false }) {
  return `<button class="good ${cls}" ${attr}>${sale ? `<span class="saletag">SALE</span>` : ""}
    <span class="gi">${icon}</span><span class="gn">${name}</span>${sub ? `<span class="gs">${sub}</span>` : ""}<span class="gp">${label}</span></button>`;
}
function buy(price, icon, name, onBuy, after) {
  if (S.coins < price) { SFX.ng(); toast(`コインがあと ${price - S.coins} たりないよ`); return; }
  const m = modal(`<div class="e">${icon}</div><h2>かう？</h2><p><b>${name}</b><br>🪙${price} つかうよ（のこり ${S.coins - price}）</p>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="mNo">やめる</button><button class="btn" id="mBuy">かう！</button></div>`);
  m.root.querySelector("#mNo").onclick = m.close;
  m.root.querySelector("#mBuy").onclick = () => {
    S.coins -= price; onBuy(); award("shop"); checkGlobalBadges(); save();
    m.close(); SFX.win(); confetti(50); showModals(after);
  };
}

function askPin(then) {
  const setting = !S.pin;
  const m = modal(`<div class="e">🔐</div><h2>${setting ? "PINをきめる" : "PINを入力"}</h2>
    <p class="muted" style="font-size:14px;font-weight:700;margin:0">${setting ? "おうちの人だけが知っている4けたの数字を決めてください。" : "おうちの人の4けたのPINを入れてください。"}</p>
    <input id="mPin" class="pin-in" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN">
    <div class="row" style="justify-content:center"><button class="btn ghost" id="mNo">やめる</button><button class="btn" id="mGo">OK</button></div>`);
  const inp = m.root.querySelector("#mPin"); inp.focus();
  m.root.querySelector("#mNo").onclick = m.close;
  m.root.querySelector("#mGo").onclick = () => {
    const v = inp.value.trim();
    if (!/^\d{4}$/.test(v)) { toast("4けたの数字を入れてください"); return; }
    if (setting) { S.pin = v; save(); toast("PINを決めました"); }
    else if (v !== S.pin) { SFX.ng(); toast("PINがちがいます"); inp.value = ""; return; }
    m.close(); then();
  };
}

function pickGear(slot) {
  const owned = GEAR.filter(g => g.slot === slot && S.gear.owned.includes(g.id));
  const m = modal(`<h2>${SLOTS[slot]}</h2>${owned.length ? `<div class="goods">${owned.map(g => goodCard({ icon: g.e, name: g.n, sub: statText(g.st), label: S.gear.eq[slot] === g.id ? "そうびちゅう" : "そうびする", cls: S.gear.eq[slot] === g.id ? "eq" : "", attr: `data-pick="${g.id}"` })).join("")}</div>` : `<p>まだ持っていないよ。</p>`}
    <div class="row" style="justify-content:center">${S.gear.eq[slot] ? `<button class="btn ghost" id="mOff">はずす</button>` : ""}<button class="btn ghost" id="mShop">ショップへ</button><button class="btn" id="mNo">とじる</button></div>`);
  const done = () => { m.close(); checkGlobalBadges(); save(); showModals(() => go("bag")); };
  m.root.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { S.gear.eq[slot] = b.dataset.pick; SFX.tap(); done(); });
  m.root.querySelector("#mOff") && (m.root.querySelector("#mOff").onclick = () => { S.gear.eq[slot] = null; done(); });
  m.root.querySelector("#mShop").onclick = () => { m.close(); go("shop", "gear"); };
  m.root.querySelector("#mNo").onclick = m.close;
}
function hatch() {
  const { egg, pot } = bagSel;
  if (!egg || !pot) return;
  const k = `${egg}-${pot}`;
  if (S.pets[k] !== undefined) { SFX.ng(); toast("この組み合わせのペットはもういるよ。ちがうくすりをためそう"); return; }
  if (!(S.inv.eggs[egg] > 0) || !(S.inv.potions[pot] > 0)) return;
  S.inv.eggs[egg]--; S.inv.potions[pot]--; S.pets[k] = 0;
  if (!S.activePet) S.activePet = k;
  award("hatch"); if (Object.keys(S.pets).length >= 10) award("pets10");
  bagSel = { egg: null, pot: null, pet: k };
  pendingModals.unshift({ e: petIcon(k), h: "たまごがかえった！", p: `<b>${petParts(k).name}</b>がうまれたよ。えさをあげて育てよう！` });
  save(); confetti(80); showModals(() => go("bag"));
}
function feed(k, food) {
  if (!k || S.pets[k] === undefined || S.pets[k] >= 100 || !(S.inv.food[food] > 0)) return;
  S.inv.food[food]--;
  const fav = EGG_BY[k.split("-")[0]].food === food;
  S.pets[k] = Math.min(100, S.pets[k] + (fav ? 25 : 10));
  SFX.ok(); toast(fav ? "だいこうぶつ！ なかよし度+25" : "もぐもぐ… なかよし度+10");
  if (S.pets[k] >= 100) { award("grown"); pendingModals.unshift({ e: petIcon(k), h: "大人になった！", p: `<b>${petParts(k).name}</b>が大きく育ったよ！` }); confetti(100); }
  save(); showModals(() => go("bag"));
}

go("home");
</script>
