<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="小4理科をクイズ・スタンプ帳・ボスバトルで学べるゲーム">
<title>りかたんけん手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  /* ひとつの世界観（方眼ノート）に決めたライト単一テーマ */
  :root {
    color-scheme: light;
    --paper: #F3F8F6;
    --grid: #DCEAE5;
    --grid-strong: #C8DDD6;
    --ink: #1F2A44;
    --ink-soft: #56627D;
    --card: #FFFFFF;
    --line: #D5DFE6;
    --stamp: #E4472E;
    --gold: #FFBF1F;
    --gold-deep: #C98A00;
    --ok: #1FA65A;
    --ok-soft: #DDF5E6;
    --ng: #E0473C;
    --ng-soft: #FDE3E0;
    --life: #2F9E5B;   --life-soft: #DDF3E4;
    --earth: #2F6FE0;  --earth-soft: #DDE8FC;
    --matter: #8A5CF0; --matter-soft: #ECE4FE;
    --energy: #E28300; --energy-soft: #FFEFD4;
    --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --r: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--body);
    font-weight: 500;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    font-size: 16px;
    line-height: 1.7;
    -webkit-tap-highlight-color: transparent;
  }
  body.nofuri rt { display: none; }
  rt { font-size: .55em; font-weight: 700; color: var(--ink-soft); }
  button { font-family: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--earth); outline-offset: 2px; }
  .wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 110px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  .display { font-family: var(--display); font-weight: 400; letter-spacing: .02em; }
  .num { font-family: var(--display); font-variant-numeric: tabular-nums; }

  /* ---------- 上部ステータス ---------- */
  .topbar {
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    background: var(--card); border: 2px solid var(--ink); border-radius: var(--r);
    padding: 10px 14px; box-shadow: 0 4px 0 var(--ink);
  }
  .avatar {
    width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
    font-size: 32px; background: var(--gold); border: 2px solid var(--ink); cursor: pointer;
  }
  .who { min-width: 0; }
  .who .name { font-weight: 900; font-size: 17px; line-height: 1.2; }
  .who .title { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
  .xpbar { height: 12px; border-radius: 99px; background: #E9EEF2; border: 2px solid var(--ink); overflow: hidden; margin-top: 4px; }
  .xpbar i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--gold) 0 8px, #FFD45C 8px 16px); transition: width .6s; }
  .xpmeta { font-size: 11px; color: var(--ink-soft); font-weight: 700; display: flex; flex-wrap: wrap; gap: 0 8px; justify-content: space-between; }
  .pills { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .pill { display: inline-flex; gap: 4px; align-items: center; font-weight: 900; font-size: 14px; background: #F5F7FA; border: 2px solid var(--line); border-radius: 99px; padding: 1px 10px; white-space: nowrap; }

  /* ---------- 共通 ---------- */
  .sec-h { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; flex-wrap: wrap; }
  .sec-h h2 { font-family: var(--display); font-weight: 400; font-size: 22px; }
  .sec-h .tag { font-size: 12px; font-weight: 900; padding: 2px 10px; border-radius: 99px; color: #fff; letter-spacing: .08em; }
  .sec-h .sub { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
  .card { background: var(--card); border: 2px solid var(--ink); border-radius: var(--r); padding: 16px; box-shadow: 0 4px 0 var(--ink); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-weight: 900; font-size: 17px; border: 2px solid var(--ink); border-radius: 14px;
    padding: 12px 20px; cursor: pointer; background: var(--gold); box-shadow: 0 4px 0 var(--ink);
    transition: transform .06s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .btn.ghost { background: var(--card); }
  .btn.blue { background: #7FB2FF; }
  .btn.green { background: #6FD49A; }
  .btn.red { background: #FF8A7A; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn.small { font-size: 14px; padding: 7px 14px; border-radius: 11px; }
  .btn.wide { width: 100%; }
  .muted { color: var(--ink-soft); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .stars { letter-spacing: 1px; font-size: 15px; }
  .stars .on { color: var(--gold); -webkit-text-stroke: 1px var(--gold-deep); }
  .stars .off { color: #D5DCE3; }

  /* ---------- ホーム ---------- */
  .hello { margin-top: 16px; display: grid; gap: 10px; }
  .hello input {
    font: inherit; font-weight: 900; font-size: 18px; padding: 10px 12px; border-radius: 12px;
    border: 2px solid var(--ink); flex: 1; min-width: 0; background: #FFFDF5;
  }
  .daily {
    margin-top: 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
    background: linear-gradient(135deg, #FFF3C4, #FFE08A);
  }
  .daily > div { min-width: 0; }
  .daily .big { font-size: 40px; }
  .daily h3 { font-size: 18px; font-weight: 900; }
  .daily p { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .daily.done { background: #F1F4F7; }
  .area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .unit {
    position: relative; text-align: left; cursor: pointer; border: 2px solid var(--ink); border-radius: 16px;
    background: var(--card); padding: 12px; box-shadow: 0 4px 0 var(--ink); display: grid; gap: 4px;
    transition: transform .06s; min-width: 0;
  }
  .unit:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .unit .emo { font-size: 34px; line-height: 1.1; }
  .unit .t { font-weight: 900; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
  .unit .src { font-size: 11px; font-weight: 700; color: var(--ink-soft); }
  .unit .mbar { height: 7px; border-radius: 99px; background: #EEF1F4; overflow: hidden; }
  .unit .mbar i { display: block; height: 100%; border-radius: 99px; }
  .unit .mini-stamp {
    position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; border-radius: 50%;
    border: 2.5px solid var(--stamp); color: var(--stamp); display: grid; place-items: center;
    font-family: var(--display); font-size: 11px; transform: rotate(-14deg); background: rgba(255,255,255,.85);
  }
  .unit .mini-stamp.gold { border-color: var(--gold-deep); color: var(--gold-deep); background: #FFF6D8; }
  .boss-tile {
    grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    border: 2px dashed var(--ink); border-radius: 16px; padding: 12px 14px; background: rgba(255,255,255,.7); cursor: pointer; text-align: left;
  }
  .boss-tile > span { min-width: 0; }
  .boss-tile .emo { font-size: 38px; }
  .boss-tile.locked { cursor: not-allowed; filter: grayscale(.9); opacity: .75; }
  .boss-tile.beaten { border-style: solid; background: #FFF6D8; }
  .boss-tile .bt { font-weight: 900; }
  .boss-tile .bs { font-size: 12px; font-weight: 700; color: var(--ink-soft); }

  /* ---------- 単元ページ ---------- */
  .back { background: none; border: none; font-weight: 900; font-size: 15px; cursor: pointer; padding: 6px 0; color: var(--ink-soft); }
  .unit-hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .unit-hero .emo { font-size: 64px; width: 96px; height: 96px; display: grid; place-items: center; border-radius: 24px; border: 2px solid var(--ink); }
  .unit-hero h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.3; }
  .unit-hero .src { font-weight: 700; font-size: 13px; color: var(--ink-soft); }
  .modes { display: grid; gap: 12px; margin-top: 18px; }
  .mode {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; text-align: left;
    background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 12px 14px; cursor: pointer; box-shadow: 0 4px 0 var(--ink);
  }
  .mode:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .mode .ic { font-size: 34px; text-align: center; }
  .mode .mt { font-weight: 900; font-size: 18px; }
  .mode .md { font-size: 13px; color: var(--ink-soft); font-weight: 700; line-height: 1.5; }
  .mode.locked { opacity: .5; cursor: not-allowed; }
  .trivia { margin-top: 18px; display: grid; gap: 10px; }
  .trivia .tv { background: #FFFBEA; border: 2px solid #F1D98A; border-radius: 14px; padding: 12px 14px; font-size: 15px; }
  .trivia .tv b:first-child { color: var(--gold-deep); }

  /* ---------- まとめカード ---------- */
  .fc-stage { perspective: 1200px; margin-top: 14px; }
  .fc {
    min-height: 300px; background: var(--card); border: 2px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink);
    padding: 22px 20px; display: grid; align-content: start; gap: 12px; position: relative; overflow: hidden;
    background-image: linear-gradient(transparent 31px, #E5EEF4 32px); background-size: 100% 32px; background-position: 0 58px;
  }
  .fc .no { font-family: var(--display); font-size: 13px; color: var(--ink-soft); }
  .fc h2 { font-weight: 900; font-size: 23px; line-height: 1.4; }
  .fc .ft { font-size: 18px; line-height: 2; }
  .fc .ft b { background: linear-gradient(transparent 55%, #FFE27A 55%); }
  .fc.enter { animation: slidein .28s ease-out; }
  @keyframes slidein { from { transform: translateX(40px) rotate(2deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .fc-nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 16px; }
  .dots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; max-width: 200px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #CFD8E0; }
  .dots i.on { background: var(--ink); }

  /* ---------- クイズ ---------- */
  .qtop { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  .quit { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); font-size: 18px; font-weight: 900; cursor: pointer; }
  .qprog { height: 16px; border-radius: 99px; border: 2px solid var(--ink); background: var(--card); overflow: hidden; }
  .qprog i { display: block; height: 100%; background: var(--ok); transition: width .35s; }
  .combo { font-family: var(--display); font-size: 15px; color: var(--stamp); min-width: 70px; text-align: right; }
  .combo.pop { animation: pop .35s; }
  @keyframes pop { 50% { transform: scale(1.35); } }
  .battle { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
  .battle .boss { font-size: 58px; line-height: 1; }
  .battle .boss.hit { animation: shake .4s; }
  @keyframes shake { 20% { transform: translateX(-8px) rotate(-8deg); } 40% { transform: translateX(8px) rotate(6deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
  .hp { height: 14px; border-radius: 99px; border: 2px solid var(--ink); background: #fff; overflow: hidden; }
  .hp i { display: block; height: 100%; background: linear-gradient(90deg, #FF5A4E, #FF9A4E); transition: width .4s; }
  .hearts { font-size: 20px; letter-spacing: 2px; }
  .qcard { margin-top: 14px; }
  .qmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; font-weight: 900; }
  .qmeta .lv { padding: 1px 9px; border-radius: 99px; border: 2px solid var(--ink); }
  .qtext { font-size: 20px; font-weight: 700; line-height: 1.9; margin: 10px 0 4px; }
  .choices { display: grid; gap: 10px; margin-top: 14px; }
  .choice {
    display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: center; text-align: left;
    border: 2px solid var(--ink); border-radius: 14px; background: var(--card); padding: 10px 12px; font-size: 17px; font-weight: 700;
    cursor: pointer; box-shadow: 0 3px 0 var(--ink); line-height: 1.6;
  }
  .choice .k { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-family: var(--display); font-size: 15px; background: #F5F7FA; }
  .choice:hover:not([disabled]) { background: #FFFBEA; }
  .choice[disabled] { cursor: default; }
  .choice.ok { background: var(--ok-soft); border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); }
  .choice.ok .k { background: var(--ok); color: #fff; border-color: var(--ok); }
  .choice.ng { background: var(--ng-soft); border-color: var(--ng); box-shadow: 0 3px 0 var(--ng); }
  .choice.ng .k { background: var(--ng); color: #fff; border-color: var(--ng); }
  .choice.gone { opacity: .25; }
  .tf { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  .tf .choice { grid-template-columns: 1fr; justify-items: center; font-size: 56px; font-family: var(--display); padding: 10px; }
  .tf .choice.o { color: var(--stamp); }
  .tf .choice.x { color: var(--earth); }
  .order-slots { display: grid; gap: 8px; margin-top: 14px; }
  .slot { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; min-height: 48px; border: 2px dashed #AFC0CE; border-radius: 12px; padding: 6px 10px; background: rgba(255,255,255,.6); font-weight: 700; }
  .slot .n { font-family: var(--display); color: var(--ink-soft); text-align: center; }
  .slot.filled { border-style: solid; border-color: var(--ink); background: var(--card); cursor: pointer; }
  .slot.ok { border-color: var(--ok); background: var(--ok-soft); }
  .slot.ng { border-color: var(--ng); background: var(--ng-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { border: 2px solid var(--ink); border-radius: 12px; background: #FFF7D6; padding: 8px 12px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
  .chip[disabled] { visibility: hidden; }
  .qtools { display: flex; gap: 8px; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; }
  .feedback {
    margin-top: 16px; border-radius: 18px; border: 2px solid var(--ink); padding: 14px 16px; background: var(--card);
    display: grid; gap: 8px; box-shadow: 0 4px 0 var(--ink); animation: rise .25s ease-out;
  }
  @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .feedback.ok { background: var(--ok-soft); border-color: var(--ok); box-shadow: 0 4px 0 var(--ok); }
  .feedback.ng { background: var(--ng-soft); border-color: var(--ng); box-shadow: 0 4px 0 var(--ng); }
  .feedback .fh { display: flex; gap: 10px; align-items: center; }
  .feedback .fh .owl { font-size: 36px; }
  .feedback .fh b { font-size: 20px; font-weight: 900; }
  .feedback .ans { font-weight: 900; }
  .feedback .ex { font-size: 16px; line-height: 1.85; }
  .gain { font-family: var(--display); font-size: 14px; color: var(--gold-deep); }

  /* ---------- 結果 ---------- */
  .result { text-align: center; display: grid; gap: 14px; justify-items: center; margin-top: 12px; }
  .result h1 { font-family: var(--display); font-weight: 400; font-size: 36px; }
  .bigstars { font-size: 58px; letter-spacing: 6px; }
  .bigstars span { display: inline-block; color: #D5DCE3; }
  .bigstars span.on { color: var(--gold); -webkit-text-stroke: 2px var(--gold-deep); animation: starin .5s both; }
  .bigstars span:nth-child(2).on { animation-delay: .25s; }
  .bigstars span:nth-child(3).on { animation-delay: .5s; }
  @keyframes starin { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .rstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
  .rstat { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 8px; }
  .rstat .v { font-family: var(--display); font-size: 24px; }
  .rstat .l { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .newstamp { display: grid; gap: 6px; justify-items: center; }
  .stamp {
    width: 104px; height: 104px; border-radius: 50%; border: 4px solid var(--stamp); color: var(--stamp);
    display: grid; place-items: center; align-content: center; transform: rotate(-12deg); background: rgba(255,255,255,.9);
    box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 6px var(--stamp); text-align: center; line-height: 1.1;
  }
  .stamp .se { font-size: 34px; filter: saturate(1.1); }
  .stamp .sn { font-family: var(--display); font-size: 11px; max-width: 80px; }
  .stamp.gold { border-color: var(--gold-deep); color: var(--gold-deep); box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 6px var(--gold-deep); background: #FFF6D8; }
  .stamp.slam { animation: slam .45s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes slam { from { transform: scale(2.4) rotate(-30deg); opacity: 0; } to { transform: scale(1) rotate(-12deg); opacity: 1; } }
  .stamp.empty { border: 3px dashed #BFCBD6; box-shadow: none; color: #AAB6C2; background: rgba(255,255,255,.5); transform: none; }
  .missed { width: 100%; text-align: left; display: grid; gap: 8px; }
  .missed .mi { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .missed .mi .a { color: var(--ok); font-weight: 900; }
  .banner { background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 14px; font-weight: 900; width: 100%; }
  .banner.gold { background: linear-gradient(135deg, #FFC83D, #FF9F1C); color: var(--ink); border: 2px solid var(--ink); }

  /* ---------- スタンプ帳 ---------- */
  .book { display: grid; gap: 18px; }
  .book .page { background: var(--card); border: 2px solid var(--ink); border-radius: var(--r); padding: 14px; box-shadow: 0 4px 0 var(--ink); }
  .book .page h3 { font-weight: 900; font-size: 17px; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stamp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px 8px; justify-items: center; }
  .stamp-grid .cell { display: grid; justify-items: center; gap: 4px; font-size: 12px; font-weight: 700; text-align: center; color: var(--ink-soft); }
  .stamp-grid .stamp { width: 84px; height: 84px; }
  .stamp-grid .stamp .se { font-size: 28px; }
  .stamp-grid .stamp .sn { font-size: 9px; }

  /* ---------- せいせき ---------- */
  .statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .statgrid .rstat { text-align: center; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .badge { display: grid; grid-template-columns: 42px 1fr; gap: 8px; align-items: center; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 10px; }
  .badge .bi { font-size: 30px; text-align: center; }
  .badge .bn { font-weight: 900; font-size: 14px; line-height: 1.3; }
  .badge .bd { font-size: 11px; color: var(--ink-soft); font-weight: 700; line-height: 1.4; }
  .badge.locked { border-color: var(--line); background: rgba(255,255,255,.6); }
  .badge.locked .bi { filter: grayscale(1); opacity: .35; }
  .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
  .ava { display: grid; justify-items: center; gap: 2px; border: 2px solid var(--ink); border-radius: 14px; background: var(--card); padding: 8px 4px; cursor: pointer; font-weight: 900; font-size: 13px; }
  .ava .e { font-size: 36px; }
  .ava.sel { background: #FFF1B8; box-shadow: 0 0 0 3px var(--gold); }
  .ava.cant { opacity: .5; }
  .settings { display: grid; gap: 10px; }
  .toggle { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 900; }
  .switch { width: 58px; height: 32px; border-radius: 99px; border: 2px solid var(--ink); background: #D9E0E6; position: relative; cursor: pointer; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); transition: left .2s; }
  .switch[aria-checked="true"] { background: var(--ok); }
  .switch[aria-checked="true"]::after { left: 28px; }
  textarea { width: 100%; font: 12px/1.4 ui-monospace, Menlo, monospace; border: 2px solid var(--ink); border-radius: 12px; padding: 8px; min-height: 70px; background: #FFFDF5; }

  /* ---------- にがて ---------- */

  .nav button .dot { position: absolute; top: 4px; right: calc(50% - 22px); background: var(--stamp); color: #fff; border-radius: 99px; font-size: 10px; padding: 0 6px; line-height: 16px; }
  body.inquiz .nav { display: none; }

  /* ---------- モーダル・トースト ---------- */

  /* ---------- アバター（着せかえ） ---------- */

  .stage { position: relative; display: inline-block; width: var(--s); height: var(--s); flex: none; overflow: hidden; border: 2px solid var(--ink); border-radius: 50%; background: var(--gold); line-height: 1; }

  .petpanel { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }

  .growbar { height: 12px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; background: #fff; margin: 4px 0; }

  .drops { display: grid; gap: 8px; justify-items: center; background: var(--card); border: 2px dashed var(--ink); border-radius: 16px; padding: 12px; width: 100%; }

<script>
const UNITS = [{"id":"magnet","title":"<ruby>磁石<rt>じしゃく<\/rt><\/ruby>","yomi":"じしゃく","emoji":"🧲","source":"上 第1回","points":[{"h":"磁石につく金属","t":"磁石に引きつけられる金属は<b>鉄・ニッケル・コバルト<\/b>。鉄くぎ・クリップ・画びょう・砂鉄・スチール缶など、身近で磁石につくもののほとんどは<b>鉄<\/b>だよ。"},{"h":"磁石につかないもの","t":"<b>銅<\/b>（10円玉）や<b>アルミニウム<\/b>（1円玉）は金属でも磁石につかない。<b>硬貨はどれも磁石につかない<\/b>。紙・ガラス・ゴム・プラスチック・木もつかない。"},{"h":"N極とS極","t":"磁石には<b>必ずN極とS極<\/b>があり、どちらか一方だけの磁石はない。自由に動けるようにすると<b>北を向く側がN極<\/b>、南を向く側がS極。これを利用した道具が<b><ruby>方位磁針<rt>ほういじしん<\/rt><\/ruby><\/b>。"},{"h":"地球は大きな磁石","t":"方位磁針のN極が北を指すのは、地球が大きな磁石で<b>北極側がS極、南極側がN極<\/b>になっているから。"},{"h":"引きつけ合う・しりぞけ合う","t":"<b>同じ極どうしはしりぞけ合い<\/b>、<b>ちがう極どうしは引きつけ合う<\/b>。磁石の力は<b>両はしが最も強く、まん中にはほとんどない<\/b>。"},{"h":"<ruby>磁力線<rt>じりょくせん<\/rt><\/ruby>","t":"砂鉄をまくと見える線の模様が磁力線。<b>N極から出てS極に向かう<\/b>。近くに置いた方位磁針の<b>N極が指す向き＝磁力線の向き<\/b>。磁力が強いところほど線が集まる。"},{"h":"鉄を磁石にする","t":"鉄くぎを磁石につけておくと磁石になり、<b>磁石のN極についていた部分はS極<\/b>、S極についていた部分はN極になる。ぬい針を<b>同じ極で同じ方向に何度もこする<\/b>と、針の先はこすった極と<b>反対の極<\/b>になる。"},{"h":"鉄が磁石になるしくみ","t":"鉄の中には<b>小さな磁石<\/b>がバラバラの向きで入っている。磁石につけたりこすったりすると、その<b>向きがそろって<\/b>全体が磁石になる。熱したりしょうげきを加えたりすると、またバラバラになる。"},{"h":"磁石を切る・つける","t":"磁石を切ると、元の極はそのままで<b>切り口に反対の極<\/b>ができ、2つの磁石になる。2つの磁石のN極とS極をつけると、<b>つけたところの磁力はなくなり<\/b>、1つの長い磁石になる。"},{"h":"<ruby>電磁石<rt>でんじしゃく<\/rt><\/ruby>","t":"鉄くぎにエナメル線を巻き、電流を流してつくる磁石。<b>電流を流したときだけ<\/b>磁石になる。<b>電流を強くする<\/b>、<b>巻き数を増やす<\/b>と強くなる。"},{"h":"電磁石の極","t":"<b>電流の向き<\/b>や<b>エナメル線を巻く向き<\/b>を反対にすると、<b>N極とS極が入れかわる<\/b>。"},{"h":"<ruby>永久磁石<rt>えいきゅうじしゃく<\/rt><\/ruby>","t":"金属やゴム、プラスチックでできたふつうの磁石が永久磁石。電磁石とちがって、<b>力の大きさもN極・S極も変えられない<\/b>。"}],"trivia":["しりぞけ合う向きに重ねて「ういている」磁石でも、重さはちゃんと下にかかっているよ。だから台はかりにのせると全部の重さを示すし、下のすきまほどせまくなるんだ。","地球を大きな磁石と見たときの極の位置は、地球の回転のじく（地軸）から約11°ずれていて、しかも少しずつ動いているんだって。","スクラップ工場の電磁クレーンは、電流を流して鉄くずを持ち上げ、電流を切ると鉄くずをはなせる。電磁石はモーターやIHヒーター、タッチするICカードにも使われているよ。"],"questions":[{"t":"choice","lv":1,"q":"磁石に引きつけられる金属は、鉄・ニッケルと、もう1つは何？","c":["コバルト","銅","アルミニウム","銀"],"e":"磁石につく金属は鉄・ニッケル・コバルト。銅やアルミニウム、銀は金属だけど磁石につかないよ。"},{"t":"choice","lv":1,"q":"次のうち、磁石につくものはどれ？","c":["鉄くぎ","1円玉","紙","10円玉"],"e":"鉄くぎは鉄なのでつく。1円玉はアルミニウム、10円玉は銅でできていて、磁石につかないよ。"},{"t":"tf","lv":2,"q":"100円玉や500円玉は金属でできているので、磁石につく。","a":false,"e":"硬貨は銅を多くふくむ合金などでできていて、どれも磁石につかない。「金属なら何でも磁石につく」わけではないよ。"},{"t":"tf","lv":2,"q":"スチール缶（鉄）とアルミ缶がまざっていても、磁石を使えば分けることができる。","a":true,"e":"スチール缶は鉄なので磁石につき、アルミ缶はつかない。リサイクルではこの性質を使って分けているよ。"},{"t":"choice","lv":1,"q":"磁石の「形」から名前をつけるとき、アルファベットのUのような形の磁石を何という？","c":["U型磁石","棒磁石","ゴム磁石","電磁石"],"e":"棒磁石・U型磁石は形からついた名前。ゴム磁石やフェライト磁石は、材料からついた名前だよ。"},{"t":"choice","lv":1,"q":"発ぽうスチロールを水にうかべ、その上に棒磁石を置いた。棒磁石のS極はどの方角を向いて止まる？","c":["南","北","東","西"],"e":"自由に動ける磁石は、N極が北、S極が南を向いて止まるよ。"},{"t":"choice","lv":1,"q":"磁石の性質を利用して、方角を調べる道具を何という？","c":["方位磁針","電磁石","温度計","虫めがね"],"e":"<ruby>方位磁針<rt>ほういじしん<\/rt><\/ruby>（方位磁石）のN極はいつも北を指すので、方角がわかるよ。"},{"t":"choice","lv":2,"q":"方位磁針のN極が北を指すのはなぜ？","c":["地球が大きな磁石で、北極側がS極になっているから","地球が大きな磁石で、北極側がN極になっているから","地球が自転しているから","北の方が気温が低いから"],"e":"N極はちがう極（S極）に引きつけられる。だから地球の北極側はS極、南極側はN極になっていると考えられるよ。"},{"t":"tf","lv":1,"q":"磁石には必ずN極とS極があり、N極だけ、S極だけの磁石はない。","a":true,"e":"どんな磁石にもN極とS極が両方ある。切って小さくしても、それぞれにN極とS極ができるよ。"},{"t":"tf","lv":1,"q":"磁石の同じ極どうしを近づけると、引きつけ合う。","a":false,"e":"同じ極どうし（NとN、SとS）はしりぞけ合う。引きつけ合うのはちがう極どうし（NとS）だよ。"},{"t":"choice","lv":2,"q":"棒磁石のS極に方位磁針を近づけると、方位磁針のどちらの極が磁石の方を向く？","c":["N極","S極","どちらも向かない"],"e":"ちがう極どうしは引きつけ合うので、方位磁針のN極が棒磁石のS極の方を向く。これで棒磁石の極を調べられるよ。"},{"t":"choice","lv":1,"q":"<ruby>磁力線<rt>じりょくせん<\/rt><\/ruby>について正しいのはどれ？","c":["N極から出てS極に向かい、方位磁針のN極が指す向きと同じ","S極から出てN極に向かい、方位磁針のN極が指す向きと同じ","N極から出てS極に向かい、方位磁針のS極が指す向きと同じ","磁石のまん中から出て、両はしに向かう"],"e":"磁力線はN極から出てS極に入る。近くの方位磁針のN極は磁力線の向きを指すよ。砂鉄をまくと模様として見られる。"},{"t":"choice","lv":2,"q":"棒磁石で、鉄を引きつける力がいちばん弱いのはどこ？","c":["まん中","N極のはし","S極のはし","どこも同じ"],"e":"磁石の力は両はし（N極・S極）が最も強く、まん中には鉄を引きつける力がほとんどないよ。"},{"t":"choice","lv":3,"q":"見た目が同じ2本の棒ア・イがあり、一方は磁石、もう一方はただの鉄の棒。アのはしをイのまん中に近づけるとついたが、イのはしをアのまん中に近づけるとつかなかった。磁石はどっち？","c":["ア","イ","どちらとも決められない"],"e":"磁石のまん中には力がほとんどない。イのはしをアのまん中に近づけてもつかなかったのは、アのまん中に力がないから＝アが磁石。アのはし（極）は鉄のイのどこにでもつくよ。"},{"t":"choice","lv":2,"q":"磁石のN極に鉄くぎの頭をつけておいた。鉄くぎの先は何極になる？","c":["N極","S極","磁石にならない"],"e":"磁石のN極とくっついている頭の方がS極になるので、反対側のくぎの先はN極になるよ。"},{"t":"tf","lv":2,"q":"磁石についた鉄くぎAの先に、鉄くぎBがついている。くぎAを磁石からそっとはなすと、くぎBはすぐに落ちる。","a":false,"e":"磁石についていた鉄くぎAは磁石になっている。磁石からはなしてもしばらくは磁力が残るので、くぎBはついたままだよ。"},{"t":"choice","lv":2,"q":"棒磁石のN極で、ぬい針の穴のある側から針の先に向かって、同じ方向に何度もこすった。針の先は何極になる？","c":["S極","N極","磁石にならない"],"e":"針の中の小さな磁石が、こすったN極に引っぱられて向きがそろう。N極に引っぱられた側（針の先）はS極になるよ。"},{"t":"choice","lv":3,"q":"2本のぬい針を、棒磁石の同じ極で、同じ向きに何度もこすって磁石にした。この2本を、先をそろえてならべてつるすと、針の先どうしはどうなる？","c":["しりぞけ合って、はなれる","引きつけ合って、くっつく","何も起こらない"],"e":"同じようにこすったので、2本とも先が同じ極になる。同じ極どうしはしりぞけ合うので、先がはなれるよ。"},{"t":"tf","lv":3,"q":"鉄の棒を、磁石で左右に行ったり来たりさせながらこすると、強い磁石になる。","a":false,"e":"左右交互にこすると、中の小さな磁石の向きがバラバラになってしまう。同じ極で、同じ方向に何度もこするのがコツだよ。"},{"t":"choice","lv":2,"q":"磁石につけたり、こすったりした鉄が磁石になるのは、なぜだと考えられている？","c":["鉄の中の小さな磁石の向きがそろうから","鉄の中に電気がたまるから","鉄の表面に磁石の粉がつくから","鉄がとけて形が変わるから"],"e":"鉄の中には小さな磁石がバラバラの向きで入っていると考えられる。向きがそろうと、全体が磁石の力をもつよ。"},{"t":"choice","lv":3,"q":"磁石になった鉄を強く熱したり、強いしょうげきを加えたりすると、どうなる？","c":["小さな磁石の向きがバラバラになり、磁石の力がなくなる","小さな磁石の向きがもっとそろい、強い磁石になる","N極とS極が入れかわる","何も変わらない"],"e":"熱やしょうげきで中の小さな磁石の向きがバラバラにもどり、磁石の力がなくなってしまうよ。"},{"t":"choice","lv":2,"q":"左はしがS極、右はしがN極の細長いゴム磁石を、まん中で2つに切った。右側の切れはしの「切り口」は何極になる？","c":["S極","N極","磁石にはならない"],"e":"切ると2つの磁石になる。元の極はそのままで、切り口には反対の極ができる。右の切れはしは右はしがN極なので、切り口はS極だよ。"},{"t":"choice","lv":1,"q":"2本の棒磁石のN極とS極をくっつけて1本にした。くっつけたところの磁力はどうなる？","c":["なくなる","弱くなるが、少し残る","強くなる","変わらない"],"e":"くっつけると1本の長い磁石になり、くっつけたところの磁力はなくなる。極は両はしだけになるよ。"},{"t":"tf","lv":3,"q":"棒磁石のN極にクリップをつけておき、そこへ別の棒磁石のS極をくっつけると、クリップは落ちる。","a":true,"e":"N極とS極をくっつけたところは磁力がなくなるので、そこについていたクリップは落ちてしまうよ。"},{"t":"choice","lv":1,"q":"鉄くぎにエナメル線を巻きつけ、電流を流してつくる磁石を何という？","c":["電磁石","永久磁石","方位磁針","棒磁石"],"e":"<ruby>電磁石<rt>でんじしゃく<\/rt><\/ruby>という。鉄くぎには、うすい紙を巻いてからエナメル線を巻くよ。"},{"t":"tf","lv":1,"q":"電磁石は、電流を流している間だけ磁石になる。","a":true,"e":"電流を切ると磁石の力がなくなる。これを利用して、電磁クレーンは鉄くずを持ち上げたり、はなしたりしているよ。"},{"t":"choice","lv":1,"q":"電磁石で、鉄くぎに巻きつけるエナメル線の巻き数を増やすとどうなる？","c":["磁石の力が強くなる","磁石の力が弱くなる","N極とS極が入れかわる","磁力がなくなる"],"e":"巻き数を増やしたり、流す電流を強くしたりすると、電磁石の力は強くなるよ。"},{"t":"choice","lv":2,"q":"電磁石に流す電流の向きを反対にすると、どうなる？","c":["N極とS極が入れかわる","磁石の力が2倍になる","磁石の力がなくなる","何も変わらない"],"e":"電流の向きや、エナメル線を巻く向きを反対にすると、電磁石のN極とS極が入れかわるよ。"},{"t":"choice","lv":2,"q":"次のうち、電磁石の「磁石の力の強さ」を変える方法ではないものはどれ？","c":["エナメル線を巻く向きを反対にする","流す電流を強くする","エナメル線の巻き数を増やす","電流を流すのをやめる"],"e":"巻く向きを変えると、N極とS極が入れかわるだけ。力の強さは電流の大きさ（0にもできる）と巻き数で変わるよ。"},{"t":"choice","lv":2,"q":"乾電池の数（1個か、2個を直列につなぐ）と、エナメル線の巻き数（100回か200回）を変えて電磁石を4つつくった。クリップをいちばん多く引きつけるのはどれ？","c":["乾電池2個（直列）・200回巻き","乾電池1個・100回巻き","乾電池1個・200回巻き","乾電池2個（直列）・100回巻き"],"e":"乾電池を直列につなぐと電流が大きくなる。電流が大きく、巻き数が多いほど電磁石は強いので、2個・200回巻きがいちばん強いよ。"},{"t":"choice","lv":3,"q":"巻き数によって電磁石の強さがどう変わるかを調べたい。どの2つをくらべればよい？","c":["乾電池1個・100回巻きと、乾電池1個・200回巻き","乾電池1個・100回巻きと、乾電池2個・200回巻き","乾電池1個・100回巻きと、乾電池2個・100回巻き","乾電池2個・100回巻きと、乾電池1個・200回巻き"],"e":"調べたいこと（巻き数）だけを変えて、ほかの条件（乾電池の数）は同じにしてくらべるのが実験のルールだよ。"},{"t":"choice","lv":1,"q":"金属やゴム、プラスチックなどでつくられた、ふつうの磁石を何という？","c":["永久磁石","電磁石","磁力線","方位磁針"],"e":"<ruby>永久磁石<rt>えいきゅうじしゃく<\/rt><\/ruby>という。電磁石とちがって、力の強さやN極・S極を変えることはできないよ。"},{"t":"choice","lv":3,"q":"ドーナツ形の磁石3個（1個10g）を、しりぞけ合う向きにして重さ30gの台の棒にさしこんだら、上の2個がういた。これを台はかりにのせると何gを示す？","c":["60g","30g","40g","50g"],"e":"ういていても、磁石の重さはしりぞけ合う力を通して台にかかっている。10g×3＋30g＝60gだよ。"},{"t":"choice","lv":3,"q":"ドーナツ形の磁石3個を、しりぞけ合う向きにして棒にさして重ねると、上の2個がういた。上のすきま（上と中の間）と下のすきま（中と下の間）をくらべると、どうなっている？","c":["下のすきまの方がせまい","上のすきまの方がせまい","どちらも同じ広さ"],"e":"上のすきまには磁石1個分、下のすきまには上の2個分の重さがかかる。重さが大きいほど強くおしつけられるので、下のすきまほどせまくなるよ。"},{"t":"order","lv":2,"q":"鉄くぎが磁石になるまでを、順にならべよう","c":["鉄くぎの中の小さな磁石は、バラバラの向きを向いている","鉄くぎを磁石にしばらくつけておく","磁石の力で、小さな磁石の向きがそろう","鉄くぎ全体が磁石の力をもつ"],"e":"小さな磁石の向きがバラバラだと磁石の力はないが、向きがそろうと全体が磁石になる。磁石からはなしても、しばらく磁力は残るよ。"}]},{"id":"insect","title":"<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>","yomi":"こんちゅう","emoji":"🦋","source":"上 第2回","points":[{"h":"からだは3つ","t":"昆虫のからだは<b>頭・<ruby>胸<rt>むね<\/rt><\/ruby>・<ruby>腹<rt>はら<\/rt><\/ruby><\/b>の3つに分かれる。<b>あしがついているところが胸<\/b>と考えるとわかりやすい（カブトムシは2つに見えるので注意）。"},{"h":"頭は感覚器官","t":"<b><ruby>触角<rt>しょっかく<\/rt><\/ruby><\/b>（2本1対）でにおいを感じ、<b><ruby>単眼<rt>たんがん<\/rt><\/ruby><\/b>（ふつう3個）で明るさを感じ、<b><ruby>複眼<rt>ふくがん<\/rt><\/ruby><\/b>（個眼の集まり）で形や色を見分ける。"},{"h":"口の形","t":"口の形は食べ物によってちがう。バッタ・カマキリは<b>かむ口<\/b>、モンシロチョウは<b>すう口<\/b>、セミは<b>さす口<\/b>、ハエは<b>なめる口<\/b>。"},{"h":"胸は運動器官","t":"胸には<b>あしが6本（3対）<\/b>、<b>はねがふつう4枚（2対）<\/b>ついている。<b>ハエ・アブ・カ<\/b>は後ろばねが退化して、はねが<b>2枚<\/b>。"},{"h":"腹で呼吸","t":"腹の節には空気の出入り口の<b><ruby>気門<rt>きもん<\/rt><\/ruby><\/b>が2つずつある。気門につながる<b><ruby>気管<rt>きかん<\/rt><\/ruby><\/b>で呼吸する（ヒトの肺にあたる）。めすの腹には<b>産卵管<\/b>がある。"},{"h":"モンシロチョウのたまご","t":"めすは<b>食草<\/b>（幼虫のえさになる植物）である<b>アブラナ科<\/b>（キャベツ・ダイコンなど）の葉にたまごを産む。たまごは<b>高さ約1mm<\/b>で、<b>乳白色から黄色<\/b>に変わる。"},{"h":"幼虫はアオムシ","t":"ふ化した幼虫は、まず<b>自分のたまごのから<\/b>を食べる。はじめは黄色だが、葉を食べてからだが緑になるので<b>アオムシ<\/b>とよばれる。胸につめのあしが6本、腹にきゅうばんのあしが10本（成虫になると消える）。"},{"h":"だっ皮して成長","t":"1令幼虫は<b>4回<ruby>脱皮<rt>だっぴ<\/rt><\/ruby><\/b>して5令幼虫になり、<b>5回目のだっ皮でさなぎ<\/b>になる。たまごからかえることを<b>ふ化<\/b>、成虫になることを<b><ruby>羽化<rt>うか<\/rt><\/ruby><\/b>という。"},{"h":"<ruby>完全変態<rt>かんぜんへんたい<\/rt><\/ruby>","t":"<b>たまご→幼虫→さなぎ→成虫<\/b>。幼虫と成虫が似ていない。<b>チョウ・ガ、カブトムシ（テントウムシ・ホタル）、ハエ・カ・アブ、ハチ・アリ<\/b>のなかま。"},{"h":"<ruby>不完全変態<rt>ふかんぜんへんたい<\/rt><\/ruby>","t":"<b>たまご→幼虫→成虫<\/b>（さなぎの時期がない）。幼虫と成虫が似ているものが多い。<b>バッタ（コオロギ）、カマキリ、セミ、トンボ<\/b>のなかま。"},{"h":"幼虫のよび名と産卵場所","t":"トンボは<b>水の中<\/b>にたまごを産み、幼虫は<b>ヤゴ<\/b>。カの幼虫は<b>ボウフラ<\/b>、さなぎは<b>オニボウフラ<\/b>。セミの幼虫は土の中で木の根のしるをすって何年も育つ。"},{"h":"<ruby>節足<rt>せっそく<\/rt><\/ruby>動物","t":"からだの外側のかたいから（<b><ruby>外骨格<rt>がいこっかく<\/rt><\/ruby><\/b>）をもち、からだとあしに節がある動物。昆虫のほか、<b>クモ（あし8本）<\/b>、エビ・カニ（10本）、ダンゴムシ（14本）、ムカデなど。"}],"trivia":["ナナホシテントウの目立つ赤と黒は「わたしは苦いよ！」という合図（警告色）。一度食べて苦い思いをした鳥は、もうおそわなくなるんだ。","鳴く昆虫はおすだけ。セミは腹にある「腹弁」で、コオロギやスズムシは前ばねをこすり合わせて音を出し、めすを呼んでいるよ。","モンシロチョウのめすのはねは紫外線を反射する。人間には同じように見えても、チョウの目にはおすとめすがちがって見えているんだって。"],"questions":[{"t":"choice","lv":1,"q":"昆虫のからだの分かれ方として正しいものはどれ？","c":["頭・胸・腹の3つ","頭胸部・腹部の2つ","頭・胴の2つ","頭・胸・腹・尾の4つ"],"e":"昆虫のからだは頭・<ruby>胸<rt>むね<\/rt><\/ruby>・<ruby>腹<rt>はら<\/rt><\/ruby>の3つ。クモは頭胸部と腹部の2つなので昆虫ではないよ。"},{"t":"choice","lv":1,"q":"昆虫は、からだのどこでにおいを感じとっている？","c":["触角","複眼","単眼","気門"],"e":"昆虫には鼻がない。頭にある2本（1対）の<ruby>触角<rt>しょっかく<\/rt><\/ruby>でにおいを感じとっているよ。"},{"t":"choice","lv":1,"q":"たくさんの個眼が集まってできていて、ものの形や色を見分ける目を何という？","c":["複眼","単眼","触角","気管"],"e":"<ruby>複眼<rt>ふくがん<\/rt><\/ruby>は小さな目（個眼）がたくさん集まったもの。形や色を見分けるよ。"},{"t":"choice","lv":2,"q":"昆虫の<ruby>単眼<rt>たんがん<\/rt><\/ruby>（ふつう3個）は、おもに何を感じる？","c":["明るさ","におい","ものの形や色","音"],"e":"単眼は明るさを感じる目。形や色を見分けるのは複眼、においを感じるのは触角だよ。"},{"t":"choice","lv":2,"q":"ハエ・バッタ・モンシロチョウのうち、「かむ口」をもつのはどれ？","c":["バッタ","ハエ","モンシロチョウ"],"e":"バッタはイネ科の葉をかんで食べる。モンシロチョウは花のみつをすう口、ハエはくさったものをなめる口だよ。"},{"t":"choice","lv":1,"q":"昆虫のあしは、からだのどこに何本ついている？","c":["胸に6本","腹に6本","胸に8本","胸に4本と腹に2本"],"e":"昆虫のあしは、すべて胸に6本（3対）。前胸・中胸・後胸に2本ずつついているよ。"},{"t":"tf","lv":1,"q":"昆虫のはねは、ふつう胸に4枚（2対）ついている。","a":true,"e":"はねは中胸と後胸に2枚ずつ、合わせて4枚。はねもあしも胸についているよ。"},{"t":"choice","lv":2,"q":"次のうち、はねの枚数がほかの3つとちがう昆虫はどれ？","c":["ハチ","ハエ","アブ","カ"],"e":"ハエ・アブ・カのなかまは後ろばねが退化していて、はねが2枚。ハチはふつうの昆虫と同じ4枚だよ。"},{"t":"choice","lv":1,"q":"昆虫の腹の節に2つずつあいている、空気の出入り口を何という？","c":["気門","気管","触角","産卵管"],"e":"<ruby>気門<rt>きもん<\/rt><\/ruby>は空気の出入り口で、ヒトでいえば鼻や口にあたる。胸にもあるよ。"},{"t":"choice","lv":2,"q":"昆虫のからだの中にあって、空気中の酸素をとりこむ（呼吸をする）、ヒトでいえば肺にあたるつくりは？","c":["気管","気門","複眼","産卵管"],"e":"気門から入った空気は、からだの中の<ruby>気管<rt>きかん<\/rt><\/ruby>に送られて呼吸が行われるよ。"},{"t":"choice","lv":1,"q":"モンシロチョウの幼虫の食草（えさになる植物）は、キャベツやダイコンなど何科の植物？","c":["アブラナ科","キク科","ミカン科","イネ科"],"e":"アブラナ科にはキャベツ・ダイコン・ハクサイ・コマツナ・ブロッコリーなどがある。レタスはキク科なのでなかまではないよ。"},{"t":"choice","lv":2,"q":"アゲハの幼虫の食草はどれ？","c":["ミカン","キャベツ","クワ","ダイコン"],"e":"アゲハはミカンやサンショウなどミカン科の葉にたまごを産む。キャベツやダイコンはモンシロチョウの食草だよ。"},{"t":"choice","lv":1,"q":"モンシロチョウのたまごの高さは、およそどれくらい？","c":["約1mm","約1cm","約5mm","約0.1mm"],"e":"たまごは高さ約1mmのとっくりのような形。はじめは乳白色で、やがて黄色に変わるよ。"},{"t":"choice","lv":1,"q":"たまごからかえったばかりのモンシロチョウの幼虫が、はじめに食べるものは？","c":["自分のたまごのから","キャベツの葉","花のみつ","ほかの幼虫"],"e":"ふ化した幼虫は、まず自分のたまごのからを食べ、それから食草の葉を食べ始めるよ。"},{"t":"choice","lv":2,"q":"モンシロチョウの幼虫の色の組み合わせで正しいのは？（①たまごからかえったすぐ後　②さなぎになる前）","c":["①黄色　②緑色","①緑色　②緑色","①緑色　②黄色","①黄色　②黄色"],"e":"生まれたばかりの幼虫は黄色。アブラナ科の葉を食べるうちにからだが緑色になるので、アオムシとよばれるよ。"},{"t":"choice","lv":1,"q":"モンシロチョウの幼虫は、からだの色から何とよばれる？","c":["アオムシ","ボウフラ","ヤゴ","オニボウフラ"],"e":"緑色のからだなのでアオムシ。ボウフラはカの幼虫、ヤゴはトンボの幼虫、オニボウフラはカのさなぎだよ。"},{"t":"choice","lv":2,"q":"モンシロチョウの幼虫は、さなぎになるまでに全部で何回だっ皮する？","c":["5回","4回","3回","6回"],"e":"1令幼虫から4回だっ皮して5令幼虫になり、5回目のだっ皮でさなぎになる（<ruby>蛹化<rt>ようか<\/rt><\/ruby>）。"},{"t":"choice","lv":3,"q":"昆虫の幼虫がだっ皮をするのはなぜ？","c":["からだの外側のかたい皮（外骨格）はほとんどのびないので、大きくなるにはぬぐ必要があるから","皮がよごれたので、きれいにするため","寒さから身を守るため","ぬいだ皮を食べて栄養にするため"],"e":"昆虫の皮は<ruby>外骨格<rt>がいこっかく<\/rt><\/ruby>でとてもじょうぶ。そのかわりのびないので、小さくなった皮をぬいで大きくなるよ。"},{"t":"order","lv":2,"q":"モンシロチョウが、たまごから成虫になるまでのできごとを順にならべよう","c":["ふ化（たまごから幼虫がかえる）","だっ皮（4回くり返して5令幼虫になる）","蛹化（さなぎになる）","羽化（成虫になる）"],"e":"ふ化→4回のだっ皮→5回目のだっ皮で蛹化→羽化。さなぎは背中側がわれて、成虫が頭から出てくるよ。"},{"t":"choice","lv":1,"q":"昆虫が成虫になることを何という？","c":["羽化","ふ化","蛹化","だっ皮"],"e":"成虫になることを<ruby>羽化<rt>うか<\/rt><\/ruby>という。さなぎのない不完全変態の昆虫でも、成虫になることは羽化というよ。"},{"t":"choice","lv":1,"q":"「たまご→幼虫→さなぎ→成虫」のように、さなぎの時期がある育ち方を何という？","c":["完全変態","不完全変態","だっ皮","羽化"],"e":"さなぎの時期がある育ち方が<ruby>完全変態<rt>かんぜんへんたい<\/rt><\/ruby>。さなぎの間にからだのつくりを大きくつくり変えるよ。"},{"t":"tf","lv":2,"q":"「たまご→幼虫→成虫」と育ち、さなぎの時期がない育ち方を、完全変態という。","a":false,"e":"さなぎの時期がない育ち方は<ruby>不完全変態<rt>ふかんぜんへんたい<\/rt><\/ruby>。完全変態は、さなぎの時期があるよ。"},{"t":"choice","lv":2,"q":"次のうち、さなぎの時期がある昆虫はどれ？","c":["カブトムシ","カマキリ","トノサマバッタ","アブラゼミ"],"e":"カブトムシは完全変態。カマキリ・バッタ・セミは、さなぎの時期がない不完全変態だよ。"},{"t":"choice","lv":2,"q":"次のうち、不完全変態をする昆虫はどれ？","c":["セミ","チョウ","ハエ","アリ"],"e":"チョウ・ガ、ハエ・カ・アブ、ハチ・アリ、カブトムシ・テントウムシのなかまは完全変態。セミはさなぎにならない不完全変態だよ。"},{"t":"tf","lv":2,"q":"不完全変態の昆虫は、幼虫と成虫のすがたが似ているものが多い。","a":true,"e":"さなぎはからだのつくりを大きく変える時期。さなぎのない不完全変態では、バッタのように幼虫が成虫に似ていることが多いよ。"},{"t":"choice","lv":1,"q":"トンボの幼虫は何とよばれる？","c":["ヤゴ","ボウフラ","アオムシ","オニボウフラ"],"e":"トンボは水の中にたまごを産み、ふ化したヤゴは水中で生活する。やがて水から出て羽化するよ。"},{"t":"choice","lv":2,"q":"カの幼虫とさなぎのよび名の組み合わせで正しいのは？","c":["幼虫はボウフラ、さなぎはオニボウフラ","幼虫はオニボウフラ、さなぎはボウフラ","幼虫はヤゴ、さなぎはボウフラ","幼虫はボウフラで、さなぎの時期はない"],"e":"カは完全変態で、幼虫（ボウフラ）もさなぎ（オニボウフラ）も水の中でくらし、動き回れるよ。"},{"t":"choice","lv":3,"q":"シオカラトンボについての説明で、まちがっているものはどれ？","c":["おすとめすは同じ色なので、見分けがつきにくい","幼虫はヤゴとよばれる","めすはムギワラトンボとよばれる","ギンヤンマやアキアカネと同じトンボのなかまである"],"e":"シオカラトンボのおすは灰色に黒いもよう、めすは濃い黄色に黒いしまもようで、色がちがう。めすはムギワラトンボとよばれるよ。"},{"t":"choice","lv":3,"q":"ゲンゴロウ・クロオオアリ・ハナアブ・カマキリのうち、シオカラトンボと同じ育ち方をするのはどれ？","c":["カマキリ","ゲンゴロウ","クロオオアリ","ハナアブ"],"e":"シオカラトンボとカマキリは不完全変態。ゲンゴロウ（カブトムシのなかま）、クロオオアリ（ハチ・アリのなかま）、ハナアブ（ハエ・アブのなかま）は、さなぎになる完全変態だよ。"},{"t":"choice","lv":1,"q":"クモ・エビ・カニなど昆虫に近いなかま（節足動物）が、昆虫と同じようにからだの外側にもつかたいからを何という？","c":["外骨格","内骨格","触角","産卵管"],"e":"<ruby>外骨格<rt>がいこっかく<\/rt><\/ruby>をもち、からだとあしに節がある動物を<ruby>節足<rt>せっそく<\/rt><\/ruby>動物という。外骨格でからだを支え、動かしているよ。"},{"t":"choice","lv":1,"q":"クモのあしは何本？","c":["8本","6本","10本","14本"],"e":"クモのあしは8本（4対）で、からだは頭胸部と腹部の2つ。だから昆虫ではない。エビ・カニは10本、ダンゴムシは14本だよ。"},{"t":"choice","lv":3,"q":"アメンボ・ダンゴムシ・マイマイ（カタツムリ）のうち、からだとあしに節があるけれど昆虫ではない動物はどれ？","c":["ダンゴムシ","アメンボ","マイマイ"],"e":"アメンボはセミのなかまの昆虫。マイマイは節のあるあしをもたない。ダンゴムシはあし14本の節足動物（甲殻類）だよ。"},{"t":"choice","lv":3,"q":"昆虫の鳴き声について、正しいものはどれ？","c":["鳴くのはおすで、セミは腹にあるつくり（腹弁）、コオロギは前ばねをこすり合わせて音を出す","鳴くのはめすで、セミもコオロギもはねをこすり合わせて音を出す","鳴くのはおすで、セミもコオロギも口から声を出す","おすもめすも、同じように鳴く"],"e":"鳴くのはおすだけで、めすを呼ぶため。セミは腹弁、スズムシやコオロギなどバッタのなかまは前ばねで音を出すよ。"},{"t":"choice","lv":3,"q":"ナナホシテントウが、よく目立つ赤と黒の色をしているのはなぜ？","c":["苦い毒をもつことを知らせて、鳥に食べられないようにするため","花にまぎれてかくれるため","なかまを呼んで、えさを分けるため","太陽の光をたくさん吸収してあたたまるため"],"e":"テントウムシは危険を感じると苦い液を出す。目立つ色を覚えた鳥はおそわなくなる。このような色を警告色というよ。"}]},{"id":"river","title":"流れる水のはたらき","yomi":"ながれるみずのはたらき","emoji":"🏞️","source":"上 第3回","points":[{"h":"にごった雨水","t":"地面を流れる雨水がにごっているのは、<b>砂やどろ<\/b>を運んでいるから。コップに入れて置いておくと、<b>つぶの大きいものほど先にしずみ<\/b>、下から大きい砂→小さい砂→どろの順にたまる。"},{"h":"流れの速さとはたらき","t":"流水実験器で<b>かたむきを大きく<\/b>したり<b>水の量を多く<\/b>したりすると、流れが<b>速く<\/b>なり、けずられる土砂も運ばれる土砂も<b>増え<\/b>、みぞが大きくなる。"},{"h":"3つのはたらき","t":"けずる<b><ruby>侵食<rt>しんしょく<\/rt><\/ruby>作用<\/b>、運ぶ<b><ruby>運搬<rt>うんぱん<\/rt><\/ruby>作用<\/b>、積もらせる<b><ruby>堆積<rt>たいせき<\/rt><\/ruby>作用<\/b>。侵食・運搬は<b>流れが速いほど強く<\/b>、堆積は<b>流れがおそくなるところで強い<\/b>。"},{"h":"まっすぐな川","t":"<b>中央付近<\/b>ほど流れが速く、川底が<b>深く<\/b>、積もる石が<b>大きい<\/b>。いちばん速いのは中央付近の<b>水面の少し下<\/b>（川底は石に、水面は空気にじゃまされておそくなる）。"},{"h":"曲がった川","t":"<b>外側<\/b>ほど流れが速く、深く、石が大きい。外側はけずられて<b>がけ<\/b>に、流れのおそい<b>内側<\/b>には小石や砂が積もって<b>川原<\/b>ができる。"},{"h":"だ行（<ruby>蛇行<rt>だこう<\/rt><\/ruby>）","t":"川が曲がりくねって流れることを<b>だ行<\/b>という。外側がけずられ内側に積もるので、だ行は<b>だんだん大きくなる<\/b>。とり残された部分は<b>三日月湖<\/b>になることもある。"},{"h":"上流と下流","t":"<b>上流<\/b>はかたむきが急で流れが速く、川はばがせまく、水の量が少ない。<b>下流<\/b>はかたむきがゆるやかで流れがおそく、支流が集まるので<b>水の量が多く、川はばが広い<\/b>。"},{"h":"川原の石","t":"上流の石は<b>大きく角ばっている<\/b>（小さい石は流されてしまう）。下流へ運ばれるうちに石どうしや川底に<b>ぶつかり合って<\/b>、<b>小さく丸く<\/b>なる。石は流れの向きにかたむいてならぶ。"},{"h":"川原の石の調べ方","t":"①川原に<b>1m四方のわく<\/b>を置く　②わくの中の石を<b>大きい順に100個<\/b>集める　③石の<b>いちばん長い部分<\/b>の長さをはかる　④棒グラフにまとめる。"},{"h":"流れる水の利用","t":"<b>水車<\/b>は水の流れで車輪を回し、精米・製粉・田畑への水の引き上げに使われてきた。<b>水力発電<\/b>は、地球温暖化につながる<b>二酸化炭素を出さない<\/b>クリーンな発電方法。"}],"trivia":["日本最長の信濃川は約367km。世界最長のナイル川は約6695kmで、信濃川の約18倍もあるよ！","世界最大の湖カスピ海（約37万4000km²）は、日本列島（約37万8000km²）とほとんど同じ広さなんだって。","大雨のとき、本流の水位が上がると支流の水がせき止められ、支流側の堤防がこわれやすくなる。だから遊水地などの治水対策がつくられているよ。"],"questions":[{"t":"order","lv":1,"q":"茶色くにごった雨水をコップに入れてしばらく置いた。コップの底から順に、たまるものをならべよう","c":["つぶが大きい砂","つぶが小さい砂","どろ"],"e":"水の中では、つぶが大きい（重い）ものほど先にしずむ。だから底に大きい砂、いちばん上にどろがたまるよ。"},{"t":"tf","lv":1,"q":"地面を流れる雨水が茶色くにごっているのは、雨水が砂やどろを運んでいるからである。","a":true,"e":"にごった雨水をしばらく置くと、水はとうめいになり、茶色の砂やどろが下にたまる。にごりの正体は砂やどろだよ。"},{"t":"choice","lv":2,"q":"流水実験器で、トレーのかたむきを大きくし、流す水の量を多くすると、どうなる？","c":["流れが速くなり、けずられて運ばれる土砂が増え、みぞが大きくなる","流れがおそくなり、みぞは小さくなる","流れは速くなるが、けずられる土砂の量は変わらない","水の量を増やしても、流れの速さは変わらない"],"e":"かたむきが大きいほど、水の量が多いほど流れは速くなる。流れが速いと、けずるはたらきも運ぶはたらきも大きくなるよ。"},{"t":"choice","lv":2,"q":"川底がいちばん大きくけずられるのは、どんなとき？","c":["川のかたむきが大きく、水量が多いとき","川のかたむきが大きく、水量が少ないとき","川のかたむきが小さく、水量が多いとき","川のかたむきが小さく、水量が少ないとき"],"e":"かたむきが大きいほど流れは速くなる。流れが速く、水の量が多いと、けずりとるはたらき（侵食作用）が大きくなるよ。"},{"t":"tf","lv":2,"q":"曲がったみぞに水を流し続けると、曲がり方はだんだん小さくなって、まっすぐに近づく。","a":false,"e":"曲がっているところの外側はけずられ、内側には土砂が積もる。だから曲がり方は少しずつ大きくなっていくよ。"},{"t":"choice","lv":1,"q":"流れる水が、川岸や川底などをけずりとるはたらきを何という？","c":["侵食作用","運搬作用","堆積作用"],"e":"けずりとるはたらきは<ruby>侵食<rt>しんしょく<\/rt><\/ruby>作用。流れが速いほど強くなるよ。"},{"t":"choice","lv":1,"q":"侵食作用でけずりとられた土砂を、水の流れが運ぶはたらきを何という？","c":["運搬作用","侵食作用","堆積作用"],"e":"運ぶはたらきは<ruby>運搬<rt>うんぱん<\/rt><\/ruby>作用。これも流れが速いほど強いよ。"},{"t":"choice","lv":1,"q":"運ばれてきた土砂を、川底や川原に積もらせるはたらきを何という？","c":["堆積作用","侵食作用","運搬作用"],"e":"積もらせるはたらきは<ruby>堆積<rt>たいせき<\/rt><\/ruby>作用。流れがおそくなって土砂を運べなくなるところで大きくなるよ。"},{"t":"choice","lv":2,"q":"流れが速くなるほど強くなるはたらきの組み合わせはどれ？","c":["侵食作用と運搬作用","運搬作用と堆積作用","侵食作用と堆積作用","堆積作用だけ"],"e":"けずる（侵食）・運ぶ（運搬）は流れが速いほど強い。積もらせる（堆積）は流れがおそくなるほど強いよ。"},{"t":"tf","lv":2,"q":"川の上流では侵食作用や運搬作用が大きく、下流に向かうほど堆積作用が大きくなる。","a":true,"e":"上流はかたむきが急で流れが速いので、けずる・運ぶはたらきが大きい。下流は流れがおそいので、積もらせるはたらきが大きいよ。"},{"t":"choice","lv":3,"q":"まっすぐ流れる川で、流れがいちばん速いのはどこ？","c":["中央付近の、水面の少し下","中央付近の、川底","両岸の近くの、浅いところ","両岸の近くの、深いところ"],"e":"中央付近ほど速いが、川底は石などにぶつかり、水面は空気とのまさつでおそくなる。だから水面の少し下がいちばん速いよ。"},{"t":"choice","lv":2,"q":"まっすぐ流れる川の、川底の形と積もる石のようすで正しいのはどれ？","c":["中央付近が深く、中央ほど大きい石が積もっている","中央付近が浅く、中央ほど大きい石が積もっている","岸の近くが深く、岸ほど大きい石が積もっている","どこも同じ深さで、石の大きさも同じ"],"e":"流れの速い中央付近は深くけずられる。小さい石は流されて、大きい石が残る。岸の近くは流れがおそく浅いよ。"},{"t":"choice","lv":1,"q":"曲がって流れる川で、流れが速いのは内側と外側のどちら？","c":["外側","内側","どちらも同じ"],"e":"曲がった川では外側の流れが速い。そのため外側ほど深く、川底の石も大きいよ。"},{"t":"choice","lv":2,"q":"曲がって流れる川の「内側」のようすとして正しいものはどれ？","c":["流れがおそく、浅くて、小石や砂が積もっている","流れが速く、深くて、けずられてがけになっている","流れがおそく、深くて、がけになっている","流れが速く、浅くて、大きな石が多い"],"e":"内側は流れがおそいので堆積作用がはたらき、浅くなって川原ができる。外側は流れが速く、侵食されてがけになるよ。"},{"t":"choice","lv":1,"q":"曲がった川の内側で、小石や砂が積もってできる平らなところを何という？","c":["川原","がけ","堤防","滝"],"e":"川原（河原）は、流れのおそい内側で土砂が積もってできるよ。"},{"t":"choice","lv":2,"q":"曲がって流れる川の外側にがけができるのは、おもにどのはたらきによる？","c":["侵食作用","堆積作用","運搬作用"],"e":"外側は流れが速く、川岸がけずられる（侵食作用）ので、がけになる。内側の川原は堆積作用でできるよ。"},{"t":"choice","lv":1,"q":"川が曲がりくねって流れることを何という？","c":["だ行","合流","はんらん","侵食"],"e":"だ行（<ruby>蛇行<rt>だこう<\/rt><\/ruby>）という。ヘビ（蛇）がくねくね進むようすからついた名前だよ。"},{"t":"choice","lv":2,"q":"だ行して流れる川の形は、時間がたつとどうなる？","c":["しだいに曲がり方が大きくなる","曲がり方はそのまま変わらない","しだいに曲がり方が小さくなる","大きくなったり小さくなったりをくり返す"],"e":"曲がっている外側は侵食作用でけずられ、内側は堆積作用で土砂が積もる。だから、だ行はしだいに大きくなるよ。"},{"t":"choice","lv":3,"q":"平野でだ行がどんどん大きくなり、やがて川がまっすぐ流れるようになると、とり残された部分に湖ができることがある。この湖を何という？","c":["三日月湖","三角州","扇状地","V字谷"],"e":"とり残された曲がった部分が、三日月のような形の湖になる。三角州・扇状地・V字谷は湖ではなく、流れる水がつくる地形だよ。"},{"t":"choice","lv":1,"q":"川を流れる水の量が最も多いのは、上流・中流・下流のどこ？","c":["下流","上流","中流"],"e":"下流に行くほど、支流が何本も合流するので水の量が増えるよ。"},{"t":"choice","lv":2,"q":"川が上流から下流へ向かうにつれて、流れの速さと川はばは、ふつうどうなる？","c":["流れはおそくなり、川はばは広くなる","流れは速くなり、川はばは広くなる","流れは速くなり、川はばはせまくなる","流れはおそくなり、川はばはせまくなる"],"e":"下流ほどかたむきがゆるやかなので流れはおそい。水の量が増えるので川はばは広くなるよ。"},{"t":"choice","lv":1,"q":"下流の川原で見られる石は、上流の石とくらべてどうなっている？","c":["小さく、丸みをおびている","大きく、角ばっている","小さく、角ばっている","大きく、丸みをおびている"],"e":"上流の石は大きく角ばっている。下流へ運ばれるうちに、小さく丸くなるよ。"},{"t":"choice","lv":2,"q":"中流や下流の川原の石が、丸みをおびているのはなぜ？","c":["水に流される間に、石どうしや川底にぶつかり合って角がとれるから","川原にころがっている間に、風や雨で角がけずられるから","川底にある間に、魚が石の角をつついてけずるから","運ばれたどろが、石の表面について固まるから"],"e":"石は流されて転がるうちに、ぶつかり合って小さく丸くなっていくよ。"},{"t":"choice","lv":2,"q":"上流の川原に大きな石が多いのはなぜ？","c":["流れが速いので小さい石は下流へ運ばれ、大きい石が残るから","上流では石がだんだん大きく成長するから","下流から大きな石が運ばれてくるから","上流は流れがおそく、石が積もりやすいから"],"e":"上流はかたむきが急で流れが速い。小さい石は流されてしまい、重くて大きい石が残るよ。"},{"t":"order","lv":2,"q":"川原の石の大きさを調べる手順を、順にならべよう","c":["川原に1m四方のわくを置く","わくの中の石を大きい順に100個集める","それぞれの石のいちばん長い部分の長さをはかる","石の大きさを棒グラフにまとめる"],"e":"同じ広さ・同じ個数で調べると、上流・中流・下流の石の大きさをくらべやすくなるよ。"},{"t":"choice","lv":3,"q":"川原の石は、どのようにならんでいることが多い？","c":["流れの向き（下流側）にかたむいてならぶ","上流側にかたむいてならぶ","どれもまっすぐ立ってならぶ","きまりなく、バラバラの向きにならぶ"],"e":"石は水に下流の方へおされ、下は地面とのまさつで動きにくい。そのため流れの向きにかたむいてならぶよ。"},{"t":"choice","lv":1,"q":"高いところから水を流し、その流れで水車（タービン）を回して電気をつくる方法を何という？","c":["水力発電","火力発電","太陽光発電","風力発電"],"e":"水力発電は、流れる水の力を利用して発電する方法だよ。"},{"t":"tf","lv":2,"q":"水力発電は、地球温暖化につながる二酸化炭素を出さない、クリーンな発電方法といわれている。","a":true,"e":"燃料を燃やす火力発電は二酸化炭素を出すが、水力発電は水の流れを利用するだけなので二酸化炭素を出さないよ。"},{"t":"choice","lv":1,"q":"水の流れで車輪を回し、米をついたり（精米）、粉をひいたり（製粉）するのに使われてきた設備は？","c":["水車","風車","堤防","ダム"],"e":"水車は流れる水を利用した設備。田畑に水を引き上げるのにも使われてきたよ。"},{"t":"choice","lv":3,"q":"曲がった川の外側の川岸を、コンクリートで固めることがある。その理由は？","c":["外側は流れが速く、侵食されやすいから","外側は流れがおそく、土砂が積もりやすいから","外側の方が水がきれいだから","外側には川原ができやすいから"],"e":"外側は流れが速く、侵食作用で川岸がけずられやすい。コンクリートで固めて、けずられるのを防いでいるよ。"},{"t":"choice","lv":3,"q":"大きな本流に支流が流れこむ場所の近くで大雨がふった。堤防がこわれる危険がとくに高いのはどこ？","c":["支流側の堤防","本流の、合流点より上流の堤防","合流点から遠くはなれた本流の堤防","どこも同じ"],"e":"本流の水位が上がると、支流の水がせき止められたり、本流の水が支流に流れこんだりする。支流の堤防は本流より小さいので、こわれやすいよ。"},{"t":"choice","lv":3,"q":"日本の川は、大陸の大きな川とくらべてどんな特ちょうがある？","c":["長さが短く、かたむきが急で流れが速い","長さが長く、かたむきがゆるやか","長さが短く、かたむきがゆるやか","長さが長く、かたむきが急"],"e":"日本最長の信濃川でも400km未満。山から海までが近く急流なので、雨が海に流れこむまでの時間が短いよ。"},{"t":"tf","lv":3,"q":"山地から平地に出るところでは流れが急におそくなるので、上流から運ばれてきた小石や砂が積もりやすい。","a":true,"e":"堆積作用は流れがおそくなるところで大きくなる。こうして扇形に積もった地形を扇状地という。河口では砂やどろが積もって三角州ができるよ。"}]},{"id":"weather","title":"季節と天気","yomi":"きせつとてんき","emoji":"🌦️","source":"上 第4回","points":[{"h":"天気の種類","t":"雨や雪がふっていないときの天気は<b>雲の量<\/b>で決まる。ほとんど雲がない＝<b><ruby>快晴<rt>かいせい<\/rt><\/ruby><\/b>、やや雲がある＝<b>晴れ<\/b>、空のほとんどが雲＝<b>くもり<\/b>。雨・雪は雲の量に関係なく決まる。"},{"h":"天気は西から東へ","t":"日本の上空には強い西風の<b><ruby>偏西風<rt>へんせいふう<\/rt><\/ruby><\/b>がふいているので、天気は<b>西から東へ<\/b>移っていく。気温は<b>北の地域ほど低く、南の地域ほど高い<\/b>。"},{"h":"各地の<ruby>降水量<rt>こうすいりょう<\/rt><\/ruby>","t":"6〜7月は<b><ruby>梅雨<rt>つゆ<\/rt><\/ruby><\/b>、8〜9月は<b>台風<\/b>で降水量が増える。冬は日本海側の<b>新潟<\/b>で大雪のため多く、太平洋側の東京は晴天で少ない。札幌（北海道）には<b>梅雨がない<\/b>。那覇の梅雨は5〜6月。"},{"h":"春の天気","t":"偏西風の影響で、<b>3〜4日ごとに晴れの日と天気の悪い日がくり返される<\/b>。中国の砂漠でまい上がった<b>黄砂<\/b>が偏西風で運ばれてくる。"},{"h":"夏の天気","t":"<b>南東<\/b>からあたたかくしめった風がふき、全国的に<b>蒸し暑い<\/b>。夕立をふらせる<b><ruby>積乱雲<rt>せきらんうん<\/rt><\/ruby>（入道雲）<\/b>がよくできる。衛星写真では日本の上空に雲が少ない。"},{"h":"暑い日・寒い日のよび方","t":"最高気温が<b>25℃以上＝夏日<\/b>、<b>30℃以上＝真夏日<\/b>、<b>35℃以上＝<ruby>猛暑日<rt>もうしょび<\/rt><\/ruby><\/b>。最低気温が<b>0℃未満＝冬日<\/b>、最高気温が<b>0℃未満＝真冬日<\/b>（1日中氷点下）。"},{"h":"秋の天気","t":"秋の初めは梅雨のような<b>秋の長雨<\/b>。9月ごろは台風が多い。10月ごろになると、春と同じように<b>3〜4日おきに天気が変わる<\/b>。"},{"h":"冬の天気","t":"シベリアから冷たくかわいた<b>北西<\/b>の風。日本海で水蒸気をふくみ、山脈にぶつかって<b>日本海側に大雪<\/b>。山をこえてかわいた風がふくので<b>太平洋側はかんそうした晴れ<\/b>。衛星写真では<b>すじ状の雲<\/b>が見られる。"},{"h":"梅雨","t":"6〜7月ごろ、北海道以外で雨やくもりの日が続く。北の冷たい空気と南のあたたかい空気がぶつかる境目が<b><ruby>梅雨前線<rt>ばいうぜんせん<\/rt><\/ruby><\/b>で、その上に<b>東西に長い雲の帯<\/b>ができる。梅雨前線が北上すると梅雨明け＝夏の始まり。"},{"h":"台風","t":"<b><ruby>熱帯低気圧<rt>ねったいていきあつ<\/rt><\/ruby><\/b>が海からの水蒸気で発達したもの。1年中発生するが、日本に近づくのは<b>8〜9月<\/b>が多い。中心に近いほど雨風が強いが、中心の<b>台風の目<\/b>は風も雨もほとんどない。"},{"h":"気温・地温のはかり方","t":"気温は<b>地上1.2〜1.5m<\/b>の<b>風通しのよい<\/b>場所で、温度計に<b>直射日光が当たらない<\/b>ようにしてはかる。地温は温度計の液だめに<b>土をかけ、おおいをして<\/b>はかる。"},{"h":"アメダスとひまわり","t":"<b>アメダス<\/b>は全国約1300か所の無人観測所で降水量・気温・風などを自動で観測し、気象庁に送るしくみ。気象衛星<b>ひまわり<\/b>は赤道の上空約36000kmを地球の自転に合わせて回る<b>静止衛星<\/b>。"}],"trivia":["ひまわりは1秒間に約3kmという猛スピードで、1日に1回地球のまわりを回っている。地球の自転と同じなので、地上からは止まって見えるんだ。","積乱雲の下に「ちぶさ雲」というぼこぼこした雲が現れると、そのあと「ひょう」がふることもあるんだって。","台風のエネルギーのもとは、あたたかい海からの水蒸気。だから北上して海水温が下がったり、上陸したりすると弱まっていくよ。"],"questions":[{"t":"choice","lv":1,"q":"空にほとんど雲がない天気を何という？","c":["快晴","晴れ","くもり","きり"],"e":"ほとんど雲がない＝<ruby>快晴<rt>かいせい<\/rt><\/ruby>、やや雲がある＝晴れ、空のほとんどが雲＝くもり、だよ。"},{"t":"tf","lv":2,"q":"空に雲が少しある日の天気は、「快晴」ではなく「晴れ」という。","a":true,"e":"やや雲があるときは「晴れ」。雲がほとんどないときだけ「快晴」というよ。"},{"t":"choice","lv":1,"q":"雨や雪がふっていないとき、おもな天気は何によって決まる？","c":["雲の量","太陽の高さ","気温","風の強さ"],"e":"快晴・晴れ・くもりは、空をおおう雲の量で決まる。雨や雪は、雲の量に関係なく決まるよ。"},{"t":"choice","lv":1,"q":"日本の天気は、ふつうどのように移り変わる？","c":["西から東へ","東から西へ","南から北へ","北から南へ"],"e":"日本の上空には偏西風という強い西風がふいているので、雲や天気は西から東へ移っていくよ。"},{"t":"choice","lv":2,"q":"春に中国の砂漠から黄砂を運んできたり、日本の天気を西から東へ移したりする、日本の上空をふく強い西風を何という？","c":["偏西風","季節風","貿易風","台風"],"e":"<ruby>偏西風<rt>へんせいふう<\/rt><\/ruby>は日本の上空にいつもふいている強い西風。雲や台風、黄砂や火山灰まで運ぶよ。"},{"t":"choice","lv":3,"q":"天気は西から東へ移る。今日、関東地方より西の地域では、どこも雨がふっていない。明日の関東地方の天気は、どうなると考えられる？","c":["雨はふらないと考えられる","雨がふると考えられる","雪がふると考えられる","まったく予想できない"],"e":"明日の天気は、今日の西の地域の天気を見て予想する。関東より西で雨がふっていないので、明日の関東は雨がふらないと考えられるよ。"},{"t":"choice","lv":2,"q":"札幌・東京・新潟・那覇のうち、日本海側にあって、冬（12〜1月ごろ）に大雪で降水量がとても多くなるのはどこ？","c":["新潟","東京","那覇"],"e":"新潟は日本海に面していて、冬に雪がたくさんふるのが特ちょう。東京は冬、かんそうした晴れで降水量が少ないよ。"},{"t":"choice","lv":2,"q":"春の天気の特ちょうとして正しいものはどれ？","c":["3〜4日ごとに、晴れの日と天気の悪い日がくり返される","南東からのしめった風で、蒸し暑くなる","雨やくもりの日が長く続く","日本海側は雪、太平洋側はかんそうした晴れの日が多い"],"e":"春は偏西風の影響を強く受け、天気が変わりやすい。2番目は夏、3番目は梅雨、4番目は冬の天気だよ。"},{"t":"choice","lv":1,"q":"夏に、あたたかくしめった風がふいてくる方角は？","c":["南東","南西","北西","北東"],"e":"夏は太平洋側から南東の風がふき、全国的に蒸し暑くなる。冬の風は北西からだよ。"},{"t":"choice","lv":1,"q":"夏によく発達し、夕立をふらせることがある、たてに高くのびる雲は？","c":["積乱雲（入道雲）","巻雲（すじ雲）","高積雲（ひつじ雲）","層雲（きり雲）"],"e":"<ruby>積乱雲<rt>せきらんうん<\/rt><\/ruby>は強い上昇気流でたてに大きく発達し、はげしい雨や雷をもたらすよ。"},{"t":"choice","lv":1,"q":"1日の最高気温が30℃以上の日を何という？","c":["真夏日","夏日","猛暑日","真冬日"],"e":"25℃以上が夏日、30℃以上が真夏日、35℃以上が猛暑日だよ。"},{"t":"choice","lv":3,"q":"最高気温が40℃になった日は、ふつう何とよぶ？（いちばんあてはまるよび方）","c":["猛暑日","真夏日","夏日","酷暑日"],"e":"最高気温35℃以上の日を<ruby>猛暑日<rt>もうしょび<\/rt><\/ruby>という。40℃も35℃以上なので猛暑日だよ。"},{"t":"choice","lv":1,"q":"1日の最高気温が0℃未満の日を何という？","c":["真冬日","冬日","猛暑日","真夏日"],"e":"最高気温が0℃未満ということは、1日中ずっと氷点下。これが真冬日だよ。"},{"t":"choice","lv":2,"q":"「冬日」とはどんな日のこと？","c":["1日の最低気温が0℃未満の日","1日の最高気温が0℃未満の日","1日中雪がふっている日","1日の最高気温が10℃未満の日"],"e":"最低気温が0℃未満なら冬日。最高気温まで0℃未満（1日中氷点下）なら真冬日だよ。"},{"t":"choice","lv":2,"q":"秋の天気の特ちょうとして正しいものはどれ？","c":["秋の初めに長雨が続き、その後は3〜4日ごとに晴れの日と天気の悪い日がくり返される","1年でいちばん蒸し暑く、夕立が多い","日本海側で大雪がふる","雨がほとんどふらず、ずっと晴れが続く"],"e":"秋の初めは梅雨のような秋の長雨。9月ごろは台風も多い。10月ごろには、春と同じように天気が変わりやすくなるよ。"},{"t":"choice","lv":1,"q":"冬に、シベリア大陸からふいてくる冷たくかわいた風の方角は？","c":["北西","南東","南西","北東"],"e":"冬は北西からの季節風がふく。夏は南東からの風だよ。"},{"t":"choice","lv":2,"q":"冬の太平洋側の天気として多いのはどれ？","c":["かんそうした晴れの日","雨や雪の日","数日おきに天気が変わる","蒸し暑い日"],"e":"冬の太平洋側はかんそうした晴れの日が多い。雨や雪が多いのは日本海側、数日おきに変わるのは春や秋の天気だよ。"},{"t":"choice","lv":2,"q":"冬に、日本海側で大雪がふるのはなぜ？","c":["北西の冷たい風が日本海で水蒸気をふくみ、山脈にぶつかって雪をふらせるから","南東のしめった風が、太平洋から雪を運んでくるから","偏西風が、中国の砂漠から雪を運んでくるから","冬に台風が多くやってくるから"],"e":"日本海で水蒸気をふくんだ風が山脈にあたり、日本海側に雪をふらせる。雪をふらせてかわいた風が太平洋側へふき下りるので、太平洋側は晴れるよ。"},{"t":"choice","lv":2,"q":"冬に気象衛星がうつした、日本付近の雲の画像の特ちょうはどれ？","c":["日本海の上などに、北西からのびるすじ状の雲がたくさん見られる","日本の上空に雲がほとんど見られない","東西に長くのびる雲の帯が見られる","うずをまいた大きな雲のかたまりが見られる"],"e":"すじ状の雲は冬。雲がほとんどないのは夏、東西に長い雲の帯は梅雨、うず状の雲のかたまりは台風だよ。"},{"t":"choice","lv":1,"q":"6〜7月ごろ、北海道以外の地域で雨やくもりの日が続く時期を何という？","c":["梅雨","秋の長雨","夕立","黄砂"],"e":"<ruby>梅雨<rt>つゆ<\/rt><\/ruby>という。北海道には梅雨がなく、沖縄（那覇）では5〜6月ごろが梅雨だよ。"},{"t":"choice","lv":2,"q":"梅雨の時期に、北からの冷たい空気と南からのあたたかい空気が日本付近でぶつかってできる境目を何という？","c":["梅雨前線","偏西風","台風の目","季節風"],"e":"<ruby>梅雨前線<rt>ばいうぜんせん<\/rt><\/ruby>の上に東西に長い雲の帯ができ、長雨をふらせる。前線が北へ移動すると梅雨明けで、夏が来るよ。"},{"t":"choice","lv":1,"q":"台風は、何が発達したもの？","c":["熱帯低気圧","温帯低気圧","移動性高気圧","太平洋高気圧"],"e":"強い日差しや、海から蒸発する水蒸気によって、日本の南で発生した<ruby>熱帯低気圧<rt>ねったいていきあつ<\/rt><\/ruby>が発達すると台風になるよ。"},{"t":"choice","lv":1,"q":"台風が日本に多く近づいたり上陸したりするのは、何月ごろ？","c":["8〜9月","6〜7月","11〜12月","2〜3月"],"e":"台風は1年中発生しているけれど、日本に近づいたり上陸したりするのは8〜9月が多いよ。"},{"t":"choice","lv":1,"q":"台風の中心にある、風も雲もほとんどないところを何という？","c":["台風の目","梅雨前線","積乱雲","偏西風"],"e":"台風の目は、発達した台風の中心にできる。まわりは雨風が強いのに、目の中は風も雲もほとんどないよ。"},{"t":"choice","lv":3,"q":"台風についての説明で、まちがっているものはどれ？","c":["台風は、気温が高くなる夏から秋にかけてだけ発生する","台風は、熱帯で発生した熱帯低気圧が発達したものである","台風が近づくと、強い雨や風による被害が出ることがある","台風の進路は、日本付近で北西から北東へ向きを変えることが多い"],"e":"台風は1年中発生している。日本に近づくのが8〜9月に多いだけだよ。"},{"t":"choice","lv":3,"q":"台風が日本付近で北上したり、陸に上陸したりすると、勢いが弱まっていくのはなぜ？","c":["エネルギーのもとになる、あたたかい海からの水蒸気が得られなくなるから","陸の上の方が、海の上より気温が高いから","偏西風がなくなるから","雲がふえすぎて、重くなるから"],"e":"台風はあたたかい海からの熱と水蒸気で発達する。北上すると海水温が下がり、上陸すると水蒸気が得られなくなるので弱まるよ。"},{"t":"choice","lv":1,"q":"気温は、地面から何mくらいの高さではかる？","c":["1.2〜1.5m","0.5m以下","ちょうど1m","2m以上"],"e":"地面に近すぎると地面の温度の影響を大きく受けるので、1.2〜1.5mの高さではかるよ。"},{"t":"choice","lv":2,"q":"気温のはかり方として、まちがっているものはどれ？","c":["温度計に直射日光を当ててはかる","風通しのよい場所ではかる","地面から1.2〜1.5mの高さではかる","温度計に直射日光が当たらないように、おおいをする"],"e":"直射日光が当たると温度計そのものがあたたまり、正しい気温がはかれない。日なたでも、おおいをすればだいじょうぶだよ。"},{"t":"choice","lv":2,"q":"地温（地面の温度）のはかり方として正しいものはどれ？","c":["温度計の液だめに土をかけ、温度計におおいをしてはかる","温度計を地上1.5mの高さにつるしてはかる","温度計に直射日光を当てながらはかる","温度計を水の中に入れてはかる"],"e":"地温は、液だめを土でおおい、温度計に直射日光が当たらないようにおおいをしてはかるよ。"},{"t":"choice","lv":1,"q":"全国約1300か所の無人観測所で、降水量や気温、風の向きや速さなどを自動で観測するしくみを何という？","c":["アメダス","ひまわり","百葉箱","天気図"],"e":"アメダス（地域気象観測システム）は、10分ごとに測ったデータを東京の気象庁に送っているよ。"},{"t":"choice","lv":1,"q":"赤道の上空約36000kmの高さにある、日本の気象衛星の名前は？","c":["ひまわり","アメダス","はやぶさ","かぐや"],"e":"気象衛星ひまわりは、宇宙から雲の画像をとって送ってくれる。2022年12月からは9号がおもに使われているよ。"},{"t":"tf","lv":2,"q":"気象衛星ひまわりは、地球の自転に合わせて地球のまわりを回っているので、地上からは止まって見える。","a":true,"e":"ひまわりは1日に1回地球のまわりを回る。地球の自転と同じなので、いつも同じ位置に見える「静止衛星」だよ。"},{"t":"choice","lv":3,"q":"気象衛星ひまわりが、日本の真上ではなく、赤道の上空を回っているのはなぜ？","c":["赤道の上空（約36000km）でないと、地球の重力と遠心力がつり合わず、安定して回れないから","日本の上空は雲が多くて、写真がとれないから","赤道の上空の方が太陽に近くて、あたたかいから","日本の上空は飛行機が多くて、あぶないから"],"e":"地球の重力と、高速で回ることで外向きにはたらく遠心力がつり合うのは赤道の上空だけ。日本の真上では安定して回り続けられないよ。"},{"t":"order","lv":2,"q":"春から冬へ、季節の天気の特ちょうを順にならべよう","c":["3〜4日ごとに晴れの日と天気の悪い日がくり返され、黄砂が飛んでくることもある","梅雨前線ができ、長雨やくもりの日が続く","南東のしめった風で蒸し暑くなり、積乱雲が夕立をふらせる","日本海側で大雪がふり、太平洋側ではかんそうした晴れが続く"],"e":"春（変わりやすい天気）→梅雨（長雨）→夏（蒸し暑い）→冬（日本海側は雪、太平洋側は晴れ）の順だよ。"},{"t":"order","lv":3,"q":"台風ができるまでを、順にならべよう","c":["強い日差しで、南の海の海水があたためられる","大量の水蒸気が発生し、上昇気流がおこる","うずができて、熱帯低気圧が発生する","熱帯低気圧が発達して、台風になる"],"e":"台風は、あたたかい海からの熱と水蒸気をエネルギーにして発達する。だから、海水温の高い南の海で生まれるんだ。"}]},{"id":"spring","title":"春の生物","yomi":"はるのせいぶつ","emoji":"🌸","source":"上 第6回","points":[{"h":"春になると","t":"春は<b>気温が上がり、昼の長さが長く<\/b>なる季節。植物の成長がさかんになり、それを食べる草食動物、さらに草食動物を食べる肉食動物の活動もさかんになるよ。"},{"h":"春の七草","t":"<b>セリ・ナズナ・ゴギョウ（ハハコグサ）・ハコベラ（ハコベ）・ホトケノザ（コオニタビラコ）・スズナ（カブ）・スズシロ（ダイコン）<\/b>の7つ。5・7・5・7・7のリズムで覚えよう。"},{"h":"野原の花","t":"人によくふまれる場所には<b>ふみつけに強い<\/b>タンポポ・シロツメクサ・オオイヌノフグリ、あまり人が来ない場所には<b>ふみつけに弱い<\/b>ナズナ・ハルジオン・カラスノエンドウ・スミレがさく。"},{"h":"<ruby>帰化<rt>きか<\/rt><\/ruby>植物","t":"外国から人の手で運ばれ、日本でふえた植物のこと。<b>セイヨウタンポポ・ハルジオン・シロツメクサ・オオイヌノフグリ<\/b>が代表。"},{"h":"畑や花だんの花","t":"<b>アブラナ・エンドウ<\/b>は前年の秋にまいた<b>種子<\/b>から、<b>チューリップ・スイセン・ヒヤシンス<\/b>は前年の秋に植えた<b>球根<\/b>から育って春に花をさかせる。"},{"h":"ソメイヨシノ（サクラ）","t":"冬芽のうち<b>丸いのが花芽<\/b>、<b>細長いのが葉芽<\/b>。<b>花が先にさき<\/b>、花が散るころに葉が出てくる。"},{"h":"開花前線","t":"ソメイヨシノの花がさく日が同じ地点を結んだ線。早くあたたかくなる<b>南から北へ、低地（平地）から高地（山地）へ<\/b>移っていく。"},{"h":"春に芽を出す草","t":"夏野菜（トマト・ナス・キュウリなど）は<b>種子<\/b>をまく。<b>サツマイモ<\/b>は種いもから出た芽を<b>苗<\/b>にして植え、<b>ジャガイモ<\/b>は<b>種いもを直接<\/b>植える。ススキ・ハス・フキは地下のくきや根で冬を越し、春に再び芽を出す。"},{"h":"<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>の<ruby>冬越<rt>ふゆご<\/rt><\/ruby>し","t":"<b>成虫<\/b>：ミツバチ・ナナホシテントウ・ハナアブ・キチョウ　<b>さなぎ<\/b>：モンシロチョウ・アゲハ（春に羽化）　<b>幼虫<\/b>：カブトムシ・ギンヤンマ・アブラゼミ　<b>卵<\/b>：カマキリ・トノサマバッタ・コオロギ（春にふ化）"},{"h":"春の魚とカエル","t":"メダカは<b>水温20℃以上・昼の長さ13時間以上<\/b>で早朝に産卵。サケは秋に川の上流でふ化し、春に川を下って海へ。ヒキガエルは<ruby>冬眠<rt>とうみん<\/rt><\/ruby>から目覚めて池などの<b>水の中<\/b>に産卵する。"},{"h":"<ruby>渡<rt>わた<\/rt><\/ruby>り鳥と<ruby>留鳥<rt>りゅうちょう<\/rt><\/ruby>","t":"<b>夏鳥<\/b>（ツバメ・カッコウ）は春に南国から来て日本で子育て。<b>冬鳥<\/b>（ハクチョウ・ガン・マガモ）は日本で冬を越し春に北国へ。<b>留鳥<\/b>（スズメ・キジバト）は1年中同じ地域。<b><ruby>漂鳥<rt>ひょうちょう<\/rt><\/ruby><\/b>（ウグイス）は夏は山地、冬は平地。"},{"h":"春のクマ","t":"ヒグマ（北海道）やツキノワグマ（本州・四国）は<b>冬眠中の1〜2月ごろ<\/b>に穴の中で子どもを産む。春には子連れのクマが見られる。"}],"trivia":["サクラの「開花日」は、気象庁が決めた標本木で5〜6輪さいた日のこと。東京の標本木は靖国神社にあるよ。","沖縄ではサクラが北部から南部へさいていく！サクラの花芽は冬の寒さで休みから目覚めるので、先に寒くなる北部から目覚めるんだ。","ハナアブは低い温度でも動けるので、冬にさくヤツデの花のみつを吸って過ごしているよ。"],"questions":[{"t":"choice","lv":1,"q":"春の七草に<b>ふくまれない<\/b>植物はどれ？","c":["スミレ","カブ","ハハコグサ","セリ"],"e":"春の七草はセリ・ナズナ・ハハコグサ（ゴギョウ）・ハコベ（ハコベラ）・コオニタビラコ（ホトケノザ）・カブ（スズナ）・ダイコン（スズシロ）。スミレは入っていないよ。"},{"t":"choice","lv":1,"q":"春の七草に<b>ふくまれる<\/b>ものはどれ？","c":["ダイコン","セロリ","タマネギ","キャベツ"],"e":"ダイコンは春の七草の「スズシロ」のこと。ちなみにカブは「スズナ」とよばれるよ。"},{"t":"choice","lv":2,"q":"外国から人の手で運ばれ、日本でふえた植物（<ruby>帰化<rt>きか<\/rt><\/ruby>植物）に<b>あてはまらない<\/b>ものはどれ？","c":["スミレ","オオイヌノフグリ","シロツメクサ","ハルジオン"],"e":"セイヨウタンポポ・シロツメクサ・ハルジオン・オオイヌノフグリは帰化植物。スミレは昔から日本にある植物だよ。"},{"t":"choice","lv":2,"q":"芝生や道ばたなど、人によくふまれる場所でもよく見られる、ふみつけに強い植物はどれ？","c":["オオイヌノフグリ","スミレ","ナズナ","カラスノエンドウ"],"e":"ふみつけに強いのはタンポポ・シロツメクサ・オオイヌノフグリなど。ナズナ・スミレ・カラスノエンドウ・ハルジオンはふみつけに弱く、人があまり来ない場所に生える。"},{"t":"choice","lv":1,"q":"スイセンやヒヤシンスは、前年の秋に植えた何から芽を出して春に花をさかせる？","c":["球根","種子","種いも","苗"],"e":"チューリップ・スイセン・ヒヤシンスは、秋に植えた球根が冬を越し、春に芽を出して花をさかせるよ。"},{"t":"choice","lv":2,"q":"前年の秋に種子をまくと秋のうちに芽を出し、若いすがたで冬を越して春に花をさかせる植物はどれ？","c":["アブラナ","チューリップ","スイセン","ヒヤシンス"],"e":"アブラナやエンドウは秋にまいた種子から育つ。チューリップ・スイセン・ヒヤシンスは球根から育つよ。"},{"t":"choice","lv":2,"q":"サツマイモとジャガイモを畑に植えるときの方法として正しいものはどれ？","c":["サツマイモは種いもから出た芽を苗として植え、ジャガイモは種いもを直接植える","サツマイモは種いもを直接植え、ジャガイモは種いもから出た芽を植える","どちらも種いもから出た芽を植える","どちらも種いもを直接植える"],"e":"サツマイモは芽を切りとって苗にして植える。ジャガイモ（やサトイモ）は種いもをそのまま植え、芽と根は同じくぼみから出るよ。"},{"t":"choice","lv":3,"q":"ジャガイモは種子からも育てられるのに、ふつうは種いもから育てる。その理由として正しいものはどれ？","c":["種いもの方が養分を多くふくんでいて、早く育つから","ジャガイモは種子を一つもつくらないから","種いもから育てると、日光がなくても育つから","種子から育てると、実がサツマイモになってしまうから"],"e":"芽が出たばかりの植物は、まだ日光で養分をつくれない。種子より養分がたっぷりある種いもから育てた方が、早く大きく育つんだ。"},{"t":"choice","lv":2,"q":"地上の部分がかれ、地下のくきや根で冬を越して、春に再び芽を出す植物として<b>ふさわしくない<\/b>ものはどれ？","c":["ダイズ","ススキ","ハス","フキ"],"e":"ススキ・ハス・フキは地下で冬越しして春に再び成長する。ダイズは春に種子をまいて育てる夏野菜だよ。"},{"t":"choice","lv":1,"q":"サクラ（ソメイヨシノ）の冬芽には丸い芽と細長い芽がある。丸い芽からは何が出る？","c":["花だけがさく","花がさいた後に葉が出る","葉だけが出る","花と葉が同時に出る"],"e":"丸い芽は花芽で、花だけがさく。細長い芽は葉芽で、そこから葉が出るよ。"},{"t":"tf","lv":2,"q":"ソメイヨシノは、葉が出そろってから花をさかせる。","a":false,"e":"反対！ソメイヨシノは先に花がさき、花が散るころに葉芽から葉が出てくる。"},{"t":"choice","lv":1,"q":"本州では、サクラの花がさく場所はどのように移っていく？","c":["南の地方から北の地方へ、平地から山地へ","北の地方から南の地方へ、平地から山地へ","南の地方から北の地方へ、山地から平地へ","北の地方から南の地方へ、山地から平地へ"],"e":"サクラは気温が高くなるとさく。南の方が、そして山地より平地の方が早くあたたかくなるので、南→北、平地→山地の順にさいていくよ。"},{"t":"choice","lv":2,"q":"ソメイヨシノの<ruby>開花前線<rt>かいかぜんせん<\/rt><\/ruby>が南から北へ移っていくのはなぜ？","c":["早くあたたかくなる地域から花がさくから","北の地方ほど日光が強いから","南の地方ほど雨が多いから","北の地方ほどサクラの木が若いから"],"e":"サクラは気温が高くなると花をさかせる。日本では南の地域ほど早くあたたかくなるので、開花も南から始まるよ。"},{"t":"choice","lv":1,"q":"ミツバチ・ナナホシテントウ・ハナアブ・キチョウは、どのすがたで冬を越す？","c":["成虫","卵","幼虫","さなぎ"],"e":"この4つは成虫のまま冬を越す。ミツバチは巣の中、ナナホシテントウは石の下などでじっとしているよ。"},{"t":"choice","lv":1,"q":"モンシロチョウやアゲハは、どのすがたで冬を越す？","c":["さなぎ","成虫","幼虫","卵"],"e":"モンシロチョウやアゲハはさなぎで冬を越し、春になると羽化して成虫になる。"},{"t":"choice","lv":1,"q":"卵で冬を越し、春にふ化する<ruby>昆虫<rt>こんちゅう<\/rt><\/ruby>はどれ？","c":["カマキリ","アブラゼミ","カブトムシ","ミツバチ"],"e":"カマキリ・トノサマバッタ・コオロギは卵で冬越しして春にふ化する。アブラゼミとカブトムシは幼虫、ミツバチは成虫で冬を越すよ。"},{"t":"choice","lv":1,"q":"春に<b>成虫を見ることができない<\/b>昆虫はどれ？","c":["ギンヤンマ","ハナアブ","アゲハ","ナナホシテントウ"],"e":"ギンヤンマは幼虫（ヤゴ）のすがたで冬を越すので、春に見られるのは幼虫。成虫が見られるのは夏ごろだよ。"},{"t":"choice","lv":3,"q":"ギンヤンマの幼虫（ヤゴ）は、どこで冬を越している？","c":["水の中","土の中","木の枝","巣の中"],"e":"トンボの幼虫ヤゴは水の中で、水中の小さな動物を食べて冬を越す。カブトムシの幼虫は土の中、セミの幼虫は木の根元の土の中だよ。"},{"t":"choice","lv":2,"q":"オオカマキリの卵のようすとして正しいものはどれ？","c":["木の枝や植物のくきにかたまりで産みつけられ、そのまま冬を越して春にふ化する","食草の葉の裏に1つずつ産みつけられる","池の水の中にひも状に産みつけられる","土の中に産みつけられ、夏にふ化する"],"e":"カマキリは卵のかたまりを木の枝や植物のくきに産みつけ、卵のすがたで冬を越して春にふ化する。葉の裏に1つずつ産むのはモンシロチョウやアゲハだよ。"},{"t":"choice","lv":2,"q":"モンシロチョウは卵をどのように産む？","c":["食草の葉の裏に1つずつ産みつける","葉やかれ枝にかためて産みつける","土の中に産みつける","水の中に産みつける"],"e":"モンシロチョウやアゲハは、幼虫のえさになる葉の裏に1つずつ卵を産む。ナナホシテントウは葉やかれ枝にかためて産むよ。"},{"t":"tf","lv":2,"q":"モンシロチョウの成虫が初めて見られる日（初見日）は、ソメイヨシノの開花前線のように、南から北、低地から高地へと移っていく。","a":true,"e":"あたたかくなる順にチョウも羽化するので、初見日もサクラと同じく南→北、低地→高地へ移っていくよ。"},{"t":"choice","lv":1,"q":"メダカは水温が何℃以上になると産卵を始める？（昼の長さは13時間以上）","c":["20℃","15℃","25℃","30℃"],"e":"メダカは水温20℃以上、昼の長さ13時間以上になると産卵する。特に5月ごろから産卵が活発になるよ。"},{"t":"tf","lv":2,"q":"メダカは、昼の長さが13時間以上になると夕方に産卵する。","a":false,"e":"メダカが産卵するのは「早朝」。水温20℃以上・昼の長さ13時間以上の条件とセットで覚えよう。"},{"t":"choice","lv":2,"q":"メダカのメスの特ちょうとして正しいものはどれ？","c":["背びれに切れこみがなく、しりびれが三角形に近い","背びれに切れこみがあり、しりびれが平行四辺形に近い","背びれに切れこみがなく、しりびれが平行四辺形に近い","背びれに切れこみがあり、しりびれが三角形に近い"],"e":"オスは背びれに切れこみがあり、しりびれが平行四辺形に近い。メスは背びれに切れこみがなく、しりびれは三角形に近いよ。"},{"t":"choice","lv":1,"q":"秋に川の上流でふ化した<ruby>稚魚<rt>ちぎょ<\/rt><\/ruby>が、春になると川を下って海へ向かう魚はどれ？","c":["サケ","メダカ","コイ","フナ"],"e":"サケは秋に川の上流でふ化し、春に川を下って海で大きくなる。"},{"t":"choice","lv":2,"q":"ヒキガエルは<ruby>冬眠<rt>とうみん<\/rt><\/ruby>から目覚めたあと、どこに卵を産む？","c":["池などの水の中","土の中","木の上","草の葉の裏"],"e":"ヒキガエルは3月下旬ごろ、池などの水の中にひも状の卵を産む。卵からかえるのがオタマジャクシだよ。"},{"t":"order","lv":2,"q":"オタマジャクシがカエルになるまでを順にならべよう","c":["卵からふ化する","後ろあしが出る","前あしが出る","尾がなくなる"],"e":"オタマジャクシは「後ろあし → 前あし → 尾がなくなる」の順にカエルのすがたになる。"},{"t":"choice","lv":1,"q":"春に南の国から渡ってきて、夏を日本で過ごして子育てをする鳥を「夏鳥」という。夏鳥にあてはまる鳥はどれ？","c":["ツバメ","ハクチョウ","スズメ","キジバト"],"e":"ツバメやカッコウは夏鳥。ハクチョウは冬鳥、スズメやキジバトは1年中同じ地域にいる留鳥だよ。"},{"t":"choice","lv":1,"q":"ハクチョウ・ガン・マガモのように、冬を日本で過ごし、春になると北の国へ渡っていく鳥を何という？","c":["冬鳥","夏鳥","留鳥","漂鳥"],"e":"日本で冬を越し（越冬し）、春に北国へ移動する渡り鳥を冬鳥という。"},{"t":"choice","lv":1,"q":"スズメやキジバトのように、1年を通してほぼ同じ地域で過ごす鳥を何という？","c":["留鳥","夏鳥","冬鳥","漂鳥"],"e":"1年中同じ地域にいる鳥が留鳥。渡りをしないので季節に関係なく見られるよ。"},{"t":"choice","lv":2,"q":"冬の間はあたたかい平地にいて、新緑のころ山地にもどって産卵し、ひなを育てる鳥はどれ？","c":["ウグイス","ツバメ","カッコウ","スズメ"],"e":"ウグイスのように、季節によって山地と平地を移動する鳥を漂鳥（ひょうちょう）という。夏は山地、冬は平地で過ごすよ。"},{"t":"tf","lv":3,"q":"夏鳥も冬鳥も、春には北へ、秋には南へ移動する。","a":true,"e":"夏鳥は春に南国から北の日本へ、冬鳥は春に日本から北のシベリアへ移動する。どちらも夏はすずしい地域で子育て、冬はあたたかい地域で冬越しという同じ動きなんだ。"},{"t":"choice","lv":3,"q":"ヒグマやツキノワグマが子どもを産むのはいつごろ？","c":["冬眠中の1〜2月ごろ、穴の中で","冬眠から目覚めた4〜5月ごろ","夏の7〜8月ごろ","冬眠前の10〜11月ごろ"],"e":"クマは冬眠中の1〜2月ごろに穴の中で出産する。子グマは1年間母グマと一緒に生活し、翌年の春に親ばなれするよ。"},{"t":"order","lv":3,"q":"春のソメイヨシノの変化を順にならべよう","c":["花芽からつぼみが出る","花がさく","花が散るころ、葉芽から葉が出る","葉だけになる"],"e":"ソメイヨシノは花が先。花が散るころに葉が出て、やがて葉だけの木になるよ。"},{"t":"choice","lv":3,"q":"よく似たハルジオンとヒメジョオンの見分け方として、ハルジオンの特ちょうはどれ？","c":["背が低く、つぼみが下を向き、くきの中が空どう","背が高く、つぼみが上を向き、くきの中に白いずいがつまっている","花びらが黄色く、つぼみが上を向く","秋になってから花がさく"],"e":"ハルジオンは背が低く、つぼみが下を向き、くきの中が空どう。ヒメジョオンは背が高く、つぼみが上を向き、くきの中に白いずいがつまっている。どちらもキク科の白い花だよ。"}]},{"id":"sun","title":"太陽","yomi":"たいよう","emoji":"☀️","source":"上 第7回","points":[{"h":"太陽のようす","t":"直径は<b>約140万km<\/b>（地球の<b>約109倍<\/b>）、表面温度は<b>約6000度<\/b>。表面のまわりより温度が低い部分を<b><ruby>黒点<rt>こくてん<\/rt><\/ruby><\/b>という。<b>水素<\/b>やヘリウムなどのガスのかたまりだよ。"},{"h":"<ruby>恒星<rt>こうせい<\/rt><\/ruby>と<ruby>惑星<rt>わくせい<\/rt><\/ruby>","t":"太陽のように自ら光を出している星が<b>恒星<\/b>。地球のように恒星のまわりを公転している星が<b>惑星<\/b>。"},{"h":"地球のようす","t":"地球の直径は<b>約1万3000km<\/b>。地球から太陽までの距離は<b>約1億5000万km<\/b>（地球から月までの約400倍）。"},{"h":"自転と公転","t":"地球は<b>1日に1回、西から東へ<ruby>自転<rt>じてん<\/rt><\/ruby><\/b>している。だから太陽は<b>東から西へ<\/b>動いて見える。また地球は1年に1回太陽のまわりを<b><ruby>公転<rt>こうてん<\/rt><\/ruby><\/b>していて、これが季節の変化のもとになる。"},{"h":"日の出・日の入り・<ruby>南中<rt>なんちゅう<\/rt><\/ruby>","t":"<b>日の出<\/b>は太陽の上のはしが地平線から見え始めたしゅん間、<b>日の入り<\/b>は全部しずんだしゅん間。太陽が真南にくることを<b>南中<\/b>といい、このとき高度が1日で最も高くなる。"},{"h":"南中時刻","t":"太陽は東から西へ動いて見えるので、南中時刻は<b>東の地域ほど早く、西の地域ほどおそい<\/b>。"},{"h":"季節と太陽の動き","t":"<b><ruby>夏至<rt>げし<\/rt><\/ruby>（6月）<\/b>は南中高度が最も高く昼が最も長い。<b><ruby>冬至<rt>とうじ<\/rt><\/ruby>（12月）<\/b>は南中高度が最も低く昼が最も短い。<b>春分（3月）・秋分（9月）<\/b>は太陽が真東から出て真西にしずみ、昼と夜の長さがほぼ同じ。"},{"h":"太陽の位置の表し方","t":"太陽の位置は<b>方位と高度<\/b>で表す。南中したときの高度を<b><ruby>南中高度<rt>なんちゅうこうど<\/rt><\/ruby><\/b>という。太陽を観察するときは必ず<b>日食グラス（しゃ光板）<\/b>を使おう。"},{"h":"影の1日の変化","t":"影は太陽と反対側にできる。朝は西、南中のときは<b>北<\/b>、夕方は東にでき、影の先は<b>西→北→東<\/b>と動く。影は朝夕に長くうすく、南中のころ<b>最も短く、こく<\/b>なる。"},{"h":"影の1年の変化","t":"夏は南中高度が高いので影は<b>短く<\/b>、冬は南中高度が低いので影は<b>長く<\/b>なる。"},{"h":"影の先の線","t":"棒の影の先を結んだ線は、夏至のころは棒に<b>最も近い<\/b>曲線、春分・秋分のころは東西に<b>まっすぐな線<\/b>、冬至のころは棒から<b>最も遠い<\/b>曲線になる。"}],"trivia":["太陽の直径は月の約400倍、地球からの距離も月の約400倍。だから空では太陽と月がほぼ同じ大きさに見えるんだ。","太陽の光が地球にとどくまでには、光の速さでも約8分20秒かかるよ。","東京に置く日時計は、日影棒の先を北に向け、地面に対して36度かたむける。棒を地球の自転の軸と平行にすると、季節がちがっても同じ時刻に同じ位置に影ができるからだよ。"],"questions":[{"t":"choice","lv":1,"q":"太陽の直径はおよそ何km？","c":["約140万km","約1万3000km","約38万km","約1億5000万km"],"e":"太陽の直径は約140万km。約1万3000kmは地球の直径、約1億5000万kmは地球から太陽までの距離だよ。"},{"t":"choice","lv":1,"q":"太陽の直径は、地球の直径の約何倍？","c":["約109倍","約4倍","約400倍","約1600倍"],"e":"太陽は地球の約109倍の直径をもつ、とても大きな星。約400倍は月の直径とくらべたときの数だよ。"},{"t":"choice","lv":1,"q":"太陽の表面温度はおよそ何度？","c":["約6000度","約600度","約4000度","約6万度"],"e":"太陽の表面温度は約6000度。黒点の部分は約4000度で、まわりより温度が低いんだ。"},{"t":"choice","lv":1,"q":"太陽の表面に見られる、まわりよりも温度が低い部分を何という？","c":["黒点","コロナ","プロミネンス","クレーター"],"e":"黒点は温度が約4000度で、まわりより低いので黒く見える。クレーターは月の表面にあるくぼみだよ。"},{"t":"choice","lv":1,"q":"太陽のように、自ら光を出している星を何という？","c":["恒星","惑星","衛星"],"e":"自ら光を出す星が恒星（こうせい）。恒星のまわりを公転する地球などは惑星、惑星のまわりを回る月などは衛星だよ。"},{"t":"choice","lv":1,"q":"太陽は、おもに何やヘリウムなどのガスのかたまり？","c":["水素","酸素","二酸化炭素","水蒸気"],"e":"太陽は水素がヘリウムに変わるときのエネルギーで明るくかがやき、熱を出しているよ。"},{"t":"choice","lv":1,"q":"地球の直径はおよそ何km？","c":["約1万3000km","約3500km","約140万km","約38万km"],"e":"地球の直径は約1万3000km。約3500kmは月の直径、約140万kmは太陽の直径だよ。"},{"t":"choice","lv":1,"q":"地球から太陽までの距離はおよそ何km？","c":["約1億5000万km","約38万km","約140万km","約1万3000km"],"e":"地球から太陽までは約1億5000万km。地球から月まで（約38万km）の約400倍だよ。"},{"t":"choice","lv":2,"q":"太陽が東から西へ動いて見えるのはなぜ？","c":["地球が西から東へ自転しているから","地球が東から西へ自転しているから","太陽が地球のまわりを回っているから","地球が太陽のまわりを公転しているから"],"e":"走り出した電車から外を見ると、景色が反対向きに動いて見えるのと同じ。地球が西→東に回っているので、太陽は東→西に動いて見えるんだ。"},{"t":"choice","lv":1,"q":"地球が1年に1回、太陽のまわりを回ることを何という？","c":["公転","自転","南中"],"e":"太陽のまわりを回るのが公転、地球そのものが1日に1回まわるのが自転。公転によって昼の長さや南中高度、季節が変わるよ。"},{"t":"choice","lv":1,"q":"「日の出」とは、どのしゅん間のこと？","c":["太陽の上のはしが地平線から見え始めたしゅん間","太陽の中心が地平線にきたしゅん間","太陽が全部地平線から出たしゅん間","太陽が真東にきたしゅん間"],"e":"日の出は太陽の上のはしが見え始めたしゅん間。月や星は中心で決めるので、太陽だけ特別なんだ。"},{"t":"tf","lv":1,"q":"「日の入り」とは、太陽が地平線に全部しずんだしゅん間のことである。","a":true,"e":"日の入りは太陽が完全にしずんだしゅん間。日の出から日の入りまでが「昼」だよ。"},{"t":"choice","lv":1,"q":"太陽が真南にくることを何という？","c":["南中","日の出","公転","夏至"],"e":"太陽が真南にくることを南中（なんちゅう）という。このとき太陽の高度は1日で最も高くなり、影は最も短くなるよ。"},{"t":"choice","lv":2,"q":"太陽が南中する時刻が早いのは、どの地方？","c":["東の地方","西の地方","北の地方","南の地方"],"e":"地球が西から東へ自転しているので、太陽は東の地方から先に南中する。東の地域ほど早く、西の地域ほどおそいよ。"},{"t":"choice","lv":3,"q":"大阪で太陽が南中しているとき、大阪より東にある東京で、地面に垂直に立てた棒の影はどちらにずれている？","c":["真北より東にずれる","真北より西にずれる","ちょうど真北にできる","真南にできる"],"e":"東京は大阪より先に南中しているので、太陽はもう南より西に進んでいる。影は太陽と反対側なので、真北より東にずれるよ。"},{"t":"choice","lv":1,"q":"1年の中で昼の長さが最も短い冬至は、何月にある？","c":["12月","6月","3月","9月"],"e":"春分は3月、夏至は6月、秋分は9月、冬至は12月。どれも20日をすぎたころだよ。"},{"t":"choice","lv":1,"q":"昼と夜の長さがほとんど同じになる日はどれとどれ？","c":["春分の日と秋分の日","夏至の日と冬至の日","夏至の日と秋分の日","春分の日と冬至の日"],"e":"春分・秋分の日は太陽が真東から出て真西にしずみ、昼の長さはおよそ12時間になるよ。"},{"t":"choice","lv":2,"q":"夏至の日の太陽の動きとして正しいものはどれ？","c":["真東より北寄りから出て、南中高度が1年で最も高く、真西より北寄りにしずむ","真東から出て、真西にしずむ","真東より南寄りから出て、南中高度が1年で最も低く、真西より南寄りにしずむ","真東より北寄りから出て、北の空を通り、真西より北寄りにしずむ"],"e":"夏至は太陽が最も北寄りから出入りし、南の空を高く通る。だから昼が1年で最も長いんだ。北の空は通らないよ。"},{"t":"tf","lv":2,"q":"冬至のころは、日の出が1年で最もおそく、日の入りが1年で最も早い。","a":true,"e":"冬至のころは日の出がおそく日の入りが早いので、昼の長さが1年で最も短くなる。"},{"t":"choice","lv":1,"q":"太陽の位置は、何と何で表す？","c":["方位と高度","時刻と温度","方位と距離","大きさと明るさ"],"e":"太陽の位置は方位（方位磁針で8方位を調べる）と高度（地面と太陽光線のつくる角度）で表すよ。"},{"t":"choice","lv":1,"q":"太陽を観察するときに使う道具として正しいものはどれ？","c":["日食グラス（しゃ光板）","サングラス","色下じき","虫めがね"],"e":"太陽を観察するときは必ず日食グラスを使う。サングラスや色下じきでは目をいためるので絶対にダメ！"},{"t":"choice","lv":1,"q":"太陽が南中しているとき、地面に垂直に立てた棒の影はどの方角にできる？","c":["北","南","東","西"],"e":"影は太陽と反対側にできる。南中したとき太陽は真南にあるので、影は真北にできるよ。"},{"t":"choice","lv":2,"q":"地面に垂直に立てた棒の影は、1日の間にどのように動く？","c":["西→北→東","東→北→西","東→南→西","西→南→東"],"e":"太陽は東→南→西と動くので、その反対側にできる影は西→北→東と動くよ。"},{"t":"choice","lv":2,"q":"1日のうちの棒の影の長さについて、正しいものはどれ？","c":["朝と夕方は長く、南中したころ最も短い","朝が最も短く、夕方が最も長い","1日中ほとんど変わらない","南中したころ最も長い"],"e":"太陽の高度が高いほど影は短い。高度が最も高い南中のころ影は最も短く、朝夕は長くなるよ。"},{"t":"tf","lv":2,"q":"棒の影は、短いときほどこく見える。","a":true,"e":"影が短いのは太陽が高く日差しが強いとき。だから影はこくなる。朝夕の長い影はうすいよ。"},{"t":"choice","lv":2,"q":"南中したときの棒の影が、1年で最も長くなるのはいつごろ？","c":["冬至のころ","夏至のころ","春分のころ","秋分のころ"],"e":"冬至は南中高度が1年で最も低い。太陽が低いほど影は長くなるので、冬至のころ最も長くなるよ。"},{"t":"choice","lv":2,"q":"棒の影の先を1日記録して線で結んだとき、東西にまっすぐな線になるのはいつごろ？","c":["春分・秋分のころ","夏至のころ","冬至のころ"],"e":"春分・秋分は太陽が真東から出て真西にしずむので、影の先は棒の北側を東西にまっすぐ動く。夏至は棒に最も近い曲線、冬至は最も遠い曲線だよ。"},{"t":"choice","lv":3,"q":"東京の校庭で棒の影の先を朝から夕方まで記録した。線は棒に近いところを通り、朝と夕方の影の先は棒より南側までのびていた。記録したのは何月？","c":["6月","3月","9月","12月"],"e":"夏至のころは太陽が真東より北寄りから出て真西より北寄りにしずむので、朝夕の影は南寄りにのびる。南中高度も高いので影が短く、線は棒に近くなるよ。"},{"t":"tf","lv":3,"q":"夏至の日の日の出の位置は、冬至の日の日の出の位置よりも南側になる。","a":false,"e":"反対！夏至の日は真東より北寄り、冬至の日は真東より南寄りから太陽が出る。"},{"t":"tf","lv":3,"q":"夏至の日でも冬至の日でも、棒の影が1日で最も短くなるのは太陽が南中したときである。","a":true,"e":"季節に関係なく、1日で太陽が最も高くなるのは南中したとき。だから影はそのとき最も短くなるよ。"},{"t":"choice","lv":3,"q":"ある日の日の出が5時45分、日の入りが17時55分だった。この日の南中時刻は？","c":["11時50分","12時00分","11時45分","12時10分"],"e":"南中時刻は日の出と日の入りのちょうど真ん中。（5時45分＋17時55分）÷2＝23時40分÷2＝11時50分だよ。"},{"t":"choice","lv":3,"q":"ある日の日の出が4時31分、日の入りが19時01分だった。この日の昼の長さは？","c":["14時間30分","15時間30分","14時間70分","12時間00分"],"e":"昼の長さ＝日の入り−日の出。19時01分−4時31分＝14時間30分。12時間より大きく長いので、夏のころの日だとわかるね。"},{"t":"choice","lv":3,"q":"長さ1mの棒を地面に垂直に立てたら、影の長さもちょうど1mだった。このときの太陽高度は？","c":["45度","30度","60度","90度"],"e":"棒と影の長さが同じとき、棒・影・光の線でできる三角形は直角二等辺三角形。だから太陽高度は45度だよ。"},{"t":"order","lv":2,"q":"3月から1年の順にならべよう","c":["春分","夏至","秋分","冬至"],"e":"春分（3月）→夏至（6月）→秋分（9月）→冬至（12月）。南中高度は夏至で最も高く、冬至で最も低いよ。"},{"t":"order","lv":2,"q":"直径が大きい順にならべよう","c":["太陽","地球","月"],"e":"太陽は約140万km、地球は約1万3000km、月は約3500km。太陽は地球の約109倍、地球は月の約4倍だよ。"}]},{"id":"water","title":"水のすがた","yomi":"みずのすがた","emoji":"💧","source":"上 第8回","points":[{"h":"<ruby>蒸発<rt>じょうはつ<\/rt><\/ruby>","t":"水が水面から<b>水蒸気<\/b>になって空気中に出ていくことを<b>蒸発<\/b>という。ふたをしないコップの水は減り、ラップでふたをしたコップは内側に水てきがつく。<b>温度が高いほど<\/b>蒸発しやすい。"},{"h":"<ruby>沸<rt>ふっ<\/rt><\/ruby>とう","t":"水を熱して、水の中からも水蒸気のあわがさかんに出てわき立つことを<b>沸とう<\/b>という。水は<b>100℃<\/b>で沸とうし、この温度を<b><ruby>沸点<rt>ふってん<\/rt><\/ruby><\/b>という。"},{"h":"沸とう中の温度","t":"沸とうしている間は、熱し続けても<b>100℃のまま<\/b>変わらない。加えた熱は、水を水蒸気に変えるために使われているんだ。"},{"h":"あわの正体","t":"熱し始めてフラスコの内側につく小さなあわは<b>水にとけていた空気<\/b>。沸とうのとき底から出る大きなあわは<b>水蒸気<\/b>。"},{"h":"水蒸気と湯気","t":"<b>水蒸気は気体で目に見えない<\/b>。白く見える<b>湯気（ゆげ）は細かい水てき（液体）<\/b>。湯気が見えなくなるのは、水てきが蒸発して水蒸気になったから。"},{"h":"水がこおる","t":"水は<b>0℃<\/b>でこおり始め、全体がこおるまで<b>0℃のまま<\/b>。氷に食塩を混ぜると温度が大きく下がる。これを<b><ruby>寒<rt>かん<\/rt><\/ruby>ざい<\/b>という。"},{"h":"氷がとける","t":"氷は<b>0℃<\/b>でとけ始め（<b><ruby>融点<rt>ゆうてん<\/rt><\/ruby><\/b>）、全部とけるまで<b>0℃のまま<\/b>。その間、フラスコの中は氷と水がまざっている。"},{"h":"体積と重さ","t":"水が水蒸気になると体積は<b>約1600倍<\/b>、水が氷になると体積は<b>約1.1倍<\/b>になる。すがたが変わっても<b>重さは変わらない<\/b>。"},{"h":"水の3つのすがた","t":"<b>固体<\/b>（氷）：かさも形も決まっている。<b>液体<\/b>（水）：かさは決まっているが形は決まっていない。<b>気体<\/b>（水蒸気）：かさも形も決まっていない。"},{"h":"熱する・冷やす","t":"熱すると<b>固体→液体→気体<\/b>、冷やすと<b>気体→液体→固体<\/b>とすがたを変える。すがたが変わっている間は温度が変わらない。"},{"h":"地球をめぐる水","t":"水は蒸発して雲になり、雨や雪になって地上にもどる。この<b>水のじゅんかん<\/b>のエネルギーのもとは<b>太陽<\/b>。"}],"trivia":["富士山の山頂では、水は約87℃で沸とうしてしまう。空気がおす力（気圧）が低いからで、ご飯をたくと芯が残ってしまうんだ。","圧力なべは中の気圧を上げて、水の沸点を約120℃にしている。だから短い時間で料理ができるよ。","氷3と食塩1の重さの割合で混ぜると、約−21℃まで下がる。これでアイスクリームも作れるよ！"],"questions":[{"t":"choice","lv":1,"q":"水が水面からしだいに気体（水蒸気）に変わって、空気中に出ていくことを何という？","c":["蒸発","沸とう","寒ざい","対流"],"e":"水面から水が水蒸気になって出ていくのが蒸発（じょうはつ）。ぬれた布がかわくのも蒸発だよ。"},{"t":"choice","lv":2,"q":"同じ量の水を入れたコップを2つ用意し、Aはそのまま、Bはラップでふたをした。しばらくすると、どうなる？","c":["Aの方が水が少なくなる","Bの方が水が少なくなる","どちらも同じだけ減る","どちらも少しも減らない"],"e":"ラップをしたBでは、蒸発した水蒸気が外に出られず、水てきになってもどる。だからふたのないAの方が減るよ。"},{"t":"tf","lv":2,"q":"水を入れてラップでふたをしたコップを置いておくと、ラップの内側に水てきがつく。","a":true,"e":"水面から蒸発した水蒸気がラップで外に出られず、冷やされて水てきにもどるんだ。"},{"t":"choice","lv":2,"q":"同じ量の水と湯を置いておいたとき、早く減るのはどちら？","c":["湯","水","どちらも同じ"],"e":"温度が高いほど蒸発しやすい。だから湯の方が早く減るよ。"},{"t":"tf","lv":2,"q":"水の蒸発は、水が100℃にならないと起こらない。","a":false,"e":"蒸発はふつうの温度でも、0℃でも起こる。せんたく物がかわくのがその例。温度が高いほどさかんになるよ。"},{"t":"choice","lv":1,"q":"水が熱せられてわき立ち、水の内部からも気体に変わることを何という？","c":["沸とう","蒸発","凝固","融解"],"e":"水がわき立って、水の中からも水蒸気のあわがさかんに出ることを沸とう（ふっとう）というよ。"},{"t":"choice","lv":1,"q":"水が沸とうするときの温度は何℃？","c":["100℃","0℃","50℃","1600℃"],"e":"水は100℃で沸とうする。この温度を沸点（ふってん）というよ。"},{"t":"choice","lv":1,"q":"液体が沸とうするときの温度を何という？","c":["沸点","融点","焦点"],"e":"沸とうする温度が沸点、氷がとける温度が融点（ゆうてん）。焦点は虫めがねで光が集まる点だよ。"},{"t":"choice","lv":2,"q":"水が沸とうし始めたあとも熱し続けると、しばらくの間、水の温度はどうなる？","c":["100℃のまま変わらない","どんどん上がり続ける","少しずつ下がる","上がったり下がったりする"],"e":"沸とうしている間は、いくら熱しても100℃のまま。温度計が止まったように見えるよ。"},{"t":"choice","lv":2,"q":"沸とうしている水を熱し続けても温度が上がらないのはなぜ？","c":["加えた熱が、水を水蒸気に変えるために使われるから","加えた熱が、氷を水に変えるために使われるから","加えた熱が、まわりの空気をあたためるために使われるから","水が熱をはね返してしまうから"],"e":"沸とう中の熱は、水を水蒸気に変えるのに使われる。同じように、氷がとけている間の熱は氷を水に変えるのに使われるよ。"},{"t":"choice","lv":2,"q":"フラスコの水を熱し始めてしばらくすると、フラスコの内側に小さなあわがつく。このあわは何？","c":["水にとけていた空気","水蒸気","ゆげ","酸素だけ"],"e":"水にはもともと空気がとけている。水温が上がるととけきれなくなり、小さなあわになって出てくるんだ。"},{"t":"choice","lv":1,"q":"水が沸とうしているとき、フラスコの底からさかんに出てくる大きなあわの正体は？","c":["水蒸気","空気","ゆげ","酸素"],"e":"沸とう中は水の中でも水が水蒸気に変わる。その水蒸気が大きなあわになって出てくるよ。試験管で冷やすと水にもどる。"},{"t":"choice","lv":2,"q":"水を沸とうさせ、フラスコにつけたガラス管の先から出るものを見た。ガラス管の先のすぐ近くには何も見えない部分がある。ここにあるのは何？","c":["水蒸気","細かい水てき","熱い空気"],"e":"ガラス管の先のすぐ近くは水蒸気。水蒸気は気体なので目に見えないんだ。"},{"t":"choice","lv":2,"q":"ガラス管の先から少しはなれたところで、白いけむりのように見える湯気（ゆげ）の正体は？","c":["細かい水てき","水蒸気","熱い空気"],"e":"湯気は、水蒸気が空気で冷やされて水にもどった細かい水てき。見えるものは水（液体）、見えないものは水蒸気（気体）だよ。"},{"t":"choice","lv":2,"q":"湯気は、さらにはなれたところで見えなくなる。このとき湯気は何に変化した？","c":["水蒸気","氷","空気","けむり"],"e":"湯気（水てき）が蒸発して、目に見えない水蒸気（気体）にもどったから見えなくなるんだ。"},{"t":"choice","lv":2,"q":"湯気は、固体・液体・気体のどのすがた？","c":["液体","気体","固体"],"e":"湯気は小さな水てきの集まりなので液体。「白く見える＝水てき」と覚えよう。"},{"t":"choice","lv":1,"q":"細かくくだいた氷に食塩を混ぜると、温度が大きく下がる。このようにしたものを何という？","c":["寒ざい","沸とう石","焦点","湯気"],"e":"氷と食塩を混ぜたものが寒ざい（かんざい）。ただの氷水では試験管の水はこおらないけれど、寒ざいならこおらせられるよ。"},{"t":"choice","lv":2,"q":"水を冷やしてこおらせるとき、0℃でこおり始めてから全体がこおるまでの温度はどうなる？","c":["0℃のまま","下がり続ける","上がったり下がったりする","少しずつ上がる"],"e":"水がこおっている間は0℃のまま。全部こおり終わってから、再び温度が下がっていくよ。"},{"t":"choice","lv":1,"q":"氷がとけ始める温度は何℃？","c":["0℃","4℃","−10℃","100℃"],"e":"氷は0℃でとけ始める。この温度を融点（ゆうてん）という。水がこおる温度も0℃だよ。"},{"t":"choice","lv":2,"q":"フラスコに氷を入れて熱すると、温度がしばらく0℃のまま上がらない時間があった。このときフラスコの中はどうなっている？","c":["氷と水がまざっている","すべて氷","すべて水","水と水蒸気がまざっている"],"e":"温度が一定のときは、2つのすがたがまざっている。0℃で止まっている間は、氷がとけて氷と水がまざっているよ。"},{"t":"choice","lv":1,"q":"水が水蒸気に変化すると、体積は約何倍になる？","c":["約1600倍","約1.1倍","約160倍","約1100倍"],"e":"水が水蒸気になると体積は約1600倍にもなる（1600〜1700倍）。この急な体積の変化で、火山では爆発が起こることもあるよ。"},{"t":"choice","lv":2,"q":"水が氷になるとき、重さと体積はどうなる？","c":["重さは変わらず、体積は約1.1倍","重さが増え、体積は約1.1倍","重さが減り、体積は約0.9倍","重さが増え、体積は約0.9倍"],"e":"すがたが変わっても重さは変わらない。水は氷になると体積が約1.1倍にふえる、ちょっと変わった性質をもっているよ。"},{"t":"tf","lv":3,"q":"氷がとけて水になると、体積は減る。","a":true,"e":"水が氷になると体積が約1.1倍になるので、反対に氷が水になると体積は減るよ。"},{"t":"choice","lv":2,"q":"10gの水をこおらせると、できた氷の重さは何g？","c":["10g","11g","9g","1.1g"],"e":"体積は約1.1倍（約11mL）になるけれど、重さは10gのまま変わらないよ。"},{"t":"choice","lv":1,"q":"水の3つのすがたのうち、かさも形も決まっているすがたを何という？","c":["固体","液体","気体"],"e":"氷のようなすがたが固体。水のような液体はかさは決まっているけれど形が決まっていない。水蒸気のような気体はかさも形も決まっていないよ。"},{"t":"tf","lv":1,"q":"気体は、一定のかさも形も決まっていない。","a":true,"e":"水蒸気のような気体は、入れ物いっぱいに広がるので、かさも形も決まっていないよ。"},{"t":"choice","lv":2,"q":"次のすがたの変化のうち、物を「熱した」ときに起こるものはどれ？","c":["固体→液体","液体→固体","気体→液体"],"e":"熱すると固体→液体→気体と変化する。液体→固体や気体→液体は冷やしたときに起こる変化だよ。"},{"t":"choice","lv":2,"q":"せんたく物がかわくのは、水が何から何に変化するから？","c":["液体から気体","気体から液体","固体から液体","液体から固体"],"e":"せんたく物の水（液体）が蒸発して水蒸気（気体）になり、空気中に出ていくからかわくんだ。"},{"t":"choice","lv":2,"q":"冷たいジュースを入れたコップのまわりに水てきがつくのはなぜ？","c":["空気中の水蒸気が冷やされて水になったから","コップの中のジュースがしみ出したから","コップの表面の氷がとけたから","空気そのものが水に変わったから"],"e":"空気中には目に見えない水蒸気がある。それがコップで冷やされ、気体から液体（水てき）に変わったんだ。"},{"t":"choice","lv":1,"q":"水がすがたを変えて地上と上空の間をめぐる「水のじゅんかん」のエネルギーは、何によってあたえられている？","c":["太陽","地球","月","海"],"e":"太陽の熱で海や陸の水が蒸発し、雲になり、雨や雪になってもどってくる。水のじゅんかんのもとは太陽だよ。"},{"t":"order","lv":3,"q":"フラスコに氷を入れて熱し続けたときのようすを、起こる順にならべよう","c":["フラスコ内の氷がすべてとける","フラスコの内側に小さなあわがつく","フラスコの底から大きなあわが出てくる","ガラス管の先からゆげがさかんに出る"],"e":"まず氷がとけ、水温が上がると水にとけていた空気が小さなあわになる。100℃で沸とうすると底から水蒸気の大きなあわが出て、ガラス管の先から湯気がさかんに出るよ。"},{"t":"choice","lv":3,"q":"富士山の山頂で、地上と同じ時間でご飯をたくと芯が残ってしまう。その理由は？","c":["気圧が低く、水が100℃より低い温度で沸とうしてしまうから","酸素が少なく、水が蒸発しないから","気温が低く、水がこおってしまうから","気圧が高く、水がなかなか沸とうしないから"],"e":"山の上は空気がおす力（気圧）が低いので、水の沸点が下がる。富士山頂では約87℃で沸とうするので、お米に十分な熱が通らないんだ。"},{"t":"choice","lv":3,"q":"水を熱するときに入れる「沸とう石」のはたらきは？","c":["急にはげしく沸とうする（とっぷつ）のを防ぐ","水が沸とうしにくくなるようにする","水の温度を100℃より高くする","水にとけた空気を取りのぞく"],"e":"沸とう石の表面の小さな穴がきっかけになって、おだやかに沸とうが始まる。熱い水が飛び散るのを防ぐためのもので、沸とうしにくくするものではないよ。"},{"t":"choice","lv":3,"q":"地球全体では、1年に陸から7万km³、海から42万km³の水が蒸発する。陸にふる雨や雪が11万km³のとき、海にふる雨や雪は何万km³？","c":["38万km³","49万km³","31万km³","53万km³"],"e":"地球上の水の量は変わらないので、蒸発した量（7万＋42万＝49万）とふる量は同じ。49万−11万＝38万km³だよ。"},{"t":"tf","lv":3,"q":"寒い冬、池や湖は水面からこおり始め、氷は水にうく。","a":true,"e":"熱は水面からうばわれるので、水面からこおる。氷は水の約1.1倍の体積で、同じ体積なら水より軽いので、しずまずにうくんだ。"}]},{"id":"light","title":"光","yomi":"ひかり","emoji":"🔦","source":"上 第9回","points":[{"h":"物の見え方","t":"物が見えるのは<b>目に光がとどく<\/b>から。太陽・電灯・テレビのように自ら光を出す物を<b><ruby>光源<rt>こうげん<\/rt><\/ruby><\/b>という。月・本・机などは、光源の光を<b>はね返して<\/b>いるので見える。"},{"h":"光の<ruby>直進<rt>ちょくしん<\/rt><\/ruby>","t":"光には<b>まっすぐに進む<\/b>性質（直進）がある。物の影が物と同じ形になるのは、光が直進しているから。"},{"h":"ピンホールカメラ","t":"小さい穴で光が交差するので、スクリーンには<b>上下左右が反対<\/b>の像がうつる。スクリーンを穴に<b>近づけると像は小さく<\/b>、遠ざけると大きくなる。"},{"h":"光の<ruby>反射<rt>はんしゃ<\/rt><\/ruby>","t":"光が鏡などではね返る性質が<b>反射<\/b>。鏡に垂直な線（<ruby>法線<rt>ほうせん<\/rt><\/ruby>）と光がつくる角を入射角・反射角といい、<b>入射角と反射角はいつも同じ大きさ<\/b>。"},{"h":"鏡にうつる像","t":"鏡の像は<b>左右が反対<\/b>に見える。自分から鏡までの距離と、鏡から像までの距離は<b>いつも同じ<\/b>。"},{"h":"全身をうつす鏡","t":"<b>身長の半分<\/b>の長さの鏡があれば、全身をうつすことができる。"},{"h":"光の<ruby>屈折<rt>くっせつ<\/rt><\/ruby>","t":"光が性質のちがう物の中へななめに進むとき、境目で折れ曲がる性質が<b>屈折<\/b>。空気→水では<b>水面から遠ざかる方向<\/b>へ、水→空気では<b>水面に近づく方向<\/b>へ曲がる。"},{"h":"浮き上がって見える","t":"水の中の物は、屈折のせいで実際より<b>浅い位置<\/b>に見える。おふろで手足が短く見えたり、プールが浅く見えたりするのはこのため。"},{"h":"虫めがね","t":"虫めがねに太陽の光を通すと、光は屈折して1点に集まる。この点が<b><ruby>焦点<rt>しょうてん<\/rt><\/ruby><\/b>、虫めがねから焦点までの長さが<b><ruby>焦点距離<rt>しょうてんきょり<\/rt><\/ruby><\/b>。"},{"h":"レンズの大きさとふくらみ","t":"レンズの<b>直径が大きいほど多くの光<\/b>を集められ、紙が早くこげる。同じ直径なら<b>ふくらみが大きいほど焦点距離が短い<\/b>。"}],"trivia":["木もれ日の中に丸い光があるのは、葉のすき間がピンホールカメラの穴になって、丸い太陽の形がうつっているから。部分日食の日には、欠けた太陽の形の木もれ日が見られるよ！","人の目の中のレンズ（水晶体）も、網膜に上下左右が反対の像をつくっている。それを脳が正しい向きに直してくれているんだ。","虹（主虹）の色は、上（外側）から赤・だいだい・黄・緑・青・あい・むらさきの順。光の色によって屈折する大きさがちがうから、色が分かれて見えるんだ。"],"questions":[{"t":"choice","lv":1,"q":"次のうち、自ら光を出して<b>いない<\/b>ものはどれ？","c":["月","電灯","太陽","星座をつくる星"],"e":"月は自ら光を出さず、太陽の光を反射して光って見える。星座をつくる星は太陽と同じ恒星なので、自ら光を出しているよ。"},{"t":"choice","lv":1,"q":"太陽・電灯・テレビのように、自ら光を出している物を何という？","c":["光源","焦点","法線","像"],"e":"自ら光を出す物を光源（こうげん）という。光源の光が直接目にとどくので見えるんだ。"},{"t":"choice","lv":2,"q":"本や机のように光を出さない物が見えるのはなぜ？","c":["光源から出た光が物ではね返り、その光が目にとどくから","物が弱い光を出しているから","目から出た光が物にとどくから","物が光を吸いこんでいるから"],"e":"物が見えるのは目に光がとどくから。光を出さない物は、光源の光をはね返し（反射し）、その光が目に入るので見えるよ。"},{"t":"choice","lv":1,"q":"光がまっすぐに進む性質を何という？","c":["光の直進","光の反射","光の屈折"],"e":"光がまっすぐ進む性質が直進（ちょくしん）。はね返るのが反射、折れ曲がるのが屈折だよ。"},{"t":"tf","lv":2,"q":"物の影が物と同じ形になるのは、光がまっすぐに進むからである。","a":true,"e":"光は直進するので、物にさえぎられたところだけ光がとどかず、物と同じ形の影ができるんだ。"},{"t":"choice","lv":1,"q":"ピンホールカメラ（針穴写真機）のスクリーンには、どんな像がうつる？","c":["上下左右が逆になった像","上下だけが逆になった像","左右だけが逆になった像","実物と同じ向きの像"],"e":"ピンホールカメラの像は上下左右が逆。これは実物をちょうど180度回転させた形と同じだよ。"},{"t":"choice","lv":2,"q":"ピンホールカメラで、上下左右が逆の像ができるのはなぜ？","c":["まっすぐ進む光が、小さい穴のところで交差するから","光が小さい穴で反射するから","光がスクリーンで屈折するから","光がつつの中で曲がるから"],"e":"上から来た光は穴を通ってスクリーンの下へ、右から来た光は左へ。光が直進して穴で交差するので、上下左右が逆になるよ。"},{"t":"choice","lv":2,"q":"ピンホールカメラの内づつを動かして、スクリーンを穴に近づけると、像はどうなる？","c":["小さく、明るく、はっきり見えるようになる","大きく、明るく、はっきり見えるようになる","大きく、暗く、ぼやけて見えるようになる","小さく、暗く、ぼやけて見えるようになる"],"e":"スクリーンが穴に近いほど、光の広がりが小さいところで像ができるので、像は小さくなり、光が集まって明るくはっきり見えるよ。"},{"t":"tf","lv":2,"q":"ピンホールカメラに、ろうそくを近づけると、スクリーンにうつる像は大きくなる。","a":true,"e":"物を穴に近づけるほど、穴で交差したあとの光が大きく広がるので、像は大きくなるよ。"},{"t":"choice","lv":3,"q":"ピンホールカメラの穴を2つにすると、スクリーンにうつる像はどうなる？","c":["像が2つできる","像は1つのままで、大きくなる","像は1つのままで、小さくなる","像の数も大きさも変わらない"],"e":"穴の数だけ像ができる。それぞれの像の大きさや明るさは、穴が1つのときと変わらないよ。"},{"t":"choice","lv":3,"q":"ピンホールカメラの穴を大きくすると、像はどうなる？","c":["明るくなるが、ぼやける","暗くなるが、はっきりする","明るく、はっきりする","暗く、ぼやける"],"e":"穴が大きいと入る光がふえて明るくなるけれど、光が交差する場所がばらけるので、像はぼやけてしまうよ。"},{"t":"choice","lv":1,"q":"光が鏡などによってはね返される性質を何という？","c":["光の反射","光の屈折","光の直進"],"e":"光がはね返されるのが反射（はんしゃ）。鏡は光の反射を利用した道具だよ。"},{"t":"choice","lv":1,"q":"光が鏡で反射するとき、入射角と反射角の大きさの関係は？","c":["いつも同じ大きさ","反射角の方がいつも大きい","入射角の方がいつも大きい","2つを足すといつも180度"],"e":"入射角と反射角はいつ
